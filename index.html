<!DOCTYPE html>
<html lang="pl">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover"
>

<meta name="theme-color" content="#000000">

<title>TRAUM SIM — PATCHLAB 2026</title>

<style>

/* =========================================================
   ROOT
   ========================================================= */

:root{

  --vh:1vh;

  --white:#f4f4f1;

  --muted:rgba(255,255,255,.48);

  --shadow:
    0 1px 2px rgba(0,0,0,.96),
    0 4px 24px rgba(0,0,0,.48);

  /*
  DREAM SUN
  */

  --sun-r:220;
  --sun-g:220;
  --sun-b:220;

  --sun-x:13%;
  --sun-y:56%;

  --sun-scale:1;

  --sun-opacity:.55;


  /*
  MOON
  */

  --moon-x:86%;
  --moon-y:45%;

  --moon-scale:.62;

  --moon-opacity:0;

}


/* =========================================================
   RESET
   ========================================================= */

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{

  width:100%;
  height:100%;

  overflow:hidden;

  background:#000;

  color:var(--white);

  font-family:
    Helvetica,
    Arial,
    sans-serif;

  -webkit-font-smoothing:antialiased;
  -webkit-text-size-adjust:none;

}

body{
  min-height:calc(var(--vh) * 100);
}


/* =========================================================
   DREAM LANDSCAPE
   ========================================================= */

#dreamLandscape{

  position:fixed;

  inset:0;

  z-index:0;

  overflow:hidden;

  pointer-events:none;

  background:#000;

}


/* =========================================================
   SKY
   ========================================================= */

.sky{

  position:absolute;

  inset:-8%;

  background:

    radial-gradient(
      ellipse at 72% 30%,
      rgba(255,255,255,.032),
      rgba(255,255,255,.010) 30%,
      transparent 58%
    ),

    linear-gradient(
      180deg,
      #020202 0%,
      #070707 45%,
      #090909 62%,
      #020202 100%
    );

  animation:
    skyDream
    210s
    ease-in-out
    infinite
    alternate;

}


/* =========================================================
   SUN SYSTEM
   ========================================================= */

#dreamSun{

  position:absolute;

  left:var(--sun-x);
  top:var(--sun-y);

  width:
    clamp(
      220px,
      28vw,
      560px
    );

  aspect-ratio:1;

  z-index:3;

  opacity:var(--sun-opacity);

  transform:
    translate(-50%,-50%)
    scale(var(--sun-scale));

  transition:
    left 9s cubic-bezier(.22,.61,.36,1),
    top 9s cubic-bezier(.22,.61,.36,1),
    transform 9s cubic-bezier(.22,.61,.36,1),
    opacity 5s ease;

  will-change:
    left,
    top,
    transform,
    opacity;

}


.sunHalo{

  position:absolute;

  inset:0;

  border-radius:50%;

  background:

    radial-gradient(
      circle,
      rgba(var(--sun-r),var(--sun-g),var(--sun-b),.50) 0%,
      rgba(var(--sun-r),var(--sun-g),var(--sun-b),.28) 8%,
      rgba(var(--sun-r),var(--sun-g),var(--sun-b),.13) 18%,
      rgba(var(--sun-r),var(--sun-g),var(--sun-b),.050) 34%,
      rgba(var(--sun-r),var(--sun-g),var(--sun-b),0) 68%
    );

  filter:
    blur(15px);

  transition:
    background 5s ease;

  animation:
    haloBreath
    58s
    ease-in-out
    infinite
    alternate;

}


.sunDisk{

  position:absolute;

  left:50%;
  top:50%;

  width:8%;
  aspect-ratio:1;

  border-radius:50%;

  transform:
    translate(-50%,-50%);

  background:
    rgb(
      var(--sun-r),
      var(--sun-g),
      var(--sun-b)
    );

  opacity:.56;

  filter:
    blur(4px);

  box-shadow:
    0 0 24px
    rgba(var(--sun-r),var(--sun-g),var(--sun-b),.18);

  transition:
    background 5s ease,
    box-shadow 5s ease;

}


/* =========================================================
   MOON
   ========================================================= */

#dreamMoon{

  position:absolute;

  left:var(--moon-x);
  top:var(--moon-y);

  width:
    clamp(
      95px,
      14vw,
      260px
    );

  aspect-ratio:1;

  z-index:4;

  border-radius:50%;

  background:#000;

  opacity:
    var(--moon-opacity);

  transform:
    translate(-50%,-50%)
    scale(var(--moon-scale));

  box-shadow:
    0 0 1px rgba(255,255,255,.08),
    inset 0 0 10px rgba(255,255,255,.015);

  transition:
    left 10s cubic-bezier(.22,.61,.36,1),
    top 10s cubic-bezier(.22,.61,.36,1),
    transform 10s cubic-bezier(.22,.61,.36,1),
    opacity 5s ease;

  will-change:
    left,
    top,
    transform,
    opacity;

}


/* =========================================================
   FAR HORIZON
   ========================================================= */

.horizonFar{

  position:absolute;

  left:-15%;
  right:-15%;

  bottom:25%;

  height:34%;

  background:

    radial-gradient(
      ellipse at 8% 100%,
      rgba(255,255,255,.045),
      transparent 55%
    ),

    radial-gradient(
      ellipse at 26% 100%,
      rgba(255,255,255,.03),
      transparent 56%
    ),

    radial-gradient(
      ellipse at 47% 100%,
      rgba(255,255,255,.055),
      transparent 54%
    ),

    radial-gradient(
      ellipse at 70% 100%,
      rgba(255,255,255,.04),
      transparent 58%
    ),

    radial-gradient(
      ellipse at 92% 100%,
      rgba(255,255,255,.03),
      transparent 57%
    );

  filter:
    blur(18px);

  opacity:.64;

  animation:
    horizonFarDream
    241s
    ease-in-out
    infinite
    alternate;

}


/* =========================================================
   GROUND
   ========================================================= */

.ground{

  position:absolute;

  left:-10%;
  right:-10%;

  bottom:-15%;

  height:56%;

  background:

    radial-gradient(
      ellipse at 12% 18%,
      rgba(255,255,255,.034),
      transparent 34%
    ),

    radial-gradient(
      ellipse at 38% 10%,
      rgba(255,255,255,.025),
      transparent 37%
    ),

    radial-gradient(
      ellipse at 67% 16%,
      rgba(255,255,255,.039),
      transparent 32%
    ),

    linear-gradient(
      180deg,
      rgba(18,18,18,.82) 0%,
      rgba(6,6,6,.97) 32%,
      #000 100%
    );

  filter:
    blur(11px);

  animation:
    groundDream
    218s
    ease-in-out
    infinite
    alternate;

}


/* =========================================================
   TREE
   ========================================================= */

.tree{

  position:absolute;

  left:33%;

  bottom:24%;

  width:
    clamp(
      120px,
      18vw,
      300px
    );

  height:
    clamp(
      250px,
      47vh,
      570px
    );

  transform:
    translateX(-50%);

  opacity:.64;

  filter:
    blur(4px);

  transform-origin:
    50% 100%;

  animation:
    treeDream
    179s
    ease-in-out
    infinite
    alternate;

}


.treeTrunk{

  position:absolute;

  left:49%;

  bottom:0;

  width:5%;

  height:51%;

  border-radius:
    50% 50% 15% 15%;

  background:
    rgba(6,6,6,.96);

  transform:
    translateX(-50%)
    rotate(-1deg);

}


.treeBranchA,
.treeBranchB,
.treeBranchC{

  position:absolute;

  left:50%;

  transform-origin:
    0 100%;

  background:
    rgba(5,5,5,.95);

  border-radius:
    99px;

}


.treeBranchA{

  bottom:42%;

  width:3.5%;

  height:31%;

  transform:
    rotate(-34deg);

}


.treeBranchB{

  bottom:40%;

  width:3.5%;

  height:34%;

  transform:
    rotate(31deg);

}


.treeBranchC{

  bottom:50%;

  width:2.6%;

  height:23%;

  transform:
    rotate(8deg);

}


.crown{

  position:absolute;

  border-radius:50%;

  background:

    radial-gradient(
      ellipse,
      rgba(13,13,13,.96) 0%,
      rgba(8,8,8,.91) 60%,
      rgba(4,4,4,.82) 78%,
      rgba(0,0,0,0) 100%
    );

}


.crown.a{

  width:72%;
  height:37%;

  left:3%;
  top:13%;

}


.crown.b{

  width:63%;
  height:43%;

  right:0%;
  top:4%;

}


.crown.c{

  width:78%;
  height:35%;

  left:12%;
  top:27%;

}


.crown.d{

  width:44%;
  height:31%;

  left:28%;
  top:0%;

}


/* =========================================================
   HOUSE
   ========================================================= */

.house{

  position:absolute;

  right:17%;

  bottom:29%;

  width:
    clamp(
      90px,
      12vw,
      190px
    );

  aspect-ratio:1.22;

  opacity:.58;

  filter:
    blur(3.5px);

  transform-origin:
    50% 100%;

  animation:
    houseDream
    223s
    ease-in-out
    infinite
    alternate;

}


.houseBody{

  position:absolute;

  left:13%;
  right:13%;

  bottom:0;

  height:60%;

  background:
    rgba(8,8,8,.95);

}


.houseRoof{

  position:absolute;

  left:4%;
  top:3%;

  width:92%;
  height:51%;

  background:
    rgba(6,6,6,.98);

  clip-path:
    polygon(
      50% 0%,
      100% 78%,
      89% 100%,
      11% 100%,
      0% 78%
    );

}


.windowA,
.windowB{

  position:absolute;

  bottom:18%;

  width:12%;
  height:22%;

  border-radius:
    50% 50% 10% 10%;

  background:
    rgba(255,255,255,.15);

  box-shadow:
    0 0 18px
    rgba(255,255,255,.07);

}


.windowA{
  left:31%;
}


.windowB{
  right:31%;
}


/* =========================================================
   SECOND DISTANT HOUSE
   ========================================================= */

.houseGhost{

  position:absolute;

  right:5%;

  bottom:38%;

  width:
    clamp(
      45px,
      7vw,
      105px
    );

  height:
    clamp(
      40px,
      6vw,
      90px
    );

  opacity:.07;

  filter:
    blur(8px);

  background:
    rgba(255,255,255,.14);

  clip-path:
    polygon(
      10% 42%,
      50% 0%,
      90% 42%,
      90% 100%,
      10% 100%
    );

  animation:
    ghostHouseDream
    281s
    ease-in-out
    infinite
    alternate;

}


/* =========================================================
   FOG
   ========================================================= */

.fog{

  position:absolute;

  left:-20%;

  width:140%;

  height:23%;

  border-radius:50%;

  background:

    radial-gradient(
      ellipse,
      rgba(255,255,255,.046) 0%,
      rgba(255,255,255,.019) 40%,
      rgba(255,255,255,0) 75%
    );

  filter:
    blur(20px);

}


.fog.one{

  bottom:15%;

  opacity:.58;

  animation:
    fogOneDream
    177s
    ease-in-out
    infinite
    alternate;

}


.fog.two{

  bottom:32%;

  opacity:.32;

  animation:
    fogTwoDream
    239s
    ease-in-out
    infinite
    alternate;

}


.fog.three{

  bottom:48%;

  height:17%;

  opacity:.16;

  animation:
    fogThreeDream
    303s
    ease-in-out
    infinite
    alternate;

}


/* =========================================================
   CLOUD VEILS
   ========================================================= */

.cloudVeil{

  position:absolute;

  width:88%;

  height:33%;

  border-radius:50%;

  background:

    radial-gradient(
      ellipse,
      rgba(255,255,255,.030),
      rgba(255,255,255,.010) 38%,
      transparent 70%
    );

  filter:
    blur(26px);

}


.cloudVeil.one{

  left:-14%;

  top:6%;

  animation:
    cloudOneDream
    271s
    ease-in-out
    infinite
    alternate;

}


.cloudVeil.two{

  right:-18%;

  top:22%;

  opacity:.52;

  animation:
    cloudTwoDream
    317s
    ease-in-out
    infinite
    alternate;

}


/* =========================================================
   STRANGE LIGHT
   ========================================================= */

.strangeLight{

  position:absolute;

  left:57%;

  top:27%;

  width:
    clamp(
      200px,
      35vw,
      650px
    );

  height:
    clamp(
      120px,
      21vw,
      360px
    );

  border-radius:50%;

  background:

    radial-gradient(
      ellipse,
      rgba(255,255,255,.038),
      rgba(255,255,255,.012) 43%,
      transparent 72%
    );

  filter:
    blur(25px);

  opacity:.38;

  transform:
    rotate(-9deg);

  animation:
    strangeLightDream
    289s
    ease-in-out
    infinite
    alternate;

}


/* =========================================================
   VIGNETTE
   ========================================================= */

#dreamVignette{

  position:absolute;

  inset:0;

  z-index:8;

  background:

    radial-gradient(
      ellipse at 50% 48%,
      rgba(0,0,0,0) 0%,
      rgba(0,0,0,.06) 37%,
      rgba(0,0,0,.34) 74%,
      rgba(0,0,0,.82) 100%
    );

}


/* =========================================================
   READABILITY
   ========================================================= */

#readingShadow{

  position:fixed;

  inset:0;

  z-index:9;

  pointer-events:none;

  opacity:.16;

  background:

    radial-gradient(
      ellipse at 50% 49%,
      rgba(0,0,0,.08) 0%,
      rgba(0,0,0,.20) 40%,
      rgba(0,0,0,.48) 82%,
      rgba(0,0,0,.67) 100%
    );

  transition:
    opacity
    2.8s
    ease;

}


body.questionMode #readingShadow{

  opacity:.54;

}


/* =========================================================
   STATIC GRAIN
   ========================================================= */

#grain{

  position:fixed;

  inset:0;

  z-index:10;

  pointer-events:none;

  opacity:.015;

  background-image:url(
    "data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.88' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E"
  );

}


/* =========================================================
   GHOST WORDS
   ========================================================= */

#ghostLayer{

  position:fixed;

  inset:0;

  z-index:11;

  pointer-events:none;

  overflow:hidden;

}


.ghost{

  position:absolute;

  max-width:90vw;

  white-space:nowrap;

  font-size:
    clamp(
      24px,
      8vw,
      110px
    );

  line-height:.9;

  letter-spacing:-.05em;

  color:
    rgba(255,255,255,.018);

  filter:
    blur(15px);

  animation:
    ghostMove
    linear
    forwards;

}


.answerGhost{

  color:
    rgba(255,255,255,.032);

}


/* =========================================================
   UI
   ========================================================= */

#ui{

  position:fixed;

  inset:0;

  z-index:20;

  height:
    calc(
      var(--vh)
      *
      100
    );

  display:flex;

  flex-direction:column;

  justify-content:space-between;

  padding:

    max(
      24px,
      env(safe-area-inset-top)
    )

    max(
      24px,
      env(safe-area-inset-right)
    )

    max(
      24px,
      env(safe-area-inset-bottom)
    )

    max(
      24px,
      env(safe-area-inset-left)
    );

  transition:
    opacity
    1.7s
    ease;

}


#ui.hide{

  opacity:0;

  pointer-events:none;

}


/* =========================================================
   TOP / BOTTOM
   ========================================================= */

.top,
.bottom{

  display:flex;

  justify-content:space-between;

  align-items:center;

  gap:20px;

  font-size:10px;

  letter-spacing:.22em;

  text-transform:uppercase;

  color:var(--muted);

  text-shadow:var(--shadow);

}


/* =========================================================
   SCREEN
   ========================================================= */

#screenWrap{

  width:
    min(
      960px,
      100%
    );

  margin:auto;

  position:relative;

}


#screenWrap::before{

  content:"";

  position:absolute;

  z-index:-1;

  inset:
    -90px
    -110px;

  pointer-events:none;

  background:

    radial-gradient(
      ellipse,
      rgba(0,0,0,.58) 0%,
      rgba(0,0,0,.38) 45%,
      rgba(0,0,0,.14) 67%,
      rgba(0,0,0,0) 83%
    );

}


#screen{

  position:relative;

  opacity:1;

  transition:
    opacity
    1.8s
    cubic-bezier(.45,0,.25,1);

  will-change:
    opacity;

}


#screen.fade{

  opacity:0;

}


/* =========================================================
   TYPOGRAPHY
   ========================================================= */

.eyebrow{

  margin-bottom:24px;

  font-size:10px;

  letter-spacing:.24em;

  text-transform:uppercase;

  color:
    rgba(255,255,255,.53);

  text-shadow:
    var(--shadow);

}


h1{

  font-size:
    clamp(
      56px,
      13vw,
      116px
    );

  line-height:.84;

  letter-spacing:-.055em;

  font-weight:400;

  text-shadow:var(--shadow);

}


h2{

  max-width:930px;

  font-size:
    clamp(
      30px,
      7vw,
      64px
    );

  line-height:1.02;

  letter-spacing:-.038em;

  font-weight:400;

  text-shadow:var(--shadow);

}


.introText{

  max-width:740px;

  margin-top:28px;

  font-size:
    clamp(
      18px,
      2.8vw,
      29px
    );

  line-height:1.35;

  letter-spacing:-.015em;

  text-shadow:var(--shadow);

}


.introMeta{

  max-width:680px;

  margin-top:27px;

  font-size:12px;

  line-height:1.65;

  color:
    rgba(255,255,255,.53);

  text-shadow:var(--shadow);

}


.sub{

  max-width:650px;

  margin-top:22px;

  font-size:14px;

  line-height:1.55;

  color:
    rgba(255,255,255,.56);

  text-shadow:var(--shadow);

}


.contextTrace{

  max-width:640px;

  margin-top:22px;

  font-size:11px;

  line-height:1.55;

  letter-spacing:.06em;

  color:
    rgba(255,255,255,.27);

  text-shadow:var(--shadow);

}


/* =========================================================
   LANGUAGE
   ========================================================= */

.langs{

  display:grid;

  grid-template-columns:
    1fr
    1fr
    1fr;

  gap:1px;

  margin-top:52px;

  background:
    rgba(255,255,255,.15);

}


button{

  appearance:none;

  border:0;

  background:
    rgba(0,0,0,.82);

  color:#fff;

  font:inherit;

  cursor:pointer;

  text-shadow:var(--shadow);

}


.langs button{

  height:82px;

  font-size:13px;

  letter-spacing:.18em;

}


button:hover{

  background:#fff;

  color:#000;

  text-shadow:none;

}


/* =========================================================
   INPUTS
   ========================================================= */

textarea,
input{

  width:100%;

  border:0;

  border-bottom:
    1px solid
    rgba(255,255,255,.20);

  outline:0;

  background:
    rgba(0,0,0,.08);

  color:#fff;

  font:inherit;

  caret-color:#fff;

  border-radius:0;

  text-shadow:var(--shadow);

}


textarea{

  min-height:210px;

  margin-top:30px;

  padding:
    16px 0 20px;

  resize:none;

  font-size:
    clamp(
      20px,
      4.2vw,
      33px
    );

  line-height:1.38;

}


input{

  margin-top:34px;

  padding:
    18px 0 20px;

  font-size:
    clamp(
      25px,
      5vw,
      44px
    );

  letter-spacing:-.02em;

}


textarea::placeholder,
input::placeholder{

  color:
    rgba(255,255,255,.17);

}


/* =========================================================
   ACTIONS
   ========================================================= */

.actions{

  margin-top:34px;

  display:flex;

  justify-content:space-between;

  align-items:center;

  gap:18px;

}


.back,
.next{

  font-size:10px;

  letter-spacing:.18em;

  text-transform:uppercase;

}


.back{

  background:transparent;

  color:var(--muted);

  padding:16px 0;

}


.next{

  min-width:150px;

  padding:
    17px 20px;

  border:
    1px solid
    rgba(255,255,255,.25);

  transition:.42s;

}


.received{

  margin-top:34px;

  font-size:11px;

  letter-spacing:.21em;

  text-transform:uppercase;

  color:
    rgba(255,255,255,.56);

}


.colorHint{

  margin-top:15px;

  font-size:10px;

  line-height:1.5;

  letter-spacing:.15em;

  text-transform:uppercase;

  color:
    rgba(255,255,255,.35);

}


/* =========================================================
   DREAM SHIFT
   ========================================================= */

#dreamShift{

  position:fixed;

  inset:0;

  z-index:150;

  pointer-events:none;

  display:flex;

  justify-content:center;

  align-items:center;

  opacity:0;

  background:
    rgba(0,0,0,.92);

}


#dreamShift.active{

  animation:
    dreamShift
    10.4s
    ease
    forwards;

}


.dreamShiftWrap{

  width:
    min(
      760px,
      88vw
    );

  text-align:center;

}


#dreamShiftMain{

  font-size:
    clamp(
      38px,

    c=>({

      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      "\"":"&quot;",

}

/* =========================================================
   DREAM COSMOS
   ========================================================= */

function updateDreamCosmos(){

  /*
  Before questions:
  sun stays far left.
  */

  if(
    state.mode !==
    "questions"
  ){

    return;

  }


  const i =
    state.questionIndex;


  const level =
    getDreamLevel();


  /*
  0 -> 8
  */

  const p =
    Math.max(
      0,
      Math.min(
        1,
        i / 8
      )
    );


  /*
  SUN:
  13% -> 50%
  56% -> 50%
  1 -> 2.45
  */

  const sunX =
    13 +
    p * 37;


  const sunY =
    56 -
    p * 6;


  const sunScale =
    1 +
    p * 1.45;


  const sunOpacity =
    .55 +
    p * .18;


  document
  .documentElement
  .style
  .setProperty(
    "--sun-x",
    sunX + "%"
  );


  document
  .documentElement
  .style
  .setProperty(
    "--sun-y",
    sunY + "%"
  );


  document
  .documentElement
  .style
  .setProperty(
    "--sun-scale",
    sunScale
  );


  document
  .documentElement
  .style
  .setProperty(
    "--sun-opacity",
    sunOpacity
  );


  /*
  TRAUM 0
  Moon invisible.
  */

  if(
    level === 0
  ){

    document
    .documentElement
    .style
    .setProperty(
      "--moon-opacity",
      "0"
    );


    document
    .documentElement
    .style
    .setProperty(
      "--moon-x",
      "86%"
    );


    document
    .documentElement
    .style
    .setProperty(
      "--moon-y",
      "45%"
    );


    document
    .documentElement
    .style
    .setProperty(
      "--moon-scale",
      ".62"
    );


    return;

  }


  /*
  TRAUM 1
  Moon appears from right.
  Questions 3,4,5
  */

  if(
    level === 1
  ){

    const local =
      Math.max(
        0,
        Math.min(
          1,
          (i-3)/2
        )
      );


    const moonX =
      82 -
      local * 23;


    const moonY =
      43 +
      local * 5;


    const moonScale =
      .66 +
      local * .21;


    document
    .documentElement
    .style
    .setProperty(
      "--moon-opacity",
      ".88"
    );


    document
    .documentElement
    .style
    .setProperty(
      "--moon-x",
      moonX + "%"
    );


    document
    .documentElement
    .style
    .setProperty(
      "--moon-y",
      moonY + "%"
    );


    document
    .documentElement
    .style
    .setProperty(
      "--moon-scale",
      moonScale
    );


    return;

  }


  /*
  TRAUM 2
  Moon converges with sun.
  Questions 6,7,8.
  */

  const local =
    Math.max(
      0,
      Math.min(
        1,
        (i-6)/2
      )
    );


  /*
  Current sun itself is already moving.
  Moon is pushed toward 50/50.
  */

  const moonX =
    60 -
    local * 10;


  const moonY =
    48 +
    local * 2;


  const moonScale =
    .90 +
    local * .18;


  document
  .documentElement
  .style
  .setProperty(
    "--moon-opacity",
    ".97"
  );


  document
  .documentElement
  .style
  .setProperty(
    "--moon-x",
    moonX + "%"
  );


  document
  .documentElement
  .style
  .setProperty(
    "--moon-y",
    moonY + "%"
  );


  document
  .documentElement
  .style
  .setProperty(
    "--moon-scale",
    moonScale
  );

}

/* =========================================================
   CROSSFADE
   ========================================================= */

let transitionRunning =
  false;


function transition(fn){

  if(
    transitionRunning
  ){
    return;
  }


  transitionRunning =
    true;


  screen
  .classList
  .add(
    "fade"
  );


  setTimeout(
    ()=>{

      setTimeout(
        ()=>{

          fn();


          requestAnimationFrame(
            ()=>{

              requestAnimationFrame(
                ()=>{

                  screen
                  .classList
                  .remove(
                    "fade"
                  );


                  setTimeout(
                    ()=>{

                      transitionRunning =
                        false;

                    },
                    1850
                  );

                }
              );

            }
          );

        },
        400
      );

    },
    1800
  );

}

/* =========================================================

   ========================================================= */

function introBack(){

  if(
    transitionRunning
  ){
    return;
  }


  if(
    state.introStep ===
    0
  ){

    transition(
      renderStart
    );

    return;

  }


  saveColorField();


  state.introStep--;


  transition(
    renderIntro
  );

}


function introNext(){

  if(
    transitionRunning
  ){
    return;
  }


  saveColorField();


  const slides =
    INTRO[
      state.lang
    ];


  if(
    state.introStep <
    slides.length-1
  ){

    state.introStep++;


    transition(
      renderIntro
    );

  }
  else{

    state.questionIndex =
      0;


    if(
      !state.generatedQuestions[0]
    ){

      state.generatedQuestions[0] =
        generateOpeningQuestion();

    }


    transition(
      renderQuestion
    );

  }

}

/* =========================================================
   FRAGMENT
   ========================================================= */

function extractFragment(text){

  const cleaned =
    normalizeText(
      text
    );


  if(
    !cleaned
  ){
    return "";
  }


  const words =
    cleaned
    .split(/\s+/)
    .filter(
      Boolean
    );


  if(
    words.length <=
    8
  ){

    return cleaned;

  }


  const startOptions = [

    0,

    Math.floor(
      words.length*.20
    ),

    Math.floor(
      words.length*.40
    ),

    Math.max(
      0,
      words.length-8
    )

  ];


  const start =
    randomItem(
      startOptions
    );


  return words
  .slice(
    start,
    start+8
  )
  .join(
    " "
  );

}

/* =========================================================
   ADAPTIVE
   ========================================================= */

function generateAdaptiveQuestion(){

  const i =
    state.questionIndex;


  const previous =
    state.answers[
      i-1
    ];


  const previousAnswer =
    previous
    ?
    previous.answer
    :
    "";


  const fragment =
    extractFragment(
      previousAnswer
    );


  const themes =
    detectThemes(
      previousAnswer
    );


  if(
    i <= 2
  ){

    return generateLayerOneQuestion(
      fragment,
      themes
    );

  }


  if(
    i <= 5
  ){

    return generateLayerTwoQuestion(
      fragment,
      themes
    );

  }


  return generateLayerThreeQuestion(
    fragment,
    themes
  );

}

/* =========================================================
   QUESTION HELPERS
   ========================================================= */

function getCurrentQuestion(){

  return state
  .generatedQuestions[
    state.questionIndex
  ];

}


function getDreamLevel(){

  if(
    state.questionIndex <=
    2
  ){
    return 0;
  }


  if(
    state.questionIndex <=
    5
  ){
    return 1;
  }


  return 2;

}


/* =========================================================
   RENDER QUESTION
   ========================================================= */

function renderQuestion(){

  setVisualMode(
    "questions"
  );


  updateDreamCosmos();


  const copy =
    UI[
      state.lang
    ];


  const q =
    getCurrentQuestion();


  if(!q){
    return;
  }


  const saved =
    state.answers[
      state.questionIndex
    ];


  const level =
    getDreamLevel();


  progress.textContent =
    `${String(
      state.questionIndex+1
    ).padStart(
      2,
      "0"
    )}
    /
    ${String(
      state.totalQuestions
    ).padStart(
      2,
      "0"
    )}`;


  depthLabel.textContent =
    `TRAUM ${level}`;


  let trace =
    "";


  if(
    state.questionIndex >
    0
  ){

    const previous =
      state.answers[
        state.questionIndex-1
      ];


    if(
      previous &&
      previous.answer
    ){

      const fragment =
        extractFragment(
          previous.answer
        );


      if(fragment){

        trace = `

<div class="contextTrace">
${escapeHtml(
  fragment
)}
</div>

`;

      }

    }

  }


  screen.innerHTML = `

<div class="eyebrow">
${escapeHtml(
  q.category
)}
</div>

<h2>
${escapeHtml(
  q.question
)}
</h2>

${trace}

<textarea
id="answer"
placeholder="${copy.placeholder}"
>${escapeHtml(
  saved
  ?
  saved.answer
  :
  ""
)}</textarea>

<div class="actions">

<button
class="back"
onclick="questionBack()"
>
${copy.back}
</button>

<button
class="next"
onclick="questionNext()"
>
${copy.next}
</button>

</div>

`;


  spawnPreviousAnswerGhost();


  setTimeout(
    ()=>{

      document
      .getElementById(
        "answer"
      )
      ?.focus();

    },
    350
  );

}


/* =========================================================
   SAVE ANSWER
   ========================================================= */

function saveCurrentAnswer(){

  const field =
    document
    .getElementById(
      "answer"
    );


  if(!field){
    return;
  }


  const q =
    getCurrentQuestion();


  state.answers[
    state.questionIndex
  ]
  =
  {

    level:
      getDreamLevel(),

    category:
      q.category,

    question:
      q.question,

    answer:
      normalizeText(
        field.value
      )

  };

}


/* =========================================================
   NEXT
   ========================================================= */

function questionNext(){

  if(
    transitionRunning ||
    dreamShiftRunning
  ){
    return;
  }


  saveCurrentAnswer();


  const current =
    state.answers[
      state.questionIndex
    ];


  if(
    !current ||
    !current.answer
  ){

    const field =
      document
      .getElementById(
        "answer"
      );


    if(field){

      field.focus();


      field.style.borderBottomColor =
        "rgba(255,255,255,.70)";


      setTimeout(
        ()=>{

          field.style.borderBottomColor =
            "rgba(255,255,255,.20)";

        },
        900
      );

    }


    return;

  }


  if(
    state.questionIndex ===
    state.totalQuestions-1
  ){

    transition(
      renderNickname
    );

    return;

  }


  if(
    state.questionIndex ===
    2
  ){

    state.questionIndex++;


    if(
      !state.generatedQuestions[
        state.questionIndex
      ]
    ){

      state.generatedQuestions[
        state.questionIndex
      ]
      =
      generateAdaptiveQuestion();

    }


    updateDreamCosmos();


    runDreamShift(
      1
    );


    return;

  }


  if(
    state.questionIndex ===
    5
  ){

    state.questionIndex++;


    if(
      !state.generatedQuestions[
        state.questionIndex
      ]
    ){

      state.generatedQuestions[
        state.questionIndex
      ]
      =
      generateAdaptiveQuestion();

    }


    updateDreamCosmos();


    runDreamShift(
      2
    );


    return;

  }


  state.questionIndex++;


  if(
    !state.generatedQuestions[
      state.questionIndex
    ]
  ){

    state.generatedQuestions[
      state.questionIndex
    ]
    =
    generateAdaptiveQuestion();

  }


  updateDreamCosmos();


  transition(
    renderQuestion
  );

}


/* =========================================================
   BACK
   ========================================================= */

function questionBack(){

  if(
    transitionRunning ||
    dreamShiftRunning
  ){
    return;
  }


  saveCurrentAnswer();


  if(
    state.questionIndex ===
    0
  ){

    state.introStep =
      INTRO[
        state.lang
      ]
      .length-1;


    transition(
      renderIntro
    );


    return;

  }


  state.questionIndex--;


  updateDreamCosmos();


  transition(
    renderQuestion
  );

}

/* =========================================================
   ANSWER GHOST
   ========================================================= */

function spawnPreviousAnswerGhost(){

  if(
    state.questionIndex ===
    0
  ){
    return;
  }


  const previous =
    state.answers
    .filter(
      a =>
        a &&
        a.answer &&
        a.answer.length > 2
    );


  if(
    !previous.length
  ){
    return;
  }


  if(
    Math.random() >
    .57
  ){

    const a =
      randomItem(
        previous
      );


    const fragment =
      extractFragment(
        a.answer
      );


    ghost(
      fragment,
      true
    );

  }

}

   ========================================================= */

async function saveDream(){

  if(
    transitionRunning
  ){
    return;
  }


  const field =
    document
    .getElementById(
      "nickname"
    );


  if(field){

    const value =
      field
      .value
      .trim();


    if(value){

      state.nickname =
        value;

    }

  }


  if(
    !state.nickname
  ){

    state.nickname =
      "ANONYMOUS";

  }


  const copy =
    UI[
      state.lang
    ];


  const payload = {

    nickname:
      state.nickname,

    language:
      state.lang,

    dreamColor:
      state.dreamColorName,

    answers:
      state.answers,

    dream:
      state.answers
      .map(
        a =>
          a
          ?
          a.answer
          :
          ""
      )
      .join(
        "\n\n"
      )

  };


  transition(
    ()=>{

      setVisualMode(
        "saving"
      );


      progress.textContent =
        "";


      depthLabel.textContent =
        "ARCHIVE";


      screen.innerHTML = `

<div class="eyebrow">
TRAUM SIM
</div>

<h2>
${copy.saving}
</h2>

<p class="sub">
...
</p>

`;

    }
  );


  try{

    const response =
      await fetch(
        API_URL,
        {

          method:"POST",

          headers:{
            "Content-Type":
              "text/plain;charset=utf-8"
          },

          body:
            JSON.stringify(
              payload
            )

        }
      );


    if(
      !response.ok
    ){

      throw new Error(
        "HTTP " +
        response.status
      );

    }


    const data =
      await response.json();


    if(
      !data.ok
    ){

      throw new Error(
        data.error ||
        "Backend error"
      );

    }


    renderSaved(
      data.dreamId
    );

  }
  catch(error){

    console.error(
      "TRAUM SAVE ERROR",
      error
    );


    renderError();

  }

}


/* =========================================================
   SAVED
   ========================================================= */

function renderSaved(id){

  const copy =
    UI[
      state.lang
    ];


  const show =
    ()=>{

      if(
        transitionRunning
      ){

        setTimeout(
          show,
          200
        );

        return;

      }


      transition(
        ()=>{

          setVisualMode(
            "saved"
          );


          screen.innerHTML = `

<div class="eyebrow">
TRAUM SIM
</div>

<h2>
${copy.done}
</h2>

<p class="sub">
${copy.sub}
</p>

<div class="received">

${escapeHtml(
  id || ""
)}

&nbsp;&nbsp;/&nbsp;&nbsp;

${escapeHtml(
  state.nickname
)}

</div>

`;

        }
      );


      setTimeout(
        startFinalSequence,
        6500
      );

    };


  show();

}


/* =========================================================
   ERROR
   ========================================================= */

function renderError(){

  const copy =
    UI[
      state.lang
    ];


  let message;


  if(
    state.lang ===
    "PL"
  ){

    message =
      "Połączenie z archiwum zostało przerwane.";

  }
  else if(
    state.lang ===
    "UKR"
  ){

    message =
      "З’єднання з архівом перервано.";

  }
  else{

    message =
      "The connection to the archive was interrupted.";

  }


  const show =
    ()=>{

      if(
        transitionRunning
      ){

        setTimeout(
          show,
          200
        );

        return;

      }


      transition(
        ()=>{

          setVisualMode(
            "error"
          );


          screen.innerHTML = `

<div class="eyebrow">
TRAUM SIM
</div>

<h2>
${copy.error}
</h2>

<p class="sub">
${message}
</p>

<div class="actions">

<span></span>

<button
class="next"
onclick="saveDream()"
>
${copy.retry}
</button>

</div>

`;

        }
      );

    };


  show();

}


/* =========================================================
   FINAL
   ========================================================= */

function startFinalSequence(){

  const ui =
    document
    .getElementById(
      "ui"
    );


  const bloom =
    document
    .getElementById(
      "whiteBloom"
    );


  const whiteout =
    document
    .getElementById(
      "whiteout"
    );


  const final =
    document
    .getElementById(
      "finalInvite"
    );


  ui
  .classList
  .add(
    "hide"
  );


  setTimeout(
    ()=>{

      bloom
      .classList
      .add(
        "active"
      );


      whiteout
      .classList
      .add(
        "active"
      );

    },
    1300
  );


  setTimeout(
    ()=>{

      document
      .getElementById(
        "finalTitle"
      )
      .textContent =
        UI[
          state.lang
        ]
        .invite;


      final
      .classList
      .add(
        "active"
      );

    },
    7500
  );


  setTimeout(
    ()=>{

      bloom.style.display =
        "none";


      whiteout.style.display =
        "none";

    },
    8150
  );

}


/* =========================================================
   GHOST
   ========================================================= */

function ghost(
  text,
  answer=false
){

  if(
    !text
  ){
    return;
  }


  const e =
    document
    .createElement(
      "div"
    );


  e.className =
    answer
    ?
    "ghost answerGhost"
    :
    "ghost";


  e.textContent =
    text;


  e.style.left =
    (
      Math.random()*55
      -
      5
    )
    +
    "vw";


  e.style.top =
    (
      Math.random()*75
      +
      8
    )
    +
    "vh";


  e.style.animationDuration =
    (
      31
      +
      Math.random()*25
    )
    +
    "s";


  ghostLayer
  .appendChild(
    e
  );


  setTimeout(
    ()=>{

      e.remove();

    },
    58000
  );

}


/* =========================================================
   INIT
   ========================================================= */

applySunColor();

renderStart();

</script>

</body>

</html>
