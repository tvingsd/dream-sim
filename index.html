<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover"
>

<meta name="theme-color" content="#000000">

<title>TRAUM SIM — PATCHLAB 2026</title>

<style>

:root{
  --vh:1vh;
  --white:#f5f5f2;
  --muted:rgba(255,255,255,.48);
  --line:rgba(255,255,255,.18);

  --shadow:
    0 1px 2px rgba(0,0,0,.92),
    0 4px 18px rgba(0,0,0,.35);
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  color:var(--white);

  font-family:
    Helvetica,
    Arial,
    sans-serif;

  -webkit-font-smoothing:antialiased;
  -webkit-text-size-adjust:none;
}

body{
  min-height:calc(var(--vh) * 100);
}


/* =========================================================
   DREAM CANVAS
   ========================================================= */

#dreamCanvas{
  position:fixed;
  inset:0;
  z-index:0;

  width:100%;
  height:100%;

  background:#000;

  opacity:.86;

  filter:
    blur(8px)
    contrast(122%);

  transition:
    filter 8s ease,
    opacity 8s ease;
}


/* =========================================================
   GRAPHITE
   ========================================================= */

#graphite{
  position:fixed;
  inset:0;
  z-index:1;

  pointer-events:none;

  background:
    radial-gradient(
      ellipse at 50% 50%,
      rgba(82,82,82,.06) 0%,
      rgba(43,43,43,.11) 35%,
      rgba(15,15,15,.26) 68%,
      rgba(0,0,0,.63) 100%
    );

  opacity:.48;

  transition:opacity 3s ease;
}

body.questionMode #graphite{
  opacity:.88;
}


/* =========================================================
   READING SHADOW
   ========================================================= */

#readingShadow{
  position:fixed;
  inset:0;
  z-index:2;

  pointer-events:none;

  opacity:0;

  background:
    radial-gradient(
      ellipse at 50% 48%,
      rgba(0,0,0,.05) 0%,
      rgba(0,0,0,.20) 43%,
      rgba(0,0,0,.50) 78%,
      rgba(0,0,0,.70) 100%
    );

  transition:opacity 2.7s ease;
}

body.questionMode #readingShadow{
  opacity:.68;
}


/* =========================================================
   VEIL
   ========================================================= */

#veil{
  position:fixed;
  inset:-18%;
  z-index:3;

  pointer-events:none;

  opacity:.48;

  mix-blend-mode:screen;

  background:
    radial-gradient(
      circle at 26% 43%,
      rgba(255,255,255,.025),
      transparent 27%
    ),

    radial-gradient(
      circle at 74% 55%,
      rgba(255,255,255,.020),
      transparent 29%
    );

  animation:
    veilBreath
    62s
    ease-in-out
    infinite
    alternate;
}


/* =========================================================
   GRAIN
   ========================================================= */

#grain{
  position:fixed;
  inset:-50%;
  z-index:7;

  pointer-events:none;

  opacity:.021;

  background-image:url(
    "data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.83' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E"
  );

  animation:
    grain .35s steps(2) infinite;
}


/* =========================================================
   GHOSTS
   ========================================================= */

#ghostLayer{
  position:fixed;
  inset:0;
  z-index:5;

  pointer-events:none;
  overflow:hidden;
}

.ghost{
  position:absolute;

  max-width:90vw;

  font-size:
    clamp(
      25px,
      8vw,
      112px
    );

  line-height:.9;
  letter-spacing:-.05em;

  white-space:nowrap;

  color:rgba(255,255,255,.027);

  filter:blur(14px);

  animation:
    ghostMove linear forwards;
}

.answerGhost{
  color:rgba(255,255,255,.050);
  filter:blur(16px);
}


/* =========================================================
   UI
   ========================================================= */

#ui{
  position:fixed;
  inset:0;
  z-index:20;

  height:calc(var(--vh) * 100);

  display:flex;
  flex-direction:column;
  justify-content:space-between;

  padding:
    max(24px,env(safe-area-inset-top))
    max(24px,env(safe-area-inset-right))
    max(24px,env(safe-area-inset-bottom))
    max(24px,env(safe-area-inset-left));

  transition:
    opacity 1.5s ease,
    filter 1.5s ease;
}

#ui.hide{
  opacity:0;
  filter:blur(14px);
  pointer-events:none;
}


/* =========================================================
   MICRO TYPOGRAPHY
   ========================================================= */

.top,
.bottom{
  display:flex;
  justify-content:space-between;
  align-items:center;

  gap:20px;

  font-size:10px;
  letter-spacing:.22em;
  text-transform:uppercase;

  color:var(--muted);

  text-shadow:var(--shadow);
}


/* =========================================================
   SCREEN
   ========================================================= */

#screenWrap{
  width:min(960px,100%);
  margin:auto;

  position:relative;
}

#screenWrap::before{
  content:"";

  position:absolute;
  z-index:-1;

  inset:-80px -90px;

  pointer-events:none;

  opacity:.54;

  filter:blur(30px);

  background:
    radial-gradient(
      ellipse,
      rgba(0,0,0,.52),
      rgba(0,0,0,.22) 62%,
      rgba(0,0,0,0) 82%
    );
}

#screen{
  position:relative;

  transition:
    opacity 1.25s ease,
    transform 1.45s ease,
    filter 1.25s ease;
}

#screen.fade{
  opacity:0;

  transform:
    translateY(10px)
    scale(1.008);

  filter:blur(13px);
}


/* =========================================================
   TYPOGRAPHY
   ========================================================= */

.eyebrow{
  margin-bottom:24px;

  font-size:10px;
  letter-spacing:.24em;
  text-transform:uppercase;

  color:rgba(255,255,255,.52);

  text-shadow:var(--shadow);
}

h1{
  font-size:
    clamp(
      56px,
      13vw,
      116px
    );

  line-height:.84;

  letter-spacing:-.055em;

  font-weight:400;

  text-shadow:var(--shadow);
}

h2{
  max-width:930px;

  font-size:
    clamp(
      30px,
      7vw,
      64px
    );

  line-height:1.02;

  letter-spacing:-.038em;

  font-weight:400;

  text-shadow:var(--shadow);
}

.introText{
  max-width:740px;

  margin-top:28px;

  font-size:
    clamp(
      18px,
      2.8vw,
      29px
    );

  line-height:1.35;

  letter-spacing:-.015em;

  text-shadow:var(--shadow);
}

.introMeta{
  max-width:680px;

  margin-top:27px;

  font-size:12px;
  line-height:1.65;

  color:rgba(255,255,255,.52);

  text-shadow:var(--shadow);
}

.sub{
  max-width:650px;

  margin-top:22px;

  font-size:14px;
  line-height:1.55;

  color:rgba(255,255,255,.54);

  text-shadow:var(--shadow);
}

.contextTrace{
  max-width:650px;

  margin-top:22px;

  font-size:11px;
  line-height:1.55;

  letter-spacing:.08em;

  color:rgba(255,255,255,.34);

  text-shadow:var(--shadow);
}


/* =========================================================
   LANGUAGE
   ========================================================= */

.langs{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;

  gap:1px;

  margin-top:52px;

  background:rgba(255,255,255,.16);
}

button{
  appearance:none;
  border:0;

  background:rgba(0,0,0,.80);

  color:#fff;

  font:inherit;

  cursor:pointer;

  text-shadow:var(--shadow);
}

.langs button{
  height:82px;

  font-size:13px;
  letter-spacing:.18em;
}

button:hover{
  background:#fff;
  color:#000;
  text-shadow:none;
}


/* =========================================================
   INPUTS
   ========================================================= */

textarea,
input{
  width:100%;

  border:0;

  border-bottom:
    1px solid
    rgba(255,255,255,.19);

  outline:0;

  background:rgba(0,0,0,.08);

  color:#fff;

  font:inherit;

  caret-color:#fff;

  border-radius:0;

  text-shadow:var(--shadow);
}

textarea{
  min-height:210px;

  margin-top:30px;

  padding:
    16px
    0
    20px;

  resize:none;

  font-size:
    clamp(
      20px,
      4.2vw,
      33px
    );

  line-height:1.38;
}

input{
  margin-top:34px;

  padding:
    18px
    0
    20px;

  font-size:
    clamp(
      25px,
      5vw,
      44px
    );

  letter-spacing:-.02em;
}

textarea::placeholder,
input::placeholder{
  color:rgba(255,255,255,.17);
}


/* =========================================================
   QUESTION TEXT — NO BLUR
   ========================================================= */

.questionText{
  filter:none !important;
  opacity:1 !important;
}


/* =========================================================
   ACTIONS
   ========================================================= */

.actions{
  margin-top:34px;

  display:flex;
  justify-content:space-between;
  align-items:center;

  gap:18px;
}

.back,
.next{
  font-size:10px;

  letter-spacing:.18em;

  text-transform:uppercase;
}

.back{
  background:transparent;

  color:var(--muted);

  padding:16px 0;
}

.next{
  min-width:150px;

  padding:
    17px
    20px;

  border:
    1px solid
    rgba(255,255,255,.26);

  transition:.42s;
}

.received{
  margin-top:34px;

  font-size:11px;

  letter-spacing:.21em;

  text-transform:uppercase;

  color:rgba(255,255,255,.56);

  text-shadow:var(--shadow);
}


/* =========================================================
   COLOR INTRO
   ========================================================= */

.colorHint{
  margin-top:15px;

  font-size:10px;

  line-height:1.5;

  letter-spacing:.15em;

  text-transform:uppercase;

  color:rgba(255,255,255,.35);

  text-shadow:var(--shadow);
}


/* =========================================================
   DREAM SHIFT
   ========================================================= */

#dreamShift{
  position:fixed;
  inset:0;
  z-index:150;

  pointer-events:none;

  display:flex;
  justify-content:center;
  align-items:center;

  opacity:0;

  background:#000;
}

#dreamShift.active{
  animation:
    dreamShift 10s ease forwards;
}

.dreamShiftWrap{
  width:min(760px,88vw);
  text-align:center;
}

#dreamShiftMain{
  font-size:
    clamp(
      38px,
      9vw,
      92px
    );

  line-height:.9;
  letter-spacing:-.055em;

  font-weight:400;

  text-shadow:var(--shadow);
}

#dreamShiftSub{
  margin-top:28px;

  font-size:10px;

  line-height:1.6;

  letter-spacing:.22em;

  text-transform:uppercase;

  color:rgba(255,255,255,.48);

  text-shadow:var(--shadow);
}


/* =========================================================
   WHITE OUT
   ========================================================= */

#whiteBloom{
  position:fixed;
  inset:-30%;
  z-index:200;

  pointer-events:none;

  opacity:0;

  transform:scale(.2);

  filter:blur(60px);

  background:
    radial-gradient(
      circle at 50% 50%,
      rgba(255,255,255,1) 0%,
      rgba(255,255,255,.96) 16%,
      rgba(255,255,255,.63) 35%,
      rgba(255,255,255,.14) 55%,
      rgba(255,255,255,0) 74%
    );
}

#whiteBloom.active{
  animation:
    bloom 5.9s cubic-bezier(.22,.62,.22,1) forwards;
}

#whiteout{
  position:fixed;
  inset:0;
  z-index:201;

  pointer-events:none;

  opacity:0;

  background:#fff;
}

#whiteout.active{
  animation:
    whiteout 6s cubic-bezier(.22,.62,.22,1) forwards;
}


/* =========================================================
   FINAL
   ========================================================= */

#finalInvite{
  position:fixed;
  inset:0;
  z-index:220;

  display:flex;
  align-items:center;
  justify-content:center;

  background:#000;

  opacity:0;

  pointer-events:none;

  padding:
    max(30px,env(safe-area-inset-top))
    max(28px,env(safe-area-inset-right))
    max(30px,env(safe-area-inset-bottom))
    max(28px,env(safe-area-inset-left));
}

#finalInvite.active{
  animation:
    finalIn 2.9s ease forwards;
}

.finalGrid{
  width:min(1100px,100%);

  display:grid;

  grid-template-columns:
    minmax(180px,280px)
    1fr;

  gap:
    clamp(
      50px,
      8vw,
      120px
    );

  align-items:end;
}

.logoBlock img{
  display:block;
  width:min(100%,260px);
  height:auto;
}

.finalCopy{
  max-width:760px;
}

.finalLabel{
  margin-bottom:32px;

  font-size:10px;

  letter-spacing:.24em;

  text-transform:uppercase;

  color:rgba(255,255,255,.42);
}

#finalTitle{
  font-size:
    clamp(
      32px,
      5.8vw,
      70px
    );

  line-height:1.02;

  letter-spacing:-.04em;

  font-weight:400;
}

.finalRule{
  height:1px;
  width:100%;

  margin:
    42px
    0
    24px;

  background:rgba(255,255,255,.21);
}

.finalDetails{
  display:flex;
  justify-content:space-between;

  gap:30px;

  font-size:11px;

  letter-spacing:.18em;

  text-transform:uppercase;

  color:rgba(255,255,255,.63);
}


/* =========================================================
   KEYFRAMES
   ========================================================= */

@keyframes veilBreath{

  from{
    transform:
      translate3d(-1%,.5%,0)
      scale(1);
  }

  to{
    transform:
      translate3d(1.2%,-.8%,0)
      scale(1.025);
  }

}

@keyframes grain{

  0%{transform:translate(0,0)}
  25%{transform:translate(3%,-3%)}
  50%{transform:translate(-4%,2%)}
  75%{transform:translate(2%,4%)}
  100%{transform:translate(-2%,-4%)}

}

@keyframes ghostMove{

  0%{
    opacity:0;

    transform:
      translate3d(-1vw,1vh,0)
      scale(.99);

    filter:blur(16px);
  }

  20%{
    opacity:1;
  }

  74%{
    opacity:.64;
  }

  100%{
    opacity:0;

    transform:
      translate3d(2vw,-1.5vh,0)
      scale(1.03);

    filter:blur(30px);
  }

}

@keyframes dreamShift{

  0%{
    opacity:0;
    filter:blur(22px);
  }

  18%{
    opacity:1;
    filter:blur(0);
  }

  78%{
    opacity:1;
    filter:blur(0);
  }

  100%{
    opacity:0;
    filter:blur(20px);
  }

}

@keyframes bloom{

  0%{
    opacity:0;
    transform:scale(.2);
  }

  42%{
    opacity:.14;
  }

  74%{
    opacity:.62;
    transform:scale(1);
  }

  100%{
    opacity:1;
    transform:scale(1.9);
  }

}

@keyframes whiteout{

  0%{opacity:0}
  58%{opacity:.05}
  82%{opacity:.34}
  100%{opacity:1}

}

@keyframes finalIn{

  0%{
    opacity:0;
    filter:blur(12px);
    transform:scale(1.01);
  }

  100%{
    opacity:1;
    filter:blur(0);
    transform:scale(1);
  }

}


/* =========================================================
   MOBILE
   ========================================================= */

@media(max-width:700px){

  #ui{
    padding:
      max(18px,env(safe-area-inset-top))
      max(18px,env(safe-area-inset-right))
      max(18px,env(safe-area-inset-bottom))
      max(18px,env(safe-area-inset-left));
  }

  h1{
    font-size:
      clamp(
        54px,
        19vw,
        84px
      );
  }

  h2{
    font-size:
      clamp(
        27px,
        8.4vw,
        43px
      );
  }

  .introText{
    font-size:
      clamp(
        19px,
        6vw,
        29px
      );
  }

  textarea{
    min-height:
      clamp(
        165px,
        29dvh,
        260px
      );

    font-size:
      clamp(
        18px,
        5.6vw,
        26px
      );
  }

  .langs{
    margin-top:36px;
  }

  .langs button{
    height:70px;
    font-size:11px;
  }

  .actions{
    margin-top:24px;
  }

  .next{
    min-width:128px;
  }

  .finalGrid{
    display:flex;
    flex-direction:column;

    align-items:flex-start;
    justify-content:center;

    gap:44px;
  }

  .logoBlock img{
    width:min(52vw,190px);
  }

  #finalTitle{
    font-size:
      clamp(
        31px,
        9vw,
        46px
      );
  }

  .finalDetails{
    flex-direction:column;
    gap:8px;
  }

}

</style>
</head>

<body>


<canvas id="dreamCanvas"></canvas>

<div id="graphite"></div>

<div id="readingShadow"></div>

<div id="veil"></div>

<div id="ghostLayer"></div>

<div id="grain"></div>


<div id="dreamShift">

  <div class="dreamShiftWrap">

    <div id="dreamShiftMain"></div>

    <div id="dreamShiftSub"></div>

  </div>

</div>


<div id="whiteBloom"></div>

<div id="whiteout"></div>


<div id="finalInvite">

  <div class="finalGrid">

    <div class="logoBlock">

      <img

      >

    </div>

      </div>

      <div id="finalTitle"></div>

        <div>

        </div>

        <div>
          KRAKÓW
        </div>

      </div>

    </div>

  </div>

</div>


<div id="ui">

  <div class="top">

    <span>

    </span>

  </div>


  <div id="screenWrap">

    <main id="screen"></main>

  </div>


  <div class="bottom">

    <span>
      PATCHLAB 2026
    </span>

    <span id="depthLabel">
      TRAUM 0
    </span>

  </div>

</div>


<script>


/* =========================================================
   BACKEND
   ========================================================= */

const API_URL =
"https://script.google.com/macros/s/AKfycbzU_GDYcK7nC4aGNVxmQd4fojRBacX1UR076Ox-lCI8KrGV1YVN7G_mwGT-6UFzOhJY3g/exec";


/* =========================================================
   VIEWPORT
   ========================================================= */

function setVH(){

  const h =
    window.visualViewport
    ?
    window.visualViewport.height
    :
    window.innerHeight;


  document
  .documentElement
  .style
  .setProperty(
    "--vh",
    (h*.01)+"px"
  );

}


setVH();


window.addEventListener(
  "resize",
  setVH
);


if(window.visualViewport){

  window.visualViewport.addEventListener(
    "resize",
    setVH
  );

}


/* =========================================================
   INTRO
   ========================================================= */

const INTRO = {

{

title:"Sen nie jest filmem.",

{

meta:"Every answer will change the next question."
}

],


UKR:[

{
type:"text",

/* =========================================================
   HELPERS
   ========================================================= */

function escapeHtml(value){

  return String(
    value || ""
  )
  .replace(
    /[&<>"']/g,
    c=>({

      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      "\"":"&quot;",
      "'":"&#039;"

    }[c])
  );

}


function randomItem(array){

  return array[
    Math.floor(
      Math.random() *
      array.length
    )
  ];

}


function normalizeText(text){

  return String(
    text || ""
  )
  .replace(/\s+/g," ")
  .trim();

}


/* =========================================================
   MODE
   ========================================================= */

function setVisualMode(mode){

  state.mode =
  mode;


  document
  .body
  .classList
  .toggle(
    "questionMode",
    [
      "questions",
      "nickname",
      "saving",
      "saved",
      "error"
    ]
    .includes(
      mode
    )
  );

}


/* =========================================================
   TRANSITION
   ========================================================= */

function transition(fn){

  screen
  .classList
  .add(
    "fade"
  );


  setTimeout(
    ()=>{

      fn();

      requestAnimationFrame(
        ()=>{

          screen
          .classList
          .remove(
            "fade"
          );

        }
      );

    },
    720
  );

}

  saveColorField();


  state.introStep--;


  transition(
    renderIntro
  );

function introNext(){

  saveColorField();


  const slides =
    INTRO[
      state.lang

  if(
    state.introStep <
    slides.length-1

    state.introStep++;


    transition(
      renderIntro

  else{

    state.questionIndex =
      0;


    if(
      !state.generatedQuestions[0]

      state.generatedQuestions[0] =
        generateOpeningQuestion();

    }


    transition(
      renderQuestion

  }

/* =========================================================
   EXTRACT MEANINGFUL FRAGMENT
   ========================================================= */

function extractFragment(text){

  const cleaned =
    normalizeText(
      text
    );


  if(
    !cleaned
  ){

    return "";

  }


  const words =
    cleaned
    .split(/\s+/)
    .filter(Boolean);


  if(
    words.length <=
    8
  ){

    return cleaned;

  }


  /*
  Bierzemy różne rejony zdania,
  aby kolejne sesje nie brzmiały identycznie.
  */

  const startOptions = [

    0,

    Math.floor(
      words.length*.20
    ),

    Math.floor(
      words.length*.40
    ),

    Math.max(
      0,
      words.length-8
    )

  ];


  const start =
    randomItem(
      startOptions
    );


  return words
    .slice(
      start,
      start+8
    )
    .join(" ");

}

/* =========================================================
   QUESTION GENERATOR
   ========================================================= */

function generateAdaptiveQuestion(){

  const i =
    state.questionIndex;


  const previousAnswer =
    state.answers[
      i-1
    ]
    ?
    state.answers[
      i-1
    ].answer
    :
    "";


  const fragment =
    extractFragment(
      previousAnswer
    );


  const themes =
    detectThemes(
      previousAnswer
    );


  /*
  Pytanie nr:
  0 = opening
  1–2 = rozwijanie opisu
  3–5 = głębsze związki
  6–8 = meta / pamięć / transformacja
  */


  if(
    i <= 2
  ){

    return generateLayerOneQuestion(
      fragment,
      themes
    );

  }


  if(
    i <= 5
  ){

    return generateLayerTwoQuestion(
      fragment,
      themes
    );

  }


  return generateLayerThreeQuestion(
    fragment,
    themes
  );

}

/* =========================================================
   CURRENT QUESTION
   ========================================================= */

function getCurrentQuestion(){

  return state.generatedQuestions[
    state.questionIndex
  ];

}


/* =========================================================
   LEVEL
   ========================================================= */

function getDreamLevel(){

  if(
    state.questionIndex <= 2
  ){
    return 0;
  }


  if(
    state.questionIndex <= 5
  ){
    return 1;
  }


  return 2;

}


/* =========================================================
   RENDER QUESTION
   ========================================================= */

function renderQuestion(){

  setVisualMode(
    "questions"
  );


  const copy =
    UI[
      state.lang
    ];


  const q =
    getCurrentQuestion();


  if(!q){
    return;
  }


  const saved =
    state.answers[
      state.questionIndex
    ];


  const level =
    getDreamLevel();


  dreamEngine.depthTarget =
    level;


  progress.textContent =
    `${String(
      state.questionIndex+1
    ).padStart(
      2,
      "0"
    )}
    /
    ${String(
      state.totalQuestions
    ).padStart(
      2,
      "0"
    )}`;


  depthLabel.textContent =
    `TRAUM ${level}`;


  let trace =
    "";


  if(
    state.questionIndex > 0
  ){

    const previous =
      state.answers[
        state.questionIndex-1
      ];


    if(
      previous &&
      previous.answer
    ){

      const fragment =
        extractFragment(
          previous.answer
        );


      if(fragment){

        trace = `

<div class="contextTrace">
${escapeHtml(
  fragment
)}
</div>

`;

      }

    }

  }


  screen.innerHTML = `

<div class="eyebrow">
${escapeHtml(
  q.category
)}
</div>

<h2 class="questionText">
${escapeHtml(
  q.question
)}
</h2>

${trace}

<textarea
id="answer"
placeholder="${copy.placeholder}"
>${escapeHtml(
  saved
  ?
  saved.answer
  :
  ""
)}</textarea>

<div class="actions">

<button
class="back"
onclick="questionBack()"
>
${copy.back}
</button>

<button
class="next"
onclick="questionNext()"
>
${copy.next}
</button>

</div>

`;


  spawnPreviousAnswerGhost();


  setTimeout(
    ()=>{

      document
      .getElementById(
        "answer"
      )
      ?.focus();

    },
    450
  );

}


/* =========================================================
   SAVE CURRENT ANSWER
   ========================================================= */

function saveCurrentAnswer(){

  const field =
    document.getElementById(
      "answer"
    );


  if(!field){
    return;
  }


  const q =
    getCurrentQuestion();


  state.answers[
    state.questionIndex
  ]
  =
  {

    level:
      getDreamLevel(),

    category:
      q.category,

    question:
      q.question,

    answer:
      normalizeText(
        field.value
      )

  };

}


/* =========================================================
   NEXT QUESTION
   ========================================================= */

function questionNext(){

  saveCurrentAnswer();


  const current =
    state.answers[
      state.questionIndex
    ];


  /*
  Pozwalamy na krótką odpowiedź,
  ale nie pustą.
  */

  if(
    !current ||
    !current.answer
  ){

    const field =
      document.getElementById(
        "answer"
      );


    if(field){

      field.focus();

      field.style.borderBottomColor =
        "rgba(255,255,255,.65)";


      setTimeout(
        ()=>{

          field.style.borderBottomColor =
            "rgba(255,255,255,.19)";

        },
        900
      );

    }


    return;

  }


  /*
  Koniec całego wywiadu.
  */

  if(
    state.questionIndex ===
    state.totalQuestions-1
  ){

    transition(
      renderNickname
    );

    return;

  }


  /*
  Po pytaniu 03 → pierwsze zejście.
  */

  if(
    state.questionIndex ===
    2
  ){

    state.questionIndex++;


    if(
      !state.generatedQuestions[
        state.questionIndex
      ]
    ){

      state.generatedQuestions[
        state.questionIndex
      ]
      =
      generateAdaptiveQuestion();

    }


    runDreamShift(
      1
    );


    return;

  }


  /*
  Po pytaniu 06 → drugie zejście.
  */

  if(
    state.questionIndex ===
    5
  ){

    state.questionIndex++;


    if(
      !state.generatedQuestions[
        state.questionIndex
      ]
    ){

      state.generatedQuestions[
        state.questionIndex
      ]
      =
      generateAdaptiveQuestion();

    }


    runDreamShift(
      2
    );


    return;

  }


  state.questionIndex++;


  if(
    !state.generatedQuestions[
      state.questionIndex
    ]
  ){

    state.generatedQuestions[
      state.questionIndex
    ]
    =
    generateAdaptiveQuestion();

  }


  transition(
    renderQuestion
  );

}


/* =========================================================
   BACK
   ========================================================= */

function questionBack(){

  saveCurrentAnswer();


  if(
    state.questionIndex ===
    0
  ){

    state.introStep =
      INTRO[
        state.lang
      ]
      .length-1;


    transition(
      renderIntro
    );


    return;

  }


  state.questionIndex--;


  dreamEngine.depthTarget =
    getDreamLevel();


  transition(
    renderQuestion
  );

}

/* =========================================================
   ANSWER GHOST
   ========================================================= */

function spawnPreviousAnswerGhost(){

  if(
    state.questionIndex ===
    0
  ){

    return;

  }


  const previous =
    state.answers
    .filter(
      a =>
        a &&
        a.answer &&
        a.answer.length > 2
    );


  if(
    !previous.length
  ){

    return;

  }


  if(
    Math.random() >
    .48
  ){

    const a =
      randomItem(
        previous
      );


    const fragment =
      extractFragment(
        a.answer
      );


    ghost(
      fragment,
      true
    );

  }

}

>

<div class="actions">

<button
class="back"
onclick="nicknameBack()"
>
${copy.back}
</button>

<button
class="next"
onclick="saveDream()"
>
${copy.nicknameSubmit}
</button>

</div>

`;


  setTimeout(
    ()=>{

      document
      .getElementById(
        "nickname"
      )
      ?.focus();

    },
    400
  );

}


/* =========================================================
   NICK BACK
   ========================================================= */

function nicknameBack(){

  const field =
    document.getElementById(
      "nickname"
    );


  if(field){

    state.nickname =
      field.value.trim();

  }


  state.questionIndex =
    state.totalQuestions-1;


  dreamEngine.depthTarget =
    2;


  transition(
    renderQuestion
  );

}


/* =========================================================
   SAVE
   ========================================================= */

async function saveDream(){

  const field =
    document.getElementById(
      "nickname"
    );


  state.nickname =
    field
    ?
    field.value.trim()
    :
    "";


  if(
    !state.nickname
  ){

    state.nickname =
      "ANONYMOUS";

  }


  const copy =
    UI[
      state.lang
    ];


  const payload = {

    nickname:
      state.nickname,

    language:
      state.lang,

    dreamColor:
      state.dreamColorName,

    answers:
      state.answers,

    dream:
      state.answers
      .map(
        a =>
          a
          ?
          a.answer
          :
          ""
      )
      .join(
        "\n\n"
      )

  };


  transition(
    ()=>{

      setVisualMode(
        "saving"
      );


      progress.textContent =
        "";


      depthLabel.textContent =
        "ARCHIVE";


      screen.innerHTML = `

<div class="eyebrow">
TRAUM SIM
</div>

<h2>
${copy.saving}
</h2>

<p class="sub">
...
</p>

`;

    }
  );


  try{

    const response =
      await fetch(
        API_URL,
        {

          method:"POST",

          headers:{
            "Content-Type":
              "text/plain;charset=utf-8"
          },

          body:
            JSON.stringify(
              payload
            )

        }
      );


    if(
      !response.ok
    ){

      throw new Error(
        "HTTP " +
        response.status
      );

    }


    const data =
      await response.json();


    if(
      !data.ok
    ){

      throw new Error(
        data.error ||
        "Backend error"
      );

    }


    renderSaved(
      data.dreamId
    );

  }
  catch(error){

    console.error(
      error
    );


    renderError();

  }

}


/* =========================================================
   SAVED
   ========================================================= */

function renderSaved(id){

  const copy =
    UI[
      state.lang
    ];


  transition(
    ()=>{

      setVisualMode(
        "saved"
      );


      screen.innerHTML = `

<div class="eyebrow">
TRAUM SIM
</div>

<h2>
${copy.done}
</h2>

<p class="sub">
${copy.sub}
</p>

<div class="received">

${escapeHtml(
  id || ""
)}

&nbsp;&nbsp;/&nbsp;&nbsp;

${escapeHtml(
  state.nickname
)}

</div>

`;

    }
  );


  setTimeout(
    startFinalSequence,
    4600
  );

}


/* =========================================================
   ERROR
   ========================================================= */

function renderError(){

  const copy =
    UI[
      state.lang
    ];


  let message;


  if(
    state.lang ===
    "PL"
  ){

    message =
      "Połączenie z archiwum zostało przerwane.";

  }
  else if(
    state.lang ===
    "UKR"
  ){

    message =
      "З’єднання з архівом було перервано.";

  }
  else{

    message =

  transition(
    ()=>{

      setVisualMode(
        "error"
      );


      screen.innerHTML = `

<div class="eyebrow">
TRAUM SIM
</div>

<h2>
${copy.error}
</h2>

<p class="sub">
${message}
</p>

<div class="actions">

<span></span>

<button
class="next"
onclick="saveDream()"
>
${copy.retry}
</button>

</div>

`;

/* =========================================================
   FINAL
   ========================================================= */

function startFinalSequence(){

    );


  const bloom =

/* =========================================================
   GHOST
   ========================================================= */

function ghost(
  text,
  answer=false
){

  if(!text){
    return;
  }


  const e =
    document.createElement(
      "div"
    );


  e.className =
    answer
    ?
    "ghost answerGhost"
    :
    "ghost";


  e.textContent =
    text;


  e.style.left =
    (
      Math.random()*55
      -
      5
    )
    +
    "vw";


  e.style.top =
    (
      Math.random()*75
      +
      8
    )
    +
    "vh";


  e.style.animationDuration =
    (
      24
      +
      Math.random()*20
    )
    +
    "s";


  ghostLayer.appendChild(
    e
  );


  setTimeout(
    ()=>{

      e.remove();

    },
    46000
  );

}


/* =========================================================
   WATERCOLOUR RORSCHACH
   ========================================================= */

const canvas =
document.getElementById(
"dreamCanvas"
);


const ctx =
canvas.getContext(
"2d"
);


let W=0;
let H=0;
let DPR=1;


const dreamEngine = {

  depth:0,

  depthTarget:0,

  focus:0

};


const organisms = [];


/* =========================================================
   RANDOM
   ========================================================= */

function rand(
  a,
  b
){

  return a +
  Math.random() *
  (
    b-a
  );

}


/* =========================================================
   ORGANISM
   ========================================================= */

function makeOrganism(index){

  const base =
    Math.min(
      W,
      H
    );


  return {

    y:
      H *
      rand(
        .25,
        .75
      ),

    radius:
      base *
      rand(
        .23,
        .50
      ),

    stretch:
      rand(
        1.25,
        2.70
      ),

    height:
      rand(
        .58,
        1.32
      ),

    lobe1:
      rand(
        1.2,
        3.5
      ),

    lobe2:
      rand(
        3.5,
        7.5
      ),

    lobe3:
      rand(
        7,
        13
      ),

    amp1:
      rand(
        .05,
        .15
      ),

    amp2:
      rand(
        .025,
        .085
      ),

    amp3:
      rand(
        .01,
        .045
      ),

    phase1:
      rand(
        0,
        Math.PI*2
      ),

    phase2:
      rand(
        0,
        Math.PI*2
      ),

    phase3:
      rand(
        0,
        Math.PI*2
      ),

    phaseY:
      rand(
        0,
        Math.PI*2
      ),

    speed1:
      rand(
        .008,
        .018
      ),

    speed2:
      rand(
        .004,
        .011
      ),

    speed3:
      rand(
        .002,
        .006
      ),

    speedY:
      rand(
        .003,
        .008
      ),

    driftY:
      rand(
        3,
        15
      ),

    index:index

  };

}


/* =========================================================
   RESIZE
   ========================================================= */

function resizeDream(){

  W =
    window.innerWidth;


  H =
    window.innerHeight;


  DPR =
    Math.min(
      window.devicePixelRatio ||
      1,
      1.5
    );


  canvas.width =
    W *
    DPR;


  canvas.height =
    H *
    DPR;


  ctx.setTransform(
    DPR,
    0,
    0,
    DPR,
    0,
    0
  );


  organisms.length =
    0;


  for(
    let i=0;
    i<7;
    i++
  ){

    organisms.push(
      makeOrganism(
        i
      )
    );

  }


  ctx.fillStyle =
    "#000";


  ctx.fillRect(
    0,
    0,
    W,
    H
  );

}


/* =========================================================
   COLOR
   ========================================================= */

function watercolorColor(
  brightness,
  alpha
){

  const c =
    state.dreamColor;


  const grey =
    (
      c.r +
      c.g +
      c.b
    )
    /
    3;


  const SAT =
    .36;


  let r =
    grey +
    (
      c.r-grey
    )
    *
    SAT;


  let g =
    grey +
    (
      c.g-grey
    )
    *
    SAT;


  let b =
    grey +
    (
      c.b-grey
    )
    *
    SAT;


  r =
    Math.min(
      255,
      r *
      brightness
    );


  g =
    Math.min(
      255,
      g *
      brightness
    );


  b =
    Math.min(
      255,
      b *
      brightness
    );


  return `rgba(
    ${Math.round(r)},
    ${Math.round(g)},
    ${Math.round(b)},
    ${alpha}
  )`;

}


/* =========================================================
   RADIUS
   ========================================================= */

function radiusAt(
  o,
  angle,
  seconds,
  scale
){

  const p1 =
    Math.sin(
      angle *
      o.lobe1
      +
      seconds *
      o.speed1
      +
      o.phase1
    )
    *
    o.amp1;


  const p2 =
    Math.cos(
      angle *
      o.lobe2
      -
      seconds *
      o.speed2
      +
      o.phase2
    )
    *
    o.amp2;


  const p3 =
    Math.sin(
      angle *
      o.lobe3
      +
      seconds *
      o.speed3
      +
      o.phase3
    )
    *
    o.amp3;


  const breath =
    Math.sin(
      seconds *
      .028
      +
      o.phase1
    )
    *
    .016;


  return
    o.radius
    *
    scale
    *
    (
      1
      +
      p1
      +
      p2
      +
      p3
      +
      breath
    );

}


/* =========================================================
   PATH
   ========================================================= */

function createBlotPath(
  o,
  seconds,
  scale,
  microOffset=0
){

  const cx =
    W*.5;


  const cy =
    o.y
    +
    Math.sin(
      seconds *
      o.speedY
      +
      o.phaseY
    )
    *
    o.driftY;


  const steps =
    190;


  const left =
    [];


  for(
    let i=0;
    i<=steps;
    i++
  ){

    const p =
      i /
      steps;


    const angle =
      -Math.PI*.5
      +
      p *
      Math.PI;


    const radius =
      radiusAt(
        o,
        angle,
        seconds,
        scale
      );


    const edge =
      Math.sin(
        angle*23
        +
        o.index*4.6
        +
        seconds*.004
      )
      *
      microOffset;


    const r =
      radius *
      (
        1 +
        edge
      );


    const x =
      Math.cos(
        angle
      )
      *
      r
      *
      o.stretch;


    const y =
      Math.sin(
        angle
      )
      *
      r
      *
      o.height;


    left.push(
      {
        x:
          cx-x,

        y:
          cy+y
      }
    );

  }


  ctx.beginPath();


  const first =
    left[0];


  ctx.moveTo(
    first.x,
    first.y
  );


  for(
    const p
    of
    left
  ){

    ctx.lineTo(
      p.x,
      p.y
    );

  }


  for(
    let i=left.length-1;
    i>=0;
    i--
  ){

    const p =
      left[i];


    ctx.lineTo(
      cx +
      (
        cx-p.x
      ),
      p.y
    );

  }


  ctx.closePath();

}


/* =========================================================
   PAINT
   ========================================================= */

function paintLayer(
  o,
  seconds,
  scale,
  brightness,
  alpha,
  edge
){

  createBlotPath(
    o,
    seconds,
    scale,
    edge
  );


  ctx.fillStyle =
    watercolorColor(
      brightness,
      alpha
    );


  ctx.fill();

}


/* =========================================================
   ORGANISM
   ========================================================= */

function paintOrganism(
  o,
  seconds
){

  paintLayer(
    o,
    seconds,
    1.20,
    1.18,
    .036,
    .010
  );


  paintLayer(
    o,
    seconds+31,
    1.00,
    .90,
    .071,
    .014
  );


  paintLayer(
    o,
    seconds+67,
    .82,
    .68,
    .066,
    .012
  );


  paintLayer(
    o,
    seconds+109,
    .61,
    .43,
    .055,
    .009
  );


  paintLayer(
    o,
    seconds+157,
    .43,
    .27,
    .050,
    .006
  );


  if(
    dreamEngine.depth >
    .70
  ){

    const strength =
      Math.min(
        1,
        dreamEngine.depth -
        .55
      );


    paintLayer(
      o,
      seconds+197,
      .29,
      .95,
      .026 *
      strength,
      .008
    );

  }

}


/* =========================================================
   FOCUS / BLUR
   ========================================================= */

function updateFocus(seconds){

  const waveA =
    (
      Math.sin(
        seconds *
        Math.PI*2 /
        82
      )
      +
      1
    )
    /
    2;


  const waveB =
    (
      Math.sin(
        seconds *
        Math.PI*2 /
        211
        +
        1.9
      )
      +
      1
    )
    /
    2;


  let focus =
    waveA*.54
    +
    waveB*.46;


  focus =
    focus *
    focus *
    (
      3 -
      2*focus
    );


  dreamEngine.focus =
    focus;


  let blur =
    17 -
    focus*12;


  if(
    state.mode ===
    "questions"
  ){

    blur +=
      1.5;

  }


  const contrast =
    112 +
    focus*38;


  const opacity =
    .70 +
    focus*.18;


  canvas.style.filter =
    `blur(${blur.toFixed(2)}px)
    contrast(${contrast.toFixed(1)}%)`;


  canvas.style.opacity =
    opacity.toFixed(
      3
    );

}


/* =========================================================
   DEPTH
   ========================================================= */

function updateDepth(){

  dreamEngine.depth +=
    (
      dreamEngine.depthTarget -
      dreamEngine.depth
    )
    *
    .002;

}


/* =========================================================
   DRAW
   ========================================================= */

function drawDream(timestamp){

  const seconds =
    timestamp /
    1000;


  updateDepth();


  ctx.fillStyle =
    "#000";


  ctx.fillRect(
    0,
    0,
    W,
    H
  );


  const g =
    ctx.createRadialGradient(
      W*.5,
      H*.5,
      0,
      W*.5,
      H*.5,
      Math.max(
        W,
        H
      )
      *
      .72
    );


  g.addColorStop(
    0,
    "rgba(35,35,35,.24)"
  );


  g.addColorStop(
    .50,
    "rgba(13,13,13,.20)"
  );


  g.addColorStop(
    1,
    "rgba(0,0,0,1)"
  );


  ctx.fillStyle =
    g;


  ctx.fillRect(
    0,
    0,
    W,
    H
  );


  ctx.globalCompositeOperation =
    "screen";


  for(
    const organism
    of
    organisms
  ){

    paintOrganism(
      organism,
      seconds
    );

  }


  ctx.globalCompositeOperation =
    "source-over";


  updateFocus(
    seconds
  );


  requestAnimationFrame(
    drawDream
  );

}


/* =========================================================
   INIT
   ========================================================= */

window.addEventListener(
  "resize",
  resizeDream
);


resizeDream();


renderStart();


requestAnimationFrame(
  drawDream
);


</script>
