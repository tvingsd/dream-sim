<head>

  content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover"
>

<title>TRAUM SIM — PATCHLAB 2026</title>


<style>

/* =========================================================
   ROOT
   ========================================================= */

:root{

  --vh:1vh;

  --white:#f5f5f2;

  --muted:
  rgba(255,255,255,.50);

  --line:
  rgba(255,255,255,.19);

  --shadow:
    0 1px 2px rgba(0,0,0,.94),
    0 4px 18px rgba(0,0,0,.42);

  /*
  Default Rorschach colour.
  Changed by user's dream colour.
  */

  --dreamRGB:
  185,185,185;

}


/* =========================================================
   RESET
   ========================================================= */

*{

  box-sizing:border-box;

  margin:0;

  padding:0;

}


html,
body{

  width:100%;

  height:100%;

  overflow:hidden;

  background:#000;

  color:
  var(--white);

  font-family:
  Helvetica,
  Arial,
  sans-serif;

  -webkit-font-smoothing:
  antialiased;

  -webkit-text-size-adjust:
  none;

}


body{

  min-height:
  calc(
    var(--vh)
    *
    100
  );

}



/* =========================================================
   =========================================================
   DREAM WORLD
   INDEPENDENT SVG BACKGROUND
   =========================================================
   ========================================================= */

#dreamWorld{

  position:fixed;

  inset:0;

  z-index:0;

  overflow:hidden;

  pointer-events:none;

  background:#000;

  opacity:.91;

  /*
  Very long focus cycle.
  */

  animation:
  dreamFocus
  139s
  ease-in-out
  infinite;

}


/* =========================================================
   SVG
   ========================================================= */

#dreamSvg{

  position:absolute;

  width:114%;
  height:114%;

  left:-7%;
  top:-7%;

  overflow:visible;

  background:#000;

  /*
  Almost imperceptible full-world breathing.
  NO ROTATION.
  */

  animation:
  dreamWorldBreath
  211s
  ease-in-out
  infinite
  alternate;

}



/* =========================================================
   PIGMENT
   ========================================================= */

.dreamInk{

  fill:
  rgb(
    var(--dreamRGB)
  );

  transition:
  fill
  8s
  ease;

}


.inkGhost{

  opacity:.07;

}


.inkSoft{

  opacity:.115;

}


.inkLight{

  opacity:.16;

}


.inkMedium{

  opacity:.14;

}


.inkMain{

  opacity:.19;

}


.inkDark{

  opacity:.10;

}


.inkCore{

  opacity:.075;

}


.inkWater{

  opacity:.12;

}



/* =========================================================
   RORSCHACH LAYERS
   ========================================================= */

#rorschachBack{

  transform-origin:
  800px
  500px;

  animation:
  backMorph
  243s
  cubic-bezier(.45,0,.55,1)
  infinite
  alternate;

}


#rorschachMid{

  transform-origin:
  800px
  500px;

  animation:
  midMorph
  187s
  cubic-bezier(.45,0,.55,1)
  infinite
  alternate;

}


#rorschachFront{

  transform-origin:
  800px
  500px;

  animation:
  frontMorph
  163s
  cubic-bezier(.45,0,.55,1)
  infinite
  alternate;

}


#waterLayer{

  transform-origin:
  800px
  500px;

  animation:
  waterMorph
  271s
  cubic-bezier(.45,0,.55,1)
  infinite
  alternate;

}



/* =========================================================
   GRAPHITE OVERLAY
   ========================================================= */

#graphite{

  position:fixed;

  inset:0;

  z-index:1;

  pointer-events:none;

  background:

  radial-gradient(

    ellipse
    at
    50%
    48%,

    rgba(72,72,72,.03)
    0%,

    rgba(32,32,32,.065)
    40%,

    rgba(8,8,8,.18)
    72%,

    rgba(0,0,0,.52)
    100%

  );

  opacity:.42;

  transition:
  opacity
  3.2s
  ease;

}


body.questionMode #graphite{

  opacity:.72;

}



/* =========================================================
   READING FIELD
   ========================================================= */

#readingShadow{

  position:fixed;

  inset:0;

  z-index:2;

  pointer-events:none;

  opacity:0;

  background:

  radial-gradient(

    ellipse
    at
    50%
    48%,

    rgba(0,0,0,.02)
    0%,

    rgba(0,0,0,.10)
    40%,

    rgba(0,0,0,.40)
    78%,

    rgba(0,0,0,.64)
    100%

  );

  transition:
  opacity
  2.8s
  ease;

}


body.questionMode #readingShadow{

  opacity:.59;

}



/* =========================================================
   VEIL
   ========================================================= */

#veil{

  position:fixed;

  inset:-18%;

  z-index:3;

  pointer-events:none;

  opacity:.40;

  mix-blend-mode:
  screen;

  background:

  radial-gradient(

    circle at 25% 43%,

    rgba(255,255,255,.022),

    transparent 27%

  ),

  radial-gradient(

    circle at 74% 57%,

    rgba(255,255,255,.017),

    transparent 30%

  );

  animation:
  veilBreath
  89s
  ease-in-out
  infinite
  alternate;

}



/* =========================================================
   GHOST WORDS
   ========================================================= */

#ghostLayer{

  position:fixed;

  inset:0;

  z-index:5;

  pointer-events:none;

  overflow:hidden;

}


.ghost{

  position:absolute;

  max-width:90vw;

  white-space:nowrap;

  font-size:
  clamp(
    25px,
    8vw,
    112px
  );

  line-height:.9;

  letter-spacing:-.05em;

  color:
  rgba(255,255,255,.023);

  filter:
  blur(15px);

  animation:
  ghostMove
  linear
  forwards;

}


.answerGhost{

  color:
  rgba(255,255,255,.042);

  filter:
  blur(17px);

}



/* =========================================================
   GRAIN
   ========================================================= */

#grain{

  position:fixed;

  inset:-50%;

  z-index:7;

  pointer-events:none;

  opacity:.019;

  background-image:

  url(
  "data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.83' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E"
  );

  animation:
  grainMove
  .36s
  steps(2)
  infinite;

}



/* =========================================================
   UI
   ========================================================= */

#ui{

  position:fixed;

  inset:0;

  z-index:20;

  height:
  calc(
    var(--vh)
    *
    100
  );

  display:flex;

  flex-direction:
  column;

  justify-content:
  space-between;

  padding:

  max(
    24px,
    env(safe-area-inset-top)
  )

  max(
    24px,
    env(safe-area-inset-right)
  )

  max(
    24px,
    env(safe-area-inset-bottom)
  )

  max(
    24px,
    env(safe-area-inset-left)
  );

  transition:

  opacity
  1.5s
  ease,

  filter
  1.5s
  ease;

}


#ui.hide{

  opacity:0;

  filter:
  blur(14px);

  pointer-events:none;

}



/* =========================================================
   MICRO UI
   ========================================================= */

.top,
.bottom{

  display:flex;

  justify-content:
  space-between;

  align-items:center;

  gap:20px;

  font-size:10px;

  letter-spacing:.22em;

  text-transform:
  uppercase;

  color:
  var(--muted);

  text-shadow:
  var(--shadow);

}



/* =========================================================
   SCREEN
   ========================================================= */

#screenWrap{

  width:
  min(
    960px,
    100%
  );

  margin:auto;

  position:relative;

}


#screenWrap::before{

  content:"";

  position:absolute;

  z-index:-1;

  inset:
  -80px
  -90px;

  pointer-events:none;

  opacity:.48;

  filter:
  blur(30px);

  background:

  radial-gradient(

    ellipse,

    rgba(0,0,0,.52),

    rgba(0,0,0,.20)
    62%,

    rgba(0,0,0,0)
    83%

  );

}


#screen{

  position:relative;

  transition:

  opacity
  1.25s
  ease,

  transform
  1.45s
  ease,

  filter
  1.25s
  ease;

}


#screen.fade{

  opacity:0;

  transform:
  translateY(10px)
  scale(1.008);

  filter:
  blur(13px);

}

#dreamShift{

  position:fixed;

  inset:0;

.dreamShiftWrap{

/* =========================================================
   =========================================================
   SLOW DREAM ANIMATIONS
   =========================================================
   ========================================================= */

@keyframes dreamWorldBreath{

  0%{

    transform:
    scale(1);

  }

  50%{

    transform:
    scale(1.015);

  }

  100%{

    transform:
    scale(1.03);

  }

}


/* =========================================================
   BACK
   ========================================================= */

@keyframes backMorph{

  0%{

    transform:
    scaleX(.95)
    scaleY(1.04);

    opacity:.78;

  }


  22%{

    transform:
    scaleX(1.02)
    scaleY(.98);

    opacity:.90;

  }


  49%{

    transform:
    scaleX(.98)
    scaleY(1.06);

    opacity:.80;

  }


  74%{

    transform:
    scaleX(1.055)
    scaleY(.95);

    opacity:.93;

  }


  100%{

    transform:
    scaleX(.965)
    scaleY(1.025);

    opacity:.80;

  }

}


/* =========================================================
   MID
   ========================================================= */

@keyframes midMorph{

  0%{

    transform:
    scaleX(1.03)
    scaleY(.95);

    opacity:.76;

  }


  32%{

    transform:
    scaleX(.95)
    scaleY(1.045);

    opacity:.94;

  }


  64%{

    transform:
    scaleX(1.05)
    scaleY(.98);

    opacity:.81;

  }


  100%{

    transform:
    scaleX(.98)
    scaleY(1.055);

    opacity:.90;

  }

}


/* =========================================================
   FRONT
   ========================================================= */

@keyframes frontMorph{

  0%{

    transform:
    scaleX(1.02)
    scaleY(.97);

    opacity:.91;

  }


  30%{

    transform:
    scaleX(.95)
    scaleY(1.05);

    opacity:.74;

  }


  63%{

    transform:
    scaleX(1.045)
    scaleY(.96);

    opacity:.96;

  }


  100%{

    transform:
    scaleX(.98)
    scaleY(1.035);

    opacity:.82;

  }

}


/* =========================================================
   WATER
   ========================================================= */

@keyframes waterMorph{

  0%{

    transform:
    scaleX(.91)
    scaleY(1.08);

    opacity:.21;

  }


  39%{

    transform:
    scaleX(1.09)
    scaleY(.92);

    opacity:.38;

  }


  73%{

    transform:
    scaleX(.96)
    scaleY(1.04);

    opacity:.25;

  }


  100%{

    transform:
    scaleX(1.05)
    scaleY(.95);

    opacity:.33;

  }

}


/* =========================================================
   FOCUS / BLUR

   This deliberately has uneven sections:
   blurred -> clear -> blurred -> very clear -> dream again.
   ========================================================= */

@keyframes dreamFocus{

  0%{

    filter:
    blur(14px)
    contrast(111%);

  }


  15%{

    filter:
    blur(11px)
    contrast(118%);

  }


  32%{

    filter:
    blur(5px)
    contrast(135%);

  }


  43%{

    filter:
    blur(2.5px)
    contrast(149%);

  }


  52%{

    filter:
    blur(4px)
    contrast(141%);

  }


  68%{

    filter:
    blur(10px)
    contrast(120%);

  }


  82%{

    filter:
    blur(17px)
    contrast(108%);

  }


  92%{

    filter:
    blur(7px)
    contrast(131%);

  }


  100%{

    filter:
    blur(14px)
    contrast(111%);

  }

}


/* =========================================================
   VEIL
   ========================================================= */

@keyframes veilBreath{

  from{

    transform:
    translate3d(
      -.7%,
      .4%,
      0
    )
    scale(1);

  }


  to{

    transform:
    translate3d(
      1%,
      -.7%,
      0
    )
    scale(1.018);

  }

}


/* =========================================================
   GRAIN
   ========================================================= */

@keyframes grainMove{

  0%{
    transform:translate(0,0);
  }

  25%{
    transform:translate(3%,-3%);
  }

  50%{
    transform:translate(-4%,2%);
  }

  75%{
    transform:translate(2%,4%);
  }

  100%{
    transform:translate(-2%,-4%);
  }

}


/* =========================================================
   GHOST
   ========================================================= */

@keyframes ghostMove{

  0%{

    opacity:0;

    transform:
    translate3d(
      -1vw,

/* =========================================================
   EXTRACT FRAGMENT
   ========================================================= */

function extractFragment(text){


const cleaned =

normalizeText(
text
);


if(
!cleaned
){

return "";

}


const words =

cleaned
.split(/\s+/)
.filter(
Boolean
);


if(
words.length<=8
){


return cleaned;


}


const startOptions =
[

0,

Math.floor(
words.length*.20
),

Math.floor(
words.length*.40
),

Math.max(
0,
words.length-8
)

];


const start =

randomItem(
startOptions
);


return words
.slice(
start,
start+8
)
.join(" ");

}

state.questionIndex<=2

state.questionIndex<=5

return 1;

}


return 2;

document
.getElementById(
"nickname"

if(field){

field
.value

value;

!state.nickname

UI[
state.lang

{


nickname:
state.nickname,


language:
state.lang,


dreamColor:
state.dreamColorName,


answers:
state.answers,


dream:

state.answers
.map(

a=>

a
?
a.answer
:
""

.join(
"\n\n"

()=>{

"saving"
);

"";

TRAUM SIM

${copy.saving}

...

</p>

}

);

await fetch(

API_URL,

{


method:
"POST",


headers:{

"text/plain;charset=utf-8"

},


body:

JSON.stringify(
payload
)


}

);

!response.ok
){

response.status

);

throw new Error(

);


}



renderSaved(
data.dreamId

}

renderError();


}

}
