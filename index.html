<!DOCTYPE html>
<html lang="pl">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover"
>

<meta name="theme-color" content="#000000">

<title>TRAUM SIM — PATCHLAB 2026</title>

<style>

:root{

  --vh:1vh;

  --white:#f4f4f1;
  --muted:rgba(255,255,255,.48);

  --shadow:
    0 1px 2px rgba(0,0,0,.96),
    0 4px 24px rgba(0,0,0,.48);


  /* =====================================================
     SUN
     ===================================================== */

  --sun-r:220;
  --sun-g:220;
  --sun-b:220;

  --sun-scale:.68;
  --sun-opacity:.54;


  /* =====================================================
     MOON
     ===================================================== */

  --moon-x:92%;
  --moon-y:50%;

  --moon-scale:.68;
  --moon-opacity:0;

}


/* =========================================================
   RESET
   ========================================================= */

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{

  width:100%;
  height:100%;

  overflow:hidden;

  background:#000;

  color:var(--white);

  font-family:
    Helvetica,
    Arial,
    sans-serif;

  -webkit-font-smoothing:antialiased;
  -webkit-text-size-adjust:none;

}

body{
  min-height:calc(var(--vh) * 100);
}


/* =========================================================
   DREAM LANDSCAPE
   ========================================================= */

#dreamLandscape{

  position:fixed;

  inset:0;

  z-index:0;

  overflow:hidden;

  pointer-events:none;

  background:#000;

}


/* =========================================================
   SKY
   ========================================================= */

.sky{

  position:absolute;

  inset:-8%;

  background:

    radial-gradient(
      ellipse at 21% 64%,
      rgba(255,255,255,.028),
      transparent 42%
    ),

    radial-gradient(
      ellipse at 78% 28%,
      rgba(255,255,255,.020),
      transparent 48%
    ),

    linear-gradient(
      180deg,
      #010101 0%,
      #050505 42%,
      #090909 64%,
      #020202 100%
    );

  animation:
    skyDream
    220s
    ease-in-out
    infinite
    alternate;

}


/* =========================================================
   CENTRAL SUN
   ========================================================= */

#dreamSun{

  position:absolute;

  left:50%;
  top:50%;

  width:
    clamp(
      340px,
      47vw,
      920px
    );

  aspect-ratio:1;

  z-index:3;

  opacity:
    var(--sun-opacity);

  transform:
    translate(-50%,-50%)
    scale(var(--sun-scale));

  transform-origin:
    50% 50%;

  transition:
    transform 8.5s cubic-bezier(.22,.61,.36,1),
    opacity 5s ease;

  will-change:
    transform,
    opacity;

}


/* =========================================================
   SUN HALO
   ========================================================= */

.sunHalo{

  position:absolute;

  inset:-18%;

  border-radius:50%;

  background:

    radial-gradient(
      circle,

      rgba(
        var(--sun-r),
        var(--sun-g),
        var(--sun-b),
        .37
      )
      0%,

      rgba(
        var(--sun-r),
        var(--sun-g),
        var(--sun-b),
        .24
      )
      8%,

      rgba(
        var(--sun-r),
        var(--sun-g),
        var(--sun-b),
        .12
      )
      19%,

      rgba(
        var(--sun-r),
        var(--sun-g),
        var(--sun-b),
        .052
      )
      34%,

      rgba(
        var(--sun-r),
        var(--sun-g),
        var(--sun-b),
        .014
      )
      53%,

      rgba(
        var(--sun-r),
        var(--sun-g),
        var(--sun-b),
        0
      )
      73%
    );

  /*
  STATIC blur only.
  No animated filters.
  */

  filter:
    blur(34px);

  animation:
    sunBreath
    22s
    ease-in-out
    infinite
    alternate;

}


/* second irregular halo */

.sunHalo::before{

  content:"";

  position:absolute;

  inset:-15%;

  border-radius:50%;

  background:

    radial-gradient(
      ellipse at 43% 52%,

      rgba(
        var(--sun-r),
        var(--sun-g),
        var(--sun-b),
        .13
      )
      0%,

      rgba(
        var(--sun-r),
        var(--sun-g),
        var(--sun-b),
        .052
      )
      28%,

      rgba(
        var(--sun-r),
        var(--sun-g),
        var(--sun-b),
        .015
      )
      48%,

      transparent
      72%
    );

  filter:
    blur(42px);

  opacity:.82;

}


/* asymmetric dream flare */

.sunHalo::after{

  content:"";

  position:absolute;

  width:82%;
  height:45%;

  left:9%;
  top:32%;

  border-radius:50%;

  background:

    radial-gradient(
      ellipse,

      rgba(
        var(--sun-r),
        var(--sun-g),
        var(--sun-b),
        .09
      ),

      rgba(
        var(--sun-r),
        var(--sun-g),
        var(--sun-b),
        .022
      )
      48%,

      transparent
      74%
    );

  filter:
    blur(48px);

  transform:
    rotate(-8deg);

}


/* =========================================================
   SUN CORE
   ========================================================= */

.sunDisk{

  position:absolute;

  left:50%;
  top:50%;

  width:11%;

  aspect-ratio:1;

  border-radius:50%;

  transform:
    translate(-50%,-50%);

  background:
    rgb(
      var(--sun-r),
      var(--sun-g),
      var(--sun-b)
    );

  opacity:.28;

  filter:
    blur(14px);

  box-shadow:

    0 0 32px
    rgba(
      var(--sun-r),
      var(--sun-g),
      var(--sun-b),
      .18
    );

}


/* =========================================================
   MOON
   ========================================================= */

#dreamMoon{

  position:absolute;

  left:var(--moon-x);
  top:var(--moon-y);

  width:
    clamp(
      110px,
      15vw,
      290px
    );

  aspect-ratio:1;

  z-index:4;

  border-radius:50%;

  background:#000;

  opacity:
    var(--moon-opacity);

  transform:
    translate(-50%,-50%)
    scale(var(--moon-scale));

  transition:

    left
    10s
    cubic-bezier(.22,.61,.36,1),

    top
    10s
    cubic-bezier(.22,.61,.36,1),

    transform
    10s
    cubic-bezier(.22,.61,.36,1),

    opacity
    5s
    ease;

  box-shadow:

    0 0 1px
    rgba(255,255,255,.08),

    inset
    0 0 15px
    rgba(255,255,255,.01);

  will-change:
    left,
    top,
    transform,
    opacity;

}


/* =========================================================
   HORIZON
   ========================================================= */

.horizonFar{

  position:absolute;

  left:-15%;
  right:-15%;

  bottom:24%;

  height:35%;

  background:

    radial-gradient(
      ellipse at 5% 100%,
      rgba(255,255,255,.035),
      transparent 53%
    ),

    radial-gradient(
      ellipse at 25% 100%,
      rgba(255,255,255,.025),
      transparent 55%
    ),

    radial-gradient(
      ellipse at 46% 100%,
      rgba(255,255,255,.05),
      transparent 52%
    ),

    radial-gradient(
      ellipse at 68% 100%,
      rgba(255,255,255,.028),
      transparent 54%
    ),

    radial-gradient(
      ellipse at 94% 100%,
      rgba(255,255,255,.022),
      transparent 54%
    );

  filter:
    blur(20px);

  opacity:.62;

  animation:
    horizonDream
    260s
    ease-in-out
    infinite
    alternate;

}


/* =========================================================
   GROUND
   ========================================================= */

.ground{

  position:absolute;

  left:-12%;
  right:-12%;

  bottom:-18%;

  height:58%;

  background:

    radial-gradient(
      ellipse at 14% 17%,
      rgba(255,255,255,.031),
      transparent 34%
    ),

    radial-gradient(
      ellipse at 42% 9%,
      rgba(255,255,255,.018),
      transparent 38%
    ),

    radial-gradient(
      ellipse at 70% 15%,
      rgba(255,255,255,.032),
      transparent 34%
    ),

    linear-gradient(
      180deg,

      rgba(18,18,18,.82)
      0%,

      rgba(5,5,5,.98)
      33%,

      #000
      100%
    );

  filter:
    blur(13px);

  animation:
    groundDream
    245s
    ease-in-out
    infinite
    alternate;

}


/* =========================================================
   TREE
   ========================================================= */

.tree{

  position:absolute;

  left:28%;

  bottom:25%;

  width:
    clamp(
      110px,
      17vw,
      280px
    );

  height:
    clamp(
      250px,
      46vh,
      560px
    );

  transform:
    translateX(-50%);

  opacity:.56;

  filter:
    blur(5px);

  transform-origin:
    50% 100%;

  animation:
    treeDream
    205s
    ease-in-out
    infinite
    alternate;

}


.treeTrunk{

  position:absolute;

  left:49%;

  bottom:0;

  width:4.8%;

  height:51%;

  border-radius:
    50% 50% 15% 15%;

  background:
    rgba(5,5,5,.96);

  transform:
    translateX(-50%)
    rotate(-1deg);

}


.treeBranchA,
.treeBranchB,
.treeBranchC{

  position:absolute;

  left:50%;

  transform-origin:
    0 100%;

  background:
    rgba(4,4,4,.96);

  border-radius:99px;

}


.treeBranchA{

  bottom:42%;

  width:3.5%;

  height:31%;

  transform:
    rotate(-34deg);

}


.treeBranchB{

  bottom:40%;

  width:3.5%;

  height:34%;

  transform:
    rotate(31deg);

}


.treeBranchC{

  bottom:50%;

  width:2.6%;

  height:23%;

  transform:
    rotate(8deg);

}


.crown{

  position:absolute;

  border-radius:50%;

  background:

    radial-gradient(
      ellipse,

      rgba(12,12,12,.96)
      0%,

      rgba(7,7,7,.91)
      58%,

      rgba(3,3,3,.80)
      77%,

      transparent
      100%
    );

}


.crown.a{

  width:72%;
  height:37%;

  left:3%;
  top:13%;

}


.crown.b{

  width:63%;
  height:43%;

  right:0%;
  top:4%;

}


.crown.c{

  width:78%;
  height:35%;

  left:12%;
  top:27%;

}


.crown.d{

  width:44%;
  height:31%;

  left:28%;
  top:0%;

}


/* =========================================================
   HOUSE
   ========================================================= */

.house{

  position:absolute;

  right:15%;

  bottom:29%;

  width:
    clamp(
      90px,
      11vw,
      175px
    );

  aspect-ratio:1.22;

  opacity:.50;

  filter:
    blur(4px);

  transform-origin:
    50% 100%;

  animation:
    houseDream
    247s
    ease-in-out
    infinite
    alternate;

}


.houseBody{

  position:absolute;

  left:13%;
  right:13%;

  bottom:0;

  height:60%;

  background:
    rgba(7,7,7,.96);

}


.houseRoof{

  position:absolute;

  left:4%;
  top:3%;

  width:92%;
  height:51%;

  background:
    rgba(4,4,4,.98);

  clip-path:
    polygon(
      50% 0%,
      100% 78%,
      89% 100%,
      11% 100%,
      0% 78%
    );

}


.windowA,
.windowB{

  position:absolute;

  bottom:18%;

  width:12%;
  height:22%;

  border-radius:
    50% 50% 10% 10%;

  background:
    rgba(255,255,255,.13);

  box-shadow:
    0 0 20px
    rgba(255,255,255,.06);

}


.windowA{
  left:31%;
}


.windowB{
  right:31%;
}


/* =========================================================
   DISTANT HOUSE
   ========================================================= */

.houseGhost{

  position:absolute;

  right:4%;

  bottom:39%;

  width:
    clamp(
      45px,
      6vw,
      100px
    );

  height:
    clamp(
      40px,
      6vw,
      90px
    );

  opacity:.055;

  filter:
    blur(9px);

  background:
    rgba(255,255,255,.12);

  clip-path:
    polygon(
      10% 42%,
      50% 0%,
      90% 42%,
      90% 100%,
      10% 100%
    );

  animation:
    ghostHouseDream
    310s
    ease-in-out
    infinite
    alternate;

}


/* =========================================================
   FOG
   ========================================================= */

.fog{

  position:absolute;

  left:-20%;

  width:140%;

  height:23%;

  border-radius:50%;

  background:

    radial-gradient(
      ellipse,

      rgba(255,255,255,.040)
      0%,

      rgba(255,255,255,.015)
      42%,

      transparent
      75%
    );

  filter:
    blur(22px);

}


.fog.one{

  bottom:14%;

  opacity:.52;

  animation:
    fogOne
    190s
    ease-in-out
    infinite
    alternate;

}


.fog.two{

  bottom:31%;

  opacity:.29;

  animation:
    fogTwo
    260s
    ease-in-out
    infinite
    alternate;

}


.fog.three{

  bottom:48%;

  height:17%;

  opacity:.14;

  animation:
    fogThree
    330s
    ease-in-out
    infinite
    alternate;

}


/* =========================================================
   CLOUDS
   ========================================================= */

.cloudVeil{

  position:absolute;

  width:88%;

  height:33%;

  border-radius:50%;

  background:

    radial-gradient(
      ellipse,

      rgba(255,255,255,.026),

      rgba(255,255,255,.009)
      38%,

      transparent
      70%
    );

  filter:
    blur(28px);

}


.cloudVeil.one{

  left:-14%;
  top:6%;

  animation:
    cloudOne
    290s
    ease-in-out
    infinite
    alternate;

}


.cloudVeil.two{

  right:-18%;
  top:22%;

  opacity:.47;

  animation:
    cloudTwo
    340s
    ease-in-out
    infinite
    alternate;

}


/* =========================================================
   STRANGE LIGHT
   ========================================================= */

.strangeLight{

  position:absolute;

  left:58%;
  top:25%;

  width:
    clamp(
      200px,
      35vw,
      650px
    );

  height:
    clamp(
      120px,
      21vw,
      360px
    );

  border-radius:50%;

  background:

    radial-gradient(
      ellipse,

      rgba(255,255,255,.032),

      rgba(255,255,255,.009)
      44%,

      transparent
      74%
    );

  filter:
    blur(27px);

  opacity:.32;

  transform:
    rotate(-8deg);

  animation:
    strangeLightDream
    310s
    ease-in-out
    infinite
    alternate;

}


/* =========================================================
   VIGNETTE
   ========================================================= */

#dreamVignette{

  position:absolute;

  inset:0;

  z-index:8;

  background:

    radial-gradient(
      ellipse at 50% 48%,

      transparent
      0%,

      rgba(0,0,0,.055)
      37%,

      rgba(0,0,0,.32)
      73%,

      rgba(0,0,0,.84)
      100%
    );

}


/* =========================================================
   READABILITY
   ========================================================= */

#readingShadow{

  position:fixed;

  inset:0;

  z-index:9;

  pointer-events:none;

  opacity:.15;

  background:

    radial-gradient(
      ellipse at 50% 49%,

      rgba(0,0,0,.10)
      0%,

      rgba(0,0,0,.22)
      40%,

      rgba(0,0,0,.48)
      82%,

      rgba(0,0,0,.68)
      100%
    );

  transition:
    opacity
    2.7s
    ease;

}


body.questionMode #readingShadow{

  opacity:.54;

}


/* =========================================================
   STATIC GRAIN
   ========================================================= */

#grain{

  position:fixed;

  inset:0;

  z-index:10;

  pointer-events:none;

  opacity:.014;

  background-image:url(
    "data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.88' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E"
  );

}


/* =========================================================
   GHOST WORDS
   ========================================================= */

#ghostLayer{

  position:fixed;

  inset:0;

  z-index:11;

  pointer-events:none;

  overflow:hidden;

}


.ghost{

  position:absolute;

  max-width:90vw;

  white-space:nowrap;

  font-size:
    clamp(
      24px,
      8vw,
      110px
    );

  line-height:.9;

  letter-spacing:-.05em;

  color:
    rgba(255,255,255,.018);

  filter:
    blur(15px);

  animation:
    ghostMove
    linear
    forwards;

}


.answerGhost{

  color:
    rgba(255,255,255,.030);

}


/* =========================================================
   UI
   ========================================================= */

#ui{

  position:fixed;

  inset:0;

  z-index:20;

  height:
    calc(
      var(--vh)
      *
      100
    );

  display:flex;

  flex-direction:column;

  justify-content:space-between;

  padding:

    max(
      24px,
      env(safe-area-inset-top)
    )

    max(
      24px,
      env(safe-area-inset-right)
    )

    max(
      24px,
      env(safe-area-inset-bottom)
    )

    max(
      24px,
      env(safe-area-inset-left)
    );

  transition:
    opacity
    1.7s
    ease;

}


#ui.hide{

  opacity:0;

  pointer-events:none;

}


.top,
.bottom{

  display:flex;

  justify-content:space-between;

  align-items:center;

  gap:20px;

  font-size:10px;

  letter-spacing:.22em;

  text-transform:uppercase;

  color:var(--muted);

  text-shadow:var(--shadow);

}


/* =========================================================
   SCREEN
   ========================================================= */

#screenWrap{

  width:
    min(
      960px,
      100%
    );

  margin:auto;

  position:relative;

}


#screenWrap::before{

  content:"";

  position:absolute;

  z-index:-1;

  inset:
    -90px
    -110px;

  pointer-events:none;

  background:

    radial-gradient(
      ellipse,

      rgba(0,0,0,.59)
      0%,

      rgba(0,0,0,.38)
      46%,

      rgba(0,0,0,.13)
      68%,

      transparent
      83%
    );

}


#screen{

  position:relative;

  opacity:1;

  transition:
    opacity
    1.8s
    cubic-bezier(.45,0,.25,1);

  will-change:opacity;

}


#screen.fade{

  opacity:0;

}


/* =========================================================
   TYPOGRAPHY
   ========================================================= */

.eyebrow{

  margin-bottom:24px;

  font-size:10px;

  letter-spacing:.24em;

  text-transform:uppercase;

  color:
    rgba(255,255,255,.53);

  text-shadow:var(--shadow);

}


h1{

  font-size:
    clamp(
      56px,
      13vw,
      116px
    );

  line-height:.84;

  letter-spacing:-.055em;

  font-weight:400;

  text-shadow:var(--shadow);

}


h2{

  max-width:930px;

  font-size:
    clamp(
      30px,
      7vw,
      64px
    );

  line-height:1.02;

  letter-spacing:-.038em;

  font-weight:400;

  text-shadow:var(--shadow);

}


.introText{

  max-width:740px;

  margin-top:28px;

  font-size:
    clamp(
      18px,
      2.8vw,
      29px
    );

  line-height:1.35;

  letter-spacing:-.015em;

  text-shadow:var(--shadow);

}


.introMeta{

  max-width:680px;

  margin-top:27px;

  font-size:12px;

  line-height:1.65;

  color:
    rgba(255,255,255,.53);

  text-shadow:var(--shadow);

}


.sub{

  max-width:650px;

  margin-top:22px;

  font-size:14px;

  line-height:1.55;

  color:
    rgba(255,255,255,.56);

  text-shadow:var(--shadow);

}


.contextTrace{

  max-width:640px;

  margin-top:22px;

  font-size:11px;

  line-height:1.55;

  letter-spacing:.06em;

  color:
    rgba(255,255,255,.27);

  text-shadow:var(--shadow);

}


/* =========================================================
   LANGUAGE
   ========================================================= */

.langs{

  display:grid;

  grid-template-columns:
    1fr
    1fr
    1fr;

  gap:1px;

  margin-top:52px;

  background:
    rgba(255,255,255,.15);

}


button{

  appearance:none;

  border:0;

  background:
    rgba(0,0,0,.82);

  color:#fff;

  font:inherit;

  cursor:pointer;

  text-shadow:var(--shadow);

}


.langs button{

  height:82px;

  font-size:13px;

  letter-spacing:.18em;

}


button:hover{

  background:#fff;

  color:#000;

  text-shadow:none;

}


/* =========================================================
   INPUTS
   ========================================================= */

textarea,
input{

  width:100%;

  border:0;

  border-bottom:
    1px solid
    rgba(255,255,255,.20);

  outline:0;

  background:
    rgba(0,0,0,.08);

  color:#fff;

  font:inherit;

  caret-color:#fff;

  border-radius:0;

  text-shadow:var(--shadow);

}


textarea{

  min-height:210px;

  margin-top:30px;

  padding:
    16px 0 20px;

  resize:none;

  font-size:
    clamp(
      20px,
      4.2vw,
      33px
    );

  line-height:1.38;

}


input{

  margin-top:34px;

  padding:
    18px 0 20px;

  font-size:

    c=>({

      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      "\"":"&quot;",
      "'":"&#039;"

    }[c])
  );

}


function normalizeText(text){

  return String(text || "")
  .replace(/\s+/g," ")
  .trim();

}


function randomItem(array){

  return array[
    Math.floor(
      Math.random()*array.length
    )
  ];

}

/* =========================================================
   DREAM COSMOS
   ========================================================= */

function updateDreamCosmos(){

  if(
    state.mode !==
    "questions"
  ){
    return;
  }


  const i =
    state.questionIndex;


  const level =
    getDreamLevel();


  /*
  =====================================================
  SUN

  Always exactly in the centre.

  Q1 = .70
  Q9 = 2.60
  =====================================================
  */

  const p =
    Math.max(
      0,
      Math.min(
        1,
        i / 8
      )
    );


  const sunScale =
    .70 +
    p * 1.90;


  const sunOpacity =
    .52 +
    p * .22;


  document
  .documentElement
  .style
  .setProperty(
    "--sun-scale",
    sunScale
  );


  document
  .documentElement
  .style
  .setProperty(
    "--sun-opacity",
    sunOpacity
  );


  /*
  =====================================================
  TRAUM 0
  =====================================================
  */

  if(
    level === 0
  ){

    document
    .documentElement
    .style
    .setProperty(
      "--moon-opacity",
      "0"
    );


    document
    .documentElement
    .style
    .setProperty(
      "--moon-x",
      "92%"
    );


    document
    .documentElement
    .style
    .setProperty(
      "--moon-y",
      "50%"
    );


    document
    .documentElement
    .style
    .setProperty(
      "--moon-scale",
      ".68"
    );


    return;

  }


  /*
  =====================================================
  TRAUM 1

  moon starts crossing field
  =====================================================
  */

  if(
    level === 1
  ){

    const local =
      Math.max(
        0,
        Math.min(
          1,
          (i-3)/2
        )
      );


    const moonX =
      84 -
      local * 21;


    const moonScale =
      .68 +
      local * .16;


    document
    .documentElement
    .style
    .setProperty(
      "--moon-opacity",
      ".92"
    );


    document
    .documentElement
    .style
    .setProperty(
      "--moon-x",
      moonX+"%"
    );


    document
    .documentElement
    .style
    .setProperty(
      "--moon-y",
      "50%"
    );


    document
    .documentElement
    .style
    .setProperty(
      "--moon-scale",
      moonScale
    );


    return;

  }


  /*
  =====================================================
  TRAUM 2

  Q7 -> 61%
  Q8 -> ~55%
  Q9 -> 50%
  =====================================================
  */

  const local =
    Math.max(
      0,
      Math.min(
        1,
        (i-6)/2
      )
    );


  const moonX =
    61 -
    local * 11;


  const moonScale =
    .86 +
    local * .22;


  document
  .documentElement
  .style
  .setProperty(
    "--moon-opacity",
    ".99"
  );


  document
  .documentElement
  .style
  .setProperty(
    "--moon-x",
    moonX+"%"
  );


  document
  .documentElement
  .style
  .setProperty(
    "--moon-y",
    "50%"
  );


  document
  .documentElement
  .style
  .setProperty(
    "--moon-scale",
    moonScale
  );

}

let transitionRunning =
false;


function transition(fn){

  if(
    transitionRunning
  ){
    return;
  }


  transitionRunning =
    true;


  screen
  .classList
  .add("fade");


  setTimeout(
    ()=>{

      setTimeout(
        ()=>{

          fn();


          requestAnimationFrame(
            ()=>{

              requestAnimationFrame(
                ()=>{

                  screen
                  .classList
                  .remove("fade");


                  setTimeout(
                    ()=>{

                      transitionRunning =
                        false;

                    },
                    1850
                  );

                }
              );

            }
          );

        },
        420
      );

    },
    1800
  );

}

function introBack(){

  if(
    transitionRunning
  ){
    return;
  }


  saveColorField();


  if(
    state.introStep ===
    0
  ){

    transition(
      renderStart
    );

    return;

  }


  state.introStep--;


  transition(
    renderIntro
  );

}


function introNext(){

  if(
    transitionRunning
  ){
    return;
  }


  saveColorField();


  const slides =
    INTRO[
      state.lang
    ];


  if(
    state.introStep <
    slides.length-1
  ){

    state.introStep++;


    transition(
      renderIntro
    );

    return;

  }


  state.questionIndex =
    0;


  if(
    !state.generatedQuestions[0]
  ){

    state.generatedQuestions[0] =
      generateOpeningQuestion();

  }


  transition(
    renderQuestion
  );

}

/* =========================================================
   FRAGMENT
   ========================================================= */

function extractFragment(text){

  const cleaned =
    normalizeText(text);


  if(!cleaned){
    return "";
  }


  const words =
    cleaned
    .split(/\s+/)
    .filter(Boolean);


  if(
    words.length <=
    8
  ){

    return cleaned;

  }


  const starts = [

    0,

    Math.floor(
      words.length*.20
    ),

    Math.floor(
      words.length*.40
    ),

    Math.max(
      0,
      words.length-8
    )

  ];


  const start =
    randomItem(starts);


  return words
  .slice(
    start,
    start+8
  )
  .join(" ");

}

/* =========================================================
   ADAPTIVE QUESTIONS
   ========================================================= */

function generateAdaptiveQuestion(){

  const i =
    state.questionIndex;


  const previous =
    state.answers[
      i-1
    ];


  const text =
    previous
    ?
    previous.answer
    :
    "";


  const fragment =
    extractFragment(text);


  const themes =
    detectThemes(text);


  if(
    i <= 2
  ){

    return generateLayerOneQuestion(
      fragment,
      themes
    );

  }


  if(
    i <= 5
  ){

    return generateLayerTwoQuestion(
      fragment,
      themes
    );

  }


  return generateLayerThreeQuestion(
    fragment,
    themes
  );

}

/* =========================================================
   QUESTION HELPERS
   ========================================================= */

function getCurrentQuestion(){

  return state
  .generatedQuestions[
    state.questionIndex
  ];

}


function getDreamLevel(){

  if(
    state.questionIndex <= 2
  ){
    return 0;
  }


  if(
    state.questionIndex <= 5
  ){
    return 1;
  }


  return 2;

}


/* =========================================================
   RENDER QUESTION
   ========================================================= */

function renderQuestion(){

  setVisualMode(
    "questions"
  );


  updateDreamCosmos();


  const copy =
    UI[
      state.lang
    ];


  const q =
    getCurrentQuestion();


  if(!q){
    return;
  }


  const saved =
    state.answers[
      state.questionIndex
    ];


  const level =
    getDreamLevel();


  progress.textContent =
    `${String(
      state.questionIndex+1
    ).padStart(
      2,
      "0"
    )}
    /
    ${String(
      state.totalQuestions
    ).padStart(
      2,
      "0"
    )}`;


  depthLabel.textContent =
    `TRAUM ${level}`;


  let trace =
    "";


  if(
    state.questionIndex > 0
  ){

    const previous =
      state.answers[
        state.questionIndex-1
      ];


    if(
      previous &&
      previous.answer
    ){

      const fragment =
        extractFragment(
          previous.answer
        );


      if(fragment){

        trace = `

<div class="contextTrace">
${escapeHtml(fragment)}
</div>

`;

      }

    }

  }


  screen.innerHTML = `

<div class="eyebrow">
${escapeHtml(
  q.category
)}
</div>

<h2>
${escapeHtml(
  q.question
)}
</h2>

${trace}

<textarea
id="answer"
placeholder="${copy.placeholder}"
>${escapeHtml(
  saved
  ?
  saved.answer
  :
  ""
)}</textarea>

<div class="actions">

<button
class="back"
onclick="questionBack()"
>
${copy.back}
</button>

<button
class="next"
onclick="questionNext()"
>
${copy.next}
</button>

</div>

`;


  spawnPreviousAnswerGhost();


  setTimeout(
    ()=>{

      document
      .getElementById(
        "answer"
      )
      ?.focus();

    },
    350
  );

}


/* =========================================================
   SAVE ANSWER
   ========================================================= */

function saveCurrentAnswer(){

  const field =
    document
    .getElementById(
      "answer"
    );


  if(!field){
    return;
  }


  const q =
    getCurrentQuestion();


  state.answers[
    state.questionIndex
  ] = {

    level:
      getDreamLevel(),

    category:
      q.category,

    question:
      q.question,

    answer:
      normalizeText(
        field.value
      )

  };

}


/* =========================================================
   NEXT
   ========================================================= */

function questionNext(){

  if(
    transitionRunning ||
    dreamShiftRunning
  ){
    return;
  }


  saveCurrentAnswer();


  const current =
    state.answers[
      state.questionIndex
    ];


  if(
    !current ||
    !current.answer
  ){

    const field =
      document
      .getElementById(
        "answer"
      );


    if(field){

      field.focus();


      field.style.borderBottomColor =
        "rgba(255,255,255,.70)";


      setTimeout(
        ()=>{

          field.style.borderBottomColor =
            "rgba(255,255,255,.20)";

        },
        900
      );

    }


    return;

  }


  if(
    state.questionIndex ===
    state.totalQuestions-1
  ){

    transition(
      renderNickname
    );

    return;

  }


  state.questionIndex++;


  if(
    !state.generatedQuestions[
      state.questionIndex
    ]
  ){

    state.generatedQuestions[
      state.questionIndex
    ] =
    generateAdaptiveQuestion();

  }


  updateDreamCosmos();


  /*
  Enter TRAUM 1
  */

  if(
    state.questionIndex === 3
  ){

    runDreamShift(1);

    return;

  }


  /*
  Enter TRAUM 2
  */

  if(
    state.questionIndex === 6
  ){

    runDreamShift(2);

    return;

  }


  transition(
    renderQuestion
  );

}


/* =========================================================
   BACK
   ========================================================= */

function questionBack(){

  if(
    transitionRunning ||
    dreamShiftRunning
  ){
    return;
  }


  saveCurrentAnswer();


  if(
    state.questionIndex === 0
  ){

    state.introStep =
      INTRO[
        state.lang
      ]
      .length-1;


    transition(
      renderIntro
    );


    return;

  }


  state.questionIndex--;


  updateDreamCosmos();


  transition(
    renderQuestion
  );

}

/* =========================================================
   GHOST
   ========================================================= */

function spawnPreviousAnswerGhost(){

  if(
    state.questionIndex ===
    0
  ){
    return;
  }


  const previous =
    state.answers
    .filter(
      a =>
      a &&
      a.answer &&
      a.answer.length > 2
    );


  if(
    !previous.length
  ){
    return;
  }


  if(
    Math.random() > .58
  ){

    const a =
      randomItem(previous);


    const fragment =
      extractFragment(
        a.answer
      );


    ghost(
      fragment,
      true
    );

  }

}


function ghost(
text,
answer=false
){

  if(!text){
    return;
  }


  const e =
    document
    .createElement("div");


  e.className =
    answer
    ?
    "ghost answerGhost"
    :
    "ghost";


  e.textContent =
    text;


  e.style.left =
    (
      Math.random()*55
      -
      5
    )
    +
    "vw";


  e.style.top =
    (
      Math.random()*75
      +
      8
    )
    +
    "vh";


  e.style.animationDuration =
    (
      32
      +
      Math.random()*26
    )
    +
    "s";


  ghostLayer
  .appendChild(e);


  setTimeout(
    ()=>{

      e.remove();

    },
    60000
  );

}

/* =========================================================
   SAVE
   ========================================================= */

async function saveDream(){

  if(
    transitionRunning
  ){
    return;
  }


  const field =
    document
    .getElementById(
      "nickname"
    );


  if(field){

    const value =
      field
      .value
      .trim();


    if(value){

      state.nickname =
        value;

    }

  }


  if(
    !state.nickname
  ){

    state.nickname =
      "ANONYMOUS";

  }


  const honeypot =
    document
    .getElementById(
      "website"
    );


  const copy =
    UI[
      state.lang
    ];


  const payload = {

    nickname:
      state.nickname,

    language:
      state.lang,

    dreamColor:
      state.dreamColorName,

    website:
      honeypot
      ?
      honeypot.value
      :
      "",

    answers:
      state.answers,

    dream:
      state.answers
      .map(
        a =>
        a
        ?
        a.answer
        :
        ""
      )
      .join(
        "\n\n"
      )

  };


  transition(
    ()=>{

      setVisualMode(
        "saving"
      );


      progress.textContent =
        "";


      depthLabel.textContent =
        "ARCHIVE";


      screen.innerHTML = `

<div class="eyebrow">
TRAUM SIM
</div>

<h2>
${copy.saving}
</h2>

<p class="sub">
...
</p>

`;

    }
  );


  try{

    const response =
      await fetch(
        API_URL,
        {

          method:"POST",

          headers:{

            "Content-Type":
            "text/plain;charset=utf-8"

          },

          body:
          JSON.stringify(
            payload
          )

        }
      );


    if(
      !response.ok
    ){

      throw new Error(
        "HTTP "
        +
        response.status
      );

    }


    const data =
      await response.json();


    if(
      !data.ok
    ){

      throw new Error(
        data.error
        ||
        "Backend error"
      );

    }


    renderSaved(
      data.dreamId
    );

  }

  catch(error){

    console.error(
      "TRAUM SAVE ERROR",
      error
    );


    renderError();

  }

}

        return;

      }


      transition(
        ()=>{

          setVisualMode(
            "error"
          );


          screen.innerHTML = `

<div class="eyebrow">
TRAUM SIM
</div>

<h2>
${copy.error}
</h2>

<p class="sub">
${message}
</p>

<div class="actions">

<span></span>

<button
class="next"
onclick="saveDream()"
>
${copy.retry}
</button>

</div>

`;

        }
      );

    };


  show();

}


/* =========================================================
   FINAL
   ========================================================= */

function startFinalSequence(){

  const ui =
    document
    .getElementById(
      "ui"
    );


  const bloom =
    document
    .getElementById(
      "whiteBloom"
    );


  const whiteout =
    document
    .getElementById(
      "whiteout"
    );


  const final =
    document
    .getElementById(
      "finalInvite"
    );


  ui
  .classList
  .add("hide");


  setTimeout(
    ()=>{

      bloom
      .classList
      .add("active");


      whiteout
      .classList
      .add("active");

    },
    1300
  );


  setTimeout(
    ()=>{

      document
      .getElementById(
        "finalTitle"
      )
      .textContent =
        UI[
          state.lang
        ]
        .invite;


      final
      .classList
      .add("active");

    },
    7500
  );


  setTimeout(
    ()=>{

      bloom.style.display =
        "none";


      whiteout.style.display =
        "none";

    },
    8150
  );

}


/* =========================================================
   INIT
   ========================================================= */

applySunColor();

renderStart();

</script>
