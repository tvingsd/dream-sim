<!DOCTYPE html>
<html lang="pl">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover"
>

<meta name="theme-color" content="#000000">

<title>
DREAM SIM — PATCHLAB 2026
</title>


<style>

/* =========================================================
   CORE
   ========================================================= */

:root{

  --vh:1vh;

  --fg:#f2f2ef;

  --muted:
  rgba(255,255,255,.44);

  --quiet:
  rgba(255,255,255,.22);

  --line:
  rgba(255,255,255,.18);

}


*{

  box-sizing:border-box;

  margin:0;

  padding:0;

}


html,
body{

  width:100%;

  height:100%;

  overflow:hidden;

  background:#000;

  color:var(--fg);

  font-family:
  Helvetica,
  Arial,
  sans-serif;

  -webkit-font-smoothing:
  antialiased;

  -webkit-text-size-adjust:
  none;

}


body{

  min-height:
  calc(
    var(--vh)
    *
    100
  );

}



/* =========================================================
   DREAM WORLD
   ========================================================= */

#dreamCanvas{

  position:fixed;

  inset:-10%;

  width:120%;

  height:120%;

  z-index:0;

  filter:
  blur(19px)
  contrast(145%);

  opacity:.86;

  transform:
  scale(1.06);

}



/* =========================================================
   FOREST
   ========================================================= */

#forestCanvas{

  position:fixed;

  inset:0;

  width:100%;

  height:100%;

  z-index:2;

  opacity:0;

  filter:
  grayscale(1)
  blur(1.5px)
  contrast(150%);

  mix-blend-mode:screen;

  pointer-events:none;

  transition:
  opacity 4s ease,
  filter 5s ease,
  transform 10s ease;

}


#forestCanvas.visible{

  opacity:.30;

  filter:
  grayscale(1)
  blur(3px)
  contrast(145%);

  transform:
  scale(1.045);

}



/* =========================================================
   CURTAIN
   ========================================================= */

#curtain{

  position:fixed;

  inset:-12%;

  z-index:2;

  pointer-events:none;

  opacity:0;

  background:

  repeating-linear-gradient(
    90deg,

    rgba(255,255,255,.00) 0%,

    rgba(255,255,255,.020) 3%,

    rgba(255,255,255,.11) 5%,

    rgba(255,255,255,.018) 8%,

    rgba(0,0,0,.08) 11%
  );

  filter:
  blur(10px)
  contrast(165%);

  transform:
  perspective(800px)
  rotateY(-7deg)
  scaleX(1.10);

  mix-blend-mode:screen;

  transition:
  opacity 4s ease;

}


#curtain.visible{

  opacity:.40;

  animation:
  curtainWave
  11s
  ease-in-out
  infinite
  alternate;

}



/* =========================================================
   FOG
   ========================================================= */

#fog{

  position:fixed;

  inset:-20%;

  z-index:3;

  pointer-events:none;

  background:

  radial-gradient(
    circle at 28% 40%,
    rgba(255,255,255,.065),
    transparent 20%
  ),

  radial-gradient(
    circle at 72% 55%,
    rgba(255,255,255,.045),
    transparent 25%
  ),

  radial-gradient(
    circle at 50% 82%,
    rgba(255,255,255,.025),
    transparent 28%
  );

  mix-blend-mode:
  screen;

  animation:
  fogMove
  22s
  ease-in-out
  infinite
  alternate;

}



/* =========================================================
   GRAIN
   ========================================================= */

#grain{

  position:fixed;

  inset:-50%;

  z-index:7;

  pointer-events:none;

  opacity:.045;

  background-image:

  url(
  "data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.88' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E"
  );

  animation:
  grain
  .22s
  steps(2)
  infinite;

}



/* =========================================================
   GHOST TEXT
   ========================================================= */

#ghostLayer{

  position:fixed;

  inset:0;

  z-index:6;

  pointer-events:none;

  overflow:hidden;

}


.ghost{

  position:absolute;

  font-size:
  clamp(
    24px,
    8vw,
    112px
  );

  line-height:.9;

  letter-spacing:
  -.05em;

  color:
  rgba(255,255,255,.038);

  filter:
  blur(8px);

  white-space:
  nowrap;

  animation:
  ghostDrift
  linear
  forwards;

}



/* =========================================================
   UI
   ========================================================= */

#ui{

  position:fixed;

  inset:0;

  z-index:20;

  height:
  calc(
    var(--vh)
    *
    100
  );

  display:flex;

  flex-direction:
  column;

  justify-content:
  space-between;

  padding:

  max(
    24px,
    env(safe-area-inset-top)
  )

  max(
    24px,
    env(safe-area-inset-right)
  )

  max(
    24px,
    env(safe-area-inset-bottom)
  )

  max(
    24px,
    env(safe-area-inset-left)
  );

  transition:
  opacity
  1.3s
  ease;

}


#ui.hide{

  opacity:0;

  pointer-events:none;

}



.top,
.bottom{

  display:flex;

  justify-content:
  space-between;

  align-items:center;

  font-size:
  10px;

  letter-spacing:
  .20em;

  text-transform:
  uppercase;

  color:
  var(--muted);

}



#screen{

  width:
  min(
    900px,
    100%
  );

  margin:auto;

  transition:

  opacity
  1.25s
  ease,

  transform
  1.45s
  ease,

  filter
  1.25s
  ease;

}


#screen.fade{

  opacity:0;

  transform:
  translateY(12px)
  scale(1.012);

  filter:
  blur(13px);

}



/* =========================================================
   TYPOGRAPHY
   ========================================================= */

.eyebrow{

  margin-bottom:
  25px;

  font-size:
  10px;

  letter-spacing:
  .24em;

  color:
  var(--muted);

  text-transform:
  uppercase;

}


h1{

  font-weight:
  400;

  font-size:
  clamp(
    52px,
    12vw,
    108px
  );

  line-height:
  .84;

  letter-spacing:
  -.055em;

}


h2{

  font-weight:
  400;

  font-size:
  clamp(
    31px,
    7vw,
    64px
  );

  line-height:
  1.02;

  letter-spacing:
  -.035em;

  max-width:
  900px;

}


.sub{

  margin-top:
  22px;

  max-width:
  620px;

  color:
  rgba(255,255,255,.50);

  font-size:
  14px;

  line-height:
  1.55;

}



/* =========================================================
   LANGUAGE
   ========================================================= */

.langs{

  display:grid;

  grid-template-columns:
  1fr 1fr;

  gap:1px;

  margin-top:
  50px;

  background:
  var(--line);

}


button{

  appearance:none;

  border:0;

  background:
  rgba(0,0,0,.84);

  color:#fff;

  font:inherit;

  cursor:pointer;

}


.langs button{

  height:
  82px;

  font-size:
  13px;

  letter-spacing:
  .18em;

}


.langs button:hover,
.next:hover{

  background:#fff;

  color:#000;

}



/* =========================================================
   DREAM WORDS
   ========================================================= */

.dreamword{

  display:inline-block;

  transition:

  filter
  3.6s
  ease,

  opacity
  3.6s
  ease,

  transform
  4s
  ease;

}


.dreamword.blur{

  filter:
  blur(7px);

  opacity:.66;

}


.dreamword.deepblur{

  filter:
  blur(14px);

  opacity:.30;

}


.dreamword.float{

  transform:
  translateY(-.09em);

}



/* =========================================================
   INPUT
   ========================================================= */

textarea{

  width:100%;

  min-height:
  190px;

  margin-top:
  30px;

  border:0;

  border-bottom:
  1px solid
  var(--line);

  outline:0;

  background:
  rgba(0,0,0,.06);

  color:#fff;

  resize:none;

  padding:
  16px
  0
  20px;

  font:inherit;

  font-size:
  clamp(
    20px,
    4.5vw,
    34px
  );

  line-height:
  1.35;

  caret-color:#fff;

}


textarea::placeholder{

  color:
  rgba(255,255,255,.15);

}



/* =========================================================
   CONTROLS
   ========================================================= */

.actions{

  margin-top:
  34px;

  display:flex;

  align-items:center;

  justify-content:
  space-between;

  gap:
  16px;

}


.back,
.next{

  text-transform:
  uppercase;

  letter-spacing:
  .17em;

  font-size:
  10px;

}


.back{

  color:
  var(--muted);

  background:
  transparent;

  padding:
  16px
  0;

}


.next{

  border:
  1px solid
  rgba(255,255,255,.25);

  padding:
  17px
  20px;

  min-width:
  150px;

  transition:
  .45s;

}


.received{

  margin-top:
  34px;

  color:
  var(--muted);

  font-size:
  11px;

  letter-spacing:
  .21em;

  text-transform:
  uppercase;

}



/* =========================================================
   WHITE DREAM BLOOM
   ========================================================= */

#whiteBloom{

  position:fixed;

  inset:-30%;

  z-index:200;

  pointer-events:none;

  opacity:0;

  transform:
  scale(.20);

  filter:
  blur(60px);

  background:

  radial-gradient(

    circle
    at
    50%
    50%,

    rgba(255,255,255,1)
    0%,

    rgba(255,255,255,.96)
    15%,

    rgba(255,255,255,.62)
    34%,

    rgba(255,255,255,.13)
    55%,

    rgba(255,255,255,0)
    74%

  );

}


#whiteBloom.active{

  animation:

  bloom
  5.5s
  cubic-bezier(
    .22,
    .62,
    .22,
    1
  )
  forwards;

}


#whiteout{

  position:fixed;

  inset:0;

  z-index:201;

  pointer-events:none;

  background:#fff;

  opacity:0;

}


#whiteout.active{

  animation:

  whiteout
  5.6s
  cubic-bezier(
    .22,
    .62,
    .22,
    1
  )
  forwards;

}



/* =========================================================
   FINAL BOARD — BRAUN / RAMS
   ========================================================= */

#finalInvite{

  position:fixed;

  inset:0;

  z-index:220;

  background:#000;

  color:#fff;

  opacity:0;

  pointer-events:none;

  display:flex;

  align-items:center;

  justify-content:center;

  padding:

  max(
    30px,
    env(safe-area-inset-top)
  )

  max(
    28px,
    env(safe-area-inset-right)
  )

  max(
    30px,
    env(safe-area-inset-bottom)
  )

  max(
    28px,
    env(safe-area-inset-left)
  );

}


#finalInvite.active{

  animation:
  finalIn
  2.7s
  ease
  forwards;

}


.finalGrid{

  width:
  min(
    1100px,
    100%
  );

  display:grid;

  grid-template-columns:
  minmax(180px,280px)
  1fr;

  gap:
  clamp(
    48px,
    8vw,
    120px
  );

  align-items:end;

}


.logoBlock{

  align-self:start;

}


.logoBlock img{

  display:block;

  width:
  min(
    100%,
    260px
  );

  height:auto;

  object-fit:
  contain;

}


.finalCopy{

  max-width:
  760px;

}


.finalLabel{

  margin-bottom:
  32px;

  font-size:
  10px;

  line-height:
  1.4;

  letter-spacing:
  .24em;

  color:
  rgba(255,255,255,.42);

  text-transform:
  uppercase;

}


#finalTitle{

  font-size:
  clamp(
    32px,
    5.8vw,
    70px
  );

  line-height:
  1.02;

  letter-spacing:
  -.04em;

  font-weight:
  400;

}


.finalRule{

  width:
  100%;

  height:
  1px;

  background:
  rgba(255,255,255,.21);

  margin:
  42px
  0
  24px;

}


.finalDetails{

  display:flex;

  justify-content:
  space-between;

  align-items:flex-start;

  gap:
  30px;

  font-size:
  clamp(
    10px,
    1.4vw,
    12px
  );

  line-height:
  1.55;

  letter-spacing:
  .17em;

  color:
  rgba(255,255,255,.65);

  text-transform:
  uppercase;

}



/* =========================================================
   ANIMATIONS
   ========================================================= */

@keyframes fogMove{

  from{

    transform:
    translate3d(
      -2%,
      0,
      0
    )
    scale(1);

  }

  to{

    transform:
    translate3d(
      3%,
      -2%,
      0
    )
    scale(1.12);

    filter:
    blur(10px);

  }

}


@keyframes curtainWave{

  0%{

    transform:
    perspective(800px)
    rotateY(-8deg)
    scaleX(1.08)
    translateX(-2%);

    filter:
    blur(10px)
    contrast(160%);

  }

  50%{

    transform:
    perspective(800px)
    rotateY(4deg)
    scaleX(.98)
    translateX(2%);

    filter:
    blur(16px)
    contrast(190%);

  }

  100%{

    transform:
    perspective(800px)
    rotateY(-3deg)
    scaleX(1.12)
    translateX(-1%);

    filter:
    blur(8px)
    contrast(150%);

  }

}


@keyframes grain{

  0%{
    transform:
    translate(0,0);
  }

  25%{
    transform:
    translate(3%,-3%);
  }

  50%{
    transform:
    translate(-4%,2%);
  }

  75%{
    transform:
    translate(2%,4%);
  }

  100%{
    transform:
    translate(-2%,-4%);
  }

}


@keyframes ghostDrift{

  0%{

    opacity:0;

    transform:
    translate3d(
      -4vw,
      3vh,
      0
    )
    scale(.97);

    filter:
    blur(12px);

  }

  18%{

    opacity:1;

  }

  68%{

    opacity:.70;

  }

  100%{

    opacity:0;

    transform:
    translate3d(
      6vw,
      -4vh,
      0
    )
    scale(1.06);

    filter:
    blur(23px);

  }

}


@keyframes bloom{

  0%{

    opacity:0;

    transform:
    scale(.20);

  }

  42%{

    opacity:.14;

  }

  74%{

    opacity:.62;

    transform:
    scale(1);

  }

  100%{

    opacity:1;

    transform:
    scale(1.9);

  }

}


@keyframes whiteout{

  0%{
    opacity:0;
  }

  56%{
    opacity:.04;
  }

  80%{
    opacity:.34;
  }

  100%{
    opacity:1;
  }

}


@keyframes finalIn{

  0%{

    opacity:0;

    filter:
    blur(12px);

    transform:
    scale(1.012);

  }

  100%{

    opacity:1;

    filter:
    blur(0);

    transform:
    scale(1);

  }

}



/* =========================================================
   MOBILE
   ========================================================= */

@media(max-width:700px){

  #ui{

    padding:

    max(
      18px,
      env(safe-area-inset-top)
    )

    max(
      18px,
      env(safe-area-inset-right)
    )

    max(
      18px,
      env(safe-area-inset-bottom)
    )

    max(
      18px,
      env(safe-area-inset-left)
    );

  }


  h1{

    font-size:
    clamp(
      52px,
      18vw,
      82px
    );

  }

    font-size:
    clamp(
      28px,
      8.7vw,
      44px
    );

  }


  textarea{

    min-height:
    clamp(
      150px,
      27dvh,
      230px
    );

    font-size:
    clamp(
      19px,
      6vw,
      27px
    );

  }


  .langs{

    margin-top:
    36px;

  }


  .langs button{

    height:
    70px;

  }


  .actions{

    margin-top:
    24px;

  }


  .next{

    min-width:
    128px;

  }


  .finalGrid{

    display:flex;

    flex-direction:
    column;

    align-items:
    flex-start;

    justify-content:
    center;

    gap:
    46px;

  }


  .logoBlock img{

    width:
    min(
      52vw,
      190px
    );

  }


  #finalTitle{

    font-size:
    clamp(
      31px,
      9vw,
      46px
    );

  }


  .finalRule{

    margin:
    32px
    0
    20px;

  }


  .finalDetails{

    flex-direction:
    column;

    gap:
    8px;

  }

}



/* =========================================================
   MOBILE LANDSCAPE
   ========================================================= */

@media(
  orientation:landscape
)
and
(max-height:520px){

  textarea{

    min-height:
    90px;

  }


  .eyebrow{

    margin-bottom:
    11px;

  }


  .actions{

    margin-top:
    13px;

  }


  .finalGrid{

    display:grid;

    grid-template-columns:
    150px
    1fr;

    gap:
    45px;

  }


  .logoBlock img{

    width:

  }


  #finalTitle{

    font-size:

      7vh,
      38px
    );

  }


  .finalLabel{

    margin-bottom:
    16px;

  }


  .finalRule{

    margin:
    20px
    0
    14px;

  }

}

</style>

<script>



/* =========================================================
   BACKEND
   ========================================================= */

const API_URL =

"https://script.google.com/macros/s/AKfycbzU_GDYcK7nC4aGNVxmQd4fojRBacX1UR076Ox-lCI8KrGV1YVN7G_mwGT-6UFzOhJY3g/exec";



/* =========================================================
   MOBILE VIEWPORT
   ========================================================= */

function
setVH(){

  const h =

  window.visualViewport

  ?

  window.visualViewport.height

  :

  window.innerHeight;


  document
  .documentElement
  .style
  .setProperty(

    "--vh",

    (
      h
      *
      .01
    )
    +
    "px"

  );

}


setVH();


window
.addEventListener(

  "resize",

  setVH

);


if(
  window.visualViewport
){

  window
  .visualViewport
  .addEventListener(

    "resize",

    setVH

  );

}



/* =========================================================
   QUESTIONS
   ========================================================= */

const QUESTIONS_PL=[

function
shuffle(a){

return [...a]
.sort(
()=>
Math.random()
-
.5
);

}



function
pickQuestions(lang){


const bank=

lang==="PL"

?

QUESTIONS_PL

:

QUESTIONS_EN;



const shuffled=

shuffle(
bank
);



const picked=[];

const used=
new Set();



for(
const q
of
shuffled
){


if(

!used.has(q[0])

||

picked.length>4

){

picked.push(q);

used.add(q[0]);

}



if(

picked.length
===
state.total

){

break;

}


}



return picked;

}
