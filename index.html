<!DOCTYPE html>
<html lang="pl">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover"
>

<meta name="theme-color" content="#000000">

<title>TRAUM SIM — PATCHLAB 2026</title>


<style>

/* =========================================================
   ROOT
   ========================================================= */

:root{

  --vh:1vh;

  --white:#f4f4f1;
  --muted:rgba(255,255,255,.50);

  --shadow:
    0 1px 2px rgba(0,0,0,.95),
    0 5px 28px rgba(0,0,0,.48);


  /* DREAM COLOR */

  --dream-r:220;
  --dream-g:220;
  --dream-b:220;

  --dream-color-strength:0;


  /* SUN */

  --sun-r:220;
  --sun-g:220;
  --sun-b:220;

  --sun-scale:.78;
  --sun-opacity:.72;


  /* MOON */

  --moon-x:94%;
  --moon-y:50%;

  --moon-scale:.72;
  --moon-opacity:0;

}


/* =========================================================
   RESET
   ========================================================= */

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{

  width:100%;
  height:100%;

  overflow:hidden;

  background:#000;

  color:var(--white);

  font-family:
    Helvetica,
    Arial,
    sans-serif;

  -webkit-font-smoothing:antialiased;
  -webkit-text-size-adjust:none;

}

body{
  min-height:calc(var(--vh) * 100);
}


/* =========================================================
   DREAM WORLD
   ========================================================= */

#dreamWorld{

  position:fixed;

  inset:0;

  z-index:0;

  overflow:hidden;

  pointer-events:none;

  background:
    linear-gradient(
      180deg,
      #050505 0%,
      #0a0a0a 45%,
      #070707 100%
    );

}


/* =========================================================
   IMAGE STAGE
   ========================================================= */

#dreamImages{

  position:absolute;

  inset:-7%;

  overflow:hidden;

  background:#080808;

}


/* =========================================================
   BASE DREAM IMAGES
   ========================================================= */

.dreamImage{

  position:absolute;

  inset:-8%;

  width:116%;
  height:116%;

  object-fit:cover;
  object-position:center;

  opacity:0;

  filter:
    grayscale(1)
    contrast(1.10)
    brightness(.92)
    blur(11px);

  transform-origin:50% 50%;

  will-change:
    opacity,
    transform;

}


/* =========================================================
   IMAGE MORPH
   ========================================================= */

#dreamImg1{
  animation:imageMorph1 52s linear infinite;
}

#dreamImg2{
  animation:imageMorph2 52s linear infinite;
}

#dreamImg3{
  animation:imageMorph3 52s linear infinite;
}

#dreamImg4{
  animation:imageMorph4 52s linear infinite;
}


/* =========================================================
   DREAM COLOR WASH
   ========================================================= */

#dreamColorWash{

  position:absolute;

  inset:-8%;

  z-index:3;

  opacity:
    var(--dream-color-strength);

  background:

    radial-gradient(
      ellipse at 50% 49%,

      rgba(
        var(--dream-r),
        var(--dream-g),
        var(--dream-b),
        .72
      )
      0%,

      rgba(
        var(--dream-r),
        var(--dream-g),
        var(--dream-b),
        .48
      )
      25%,

      rgba(
        var(--dream-r),
        var(--dream-g),
        var(--dream-b),
        .22
      )
      52%,

      rgba(
        var(--dream-r),
        var(--dream-g),
        var(--dream-b),
        .04
      )
      75%,

      transparent
      100%
    );

  mix-blend-mode:color;

  transition:
    opacity 3s ease;

}


/* =========================================================
   COLOR GLOW
   ========================================================= */

#dreamColorGlow{

  position:absolute;

  inset:-15%;

  z-index:4;

  opacity:
    calc(
      var(--dream-color-strength) * .75
    );

  background:

    radial-gradient(
      ellipse at 50% 52%,

      rgba(
        var(--dream-r),
        var(--dream-g),
        var(--dream-b),
        .42
      )
      0%,

      rgba(
        var(--dream-r),
        var(--dream-g),
        var(--dream-b),
        .16
      )
      38%,

      transparent
      70%
    );

  filter:blur(55px);

  mix-blend-mode:screen;

  transition:
    opacity 3s ease;

}


/* =========================================================
   MILKY DREAM VEIL
   ========================================================= */

#dreamImageVeil{

  position:absolute;

  inset:-15%;

  z-index:5;

  background:

    radial-gradient(
      ellipse at 38% 45%,

      rgba(255,255,255,.105)
      0%,

      rgba(255,255,255,.045)
      30%,

      transparent
      68%
    ),

    radial-gradient(
      ellipse at 72% 54%,

      rgba(255,255,255,.075)
      0%,

      rgba(255,255,255,.025)
      36%,

      transparent
      72%
    );

  filter:blur(42px);

  opacity:.54;

  animation:
    imageVeilDrift
    105s
    ease-in-out
    infinite
    alternate;

}


/* =========================================================
   SOFT FOG
   ========================================================= */

#softFog{

  position:absolute;

  inset:-10%;

  z-index:6;

  background:

    radial-gradient(
      ellipse at 50% 60%,

      rgba(255,255,255,.060)
      0%,

      rgba(255,255,255,.020)
      42%,

      transparent
      75%
    );

  filter:blur(34px);

  opacity:.78;

  animation:
    softFogMove
    90s
    ease-in-out
    infinite
    alternate;

}


/* =========================================================
   SUN
   ========================================================= */

#dreamSun{

  position:absolute;

  left:50%;
  top:50%;

  width:
    clamp(
      450px,
      60vw,
      1160px
    );

  aspect-ratio:1;

  z-index:8;

  opacity:
    var(--sun-opacity);

  transform:
    translate(-50%,-50%)
    scale(var(--sun-scale));

  transform-origin:
    50% 50%;

  transition:
    transform 7s cubic-bezier(.22,.61,.36,1),
    opacity 4s ease;

}


/* =========================================================
   SUN HALO
   ========================================================= */

.sunHalo{

  position:absolute;

  inset:-27%;

  border-radius:50%;

  background:

    radial-gradient(
      circle,

      rgba(
        var(--sun-r),
        var(--sun-g),
        var(--sun-b),
        .70
      )
      0%,

      rgba(
        var(--sun-r),
        var(--sun-g),
        var(--sun-b),
        .42
      )
      9%,

      rgba(
        var(--sun-r),
        var(--sun-g),
        var(--sun-b),
        .22
      )
      22%,

      rgba(
        var(--sun-r),
        var(--sun-g),
        var(--sun-b),
        .085
      )
      39%,

      rgba(
        var(--sun-r),
        var(--sun-g),
        var(--sun-b),
        .025
      )
      56%,

      transparent
      77%
    );

  filter:blur(54px);

  animation:
    sunBreath
    19s
    ease-in-out
    infinite
    alternate;

}


.sunHalo::before{

  content:"";

  position:absolute;

  inset:-18%;

  border-radius:50%;

  background:

    radial-gradient(
      ellipse at 42% 52%,

      rgba(
        var(--sun-r),
        var(--sun-g),
        var(--sun-b),
        .24
      ),

      rgba(
        var(--sun-r),
        var(--sun-g),
        var(--sun-b),
        .075
      )
      38%,

      transparent
      72%
    );

  filter:blur(62px);

}


.sunHalo::after{

  content:"";

  position:absolute;

  width:94%;
  height:48%;

  left:3%;
  top:28%;

  border-radius:50%;

  background:

    radial-gradient(
      ellipse,

      rgba(
        var(--sun-r),
        var(--sun-g),
        var(--sun-b),
        .17
      ),

      rgba(
        var(--sun-r),
        var(--sun-g),
        var(--sun-b),
        .035
      )
      49%,

      transparent
      76%
    );

  filter:blur(70px);

}


/* =========================================================
   SUN DISK
   ========================================================= */

.sunDisk{

  position:absolute;

  left:50%;
  top:50%;

  width:12%;

  aspect-ratio:1;

  border-radius:50%;

  transform:
    translate(-50%,-50%);

  background:
    rgb(
      var(--sun-r),
      var(--sun-g),
      var(--sun-b)
    );

  opacity:.44;

  filter:blur(20px);

}


/* =========================================================
   MOON
   ========================================================= */

#dreamMoon{

  position:absolute;

  left:
    var(--moon-x);

  top:
    var(--moon-y);

  width:
    clamp(
      135px,
      18vw,
      350px
    );

  aspect-ratio:1;

  z-index:9;

  border-radius:50%;

  background:#000;

  opacity:
    var(--moon-opacity);

  transform:
    translate(-50%,-50%)
    scale(var(--moon-scale));

  transition:
    left 8s cubic-bezier(.22,.61,.36,1),
    top 8s cubic-bezier(.22,.61,.36,1),
    transform 8s cubic-bezier(.22,.61,.36,1),
    opacity 4s ease;

}


/* =========================================================
   NOISE
   ========================================================= */

#noise{

  position:absolute;

  inset:0;

  z-index:12;

  opacity:.035;

  pointer-events:none;

  background-image:

    url(
      "data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.72' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.65'/%3E%3C/svg%3E"
    );

  mix-blend-mode:soft-light;

}


/* =========================================================
   VIGNETTE
   ========================================================= */

#dreamVignette{

  position:absolute;

  inset:0;

  z-index:13;

  background:

    radial-gradient(
      ellipse at 50% 48%,

      transparent
      0%,

      rgba(0,0,0,.025)
      39%,

      rgba(0,0,0,.15)
      72%,

      rgba(0,0,0,.55)
      100%
    );

}


/* =========================================================
   READABILITY
   ========================================================= */

#readingShadow{

  position:fixed;

  inset:0;

  z-index:14;

  pointer-events:none;

  opacity:.08;

  background:

    radial-gradient(
      ellipse at 50% 50%,

      rgba(0,0,0,.04)
      0%,

      rgba(0,0,0,.10)
      42%,

      rgba(0,0,0,.34)
      84%,

      rgba(0,0,0,.54)
      100%
    );

  transition:
    opacity 2s ease;

}


body.questionMode #readingShadow{

  opacity:.33;

}


/* =========================================================
   LOW POWER IOS

   Full graphics remain during intro.

   From first questionnaire screen onward:
   all heavy graphics are physically removed
   from rendering.
   ========================================================= */

body.lowPowerIOS.formActive{

  background:#000 !important;

}


body.lowPowerIOS.formActive #dreamWorld,
body.lowPowerIOS.formActive #ghostLayer,
body.lowPowerIOS.formActive #readingShadow{

  display:none !important;

}


body.lowPowerIOS.formActive #ui{

  background:#000;

}


/* =========================================================
   GHOST TEXT
   ========================================================= */

#ghostLayer{

  position:fixed;

  inset:0;

  z-index:15;

  pointer-events:none;

  overflow:hidden;

}


.ghost{

  position:absolute;

  max-width:90vw;

  white-space:nowrap;

  font-size:
    clamp(
      24px,
      8vw,
      112px
    );

  line-height:.9;

  letter-spacing:-.05em;

  color:
    rgba(255,255,255,.020);

  filter:blur(15px);

  animation:
    ghostMove
    linear
    forwards;

}


.answerGhost{

  color:
    rgba(255,255,255,.034);

}


/* =========================================================
   UI
   ========================================================= */

#ui{

  position:fixed;

  inset:0;

  z-index:20;

  height:
    calc(
      var(--vh) * 100
    );

  display:flex;

  flex-direction:column;

  justify-content:space-between;

  padding:

    max(
      24px,
      env(safe-area-inset-top)
    )

    max(
      24px,
      env(safe-area-inset-right)
    )

    max(
      24px,
      env(safe-area-inset-bottom)
    )

    max(
      24px,
      env(safe-area-inset-left)
    );

  transition:
    opacity 1.35s ease;

}


#ui.hide{

  opacity:0;

  pointer-events:none;

}


.top,
.bottom{

  display:flex;

  justify-content:space-between;

  align-items:center;

  gap:20px;

  font-size:10px;

  letter-spacing:.22em;

  text-transform:uppercase;

  color:
    var(--muted);

  text-shadow:
    var(--shadow);

}


/* =========================================================
   SCREEN
   ========================================================= */

#screenWrap{

  width:
    min(
      960px,
      100%
    );

  margin:auto;

  position:relative;

}


#screenWrap::before{

  content:"";

  position:absolute;

  z-index:-1;

  inset:
    -80px
    -100px;

  pointer-events:none;

  background:

    radial-gradient(
      ellipse,

      rgba(0,0,0,.43)
      0%,

      rgba(0,0,0,.22)
      48%,

      rgba(0,0,0,.05)
      70%,

      transparent
      84%
    );

}


body.lowPowerIOS.formActive #screenWrap::before{

  display:none;

}


#screen{

  position:relative;

  opacity:1;

  transition:
    opacity
    1.15s
    cubic-bezier(.45,0,.25,1);

}


#screen.fade{

  opacity:0;

}


/* =========================================================
   TYPOGRAPHY
   ========================================================= */

.eyebrow{

  margin-bottom:24px;

  font-size:10px;

  letter-spacing:.24em;

  text-transform:uppercase;

  color:
    rgba(255,255,255,.56);

  text-shadow:
    var(--shadow);

}


h1{

  font-size:
    clamp(
      56px,
      13vw,
      116px
    );

  line-height:.84;

  letter-spacing:-.055em;

  font-weight:400;

  text-shadow:
    var(--shadow);

}


h2{

  max-width:930px;

  font-size:
    clamp(
      30px,
      7vw,
      64px
    );

  line-height:1.02;

  letter-spacing:-.038em;

  font-weight:400;

  text-shadow:
    var(--shadow);

}


.introText{

  max-width:740px;

  margin-top:28px;

  font-size:
    clamp(
      18px,
      2.8vw,
      29px
    );

  line-height:1.35;

  letter-spacing:-.015em;

  text-shadow:
    var(--shadow);

}


.introMeta{

  max-width:680px;

  margin-top:27px;

  font-size:12px;

  line-height:1.65;

  color:
    rgba(255,255,255,.56);

}


.sub{

  max-width:650px;

  margin-top:22px;

  font-size:14px;

  line-height:1.55;

  color:
    rgba(255,255,255,.59);

}


.contextTrace{

  max-width:640px;

  margin-top:22px;

  font-size:11px;

  line-height:1.55;

  letter-spacing:.06em;

  color:
    rgba(255,255,255,.32);

}


/* =========================================================
   LANGUAGE
   ========================================================= */

.langs{

  display:grid;

  grid-template-columns:
    1fr 1fr 1fr;

  gap:1px;

  margin-top:52px;

  background:
    rgba(255,255,255,.16);

}


button{

  appearance:none;

  border:0;

  background:
    rgba(0,0,0,.78);

  color:#fff;

  font:inherit;

  cursor:pointer;

}


.langs button{

  height:82px;

  font-size:13px;

  letter-spacing:.18em;

}


button:hover{

  background:#fff;

  color:#000;

}


/* =========================================================
   INPUTS
   ========================================================= */

textarea,
input{

  width:100%;

  border:0;

  border-bottom:
    1px solid
    rgba(255,255,255,.24);

  outline:0;

  background:
    rgba(0,0,0,.06);

  color:#fff;

  font:inherit;

  caret-color:#fff;

  border-radius:0;

}


textarea{

  min-height:210px;

  margin-top:30px;

  padding:
    16px 0 20px;

  resize:none;

  font-size:
    clamp(
      20px,
      4.2vw,
      33px
    );

  line-height:1.38;

}


input{

  margin-top:34px;

  padding:
    18px 0 20px;

  font-size:
    clamp(
      25px,
      5vw,
      44px
    );

}


textarea::placeholder,
input::placeholder{

  color:
    rgba(255,255,255,.20);

}


/* =========================================================
   HONEYPOT
   ========================================================= */

#website{

  position:absolute;

  left:-99999px;

  width:1px;
  height:1px;

  opacity:0;

  pointer-events:none;

}


/* =========================================================
   ACTIONS
   ========================================================= */

.actions{

  margin-top:34px;

  display:flex;

  justify-content:space-between;

  align-items:center;

  gap:18px;

}


.back,
.next{

  font-size:10px;

  letter-spacing:.18em;

  text-transform:uppercase;

}


.back{

  background:transparent;

  color:
    var(--muted);

  padding:
    16px 0;

}


.next{

  min-width:150px;

  padding:
    17px 20px;

  border:
    1px solid
    rgba(255,255,255,.30);

}


.received{

  margin-top:34px;

  font-size:11px;

  letter-spacing:.21em;

  text-transform:uppercase;

  color:
    rgba(255,255,255,.60);

}


.colorHint{

  margin-top:15px;

  font-size:10px;

  line-height:1.5;

  letter-spacing:.15em;

  text-transform:uppercase;

  color:
    rgba(255,255,255,.40);

}


/* =========================================================
   DREAM SHIFT
   ========================================================= */

#dreamShift{

  position:fixed;

  inset:0;

  z-index:150;

  pointer-events:none;

  display:flex;

  justify-content:center;

  align-items:center;

  opacity:0;

  background:
    rgba(0,0,0,.94);

}


#dreamShift.active{

  animation:
    dreamShift
    8.3s
    ease
    forwards;

}


.dreamShiftWrap{

  width:
    min(
      760px,
      88vw
    );

  text-align:center;

}


#dreamShiftMain{

  font-size:
    clamp(
      38px,
      9vw,
      92px
    );

  line-height:.9;

  letter-spacing:-.055em;

  font-weight:400;

}


#dreamShiftSub{

  margin-top:28px;

  font-size:10px;

  line-height:1.6;

  letter-spacing:.22em;

  text-transform:uppercase;

  color:
    rgba(255,255,255,.50);

}


#dreamShiftMain,
#dreamShiftSub{

  opacity:1;

  transition:
    opacity 1.2s ease;

}


#dreamShiftMain.shiftFade,
#dreamShiftSub.shiftFade{

  opacity:0;

}


/* =========================================================
   FINAL
   ========================================================= */

#whiteBloom{

  position:fixed;

  inset:-30%;

  z-index:200;

  pointer-events:none;

  opacity:0;

  transform:scale(.2);

  background:

    radial-gradient(
      circle at 50% 50%,

      rgba(255,255,255,1)
      0%,

      rgba(255,255,255,.90)
      17%,

      rgba(255,255,255,.48)
      37%,

      rgba(255,255,255,.08)
      58%,

      transparent
      74%
    );

}


#whiteBloom.active{

  animation:
    bloom
    5.3s
    cubic-bezier(.22,.62,.22,1)
    forwards;

}


#whiteout{

  position:fixed;

  inset:0;

  z-index:201;

  pointer-events:none;

  opacity:0;

  background:#fff;

}


#whiteout.active{

  animation:
    whiteout
    5.4s
    cubic-bezier(.22,.62,.22,1)
    forwards;

}


#finalInvite{

  position:fixed;

  inset:0;

  z-index:220;

  display:flex;

  align-items:center;

  justify-content:center;

  background:#000;

  opacity:0;

  pointer-events:none;

  padding:30px;

}


#finalInvite.active{

  animation:
    finalIn
    2.4s
    ease
    forwards;

}


.finalGrid{

  width:min(1100px,100%);

  display:grid;

  grid-template-columns:
    minmax(180px,280px)
    1fr;

  gap:
    clamp(
      50px,
      8vw,
      120px
    );

  align-items:end;

}


.logoBlock img{

  display:block;

  width:min(100%,260px);

  height:auto;

}


.finalCopy{
  max-width:760px;
}


.finalLabel{

  margin-bottom:32px;

  font-size:10px;

  letter-spacing:.24em;

  text-transform:uppercase;

  color:
    rgba(255,255,255,.42);

}


#finalTitle{

  font-size:
    clamp(
      32px,
      5.8vw,
      70px
    );

  line-height:1.02;

  letter-spacing:-.04em;

  font-weight:400;

}


.finalRule{

  width:100%;

  height:1px;

  margin:
    42px 0 24px;

  background:
    rgba(255,255,255,.21);

}


.finalDetails{

  display:flex;

  justify-content:space-between;

  gap:30px;

  font-size:11px;

  letter-spacing:.18em;

  text-transform:uppercase;

  color:
    rgba(255,255,255,.63);

}


/* =========================================================
   MORPH ANIMATIONS
   ========================================================= */

@keyframes imageMorph1{

  0%{
    opacity:.92;
    transform:translate3d(-1.5%,0,0) scale(1.09);
  }

  17%{
    opacity:.94;
    transform:translate3d(.2%,-.6%,0) scale(1.13);
  }

  29%{
    opacity:0;
    transform:translate3d(1.2%,-1%,0) scale(1.17);
  }

  87%{
    opacity:0;
    transform:translate3d(-1.4%,.8%,0) scale(1.07);
  }

  100%{
    opacity:.92;
    transform:translate3d(-1.5%,0,0) scale(1.09);

/* =========================================================
   IOS PERFORMANCE PROFILE
   ========================================================= */

function detectLowPowerIOS(){

  const ua =
    navigator.userAgent || "";


  const platform =
    navigator.platform || "";


  const touchPoints =
    navigator.maxTouchPoints || 0;


  /*
  Normal iPhone detection.
  Also covers iOS-style WebKit identification.
  */

  const isIPhone =
    /iPhone|iPod/i.test(ua);


  const isiOSDevice =
    isIPhone
    ||
    (
      platform === "MacIntel"
      &&
      touchPoints > 1
      &&
      Math.min(
        screen.width,
        screen.height
      ) <= 430
    );


  if(
    !isiOSDevice
  ){

    return false;

  }


  const shortSide =
    Math.min(
      screen.width,
      screen.height
    );


  const longSide =
    Math.max(
      screen.width,
      screen.height
    );


  const dpr =
    window.devicePixelRatio || 1;


  /*
  IMPORTANT:

  Safari does not expose an exact model such as
  "iPhone 13" or "iPhone 14".

  This intentionally uses a SAFE PERFORMANCE CLASS.

  It includes typical iPhone 14 / 13 / 12 / 11 / SE etc.
  It may also classify some newer similarly-sized iPhones
  as low power.

  That is deliberate:
  stability is more important than guessing the exact model.
  */

  const phoneSizeClass =
    shortSide <= 430
    &&
    longSide <= 932;


  const retinaPhone =
    dpr >= 2
    &&
    dpr <= 3.5;


  return (
    phoneSizeClass
    &&
    retinaPhone
  );

}


const LOW_POWER_IOS =
  detectLowPowerIOS();

  LOW_POWER_IOS

/* =========================================================
   CSS COLOR FALLBACK
   ========================================================= */

function parseCssColor(value){

  try{

    const canvas =
      document
      .createElement(
        "canvas"
      );


    canvas.width=1;
    canvas.height=1;


    const ctx =
      canvas
      .getContext(
        "2d"
      );


    if(!ctx){

      return null;

    }


    ctx.fillStyle =
      "#010203";


    ctx.fillStyle =
      value;


    const normalized =
      ctx.fillStyle;


    if(
      normalized === "#010203"
      &&
      value !== "#010203"
    ){

      return null;

    }


    ctx.clearRect(
      0,
      0,
      1,
      1
    );


    ctx.fillStyle =
      normalized;


    ctx.fillRect(
      0,
      0,
      1,
      1
    );


    const pixel =
      ctx
      .getImageData(
        0,
        0,
        1,
        1
      )
      .data;


    return {

      r:pixel[0],
      g:pixel[1],
      b:pixel[2]

    };

  }

  catch(error){

    return null;

  }

}

   ========================================================= */

function setVisualMode(mode){

  state.mode =
    mode;


  const formModes = [

    "questions",
    "nickname",
    "saving",
    "saved",
    "error"

  ];


  const isFormMode =
    formModes.includes(
      mode
    );


  document
  .body
  .classList
  .toggle(
    "questionMode",
    isFormMode
  );


  /*
  LOW POWER IOS:

  Intro = full visuals.

  Questionnaire onwards =
  pure black lightweight environment.
  */

  if(
    LOW_POWER_IOS
  ){

    document
    .body
    .classList
    .toggle(
      "formActive",
      isFormMode
    );

  }

}


/* =========================================================
   COSMOS
   ========================================================= */

function updateDreamCosmos(){

  /*
  No reason to update hidden graphics
  on low-power iPhones.
  */

  if(
    LOW_POWER_IOS
    &&
    document
    .body
    .classList
    .contains(
      "formActive"
    )
  ){

    return;

  }


  if(
    state.mode !==
    "questions"
  ){

    return;

  }


  const i =
    state.questionIndex;


  const level =
    getDreamLevel();


  const p =
    Math.max(
      0,
      Math.min(
        1,
        i/8
      )
    );


  const sunScale =
    .84 +
    p*2.20;


  const sunOpacity =
    .73 +
    p*.20;


  document
  .documentElement
  .style
  .setProperty(
    "--sun-scale",
    sunScale
  );


  document
  .documentElement
  .style
  .setProperty(
    "--sun-opacity",
    sunOpacity
  );


  if(
    level === 0
  ){

    document
    .documentElement
    .style
    .setProperty(
      "--moon-opacity",
      "0"
    );


    return;

  }


  if(
    level === 1
  ){

    const local =
      Math.max(
        0,
        Math.min(
          1,
          (i-3)/2
        )
      );


    const moonX =
      85 -
      local*21;


    const moonScale =
      .75 +
      local*.18;


    document
    .documentElement
    .style
    .setProperty(
      "--moon-opacity",
      ".94"
    );


    document
    .documentElement
    .style
    .setProperty(
      "--moon-x",
      moonX+"%"
    );


    document
    .documentElement
    .style
    .setProperty(
      "--moon-scale",
      moonScale
    );


    return;

  }


  const local =
    Math.max(
      0,
      Math.min(
        1,
        (i-6)/2
      )
    );


  const moonX =
    61 -
    local*11;


  const moonScale =
    .95 +
    local*.28;


  document
  .documentElement
  .style
  .setProperty(
    "--moon-opacity",
    ".995"
  );


  document
  .documentElement
  .style
  .setProperty(
    "--moon-x",
    moonX+"%"
  );


  document
  .documentElement
  .style
  .setProperty(
    "--moon-scale",
    moonScale
  );

}


/* =========================================================

   ========================================================= */

let transitionRunning =
false;


function transition(fn){

  if(
    transitionRunning
  ){

    return;

  }


  transitionRunning =
    true;


  screen
  .classList
  .add(
    "fade"
  );


  setTimeout(

    ()=>{


      fn();


      requestAnimationFrame(

        ()=>{


          requestAnimationFrame(

            ()=>{


              screen
              .classList
              .remove(
                "fade"
              );


              setTimeout(

                ()=>{

                  transitionRunning =
                    false;

                },

                1200

              );


            }

          );


        }

      );


    },

    1150

  );

}

function saveColorField(){

    document
    .getElementById(
      "dreamColorInput"
    );


  if(
    !field
  ){

    return;

  }


  state.dreamColorName =
    field
    .value
    .trim();


  state.dreamColor =
    parseDreamColor(
      state.dreamColorName
    );


  /*

  */

  applyDreamColor();

/* =========================================================
   INTRO NAV
   ========================================================= */

function introBack(){

  if(
    transitionRunning
  ){

    return;

  }


  saveColorField();


  if(
    state.introStep === 0
  ){

    transition(
      renderStart
    );


    return;

  }


  state.introStep--;


  transition(
    renderIntro
  );

}


function introNext(){

  if(
    transitionRunning
  ){

    return;

  }


  saveColorField();


  const slides =
    INTRO[
      state.lang
    ];


  if(
    state.introStep <
    slides.length-1
  ){

    state.introStep++;


    transition(
      renderIntro
    );


    return;

  }


  state.questionIndex =
    0;


  if(
    !state.generatedQuestions[0]
  ){

    state.generatedQuestions[0] =
      generateOpeningQuestion();

  }


  transition(
    renderQuestion
  );

}

/* =========================================================
   FRAGMENT
   ========================================================= */

function extractFragment(text){

  const cleaned =
    normalizeText(
      text
    );


  if(
    !cleaned
  ){

    return "";

  }


  const words =
    cleaned
    .split(/\s+/)
    .filter(Boolean);


  if(
    words.length <= 8
  ){

    return cleaned;

  }


  const starts = [

    0,

    Math.floor(
      words.length*.20
    ),

    Math.floor(
      words.length*.40
    ),

    Math.max(
      0,
      words.length-8
    )

  ];


  const start =
    randomItem(
      starts
    );


  return words
  .slice(
    start,
    start+8
  )
  .join(" ");

}


/* =========================================================
   CLEAN FRAGMENT
   ========================================================= */

function cleanFragmentForPrompt(text){

  let fragment =
    normalizeText(
      text || ""
    );


  fragment =
    fragment
    .replace(
      /["“”„«»']/g,
      ""
    )
    .trim();


  fragment =
    fragment
    .replace(
      /[.,!?;:]+$/g,
      ""
    )
    .trim();


  return fragment;

}

function generateAdaptiveQuestion(){

  const i =
    state.questionIndex;


  const previous =
    state.answers[
      i-1
    ];


  const answer =
    previous
    ?
    previous.answer
    :
    "";


  const fragment =
    cleanFragmentForPrompt(
      extractFragment(
        answer
      )
    );


  const themes =
    detectThemes(
      answer
    );


  if(
    i <= 2
  ){

    return generateLayerOneQuestion(
      fragment,
      themes
    );

  }


  if(
    i <= 5
  ){

    return generateLayerTwoQuestion(
      fragment,
      themes

/* =========================================================
   QUESTION HELPERS
   ========================================================= */

function getCurrentQuestion(){

  return state
  .generatedQuestions[
    state.questionIndex
  ];

}


function getDreamLevel(){

  if(
    state.questionIndex <= 2
  ){

    return 0;

  }


  if(
    state.questionIndex <= 5
  ){

    return 1;

  }


  return 2;

}


/* =========================================================
   RENDER QUESTION
   ========================================================= */

function renderQuestion(){

  /*
  IMPORTANT:

  Calling setVisualMode here activates
  formActive on LOW_POWER_IOS.

  This is the exact moment all background
  graphics disappear.
  */

  setVisualMode(
    "questions"
  );


  updateDreamCosmos();


  const copy =
    UI[
      state.lang
    ];


  const q =
    getCurrentQuestion();


  if(
    !q
  ){

    return;

  }


  const saved =
    state.answers[
      state.questionIndex
    ];


  const level =
    getDreamLevel();


  progress.textContent =
    `${String(
      state.questionIndex+1
    ).padStart(
      2,
      "0"
    )}
    /
    ${String(
      state.totalQuestions
    ).padStart(
      2,
      "0"
    )}`;


  depthLabel.textContent =
    `TRAUM ${level}`;


  let trace =
    "";


  if(
    state.questionIndex > 0
  ){

    const previous =
      state.answers[
        state.questionIndex-1
      ];


    if(
      previous
      &&
      previous.answer
    ){

      const fragment =
        cleanFragmentForPrompt(
          extractFragment(
            previous.answer
          )
        );


      if(
        fragment
      ){

        trace = `

<div class="contextTrace">
${escapeHtml(fragment)}
</div>

`;

      }

    }

  }


  screen.innerHTML = `

<div class="eyebrow">
${escapeHtml(
  q.category
)}
</div>

<h2>
${escapeHtml(
  q.question
)}
</h2>

${trace}

<textarea
id="answer"
placeholder="${copy.placeholder}"
>${escapeHtml(
  saved
  ?
  saved.answer
  :
  ""
)}</textarea>

<div class="actions">

<button
class="back"
onclick="questionBack()"
>
${copy.back}
</button>

<button
class="next"
onclick="questionNext()"
>
${copy.next}
</button>

</div>

`;


  /*
  Disable ghost generation entirely
  for low-power iPhones.
  */

  if(
    !LOW_POWER_IOS
  ){

    spawnPreviousAnswerGhost();

  }


  setTimeout(

    ()=>{

      document
      .getElementById(
        "answer"
      )
      ?.focus();

    },

    250

  );

}


/* =========================================================
   SAVE CURRENT ANSWER
   ========================================================= */

function saveCurrentAnswer(){

  const field =
    document
    .getElementById(
      "answer"
    );


  if(
    !field
  ){

    return;

  }


  const q =
    getCurrentQuestion();


  state.answers[
    state.questionIndex
  ] = {

    level:
      getDreamLevel(),

    category:
      q.category,

    question:
      q.question,

    answer:
      normalizeText(
        field.value
      )

  };

}


/* =========================================================
   NEXT
   ========================================================= */

function questionNext(){

  if(
    transitionRunning
    ||
    dreamShiftRunning
  ){

    return;

  }


  saveCurrentAnswer();


  const current =
    state.answers[
      state.questionIndex
    ];


  if(
    !current
    ||
    !current.answer
  ){

    const field =
      document
      .getElementById(
        "answer"
      );


    if(field){

      field.focus();


      field.style.borderBottomColor =
        "rgba(255,255,255,.72)";


      setTimeout(

        ()=>{

          field.style.borderBottomColor =
            "rgba(255,255,255,.24)";

        },

        700

      );

    }


    return;

  }


  if(
    state.questionIndex ===
    state.totalQuestions-1
  ){

    transition(
      renderNickname
    );


    return;

  }


  state.questionIndex++;


  if(
    !state.generatedQuestions[
      state.questionIndex
    ]
  ){

    state.generatedQuestions[
      state.questionIndex
    ] =
      generateAdaptiveQuestion();

  }


  updateDreamCosmos();


  if(
    state.questionIndex === 3
  ){

    runDreamShift(
      1
    );


    return;

  }


  if(
    state.questionIndex === 6
  ){

    runDreamShift(
      2
    );


    return;

  }


  transition(
    renderQuestion
  );

}


/* =========================================================
   BACK
   ========================================================= */

function questionBack(){

  if(
    transitionRunning
    ||
    dreamShiftRunning
  ){

    return;

  }


  saveCurrentAnswer();


  if(
    state.questionIndex === 0
  ){

    state.introStep =
      INTRO[
        state.lang
      ]
      .length-1;


    transition(
      renderIntro
    );


    return;

  }


  state.questionIndex--;


  transition(
    renderQuestion
  );

}

/* =========================================================
   GHOST
   ========================================================= */

function spawnPreviousAnswerGhost(){

  if(
    LOW_POWER_IOS
  ){

    return;

  }


  if(
    state.questionIndex === 0
  ){

    return;

  }


  const previous =
    state.answers
    .filter(

      a =>
        a
        &&
        a.answer
        &&
        a.answer.length > 2

    );


  if(
    !previous.length
  ){

    return;

  }


  if(
    Math.random() >
    .60
  ){

    const a =
      randomItem(
        previous
      );


    const fragment =
      cleanFragmentForPrompt(
        extractFragment(
          a.answer
        )
      );


    ghost(
      fragment,
      true
    );

  }

}


function ghost(
  text,
  answer=false
){

  if(
    !text
  ){

    return;

  }


  if(
    LOW_POWER_IOS
    &&
    document
    .body
    .classList
    .contains(
      "formActive"
    )
  ){

    return;

  }


  const e =
    document
    .createElement(
      "div"
    );


  e.className =
    answer
    ?
    "ghost answerGhost"
    :
    "ghost";


  e.textContent =
    text;


  e.style.left =
    (
      Math.random()*55
      -
      5
    )
    +
    "vw";


  e.style.top =
    (
      Math.random()*75
      +
      8
    )
    +
    "vh";


  e.style.animationDuration =
    (
      30
      +
      Math.random()*22
    )
    +
    "s";


  ghostLayer
  .appendChild(
    e
  );


  setTimeout(

    ()=>{

      e.remove();

    },

    56000

  );

}

/* =========================================================
   NICK BACK
   ========================================================= */

function nicknameBack(){

  if(
    transitionRunning
  ){

    return;

  }


  const field =
    document
    .getElementById(
      "nickname"
    );


  if(field){

    state.nickname =
      field
      .value
      .trim();

  }


  state.questionIndex =
    state.totalQuestions-1;


  transition(
    renderQuestion
  );

}


/* =========================================================
   SAVE
   ========================================================= */

async function saveDream(){

  if(
    transitionRunning
  ){

    return;

  }


  const field =
    document
    .getElementById(
      "nickname"
    );


  if(field){

    const value =
      field
      .value
      .trim();


    if(value){

      state.nickname =
        value;

    }

  }


  if(
    !state.nickname
  ){

    state.nickname =
      "ANONYMOUS";

  }


  const honeypot =
    document
    .getElementById(
      "website"
    );


  const copy =
    UI[
      state.lang
    ];


  const payload = {

    nickname:
      state.nickname,

    language:
      state.lang,

    dreamColor:
      state.dreamColorName,

    website:
      honeypot
      ?
      honeypot.value
      :
      "",

    answers:
      state.answers,

    dream:
      state.answers
      .map(
        a =>
          a
          ?
          a.answer
          :
          ""
      )
      .join(
        "\n\n"
      )

  };


  transition(

    ()=>{


      setVisualMode(
        "saving"
      );


      progress.textContent =
        "";


      depthLabel.textContent =
        "ARCHIVE";


      screen.innerHTML = `

<div class="eyebrow">
TRAUM SIM
</div>

<h2>
${copy.saving}
</h2>

<p class="sub">
...
</p>

`;

    }

  );


  try{

    const response =
      await fetch(

        API_URL,

        {

          method:"POST",

          headers:{

            "Content-Type":
              "text/plain;charset=utf-8"

          },

          body:
            JSON.stringify(
              payload
            )

        }

      );


    if(
      !response.ok
    ){

      throw new Error(
        "HTTP "
        +
        response.status
      );

    }


    const data =
      await response.json();


    if(
      !data.ok
    ){

      throw new Error(
        data.error
        ||
        "Backend error"
      );

    }


    renderSaved(
      data.dreamId
    );

  }

  catch(error){

    console.error(
      "TRAUM SAVE ERROR",
      error
    );


    renderError();

  }

}

   SAVED

          );

<div class="eyebrow">
TRAUM SIM
</div>

<h2>
${copy.done}
</h2>

<p class="sub">
${copy.sub}

${escapeHtml(

  state.nickname
)}

  const show =

      if(

        );


        return;

      }


      transition(

        ()=>{


          setVisualMode(
            "error"
          );


          screen.innerHTML = `

<h2>
${copy.error}

/* =========================================================
   FINAL
   ========================================================= */

function startFinalSequence(){

  const ui =
    document
    .getElementById(
      "ui"
    );


  const bloom =
    document
    .getElementById(
      "whiteBloom"
    );


  const whiteout =
    document
    .getElementById(
      "whiteout"
    );


  const final =
    document
    .getElementById(
      "finalInvite"
    );


  ui
  .classList
  .add(
    "hide"
  );


  setTimeout(

    ()=>{


      bloom
      .classList
      .add(
        "active"
      );


      whiteout
      .classList
      .add(
        "active"
      );


    },

    950

  );


  setTimeout(

    ()=>{


      document
      .getElementById(
        "finalTitle"
      )
      .textContent =
        UI[
          state.lang
        ]
        .invite;


      final
      .classList
      .add(
        "active"
      );


    },

    6500

  );


  setTimeout(

    ()=>{


      bloom.style.display =
        "none";


      whiteout.style.display =
        "none";


    },

    7000

  );

}
