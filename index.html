<!DOCTYPE html>
<html lang="pl">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover"
>

<meta name="theme-color" content="#000000">

<title>TRAUM SIM — PATCHLAB 2026</title>

<style>

:root{
  --vh:1vh;
  --white:#f5f5f2;
  --muted:rgba(255,255,255,.48);
  --line:rgba(255,255,255,.18);

  --shadow:
    0 1px 2px rgba(0,0,0,.92),
    0 4px 18px rgba(0,0,0,.35);
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  color:var(--white);

  font-family:
    Helvetica,
    Arial,
    sans-serif;

  -webkit-font-smoothing:antialiased;
  -webkit-text-size-adjust:none;
}

body{
  min-height:calc(var(--vh) * 100);
}


/* =========================================================
   DREAM CANVAS
   ========================================================= */

#dreamCanvas{
  position:fixed;
  inset:0;
  z-index:0;

  width:100%;
  height:100%;

  background:#000;

  opacity:.86;

  filter:
    blur(8px)
    contrast(122%);

  transition:
    filter 8s ease,
    opacity 8s ease;
}


/* =========================================================
   GRAPHITE FIELD
   ========================================================= */

#graphite{
  position:fixed;
  inset:0;
  z-index:1;

  pointer-events:none;

  background:
    radial-gradient(
      ellipse at 50% 50%,
      rgba(82,82,82,.06) 0%,
      rgba(43,43,43,.11) 35%,
      rgba(15,15,15,.26) 68%,
      rgba(0,0,0,.63) 100%
    );

  opacity:.48;

  transition:
    opacity 3s ease;
}

body.questionMode #graphite{
  opacity:.87;
}


/* =========================================================
   READING SHADOW
   ========================================================= */

#readingShadow{
  position:fixed;
  inset:0;
  z-index:2;

  pointer-events:none;

  opacity:0;

  background:
    radial-gradient(
      ellipse at 50% 48%,
      rgba(0,0,0,.06) 0%,
      rgba(0,0,0,.20) 43%,
      rgba(0,0,0,.50) 78%,
      rgba(0,0,0,.68) 100%
    );

  transition:
    opacity 2.7s ease;
}

body.questionMode #readingShadow{
  opacity:.64;
}


/* =========================================================
   ATMOSPHERE
   ========================================================= */

#veil{
  position:fixed;
  inset:-18%;
  z-index:3;

  pointer-events:none;

  opacity:.48;

  mix-blend-mode:screen;

  background:
    radial-gradient(
      circle at 26% 43%,
      rgba(255,255,255,.025),
      transparent 27%
    ),

    radial-gradient(
      circle at 74% 55%,
      rgba(255,255,255,.020),
      transparent 29%
    );

  animation:
    veilBreath
    58s
    ease-in-out
    infinite
    alternate;
}


/* =========================================================
   GRAIN
   ========================================================= */

#grain{
  position:fixed;
  inset:-50%;
  z-index:7;

  pointer-events:none;

  opacity:.023;

  background-image:url(
    "data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.83' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E"
  );

  animation:
    grain
    .33s
    steps(2)
    infinite;
}


/* =========================================================
   GHOSTS
   ========================================================= */

#ghostLayer{
  position:fixed;
  inset:0;
  z-index:5;

  pointer-events:none;

  overflow:hidden;
}

.ghost{
  position:absolute;

  max-width:90vw;

  font-size:
    clamp(
      25px,
      8vw,
      112px
    );

  line-height:.9;

  letter-spacing:-.05em;

  white-space:nowrap;

  color:rgba(255,255,255,.028);

  filter:blur(13px);

  animation:
    ghostMove
    linear
    forwards;
}

.answerGhost{
  color:rgba(255,255,255,.050);
  filter:blur(15px);
}


/* =========================================================
   UI
   ========================================================= */

#ui{
  position:fixed;
  inset:0;
  z-index:20;

  height:
    calc(
      var(--vh)
      *
      100
    );

  display:flex;
  flex-direction:column;
  justify-content:space-between;

  padding:
    max(24px,env(safe-area-inset-top))
    max(24px,env(safe-area-inset-right))
    max(24px,env(safe-area-inset-bottom))
    max(24px,env(safe-area-inset-left));

  transition:
    opacity 1.5s ease,
    filter 1.5s ease;
}

#ui.hide{
  opacity:0;
  filter:blur(14px);
  pointer-events:none;
}


/* =========================================================
   TOP / BOTTOM
   ========================================================= */

.top,
.bottom{
  display:flex;
  justify-content:space-between;
  align-items:center;

  gap:20px;

  font-size:10px;
  letter-spacing:.22em;
  text-transform:uppercase;

  color:var(--muted);

  text-shadow:var(--shadow);
}


/* =========================================================
   SCREEN
   ========================================================= */

#screenWrap{
  width:min(960px,100%);
  margin:auto;

  position:relative;
}

#screenWrap::before{
  content:"";

  position:absolute;

  z-index:-1;

  inset:-80px -90px;

  pointer-events:none;

  opacity:.54;

  filter:blur(30px);

  background:
    radial-gradient(
      ellipse,
      rgba(0,0,0,.52),
      rgba(0,0,0,.22) 62%,
      rgba(0,0,0,0) 82%
    );
}

#screen{
  position:relative;

  transition:
    opacity 1.25s ease,
    transform 1.45s ease,
    filter 1.25s ease;
}

#screen.fade{
  opacity:0;

  transform:
    translateY(10px)
    scale(1.008);

  filter:blur(13px);
}


/* =========================================================
   TYPOGRAPHY
   ========================================================= */

.eyebrow{
  margin-bottom:24px;

  font-size:10px;
  letter-spacing:.24em;
  text-transform:uppercase;

  color:rgba(255,255,255,.52);

  text-shadow:var(--shadow);
}

h1{
  font-size:
    clamp(
      56px,
      13vw,
      116px
    );

  line-height:.84;
  letter-spacing:-.055em;

  font-weight:400;

  text-shadow:var(--shadow);
}

h2{
  max-width:930px;

  font-size:
    clamp(
      30px,
      7vw,
      64px
    );

  line-height:1.02;
  letter-spacing:-.038em;

  font-weight:400;

  text-shadow:var(--shadow);
}

.introText{
  max-width:740px;

  margin-top:28px;

  font-size:
    clamp(
      18px,
      2.8vw,
      29px
    );

  line-height:1.35;
  letter-spacing:-.015em;

  text-shadow:var(--shadow);
}

.introMeta{
  max-width:680px;

  margin-top:27px;

  font-size:12px;
  line-height:1.65;

  color:rgba(255,255,255,.52);

  text-shadow:var(--shadow);
}

.sub{
  max-width:650px;

  margin-top:22px;

  font-size:14px;
  line-height:1.55;

  color:rgba(255,255,255,.54);

  text-shadow:var(--shadow);
}


/* =========================================================
   LANGUAGE
   ========================================================= */

.langs{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;

  gap:1px;

  margin-top:52px;

  background:rgba(255,255,255,.16);
}

button{
  appearance:none;

  border:0;

  background:rgba(0,0,0,.80);

  color:#fff;

  font:inherit;

  cursor:pointer;

  text-shadow:var(--shadow);
}

.langs button{
  height:82px;

  font-size:13px;

  letter-spacing:.18em;
}

button:hover{
  background:#fff;
  color:#000;
  text-shadow:none;
}


/* =========================================================
   INPUT
   ========================================================= */

textarea,
input{
  width:100%;

  border:0;

  border-bottom:
    1px solid
    rgba(255,255,255,.19);

  outline:0;

  background:rgba(0,0,0,.08);

  color:#fff;

  font:inherit;

  caret-color:#fff;

  border-radius:0;

  text-shadow:var(--shadow);
}

textarea{
  min-height:190px;

  margin-top:30px;

  padding:
    16px
    0
    20px;

  resize:none;

  font-size:
    clamp(
      20px,
      4.4vw,
      34px
    );

  line-height:1.35;
}

input{
  margin-top:34px;

  padding:
    18px
    0
    20px;

  font-size:
    clamp(
      25px,
      5vw,
      44px
    );

  letter-spacing:-.02em;
}

textarea::placeholder,
input::placeholder{
  color:rgba(255,255,255,.17);
}


/* =========================================================
   QUESTION WORDS — ALWAYS CLEAR
   ========================================================= */

.dreamword{
  display:inline-block;
  filter:none !important;
  opacity:1 !important;
  transform:none !important;
}


/* =========================================================
   ACTIONS
   ========================================================= */

.actions{
  margin-top:34px;

  display:flex;
  justify-content:space-between;
  align-items:center;

  gap:18px;
}

.back,
.next{
  font-size:10px;

  letter-spacing:.18em;

  text-transform:uppercase;
}

.back{
  background:transparent;

  color:var(--muted);

  padding:16px 0;
}

.next{
  min-width:150px;

  padding:
    17px
    20px;

  border:
    1px solid
    rgba(255,255,255,.26);

  transition:.42s;
}

.received{
  margin-top:34px;

  font-size:11px;

  letter-spacing:.21em;

  text-transform:uppercase;

  color:rgba(255,255,255,.56);

  text-shadow:var(--shadow);
}


/* =========================================================
   COLOR QUESTION
   ========================================================= */

.colorQuestionInput{
  text-transform:none;
}

.colorHint{
  margin-top:15px;

  font-size:10px;
  line-height:1.5;

  letter-spacing:.15em;
  text-transform:uppercase;

  color:rgba(255,255,255,.35);

  text-shadow:var(--shadow);
}


/* =========================================================
   DREAM SHIFT
   ========================================================= */

#dreamShift{
  position:fixed;
  inset:0;
  z-index:150;

  pointer-events:none;

  display:flex;
  justify-content:center;
  align-items:center;

  opacity:0;

  background:#000;
}

#dreamShift.active{
  animation:
    dreamShift
    9.5s
    ease
    forwards;
}

.dreamShiftWrap{
  width:min(760px,88vw);
  text-align:center;
}

#dreamShiftMain{
  font-size:
    clamp(
      38px,
      9vw,
      92px
    );

  line-height:.9;
  letter-spacing:-.055em;

  font-weight:400;

  text-shadow:var(--shadow);
}

#dreamShiftSub{
  margin-top:28px;

  font-size:10px;

  letter-spacing:.22em;
  line-height:1.6;

  text-transform:uppercase;

  color:rgba(255,255,255,.48);

  text-shadow:var(--shadow);
}


/* =========================================================
   WHITE OUT
   ========================================================= */

#whiteBloom{
  position:fixed;

  inset:-30%;

  z-index:200;

  pointer-events:none;

  opacity:0;

  transform:scale(.2);

  filter:blur(60px);

  background:
    radial-gradient(
      circle at 50% 50%,
      rgba(255,255,255,1) 0%,
      rgba(255,255,255,.96) 16%,
      rgba(255,255,255,.63) 35%,
      rgba(255,255,255,.14) 55%,
      rgba(255,255,255,0) 74%
    );
}

#whiteBloom.active{
  animation:
    bloom
    5.9s
    cubic-bezier(.22,.62,.22,1)
    forwards;
}

#whiteout{
  position:fixed;

  inset:0;

  z-index:201;

  pointer-events:none;

  opacity:0;

  background:#fff;
}

#whiteout.active{
  animation:
    whiteout
    6s
    cubic-bezier(.22,.62,.22,1)
    forwards;
}


/* =========================================================
   FINAL
   ========================================================= */

#finalInvite{
  position:fixed;

  inset:0;

  z-index:220;

  display:flex;
  align-items:center;
  justify-content:center;

  background:#000;

  opacity:0;

  pointer-events:none;

  padding:
    max(30px,env(safe-area-inset-top))
    max(28px,env(safe-area-inset-right))
    max(30px,env(safe-area-inset-bottom))
    max(28px,env(safe-area-inset-left));
}

#finalInvite.active{
  animation:
    finalIn
    2.9s
    ease
    forwards;
}

.finalGrid{
  width:min(1100px,100%);

  display:grid;

  grid-template-columns:
    minmax(180px,280px)
    1fr;

  gap:
    clamp(
      50px,
      8vw,
      120px
    );

  align-items:end;
}

.logoBlock img{
  display:block;

  width:min(100%,260px);

  height:auto;
}

.finalCopy{
  max-width:760px;
}

.finalLabel{
  margin-bottom:32px;

  font-size:10px;

  letter-spacing:.24em;

  text-transform:uppercase;

  color:rgba(255,255,255,.42);
}

#finalTitle{
  font-size:
    clamp(
      32px,
      5.8vw,
      70px
    );

  line-height:1.02;

  letter-spacing:-.04em;

  font-weight:400;
}

.finalRule{
  height:1px;

  width:100%;

  margin:
    42px
    0
    24px;

  background:rgba(255,255,255,.21);
}

.finalDetails{
  display:flex;
  justify-content:space-between;

  gap:30px;

  font-size:11px;

  letter-spacing:.18em;

  text-transform:uppercase;

  color:rgba(255,255,255,.63);
}


/* =========================================================
   KEYFRAMES
   ========================================================= */

@keyframes veilBreath{
  from{
    transform:
      translate3d(-1%,.5%,0)
      scale(1);
  }

  to{
    transform:
      translate3d(1.2%,-.8%,0)
      scale(1.025);
  }
}

@keyframes grain{
  0%{transform:translate(0,0)}
  25%{transform:translate(3%,-3%)}
  50%{transform:translate(-4%,2%)}
  75%{transform:translate(2%,4%)}
  100%{transform:translate(-2%,-4%)}
}

@keyframes ghostMove{
  0%{
    opacity:0;

    transform:
      translate3d(-1vw,1vh,0)
      scale(.99);

    filter:blur(16px);
  }

  20%{
    opacity:1;
  }

  74%{
    opacity:.64;
  }

  100%{
    opacity:0;

    transform:
      translate3d(2vw,-1.5vh,0)
      scale(1.03);

    filter:blur(29px);
  }
}

@keyframes dreamShift{
  0%{
    opacity:0;
    filter:blur(22px);
  }

  18%{
    opacity:1;
    filter:blur(0);
  }

  78%{
    opacity:1;
    filter:blur(0);
  }

  100%{
    opacity:0;
    filter:blur(20px);
  }
}

@keyframes bloom{
  0%{
    opacity:0;
    transform:scale(.2);
  }

  42%{
    opacity:.14;
  }

  74%{
    opacity:.62;
    transform:scale(1);
  }

  100%{
    opacity:1;
    transform:scale(1.9);
  }
}

@keyframes whiteout{
  0%{opacity:0}
  58%{opacity:.05}
  82%{opacity:.34}
  100%{opacity:1}
}

@keyframes finalIn{
  0%{
    opacity:0;

    filter:blur(12px);

    transform:scale(1.01);
  }

  100%{
    opacity:1;

    filter:blur(0);

    transform:scale(1);
  }
}


/* =========================================================
   MOBILE
   ========================================================= */

@media(max-width:700px){

  #ui{
    padding:
      max(18px,env(safe-area-inset-top))
      max(18px,env(safe-area-inset-right))
      max(18px,env(safe-area-inset-bottom))
      max(18px,env(safe-area-inset-left));
  }

  h1{
    font-size:
      clamp(
        54px,
        19vw,
        84px
      );
  }

  h2{
    font-size:
      clamp(
        28px,
        8.8vw,
        44px
      );
  }

  .introText{
    font-size:
      clamp(
        19px,
        6vw,
        29px
      );
  }

  textarea{
    min-height:
      clamp(
        145px,
        25dvh,
        225px
      );

    font-size:
      clamp(
        19px,
        6vw,
        27px
      );
  }

  .langs{
    margin-top:36px;
  }

  .langs button{
    height:70px;
    font-size:11px;
  }

  .actions{
    margin-top:24px;
  }

  .next{
    min-width:128px;
  }

  .finalGrid{
    display:flex;
    flex-direction:column;

    align-items:flex-start;
    justify-content:center;

    gap:44px;
  }

  .logoBlock img{
    width:min(52vw,190px);
  }

  #finalTitle{
    font-size:
      clamp(
        31px,
        9vw,
        46px
      );
  }

  .finalDetails{
    flex-direction:column;
    gap:8px;
  }

}

</style>

</head>

<body>

<canvas id="dreamCanvas"></canvas>

<div id="graphite"></div>

<div id="readingShadow"></div>

<div id="veil"></div>

<div id="ghostLayer"></div>

<div id="grain"></div>


<div id="dreamShift">

  <div class="dreamShiftWrap">

    <div id="dreamShiftMain"></div>

    <div id="dreamShiftSub"></div>

  </div>

</div>


<div id="whiteBloom"></div>

<div id="whiteout"></div>


<div id="finalInvite">

  <div class="finalGrid">

    <div class="logoBlock">

      <img
        src="patchlab_2026_header_1.png"
        alt="Patchlab Festival 2026"
      >

    </div>

    <div class="finalCopy">

      <div class="finalLabel">
        TRAUM SIM / PATCHLAB 2026
      </div>

      <div id="finalTitle"></div>

      <div class="finalRule"></div>

      <div class="finalDetails">

        <div>15.10.2026</div>

        <div>HEVRE</div>

        <div>KRAKÓW</div>

      </div>

    </div>

  </div>

</div>


<div id="ui">

  <div class="top">

    <span>
      TRAUM SIM
    </span>

    <span id="progress"></span>

  </div>

  <div id="screenWrap">

    <main id="screen"></main>

  </div>

  <div class="bottom">

    <span>
      PATCHLAB 2026
    </span>

    <span id="depthLabel">
      TRAUM 0
    </span>

  </div>

</div>


<script>

/* =========================================================
   BACKEND
   ========================================================= */

const API_URL =
"https://script.google.com/macros/s/AKfycbzU_GDYcK7nC4aGNVxmQd4fojRBacX1UR076Ox-lCI8KrGV1YVN7G_mwGT-6UFzOhJY3g/exec";


/* =========================================================
   VIEWPORT
   ========================================================= */

function setVH(){

  const h =
    window.visualViewport
      ? window.visualViewport.height
      : window.innerHeight;

  document
    .documentElement
    .style
    .setProperty(
      "--vh",
      (h * .01) + "px"
    );

}

setVH();

window.addEventListener(
  "resize",
  setVH
);

if(window.visualViewport){

  window.visualViewport.addEventListener(
    "resize",
    setVH
  );

}


/* =========================================================
   INTRO
   ========================================================= */

const INTRO = {

PL:[

{
type:"text",
label:"TRAUM / 01",
title:"Sen nie jest filmem.",
text:"Podczas snu mózg nadal pracuje. Fragmenty pamięci, emocji, miejsc, osób i doświadczeń zostają ponownie połączone w rzeczywistość, która w chwili śnienia może wydawać się całkowicie prawdziwa.",
meta:"Nie istnieje jeden naukowy słownik symboli snu. Znaczenie obrazu zależy od osoby, pamięci, emocji i kontekstu."
},

{
type:"text",
label:"TRAUM / 02",

meta:"To, co podczas czuwania byłoby sprzecznością, we śnie często zostaje zaakceptowane bez pytania."
},

{
type:"color",
label:"TRAUM / 03",
title:"Jaki kolor mają twoje najlepsze sny?",
text:"Nie zastanawiaj się długo. Wpisz pierwszy kolor, który pojawił się w twojej głowie.",
meta:"Od tej chwili TRAUM SIM spróbuje śnić właśnie tym kolorem."
},

{
type:"text",
label:"TRAUM / 04",
title:"Nie próbuj interpretować.",
text:"Przypomnij sobie tylko to, co zostało. Obraz. Uczucie. Osobę. Miejsce. Przejście. Coś niemożliwego.",
meta:"Nie szukamy poprawnego znaczenia. Szukamy śladu."
}

],


ENG:[

{

label:"TRAUM / 01",
title:"A dream is not a film.",
text:"During sleep the brain continues working. Fragments of memory, emotion, places, people and experience are recombined into a reality that can feel completely real while it is happening.",
meta:"There is no single scientific dictionary of dream symbols. Meaning depends on the dreamer, memory, emotion and context."
},

{
type:"text",
label:"TRAUM / 02",
title:"Memory does not replay. Memory reconstructs.",
text:"A dream can merge a childhood home with a room seen yesterday, give a familiar person another face, or allow you to know something nobody ever told you.",
meta:"What would be a contradiction while awake often requires no explanation inside a dream."
},

{
type:"color",
label:"TRAUM / 03",
title:"What colour do your best dreams have?",
text:"Do not think too long. Type the first colour that appeared in your mind.",
meta:"From now on TRAUM SIM will try to dream in that colour."
},

{
type:"text",

/* =========================================================
   HELPERS
   ========================================================= */

function shuffle(array){

  const a =
    [...array];

  for(
    let i=a.length-1;
    i>0;
    i--
  ){

    const j =
      Math.floor(
        Math.random() *
        (i+1)
      );

    [
      a[i],
      a[j]
    ]
    =
    [
      a[j],
      a[i]
    ];

  }

  return a;

}


function escapeHtml(value){

  return String(
    value || ""
  )
  .replace(
    /[&<>"']/g,
    c=>({

      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      "\"":"&quot;",
      "'":"&#039;"

    }[c])
  );

}


/* =========================================================
   QUESTIONS PREP
   ========================================================= */

function prepareQuestions(){

  let bank;

  if(
    state.lang==="PL"
  ){

    bank =
      QUESTIONS_PL;

  }
  else if(
    state.lang==="UKR"
  ){

    bank =
      QUESTIONS_UKR;

  }
  else{

    bank =
      QUESTIONS_EN;

  }


  state.questionsByLevel[0] =
    shuffle(
      bank[0]
    )
    .slice(
      0,
      3
    );


  state.questionsByLevel[1] =
    shuffle(
      bank[1]
    )
    .slice(
      0,
      3
    );


  state.questionsByLevel[2] =
    shuffle(
      bank[2]
    )
    .slice(
      0,
      3
    );

}


/* =========================================================
   MODE
   ========================================================= */

function setVisualMode(mode){

  state.mode =
    mode;


  document
    .body
    .classList
    .toggle(
      "questionMode",
      [
        "questions",
        "nickname",
        "saving",
        "saved",
        "error"
      ]
      .includes(
        mode
      )
    );

}


/* =========================================================
   TRANSITION
   ========================================================= */

function transition(fn){

  screen
    .classList
    .add(
      "fade"
    );


  setTimeout(
    ()=>{

      fn();

      requestAnimationFrame(
        ()=>{

          screen
            .classList
            .remove(
              "fade"
            );

        }
      );

    },
    720
  );

}

   ========================================================= */

function introBack(){

  if(
    state.introStep ===
    0
  ){

    transition(
      renderStart
    );

    return;

  }


  saveColorField();


  state.introStep--;


  transition(
    renderIntro
  );

}


function introNext(){

  saveColorField();


  const slides =
    INTRO[
      state.lang
    ];


  if(
    state.introStep <
    slides.length-1
  ){

    state.introStep++;

    transition(
      renderIntro
    );

  }
  else{

    state.level =
      0;

    state.levelQuestion =
      0;

    transition(
      renderQuestion
    );

  }

}

/* =========================================================

   ========================================================= */

function surrealize(text){

  if(!text){
    return "";
  }

  return text
    .split(" ")
    .map(
      word =>
        `<span class="dreamword">${escapeHtml(word)}</span>`
    )
    .join(" ");

}


/* =========================================================
   ECHO
   ========================================================= */

function questionWithEcho(item){

  if(
    state.level ===
    0
  ){

    return item.question;

  }


  const previous =
    state.answers
    .filter(
      a =>
        a &&
        a.answer &&
        a.answer.length > 2
    );


  if(
    !previous.length
  ){

    return item.question;

  }


  if(
    Math.random() >
    .66
  ){

    const source =
      previous[
        Math.floor(
          Math.random() *
          previous.length
        )
      ];


    const fragment =
      source.answer
      .split(/\s+/)
      .slice(
        0,
        7
      )
      .join(" ");


    if(
      state.lang ===
      "PL"
    ){

      const variants = [

        `Powiedziałeś wcześniej: „${fragment}”. Czy nadal tak to pamiętasz?`,

        `„${fragment}” — czy to należało do pierwszego snu?`,

        `Jeżeli „${fragment}” było prawdą, co znajdowało się tuż poza kadrem?`

      ];


      return variants[
        Math.floor(
          Math.random() *
          variants.length
        )
      ];

    }


    if(
      state.lang ===
      "UKR"
    ){

      const variants = [

        `Раніше ти сказав: «${fragment}». Ти досі пам’ятаєш це саме так?`,

        `«${fragment}» — це належало до першого сну?`,

        `Якщо «${fragment}» було правдою, що знаходилося просто за межами кадру?`

      ];


      return variants[
        Math.floor(
          Math.random() *
          variants.length
        )
      ];

    }


    const variants = [

      `Earlier you said: “${fragment}”. Do you still remember it that way?`,

      `“${fragment}” — did that belong to the first dream?`,

      `If “${fragment}” was true, what existed just outside the frame?`

    ];


    return variants[
      Math.floor(
        Math.random() *
        variants.length
      )
    ];

  }


  return item.question;

}

      .length - 1;

  transition(

  );

  saveCurrentAnswer();


  const index =
    globalQuestionIndex();


  if(

  }


  if(

  state.levelQuestion++;

    state.answers
    .filter(
      a =>
        a &&
        a.answer &&

  if(

    const fragment =

async function saveDream(){

  const field =
    document
      .getElementById(
        "nickname"
      );


  state.nickname =
    field
      ? field.value.trim()
      : "";


  if(
    !state.nickname
  ){

    state.nickname =
      "ANONYMOUS";

  }


  const copy =
    UI[
      state.lang
    ];


  const payload = {

    nickname:
      state.nickname,

    language:
      state.lang,

    dreamColor:
      state.dreamColorName,

    answers:
      state.answers,

    dream:
      state.answers
      .map(
        a =>
          a
            ? a.answer
            : ""
      )
      .join(
        "\n\n"
      )

  };


  transition(
    ()=>{

      setVisualMode(
        "saving"
      );


      progress.textContent =
        "";


      depthLabel.textContent =
        "ARCHIVE";


      screen.innerHTML = `

<div class="eyebrow">
TRAUM SIM
</div>

<h2>
${copy.saving}
</h2>

<p class="sub">
...
</p>

`;

    }
  );


  try{

    const response =
      await fetch(
        API_URL,
        {

          method:"POST",

          headers:{
            "Content-Type":
              "text/plain;charset=utf-8"
          },

          body:
            JSON.stringify(
              payload
            )

        }
      );


    if(
      !response.ok
    ){

      throw new Error(
        "HTTP " +
        response.status
      );

    }


    const data =
      await response.json();


    if(
      !data.ok
    ){

      throw new Error(
        data.error ||
        "Backend error"
      );

    }


    renderSaved(
      data.dreamId
    );

  }
  catch(error){

    console.error(
      error
    );


    renderError();

  }

}

/* =========================================================
   WATERCOLOUR RORSCHACH ENGINE
   ========================================================= */

const canvas =
  document
    .getElementById(
      "dreamCanvas"
    );


const ctx =
  canvas
    .getContext(
      "2d"
    );


let W = 0;

let H = 0;

let DPR = 1;


const dreamEngine = {

  depth:0,

  depthTarget:0,

  focus:0

};


const organisms = [];


/* =========================================================
   RANDOM
   ========================================================= */

function rand(
  a,
  b
){

  return a +
  Math.random() *
  (
    b-a
  );

}


/* =========================================================
   ORGANISM
   ========================================================= */

function makeOrganism(index){

  const base =
    Math.min(
      W,
      H
    );


  return {

    y:
      H *
      rand(
        .28,
        .72
      ),

    radius:
      base *
      rand(
        .23,
        .48
      ),

    stretch:
      rand(
        1.25,
        2.55
      ),

    height:
      rand(
        .60,
        1.30
      ),

    lobe1:
      rand(
        1.2,
        3.5
      ),

    lobe2:
      rand(
        3.5,
        7.5
      ),

    lobe3:
      rand(
        7,
        13
      ),

    amp1:
      rand(
        .05,
        .15
      ),

    amp2:
      rand(
        .025,
        .085
      ),

    amp3:
      rand(
        .01,
        .045
      ),

    phase1:
      rand(
        0,
        Math.PI*2
      ),

    phase2:
      rand(
        0,
        Math.PI*2
      ),

    phase3:
      rand(
        0,
        Math.PI*2
      ),

    phaseY:
      rand(
        0,
        Math.PI*2
      ),

    speed1:
      rand(
        .010,
        .022
      ),

    speed2:
      rand(
        .005,
        .014
      ),

    speed3:
      rand(
        .0025,
        .008
      ),

    speedY:
      rand(
        .004,
        .010
      ),

    driftY:
      rand(
        4,
        18
      ),

    index

  };

}


/* =========================================================
   RESIZE
   ========================================================= */

function resizeDream(){

  W =
    window.innerWidth;


  H =
    window.innerHeight;


  DPR =
    Math.min(
      window.devicePixelRatio || 1,
      1.5
    );


  canvas.width =
    W * DPR;


  canvas.height =
    H * DPR;


  ctx.setTransform(
    DPR,
    0,
    0,
    DPR,
    0,
    0
  );


  organisms.length =
    0;


  for(
    let i=0;
    i<7;
    i++
  ){

    organisms.push(
      makeOrganism(
        i
      )
    );

  }


  ctx.fillStyle =
    "#000";


  ctx.fillRect(
    0,
    0,
    W,
    H
  );

}


/* =========================================================
   COLOUR
   ========================================================= */

function watercolorColor(
  brightness,
  alpha
){

  const c =
    state.dreamColor;


  const grey =
    (
      c.r +
      c.g +
      c.b
    )
    /
    3;


  const SAT =
    .36;


  let r =
    grey +
    (
      c.r -
      grey
    )
    *
    SAT;


  let g =
    grey +
    (
      c.g -
      grey
    )
    *
    SAT;


  let b =
    grey +
    (
      c.b -
      grey
    )
    *
    SAT;


  r =
    Math.min(
      255,
      r *
      brightness
    );


  g =
    Math.min(
      255,
      g *
      brightness
    );


  b =
    Math.min(
      255,
      b *
      brightness
    );


  return `rgba(
    ${Math.round(r)},
    ${Math.round(g)},
    ${Math.round(b)},
    ${alpha}
  )`;

}


/* =========================================================
   RADIUS
   ========================================================= */

function radiusAt(
  o,
  angle,
  seconds,
  scale
){

  const p1 =
    Math.sin(
      angle *
      o.lobe1
      +
      seconds *
      o.speed1
      +
      o.phase1
    )
    *
    o.amp1;


  const p2 =
    Math.cos(
      angle *
      o.lobe2
      -
      seconds *
      o.speed2
      +
      o.phase2
    )
    *
    o.amp2;


  const p3 =
    Math.sin(
      angle *
      o.lobe3
      +
      seconds *
      o.speed3
      +
      o.phase3
    )
    *
    o.amp3;


  const breath =
    Math.sin(
      seconds *
      .036
      +
      o.phase1
    )
    *
    .018;


  return
    o.radius
    *
    scale
    *
    (
      1
      +
      p1
      +
      p2
      +
      p3
      +
      breath
    );

}


/* =========================================================
   PATH
   ========================================================= */

function createBlotPath(
  o,
  seconds,
  scale,
  microOffset=0
){

  const cx =
    W *
    .5;


  const cy =
    o.y
    +
    Math.sin(
      seconds *
      o.speedY
      +
      o.phaseY
    )
    *
    o.driftY;


  const steps =
    190;


  const left =
    [];


  for(
    let i=0;
    i<=steps;
    i++
  ){

    const p =
      i / steps;


    const angle =
      -Math.PI*.5
      +
      p *
      Math.PI;


    const radius =
      radiusAt(
        o,
        angle,
        seconds,
        scale
      );


    const edge =
      Math.sin(
        angle*23
        +
        o.index*4.6
        +
        seconds*.006
      )
      *
      microOffset;


    const r =
      radius *
      (
        1 +
        edge
      );


    const x =
      Math.cos(
        angle
      )
      *
      r
      *
      o.stretch;


    const y =
      Math.sin(
        angle
      )
      *
      r
      *
      o.height;


    left.push(
      {
        x:
          cx-x,

        y:
          cy+y
      }
    );

  }


  ctx.beginPath();


  const first =
    left[0];


  ctx.moveTo(
    first.x,
    first.y
  );


  for(
    const p
    of
    left
  ){

    ctx.lineTo(
      p.x,
      p.y
    );

  }


  for(
    let i=left.length-1;
    i>=0;
    i--
  ){

    const p =
      left[i];


    ctx.lineTo(
      cx +
      (
        cx-p.x
      ),
      p.y
    );

  }


  ctx.closePath();

}


/* =========================================================
   LAYER
   ========================================================= */

function paintLayer(
  o,
  seconds,
  scale,
  brightness,
  alpha,
  edge
){

  createBlotPath(
    o,
    seconds,
    scale,
    edge
  );


  ctx.fillStyle =
    watercolorColor(
      brightness,
      alpha
    );


  ctx.fill();

}


/* =========================================================
   ORGANISM
   ========================================================= */

function paintOrganism(
  o,
  seconds
){

  paintLayer(
    o,
    seconds,
    1.18,
    1.18,
    .036,
    .010
  );


  paintLayer(
    o,
    seconds+29,
    1.00,
    .90,
    .070,
    .014
  );


  paintLayer(
    o,
    seconds+61,
    .82,
    .68,
    .066,
    .012
  );


  paintLayer(
    o,
    seconds+103,
    .61,
    .43,
    .055,
    .009
  );


  paintLayer(
    o,
    seconds+149,
    .43,
    .27,
    .050,
    .006
  );


  if(
    dreamEngine.depth >
    .75
  ){

    const strength =
      Math.min(
        1,
        dreamEngine.depth -
        .65
      );


    paintLayer(
      o,
      seconds+191,
      .29,
      .95,
      .025 *
      strength,
      .008
    );

  }

}


/* =========================================================
   FOCUS
   ========================================================= */

function updateFocus(seconds){

  const waveA =
    (
      Math.sin(
        seconds *
        Math.PI*2 /
        72
      )
      +
      1
    )
    /
    2;


  const waveB =
    (
      Math.sin(
        seconds *
        Math.PI*2 /
        183
        +
        1.9
      )
      +
      1
    )
    /
    2;


  let focus =
    waveA*.56
    +
    waveB*.44;


  focus =
    focus *
    focus *
    (
      3 -
      2*focus
    );


  dreamEngine.focus =
    focus;


  let blur =
    17 -
    focus*12;


  if(
    state.mode ===
    "questions"
  ){

    blur +=
      1.2;

  }


  const contrast =
    112 +
    focus*38;


  const opacity =
    .70 +
    focus*.18;


  canvas.style.filter =
    `blur(${blur.toFixed(2)}px)
    contrast(${contrast.toFixed(1)}%)`;


  canvas.style.opacity =
    opacity.toFixed(
      3
    );

}


/* =========================================================
   DEPTH
   ========================================================= */

function updateDepth(){

  dreamEngine.depth +=
    (
      dreamEngine.depthTarget -
      dreamEngine.depth
    )
    *
    .002;

}


/* =========================================================
   DRAW
   ========================================================= */

function drawDream(timestamp){

  const seconds =
    timestamp /
    1000;


  updateDepth();


  ctx.fillStyle =
    "#000";


  ctx.fillRect(
    0,
    0,
    W,
    H
  );


  const g =
    ctx.createRadialGradient(
      W*.5,
      H*.5,
      0,
      W*.5,
      H*.5,
      Math.max(
        W,
        H
      )
      *
      .72
    );


  g.addColorStop(
    0,
    "rgba(35,35,35,.24)"
  );


  g.addColorStop(
    .50,
    "rgba(13,13,13,.20)"
  );


  g.addColorStop(
    1,
    "rgba(0,0,0,1)"
  );


  ctx.fillStyle =
    g;


  ctx.fillRect(
    0,
    0,
    W,
    H
  );


  ctx.globalCompositeOperation =
    "screen";


  for(
    const organism
    of
    organisms
  ){

    paintOrganism(
      organism,
      seconds
    );

  }


  ctx.globalCompositeOperation =
    "source-over";


  const fold =
    ctx.createLinearGradient(
      W*.46,
      0,
      W*.54,
      0
    );


  fold.addColorStop(
    0,
    "rgba(0,0,0,0)"
  );


  fold.addColorStop(
    .5,
    "rgba(115,115,115,.018)"
  );


  fold.addColorStop(
    1,
    "rgba(0,0,0,0)"
  );


  ctx.fillStyle =
    fold;


  ctx.fillRect(
    W*.43,
    0,
    W*.14,
    H
  );


  updateFocus(
    seconds
  );


  requestAnimationFrame(
    drawDream
  );

}


/* =========================================================
   INIT
   ========================================================= */

window.addEventListener(
  "resize",
  resizeDream
);


resizeDream();


renderStart();


requestAnimationFrame(
  drawDream
);

</script>
