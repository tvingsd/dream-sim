<!DOCTYPE html>
<html lang="pl">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover"
>

<meta name="theme-color" content="#000000">

<title>TRAUM SIM — PATCHLAB 2026</title>


<style>

/* =========================================================
   ROOT
   ========================================================= */

:root{

  --vh:1vh;

  --white:#f4f4f1;
  --muted:rgba(255,255,255,.50);

  --shadow:
    0 1px 2px rgba(0,0,0,.95),
    0 5px 28px rgba(0,0,0,.48);


  /* DREAM COLOR */

  --dream-r:220;
  --dream-g:220;
  --dream-b:220;

  --dream-color-strength:0;


  /* SUN */

  --sun-r:220;
  --sun-g:220;
  --sun-b:220;

  --sun-scale:.78;
  --sun-opacity:.72;


  /* MOON */

  --moon-x:94%;
  --moon-y:50%;

  --moon-scale:.72;
  --moon-opacity:0;

}


/* =========================================================
   RESET
   ========================================================= */

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{

  width:100%;
  height:100%;

  overflow:hidden;

  background:#000;

  color:var(--white);

  font-family:
    Helvetica,
    Arial,
    sans-serif;

  -webkit-font-smoothing:antialiased;
  -webkit-text-size-adjust:none;

}

body{
  min-height:calc(var(--vh) * 100);
}


/* =========================================================
   DREAM WORLD
   ========================================================= */

#dreamWorld{

  position:fixed;

  inset:0;

  z-index:0;

  overflow:hidden;

  pointer-events:none;

  background:
    linear-gradient(
      180deg,
      #050505 0%,
      #0a0a0a 45%,
      #070707 100%
    );

}


/* =========================================================
   IMAGE STAGE
   ========================================================= */

#dreamImages{

  position:absolute;

  inset:-7%;

  overflow:hidden;

  background:#080808;

}


/* =========================================================
   BASE DREAM IMAGES
   ========================================================= */

.dreamImage{

  position:absolute;

  inset:-8%;

  width:116%;
  height:116%;

  object-fit:cover;
  object-position:center;

  opacity:0;

  /*
  Softer than before:
  - still monochromatic
  - much less harsh threshold feeling
  - more milk / haze
  */

  filter:
    grayscale(1)
    contrast(1.10)
    brightness(.92)
    blur(11px);

  transform-origin:50% 50%;

  will-change:
    opacity,
    transform;

}


/* =========================================================
   IMAGE MORPH
   ========================================================= */

#dreamImg1{

  animation:
    imageMorph1
    52s
    linear
    infinite;

}

#dreamImg2{

  animation:
    imageMorph2
    52s
    linear
    infinite;

}

#dreamImg3{

  animation:
    imageMorph3
    52s
    linear
    infinite;

}

#dreamImg4{

  animation:
    imageMorph4
    52s
    linear
    infinite;

}


/* =========================================================
   COLOR WASH FOR RORSCHACH IMAGES
   ========================================================= */

/*
This is the key change.

We are not recolouring the image destructively.
We place a soft colour field over the entire dream image
and blend it with the grayscale Rorschach layers.
*/

#dreamColorWash{

  position:absolute;

  inset:-8%;

  z-index:3;

  opacity:
    var(--dream-color-strength);

  background:

    radial-gradient(
      ellipse at 50% 49%,

      rgba(
        var(--dream-r),
        var(--dream-g),
        var(--dream-b),
        .72
      )
      0%,

      rgba(
        var(--dream-r),
        var(--dream-g),
        var(--dream-b),
        .48
      )
      25%,

      rgba(
        var(--dream-r),
        var(--dream-g),
        var(--dream-b),
        .22
      )
      52%,

      rgba(
        var(--dream-r),
        var(--dream-g),
        var(--dream-b),
        .04
      )
      75%,

      transparent
      100%
    );

  mix-blend-mode:color;

  transition:
    opacity
    3s
    ease,
    background
    4s
    ease;

}


/* =========================================================
   SECOND COLOR GLOW
   ========================================================= */

#dreamColorGlow{

  position:absolute;

  inset:-15%;

  z-index:4;

  opacity:
    calc(
      var(--dream-color-strength) * .75
    );

  background:

    radial-gradient(
      ellipse at 50% 52%,

      rgba(
        var(--dream-r),
        var(--dream-g),
        var(--dream-b),
        .42
      )
      0%,

      rgba(
        var(--dream-r),
        var(--dream-g),
        var(--dream-b),
        .16
      )
      38%,

      transparent
      70%
    );

  filter:
    blur(55px);

  mix-blend-mode:screen;

  transition:
    opacity
    3s
    ease;

}


/* =========================================================
   MILKY DREAM VEIL
   ========================================================= */

#dreamImageVeil{

  position:absolute;

  inset:-15%;

  z-index:5;

  background:

    radial-gradient(
      ellipse at 38% 45%,

      rgba(255,255,255,.105)
      0%,

      rgba(255,255,255,.045)
      30%,

      transparent
      68%
    ),

    radial-gradient(
      ellipse at 72% 54%,

      rgba(255,255,255,.075)
      0%,

      rgba(255,255,255,.025)
      36%,

      transparent
      72%
    );

  filter:
    blur(42px);

  opacity:.54;

  animation:
    imageVeilDrift
    105s
    ease-in-out
    infinite
    alternate;

}


/* =========================================================
   SOFT WHITE FOG
   ========================================================= */

#softFog{

  position:absolute;

  inset:-10%;

  z-index:6;

  background:

    radial-gradient(
      ellipse at 50% 60%,

      rgba(255,255,255,.060)
      0%,

      rgba(255,255,255,.020)
      42%,

      transparent
      75%
    );

  filter:
    blur(34px);

  opacity:.78;

  animation:
    softFogMove
    90s
    ease-in-out
    infinite
    alternate;

}


/* =========================================================
   SUN
   ========================================================= */

#dreamSun{

  position:absolute;

  left:50%;
  top:50%;

  width:
    clamp(
      450px,
      60vw,
      1160px
    );

  aspect-ratio:1;

  z-index:8;

  opacity:
    var(--sun-opacity);

  transform:
    translate(-50%,-50%)
    scale(var(--sun-scale));

  transform-origin:
    50% 50%;

  transition:
    transform
    7s
    cubic-bezier(.22,.61,.36,1),
    opacity
    4s
    ease;

}


/* =========================================================
   SUN HALO
   ========================================================= */

.sunHalo{

  position:absolute;

  inset:-27%;

  border-radius:50%;

  background:

    radial-gradient(
      circle,

      rgba(
        var(--sun-r),
        var(--sun-g),
        var(--sun-b),
        .70
      )
      0%,

      rgba(
        var(--sun-r),
        var(--sun-g),
        var(--sun-b),
        .42
      )
      9%,

      rgba(
        var(--sun-r),
        var(--sun-g),
        var(--sun-b),
        .22
      )
      22%,

      rgba(
        var(--sun-r),
        var(--sun-g),
        var(--sun-b),
        .085
      )
      39%,

      rgba(
        var(--sun-r),
        var(--sun-g),
        var(--sun-b),
        .025
      )
      56%,

      transparent
      77%
    );

  filter:
    blur(54px);

  animation:
    sunBreath
    19s
    ease-in-out
    infinite
    alternate;

}


.sunHalo::before{

  content:"";

  position:absolute;

  inset:-18%;

  border-radius:50%;

  background:

    radial-gradient(
      ellipse at 42% 52%,

      rgba(
        var(--sun-r),
        var(--sun-g),
        var(--sun-b),
        .24
      ),

      rgba(
        var(--sun-r),
        var(--sun-g),
        var(--sun-b),
        .075
      )
      38%,

      transparent
      72%
    );

  filter:
    blur(62px);

}


.sunHalo::after{

  content:"";

  position:absolute;

  width:94%;
  height:48%;

  left:3%;
  top:28%;

  border-radius:50%;

  background:

    radial-gradient(
      ellipse,

      rgba(
        var(--sun-r),
        var(--sun-g),
        var(--sun-b),
        .17
      ),

      rgba(
        var(--sun-r),
        var(--sun-g),
        var(--sun-b),
        .035
      )
      49%,

      transparent
      76%
    );

  filter:
    blur(70px);

  transform:
    rotate(-6deg);

}


/* =========================================================
   SUN CORE
   ========================================================= */

.sunDisk{

  position:absolute;

  left:50%;
  top:50%;

  width:12%;

  aspect-ratio:1;

  border-radius:50%;

  transform:
    translate(-50%,-50%);

  background:
    rgb(
      var(--sun-r),
      var(--sun-g),
      var(--sun-b)
    );

  opacity:.44;

  filter:
    blur(20px);

  box-shadow:

    0 0 60px

    rgba(
      var(--sun-r),
      var(--sun-g),
      var(--sun-b),
      .28
    );

}


/* =========================================================
   MOON
   ========================================================= */

#dreamMoon{

  position:absolute;

  left:
    var(--moon-x);

  top:
    var(--moon-y);

  width:
    clamp(
      135px,
      18vw,
      350px
    );

  aspect-ratio:1;

  z-index:9;

  border-radius:50%;

  background:#000;

  opacity:
    var(--moon-opacity);

  transform:
    translate(-50%,-50%)
    scale(var(--moon-scale));

  transition:
    left
    8s
    cubic-bezier(.22,.61,.36,1),
    top
    8s
    cubic-bezier(.22,.61,.36,1),
    transform
    8s
    cubic-bezier(.22,.61,.36,1),
    opacity
    4s
    ease;

}


/* =========================================================
   NOISE
   ========================================================= */

#noise{

  position:absolute;

  inset:0;

  z-index:12;

  opacity:.035;

  pointer-events:none;

  background-image:

    url(
      "data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.72' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.65'/%3E%3C/svg%3E"
    );

  mix-blend-mode:soft-light;

}


/* =========================================================
   VIGNETTE
   ========================================================= */

#dreamVignette{

  position:absolute;

  inset:0;

  z-index:13;

  background:

    radial-gradient(
      ellipse at 50% 48%,

      transparent
      0%,

      rgba(0,0,0,.025)
      39%,

      rgba(0,0,0,.15)
      72%,

      rgba(0,0,0,.55)
      100%
    );

}


/* =========================================================
   READABILITY
   ========================================================= */

#readingShadow{

  position:fixed;

  inset:0;

  z-index:14;

  pointer-events:none;

  opacity:.08;

  background:

    radial-gradient(
      ellipse at 50% 50%,

      rgba(0,0,0,.04)
      0%,

      rgba(0,0,0,.10)
      42%,

      rgba(0,0,0,.34)
      84%,

      rgba(0,0,0,.54)
      100%
    );

  transition:
    opacity
    2s
    ease;

}


body.questionMode #readingShadow{

  opacity:.33;

}


/* =========================================================
   GHOST TEXT
   ========================================================= */

#ghostLayer{

  position:fixed;

  inset:0;

  z-index:15;

  pointer-events:none;

  overflow:hidden;

}


.ghost{

  position:absolute;

  max-width:90vw;

  white-space:nowrap;

  font-size:
    clamp(
      24px,
      8vw,
      112px
    );

  line-height:.9;

  letter-spacing:-.05em;

  color:
    rgba(255,255,255,.020);

  filter:
    blur(15px);

  animation:
    ghostMove
    linear
    forwards;

}


.answerGhost{

  color:
    rgba(255,255,255,.034);

}


/* =========================================================
   UI
   ========================================================= */

#ui{

  position:fixed;

  inset:0;

  z-index:20;

  height:
    calc(
      var(--vh) * 100
    );

  display:flex;

  flex-direction:column;

  justify-content:space-between;

  padding:

    max(
      24px,
      env(safe-area-inset-top)
    )

    max(
      24px,
      env(safe-area-inset-right)
    )

    max(
      24px,
      env(safe-area-inset-bottom)
    )

    max(
      24px,
      env(safe-area-inset-left)
    );

  transition:
    opacity
    1.35s
    ease;

}


#ui.hide{

  opacity:0;

  pointer-events:none;

}


.top,
.bottom{

  display:flex;

  justify-content:space-between;

  align-items:center;

  gap:20px;

  font-size:10px;

  letter-spacing:.22em;

  text-transform:uppercase;

  color:
    var(--muted);

  text-shadow:
    var(--shadow);

}


/* =========================================================
   SCREEN
   ========================================================= */

#screenWrap{

  width:
    min(
      960px,
      100%
    );

  margin:auto;

  position:relative;

}


#screenWrap::before{

  content:"";

  position:absolute;

  z-index:-1;

  inset:
    -80px
    -100px;

  pointer-events:none;

  background:

    radial-gradient(
      ellipse,

      rgba(0,0,0,.43)
      0%,

      rgba(0,0,0,.22)
      48%,

      rgba(0,0,0,.05)
      70%,

      transparent
      84%
    );

}


#screen{

  position:relative;

  opacity:1;

  transition:
    opacity
    1.15s
    cubic-bezier(.45,0,.25,1);

  will-change:
    opacity;

}


#screen.fade{

  opacity:0;

}


/* =========================================================
   TYPOGRAPHY
   ========================================================= */

.eyebrow{

  margin-bottom:24px;

  font-size:10px;

  letter-spacing:.24em;

  text-transform:uppercase;

  color:
    rgba(255,255,255,.56);

  text-shadow:
    var(--shadow);

}


h1{

  font-size:
    clamp(
      56px,
      13vw,
      116px
    );

  line-height:.84;

  letter-spacing:-.055em;

  font-weight:400;

  text-shadow:
    var(--shadow);

}


h2{

  max-width:930px;

  font-size:
    clamp(
      30px,
      7vw,
      64px
    );

  line-height:1.02;

  letter-spacing:-.038em;

  font-weight:400;

  text-shadow:
    var(--shadow);

}


.introText{

  max-width:740px;

  margin-top:28px;

  font-size:
    clamp(
      18px,
      2.8vw,
      29px
    );

  line-height:1.35;

  letter-spacing:-.015em;

  text-shadow:
    var(--shadow);

}


.introMeta{

  max-width:680px;

  margin-top:27px;

  font-size:12px;

  line-height:1.65;

  color:
    rgba(255,255,255,.56);

  text-shadow:
    var(--shadow);

}


.sub{

  max-width:650px;

  margin-top:22px;

  font-size:14px;

  line-height:1.55;

  color:
    rgba(255,255,255,.59);

  text-shadow:
    var(--shadow);

}


.contextTrace{

  max-width:640px;

  margin-top:22px;

  font-size:11px;

  line-height:1.55;

  letter-spacing:.06em;

  color:
    rgba(255,255,255,.32);

  text-shadow:
    var(--shadow);

}


/* =========================================================
   LANGUAGE
   ========================================================= */

.langs{

  display:grid;

  grid-template-columns:
    1fr
    1fr
    1fr;

  gap:1px;

  margin-top:52px;

  background:
    rgba(255,255,255,.16);

}


button{

  appearance:none;

  border:0;

  background:
    rgba(0,0,0,.78);

  color:#fff;

  font:inherit;

  cursor:pointer;

  text-shadow:
    var(--shadow);

}


.langs button{

  height:82px;

  font-size:13px;

  letter-spacing:.18em;

}


button:hover{

  background:#fff;

  color:#000;

  text-shadow:none;

}


/* =========================================================
   INPUTS
   ========================================================= */

textarea,
input{

  width:100%;

  border:0;

  border-bottom:
    1px solid
    rgba(255,255,255,.24);

  outline:0;

  background:
    rgba(0,0,0,.06);

  color:#fff;

  font:inherit;

  caret-color:#fff;

  border-radius:0;

  text-shadow:
    var(--shadow);

}


textarea{

  min-height:210px;

  margin-top:30px;

  padding:
    16px 0 20px;

  resize:none;

  font-size:
    clamp(
      20px,
      4.2vw,
      33px
    );

  line-height:1.38;

}


input{

  margin-top:34px;

  padding:
    18px 0 20px;

  font-size:
    clamp(
      25px,
      5vw,
      44px
    );

  letter-spacing:-.02em;

}


textarea::placeholder,
input::placeholder{

  color:
    rgba(255,255,255,.20);

}


/* =========================================================
   HONEYPOT
   ========================================================= */

#website{

  position:absolute;

  left:-99999px;

  width:1px;
  height:1px;

  opacity:0;

  pointer-events:none;

}


/* =========================================================
   ACTIONS
   ========================================================= */

.actions{

  margin-top:34px;

  display:flex;

  justify-content:space-between;

  align-items:center;

  gap:18px;

}


.back,
.next{

  font-size:10px;

  letter-spacing:.18em;

  text-transform:uppercase;

}


.back{

  background:transparent;

  color:
    var(--muted);

  padding:
    16px 0;

}


.next{

  min-width:150px;

  padding:
    17px 20px;

  border:
    1px solid
    rgba(255,255,255,.30);

  transition:.36s;

}


.received{

  margin-top:34px;

  font-size:11px;

  letter-spacing:.21em;

  text-transform:uppercase;

  color:
    rgba(255,255,255,.60);

}


.colorHint{

  margin-top:15px;

  font-size:10px;

  line-height:1.5;

  letter-spacing:.15em;

  text-transform:uppercase;

  color:
    rgba(255,255,255,.40);

}


/* =========================================================
   DREAM SHIFT
   ========================================================= */

#dreamShift{

  position:fixed;

  inset:0;

  z-index:150;

  pointer-events:none;

  display:flex;

  justify-content:center;

  align-items:center;

  opacity:0;

  background:
    rgba(0,0,0,.88);

}


#dreamShift.active{

  animation:
    dreamShift
    8.3s
    ease
    forwards;

}


.dreamShiftWrap{

  width:
    min(
      760px,
      88vw
    );

  text-align:center;

}


#dreamShiftMain{

  font-size:
    clamp(
      38px,
      9vw,
      92px
    );

  line-height:.9;

  letter-spacing:-.055em;

  font-weight:400;

}


#dreamShiftSub{

  margin-top:28px;

  font-size:10px;

  line-height:1.6;

  letter-spacing:.22em;

  text-transform:uppercase;

  color:
    rgba(255,255,255,.50);

}


#dreamShiftMain,
#dreamShiftSub{

  opacity:1;

  transition:
    opacity
    1.2s
    ease;

}


#dreamShiftMain.shiftFade,
#dreamShiftSub.shiftFade{

  opacity:0;

}


/* =========================================================
   FINAL
   ========================================================= */

#whiteBloom{

  position:fixed;

  inset:-30%;

  z-index:200;

  pointer-events:none;

  opacity:0;

  transform:
    scale(.2);

  filter:
    blur(55px);

  background:

    radial-gradient(
      circle at 50% 50%,

      rgba(255,255,255,1)
      0%,

      rgba(255,255,255,.90)
      17%,

      rgba(255,255,255,.48)
      37%,

      rgba(255,255,255,.08)
      58%,

      transparent
      74%
    );

}


#whiteBloom.active{

  animation:
    bloom
    5.3s
    cubic-bezier(.22,.62,.22,1)
    forwards;

}


#whiteout{

  position:fixed;

  inset:0;

  z-index:201;

  pointer-events:none;

  opacity:0;

  background:#fff;

}


#whiteout.active{

  animation:
    whiteout
    5.4s
    cubic-bezier(.22,.62,.22,1)
    forwards;

}


#finalInvite{

  position:fixed;

  inset:0;

  z-index:220;

  display:flex;

  align-items:center;

  justify-content:center;

  background:#000;

  opacity:0;

  pointer-events:none;

  padding:

    max(
      30px,
      env(safe-area-inset-top)
    )

    max(
      28px,
      env(safe-area-inset-right)
    )

    max(
      30px,
      env(safe-area-inset-bottom)
    )

    max(
      28px,
      env(safe-area-inset-left)
    );

}


#finalInvite.active{

  animation:
    finalIn
    2.4s
    ease
    forwards;

}


.finalGrid{

  width:
    min(
      1100px,
      100%
    );

  display:grid;

  grid-template-columns:
    minmax(
      180px,
      280px
    )
    1fr;

  gap:
    clamp(
      50px,
      8vw,
      120px
    );

  align-items:end;

}


.logoBlock img{

  display:block;

  width:
    min(
      100%,
      260px
    );

  height:auto;

}


.finalCopy{
  max-width:760px;
}


.finalLabel{

  margin-bottom:32px;

  font-size:10px;

  letter-spacing:.24em;

  text-transform:uppercase;

  color:
    rgba(255,255,255,.42);

  const level =
    getDreamLevel();


  const p =
    Math.max(
      0,
      Math.min(
        1,
        i/8
      )
    );


  const sunScale =
    .84 +
    p * 2.20;


  const sunOpacity =
    .73 +
    p * .20;


  document.documentElement.style.setProperty(
    "--sun-scale",
    sunScale
  );


  document.documentElement.style.setProperty(
    "--sun-opacity",
    sunOpacity
  );


  if(
    level === 0
  ){

    document.documentElement.style.setProperty(
      "--moon-opacity",
      "0"
    );

    document.documentElement.style.setProperty(
      "--moon-x",
      "94%"
    );

    document.documentElement.style.setProperty(
      "--moon-scale",
      ".72"
    );

    return;

  }


  if(
    level === 1
  ){

    const local =
      Math.max(
        0,
        Math.min(
          1,
          (i-3)/2
        )
      );


    const moonX =
      85 -
      local * 21;


    const moonScale =
      .75 +
      local * .18;


    document.documentElement.style.setProperty(
      "--moon-opacity",
      ".94"
    );

    document.documentElement.style.setProperty(
      "--moon-x",
      moonX+"%"
    );

    document.documentElement.style.setProperty(
      "--moon-y",
      "50%"
    );

    document.documentElement.style.setProperty(
      "--moon-scale",
      moonScale
    );

    return;

  }


  const local =
    Math.max(
      0,
      Math.min(
        1,
        (i-6)/2
      )
    );


  const moonX =
    61 -
    local * 11;


  const moonScale =
    .95 +
    local * .28;


  document.documentElement.style.setProperty(
    "--moon-opacity",
    ".995"
  );

  document.documentElement.style.setProperty(
    "--moon-x",
    moonX+"%"
  );

  document.documentElement.style.setProperty(
    "--moon-y",
    "50%"
  );

  document.documentElement.style.setProperty(
    "--moon-scale",
    moonScale
  );

}

/* =========================================================
   CROSSFADE
   ========================================================= */

let transitionRunning =
false;


function transition(fn){

  if(
    transitionRunning
  ){

    return;

  }


  transitionRunning =
    true;


  screen.classList.add(
    "fade"
  );


  setTimeout(

    ()=>{


      fn();


      requestAnimationFrame(

        ()=>{


          requestAnimationFrame(

            ()=>{


              screen.classList.remove(
                "fade"
              );


              setTimeout(

                ()=>{

                  transitionRunning =
                    false;

                },

                1200

              );


            }

          );


        }

      );


    },

    1150

  );

}

function introBack(){

  if(
    transitionRunning
  ){

    return;

  }


  saveColorField();


  if(
    state.introStep === 0
  ){

    transition(
      renderStart
    );

    return;

  }


  state.introStep--;


  transition(
    renderIntro
  );

}


function introNext(){

  if(
    transitionRunning
  ){

    return;

  }


  saveColorField();


  const slides =
    INTRO[
      state.lang
    ];


  if(
    state.introStep <
    slides.length-1
  ){

    state.introStep++;


    transition(
      renderIntro
    );

    return;

  }


  state.questionIndex =
    0;


  if(
    !state.generatedQuestions[0]
  ){

    state.generatedQuestions[0] =
      generateOpeningQuestion();

  }


  transition(
    renderQuestion
  );

}

/* =========================================================
   FRAGMENT
   ========================================================= */

function extractFragment(text){

  const cleaned =
    normalizeText(
      text
    );


  if(!cleaned){
    return "";
  }


  const words =
    cleaned
    .split(/\s+/)
    .filter(Boolean);


  if(
    words.length <= 8
  ){

    return cleaned;

  }


  const starts = [

    0,

    Math.floor(
      words.length*.20
    ),

    Math.floor(
      words.length*.40
    ),

    Math.max(
      0,
      words.length-8
    )

  ];


  const start =
    randomItem(
      starts
    );


  return words
  .slice(
    start,
    start+8
  )
  .join(" ");

}


/* =========================================================
   CLEAN FRAGMENT
   ========================================================= */

function cleanFragmentForPrompt(text){

  let fragment =
    normalizeText(
      text || ""
    );


  fragment =
    fragment
    .replace(
      /["“”„«»']/g,
      ""
    )
    .trim();


  fragment =
    fragment
    .replace(
      /[.,!?;:]+$/g,
      ""
    )
    .trim();


  return fragment;

}

/* =========================================================
   ADAPTIVE
   ========================================================= */

function generateAdaptiveQuestion(){

  const i =
    state.questionIndex;


  const previous =
    state.answers[
      i-1
    ];


  const answer =
    previous
    ?
    previous.answer
    :
    "";


  const fragment =
    cleanFragmentForPrompt(
      extractFragment(
        answer
      )
    );


  const themes =
    detectThemes(
      answer
    );


  if(
    i <= 2
  ){

    return generateLayerOneQuestion(
      fragment,
      themes
    );

  }


  if(
    i <= 5
  ){

    return generateLayerTwoQuestion(
      fragment,
      themes
    );

  }


  return generateLayerThreeQuestion(
    fragment,
    themes
  );

}

          `Wróć do fragmentu: ${f}. Czy nadal masz pewność, że właśnie tak wyglądał sen? Co zdążyło zmienić się w pamięci podczas tej rozmowy?`
      },

      {
        category:"DRUGI SEN",
        question:
          `Potraktuj fragment ${f} jak część snu znajdującego się wewnątrz innego snu. Co mogłoby pojawić się po przebudzeniu z tej pierwszej warstwy?`
      },

      {
        category:"TOŻSAMOŚĆ",
        question:
          `Wróć do sceny: ${f}. Wyobraź sobie tę sytuację bez swojej obecności. Co nadal by się wydarzało?`
      },

      {
        category:"ŚLAD",
        question:
          `Wróć do obrazu: ${f}. Gdyby z całego snu można było zachować tylko jeden obraz, gest, przedmiot albo zdanie — co powinno pozostać?`
      },

      {
        category:"ODWRÓCENIE",
        question:
          `Wróć do sceny: ${f}. A jeśli to nie Ty obserwujesz sen? Co w tej historii mogłoby obserwować Ciebie?`
      },

      {
        category:"PRZESUNIĘCIE",
        question:
          `Wróć do fragmentu: ${f}. Zmień w nim jedną rzecz. Co musiałoby się zmienić, aby cały sen nagle zaczął znaczyć coś zupełnie innego?`
      }

    ]);

  }


  if(
    state.lang ===
    "UKR"
  ){

    return randomItem([

      {
        category:"ПАМ’ЯТЬ",
        question:
          `Повернися до фрагмента: ${f}. Чи залишається впевненість, що саме так виглядав сон? Що вже встигло змінитися в пам’яті протягом цієї розмови?`
      },

      {
        category:"ІНШИЙ СОН",
        question:
          `Сприйми фрагмент ${f} як частину сну всередині іншого сну. Що могло б з’явитися після пробудження з цього першого шару?`
      },

      {
        category:"ПРИСУТНІСТЬ",
        question:
          `Повернися до сцени: ${f}. Уяви цю ситуацію без своєї присутності. Що продовжувало б відбуватися?`
      },

      {
        category:"СЛІД",
        question:
          `Повернися до образу: ${f}. Якби з усього сну можна було залишити лише один образ, жест, предмет або речення — що мало б залишитися?`
      },

      {
        category:"ПОГЛЯД",
        question:
          `Повернися до сцени: ${f}. А якщо не Ти спостерігаєш за сном? Що в цій історії могло б спостерігати у відповідь?`
      }

    ]);

  }


  return randomItem([

    {
      category:"MEMORY",
      question:
        `Return to this fragment: ${f}. Are you still certain the dream looked exactly like that? What has already changed in your memory during this conversation?`
    },

    {
      category:"SECOND DREAM",
      question:
        `Treat the fragment ${f} as part of a dream contained inside another dream. What might appear after waking from the first layer?`
    },

    {
      category:"IDENTITY",
      question:
        `Return to the scene: ${f}. Imagine this situation without your presence. What would continue happening?`
    },

    {
      category:"TRACE",
      question:
        `Return to the image: ${f}. If only one image, gesture, object or sentence could remain from the entire dream, what should survive?`
    },

    {
      category:"REVERSAL",
      question:
        `Return to the scene: ${f}. What if you are not the one observing the dream? What in this story might be observing you?`
    }

  ]);

}


/* =========================================================
   QUESTION HELPERS
   ========================================================= */

function getCurrentQuestion(){

  return state
  .generatedQuestions[
    state.questionIndex
  ];

}


function getDreamLevel(){

  if(
    state.questionIndex <= 2
  ){

    return 0;

  }


  if(
    state.questionIndex <= 5
  ){

    return 1;

  }


  return 2;

}


/* =========================================================
   RENDER QUESTION
   ========================================================= */

function renderQuestion(){

  setVisualMode(
    "questions"
  );


  updateDreamCosmos();


  const copy =
    UI[
      state.lang
    ];


  const q =
    getCurrentQuestion();


  if(!q){
    return;
  }


  const saved =
    state.answers[
      state.questionIndex
    ];


  const level =
    getDreamLevel();


  progress.textContent =
    `${String(
      state.questionIndex+1
    ).padStart(
      2,
      "0"
    )}
    /
    ${String(
      state.totalQuestions
    ).padStart(
      2,
      "0"
    )}`;


  depthLabel.textContent =
    `TRAUM ${level}`;


  let trace =
    "";


  if(
    state.questionIndex > 0
  ){

    const previous =
      state.answers[
        state.questionIndex-1
      ];


    if(
      previous &&
      previous.answer
    ){

      const fragment =
        cleanFragmentForPrompt(
          extractFragment(
            previous.answer
          )
        );


      if(fragment){

        trace = `

<div class="contextTrace">
${escapeHtml(fragment)}
</div>

`;

      }

    }

  }


  screen.innerHTML = `

<div class="eyebrow">
${escapeHtml(
  q.category
)}
</div>

<h2>
${escapeHtml(
  q.question
)}
</h2>

${trace}

<textarea
id="answer"
placeholder="${copy.placeholder}"
>${escapeHtml(
  saved
  ?
  saved.answer
  :
  ""
)}</textarea>

<div class="actions">

<button
class="back"
onclick="questionBack()"
>
${copy.back}
</button>

<button
class="next"
onclick="questionNext()"
>
${copy.next}
</button>

</div>

`;


  spawnPreviousAnswerGhost();


  setTimeout(
    ()=>{

      document
      .getElementById(
        "answer"
      )
      ?.focus();

    },
    250
  );

}


/* =========================================================
   SAVE ANSWER
   ========================================================= */

function saveCurrentAnswer(){

  const field =
    document.getElementById(
      "answer"
    );


  if(!field){
    return;
  }


  const q =
    getCurrentQuestion();


  state.answers[
    state.questionIndex
  ] = {

    level:
      getDreamLevel(),

    category:
      q.category,

    question:
      q.question,

    answer:
      normalizeText(
        field.value
      )

  };

}


/* =========================================================
   NEXT
   ========================================================= */

function questionNext(){

  if(
    transitionRunning ||
    dreamShiftRunning
  ){

    return;

  }


  saveCurrentAnswer();


  const current =
    state.answers[
      state.questionIndex
    ];


  if(
    !current ||
    !current.answer
  ){

    const field =
      document.getElementById(
        "answer"
      );


    if(field){

      field.focus();

      field.style.borderBottomColor =
        "rgba(255,255,255,.72)";


      setTimeout(
        ()=>{

          field.style.borderBottomColor =
            "rgba(255,255,255,.24)";

        },
        700
      );

    }


    return;

  }


  if(
    state.questionIndex ===
    state.totalQuestions-1
  ){

    transition(
      renderNickname
    );

    return;

  }


  state.questionIndex++;


  if(
    !state.generatedQuestions[
      state.questionIndex
    ]
  ){

    state.generatedQuestions[
      state.questionIndex
    ] =
      generateAdaptiveQuestion();

  }


  updateDreamCosmos();


  if(
    state.questionIndex === 3
  ){

    runDreamShift(1);

    return;

  }


  if(
    state.questionIndex === 6
  ){

    runDreamShift(2);

    return;

  }


  transition(
    renderQuestion
  );

}


/* =========================================================
   BACK
   ========================================================= */

function questionBack(){

  if(
    transitionRunning ||
    dreamShiftRunning
  ){

    return;

  }


  saveCurrentAnswer();


  if(
    state.questionIndex === 0
  ){

    state.introStep =
      INTRO[
        state.lang
      ]
      .length-1;


    transition(
      renderIntro
    );

    return;

  }


  state.questionIndex--;


  updateDreamCosmos();


  transition(
    renderQuestion
  );

}


/* =========================================================
   DREAM SHIFT
   ========================================================= */

let dreamShiftRunning =
false;


function runDreamShift(level){

  if(
    dreamShiftRunning
  ){

    return;

  }


  dreamShiftRunning =
    true;


  const overlay =
    document.getElementById(
      "dreamShift"
    );


  const main =
    document.getElementById(
      "dreamShiftMain"
    );


  const sub =
    document.getElementById(
      "dreamShiftSub"
    );


  const ui =
    document.getElementById(
      "ui"
    );


  main.classList.remove(
    "shiftFade"
  );


  sub.classList.remove(
    "shiftFade"
  );


  ui.classList.add(
    "hide"
  );


  if(
    level === 1
  ){

    if(
      state.lang === "PL"
    ){

      main.textContent =
        "COŚ PRZESZŁO PRZEZ ŚWIATŁO";

      sub.textContent =
        "sen ma jeszcze jedną warstwę";

    }

    else if(
      state.lang === "UKR"
    ){

      main.textContent =
        "ЩОСЬ ПРОЙШЛО КРІЗЬ СВІТЛО";

      sub.textContent =
        "сон має ще один шар";

    }

    else{

      main.textContent =
        "SOMETHING CROSSED THE LIGHT";

      sub.textContent =
        "the dream has another layer";

    }

  }

  else{

    if(
      state.lang === "PL"
    ){

      main.textContent =
        "ŚWIATŁO NIE ZNIKNĘŁO";

      sub.textContent =
        "zostało tylko przesłonięte";

    }

    else if(
      state.lang === "UKR"
    ){

      main.textContent =
        "СВІТЛО НЕ ЗНИКЛО";

      sub.textContent =
        "його лише було закрито";

    }

    else{

      main.textContent =
        "THE LIGHT DID NOT DISAPPEAR";

      sub.textContent =
        "it was only covered";

    }

  }


  overlay.classList.add(
    "active"
  );


  setTimeout(
    ()=>{

      main.classList.add(
        "shiftFade"
      );

      sub.classList.add(
        "shiftFade"
      );

    },
    2600
  );


  setTimeout(
    ()=>{

      if(
        level === 1
      ){

        if(
          state.lang === "PL"
        ){

          main.textContent =
            "NIE SZUKAJ POCZĄTKU";

          sub.textContent =
            "pozwól obrazowi prowadzić dalej";

        }

        else if(
          state.lang === "UKR"
        ){

          main.textContent =
            "НЕ ШУКАЙ ПОЧАТКУ";

          sub.textContent =
            "дозволь образу вести далі";

        }

        else{

          main.textContent =
            "DO NOT LOOK FOR THE BEGINNING";

          sub.textContent =
            "let the image lead you further";

        }

      }

      else{

        if(
          state.lang === "PL"
        ){

          main.textContent =
            "ZOSTAŁA KORONA";

          sub.textContent =
            "kolor nadal jest pod spodem";

        }

        else if(
          state.lang === "UKR"
        ){

          main.textContent =
            "ЗАЛИШИЛАСЯ КОРОНА";

          sub.textContent =
            "колір усе ще під нею";

        }

        else{

          main.textContent =
            "THE CORONA REMAINS";

          sub.textContent =
            "the colour is still underneath";

        }

      }


      requestAnimationFrame(
        ()=>{

          requestAnimationFrame(
            ()=>{

              main.classList.remove(
                "shiftFade"
              );

              sub.classList.remove(
                "shiftFade"
              );

            }
          );

        }
      );

    },
    3900
  );


  setTimeout(
    ()=>{

      main.classList.add(
        "shiftFade"
      );

      sub.classList.add(
        "shiftFade"
      );

    },
    6500
  );


  setTimeout(
    ()=>{

      overlay.classList.remove(
        "active"
      );


      renderQuestion();


      ui.classList.remove(
        "hide"
      );


      setTimeout(
        ()=>{

          dreamShiftRunning =
            false;

        },
        650
      );

    },
    8300
  );

}


/* =========================================================
   GHOST
   ========================================================= */

function spawnPreviousAnswerGhost(){

  if(
    state.questionIndex === 0
  ){

    return;

  }


  const previous =
    state.answers
    .filter(
      a =>
        a &&
        a.answer &&
        a.answer.length > 2
    );


  if(
    !previous.length
  ){

    return;

  }


  if(
    Math.random() >
    .60
  ){

    const a =
      randomItem(
        previous
      );


    const fragment =
      cleanFragmentForPrompt(
        extractFragment(
          a.answer
        )
      );


    ghost(
      fragment,
      true
    );

  }

}


function ghost(
  text,
  answer=false
){

  if(!text){
    return;
  }


  const e =
    document.createElement(
      "div"
    );


  e.className =
    answer
    ?
    "ghost answerGhost"
    :
    "ghost";


  e.textContent =
    text;


  e.style.left =
    (
      Math.random()*55
      -
      5
    )
    +
    "vw";


  e.style.top =
    (
      Math.random()*75
      +
      8
    )
    +
    "vh";


  e.style.animationDuration =
    (
      30
      +
      Math.random()*22
    )
    +
    "s";


  ghostLayer.appendChild(
    e
  );


  setTimeout(
    ()=>{

      e.remove();

    },
    56000
  );

}

/* =========================================================
   NICK BACK
   ========================================================= */

function nicknameBack(){

  if(
    transitionRunning
  ){

    return;

  }


  const field =
    document.getElementById(
      "nickname"
    );


  if(field){

    state.nickname =
      field.value.trim();

  }


  state.questionIndex =
    state.totalQuestions-1;


  updateDreamCosmos();


  transition(
    renderQuestion
  );

}


/* =========================================================
   SAVE
   ========================================================= */

async function saveDream(){

  if(
    transitionRunning
  ){

    return;

  }


  const field =
    document.getElementById(
      "nickname"
    );


  if(field){

    const value =
      field.value.trim();


    if(value){

      state.nickname =
        value;

    }

  }


  if(
    !state.nickname
  ){

    state.nickname =
      "ANONYMOUS";

  }


  const honeypot =
    document.getElementById(
      "website"
    );


  const copy =
    UI[
      state.lang
    ];


  const payload = {

    nickname:
      state.nickname,

    language:
      state.lang,

    dreamColor:
      state.dreamColorName,

    website:
      honeypot
      ?
      honeypot.value
      :
      "",

    answers:
      state.answers,

    dream:
      state.answers
      .map(
        a =>
          a
          ?
          a.answer
          :
          ""
      )
      .join(
        "\n\n"
      )

  };


  transition(
    ()=>{

      setVisualMode(
        "saving"
      );


      progress.textContent =
        "";


      depthLabel.textContent =
        "ARCHIVE";


      screen.innerHTML = `

<div class="eyebrow">
TRAUM SIM
</div>

<h2>
${copy.saving}
</h2>

<p class="sub">
...
</p>

`;

    }
  );


  try{

    const response =
      await fetch(
        API_URL,
        {

          method:"POST",

          headers:{
            "Content-Type":
              "text/plain;charset=utf-8"
          },

          body:
            JSON.stringify(
              payload
            )

        }
      );


    if(
      !response.ok
    ){

      throw new Error(
        "HTTP "
        +
        response.status
      );

    }


    const data =
      await response.json();


    if(
      !data.ok
    ){

      throw new Error(
        data.error
        ||
        "Backend error"
      );

    }


    renderSaved(
      data.dreamId
    );

  }

  catch(error){

    console.error(
      "TRAUM SAVE ERROR",
      error
    );


    renderError();

  }

}
