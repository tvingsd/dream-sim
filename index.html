<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover"
>

<meta name="theme-color" content="#000000">

<title>TRAUM SIM — PATCHLAB 2026</title>

<style>

:root{
  --vh:1vh;

  --white:#f5f5f2;

  --muted:rgba(255,255,255,.50);

  --line:rgba(255,255,255,.19);

  --shadow:
    0 1px 2px rgba(0,0,0,.94),
    0 4px 18px rgba(0,0,0,.42);
}


/* =========================================================
   RESET
   ========================================================= */

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{
  width:100%;
  height:100%;

  overflow:hidden;

  background:#000;

  color:var(--white);

  font-family:
    Helvetica,
    Arial,
    sans-serif;

  -webkit-font-smoothing:antialiased;
  -webkit-text-size-adjust:none;
}

body{
  min-height:calc(var(--vh) * 100);
}


/* =========================================================
   DREAM CANVAS
   ========================================================= */

#dreamCanvas{
  position:fixed;

  inset:0;

  z-index:0;

  width:100%;
  height:100%;

  background:#000;

  opacity:.90;

  filter:
    blur(8px)
    contrast(125%);

  will-change:
    filter,
    opacity;
}


/* =========================================================
   GRAPHITE
   ========================================================= */

#graphite{
  position:fixed;

  inset:0;

  z-index:1;

  pointer-events:none;

  background:

    radial-gradient(
      ellipse at 50% 48%,
      rgba(75,75,75,.045) 0%,
      rgba(28,28,28,.10) 43%,
      rgba(5,5,5,.24) 74%,
      rgba(0,0,0,.52) 100%
    );

  opacity:.46;

  transition:
    opacity 3s ease;
}

body.questionMode #graphite{
  opacity:.76;
}


/* =========================================================
   READING SHADOW
   ========================================================= */

#readingShadow{
  position:fixed;

  inset:0;

  z-index:2;

  pointer-events:none;

  opacity:0;

  background:

    radial-gradient(
      ellipse at 50% 49%,
      rgba(0,0,0,.03) 0%,
      rgba(0,0,0,.14) 45%,
      rgba(0,0,0,.44) 79%,
      rgba(0,0,0,.67) 100%
    );

  transition:
    opacity 2.6s ease;
}

body.questionMode #readingShadow{
  opacity:.57;
}


/* =========================================================
   VEIL
   ========================================================= */

#veil{
  position:fixed;

  inset:-18%;

  z-index:3;

  pointer-events:none;

  opacity:.44;

  mix-blend-mode:screen;

  background:

    radial-gradient(
      circle at 28% 42%,
      rgba(255,255,255,.025),
      transparent 28%
    ),

    radial-gradient(
      circle at 73% 59%,
      rgba(255,255,255,.018),
      transparent 30%
    );

  animation:
    veilBreath
    76s
    ease-in-out
    infinite
    alternate;
}


/* =========================================================
   GRAIN
   ========================================================= */

#grain{
  position:fixed;

  inset:-50%;

  z-index:7;

  pointer-events:none;

  opacity:.020;

  background-image:url(
    "data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.83' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E"
  );

  animation:
    grainMove
    .36s
    steps(2)
    infinite;
}


/* =========================================================
   GHOSTS
   ========================================================= */

#ghostLayer{
  position:fixed;

  inset:0;

  z-index:5;

  pointer-events:none;

  overflow:hidden;
}

.ghost{
  position:absolute;

  max-width:90vw;

  font-size:
    clamp(
      25px,
      8vw,
      112px
    );

  line-height:.9;

  letter-spacing:-.05em;

  white-space:nowrap;

  color:rgba(255,255,255,.025);

  filter:blur(15px);

  animation:
    ghostMove
    linear
    forwards;
}

.answerGhost{
  color:rgba(255,255,255,.045);

  filter:blur(17px);
}


/* =========================================================
   UI
   ========================================================= */

#ui{
  position:fixed;

  inset:0;

  z-index:20;

  height:calc(var(--vh) * 100);

  display:flex;

  flex-direction:column;

  justify-content:space-between;

  padding:
    max(24px,env(safe-area-inset-top))
    max(24px,env(safe-area-inset-right))
    max(24px,env(safe-area-inset-bottom))
    max(24px,env(safe-area-inset-left));

  transition:
    opacity 1.5s ease,
    filter 1.5s ease;
}

#ui.hide{
  opacity:0;

  filter:blur(14px);

  pointer-events:none;
}


/* =========================================================
   TOP / BOTTOM
   ========================================================= */

.top,
.bottom{
  display:flex;

  justify-content:space-between;

  align-items:center;

  gap:20px;

  font-size:10px;

  letter-spacing:.22em;

  text-transform:uppercase;

  color:var(--muted);

  text-shadow:var(--shadow);
}


/* =========================================================
   SCREEN
   ========================================================= */

#screenWrap{
  width:min(960px,100%);

  margin:auto;

  position:relative;
}

#screenWrap::before{
  content:"";

  position:absolute;

  z-index:-1;

  inset:-80px -90px;

  pointer-events:none;

  opacity:.50;

  filter:blur(30px);

  background:

    radial-gradient(
      ellipse,
      rgba(0,0,0,.52),
      rgba(0,0,0,.22) 62%,
      rgba(0,0,0,0) 82%
    );
}

#screen{
  position:relative;

  transition:
    opacity 1.25s ease,
    transform 1.45s ease,
    filter 1.25s ease;
}

#screen.fade{
  opacity:0;

  transform:
    translateY(10px)
    scale(1.008);

  filter:blur(13px);
}


/* =========================================================
   TYPOGRAPHY
   ========================================================= */

.eyebrow{
  margin-bottom:24px;

  font-size:10px;

  letter-spacing:.24em;

  text-transform:uppercase;

  color:rgba(255,255,255,.54);

  text-shadow:var(--shadow);
}

h1{
  font-size:
    clamp(
      56px,
      13vw,
      116px
    );

  line-height:.84;

  letter-spacing:-.055em;

  font-weight:400;

  text-shadow:var(--shadow);
}

h2{
  max-width:930px;

  font-size:
    clamp(
      30px,
      7vw,
      64px
    );

  line-height:1.02;

  letter-spacing:-.038em;

  font-weight:400;

  text-shadow:var(--shadow);
}

.introText{
  max-width:740px;

  margin-top:28px;

  font-size:
    clamp(
      18px,
      2.8vw,
      29px
    );

  line-height:1.35;

  letter-spacing:-.015em;

  text-shadow:var(--shadow);
}

.introMeta{
  max-width:680px;

  margin-top:27px;

  font-size:12px;

  line-height:1.65;

  color:rgba(255,255,255,.54);

  text-shadow:var(--shadow);
}

.sub{
  max-width:650px;

  margin-top:22px;

  font-size:14px;

  line-height:1.55;

  color:rgba(255,255,255,.56);

  text-shadow:var(--shadow);
}

.contextTrace{
  max-width:640px;

  margin-top:22px;

  font-size:11px;

  line-height:1.55;

  letter-spacing:.06em;

  color:rgba(255,255,255,.30);

  text-shadow:var(--shadow);
}


/* =========================================================
   LANG
   ========================================================= */

.langs{
  display:grid;

  grid-template-columns:
    1fr 1fr 1fr;

  gap:1px;

  margin-top:52px;

  background:rgba(255,255,255,.16);
}

button{
  appearance:none;

  border:0;

  background:rgba(0,0,0,.80);

  color:#fff;

  font:inherit;

  cursor:pointer;

  text-shadow:var(--shadow);
}

.langs button{
  height:82px;

  font-size:13px;

  letter-spacing:.18em;
}

button:hover{
  background:#fff;

  color:#000;

  text-shadow:none;
}


/* =========================================================
   INPUTS
   ========================================================= */

textarea,
input{
  width:100%;

  border:0;

  border-bottom:
    1px solid
    rgba(255,255,255,.19);

  outline:0;

  background:rgba(0,0,0,.07);

  color:#fff;

  font:inherit;

  caret-color:#fff;

  border-radius:0;

  text-shadow:var(--shadow);
}

textarea{
  min-height:210px;

  margin-top:30px;

  padding:
    16px
    0
    20px;

  resize:none;

  font-size:
    clamp(
      20px,
      4.2vw,
      33px
    );

  line-height:1.38;
}

input{
  margin-top:34px;

  padding:
    18px
    0
    20px;

  font-size:
    clamp(
      25px,
      5vw,
      44px
    );

  letter-spacing:-.02em;
}

textarea::placeholder,
input::placeholder{
  color:rgba(255,255,255,.17);
}


/* =========================================================
   ACTIONS
   ========================================================= */

.actions{
  margin-top:34px;

  display:flex;

  justify-content:space-between;

  align-items:center;

  gap:18px;
}

.back,
.next{
  font-size:10px;

  letter-spacing:.18em;

  text-transform:uppercase;
}

.back{
  background:transparent;

  color:var(--muted);

  padding:16px 0;
}

.next{
  min-width:150px;

  padding:
    17px
    20px;

  border:
    1px solid
    rgba(255,255,255,.26);

  transition:.42s;
}

.received{
  margin-top:34px;

  font-size:11px;

  letter-spacing:.21em;

  text-transform:uppercase;

  color:rgba(255,255,255,.56);

  text-shadow:var(--shadow);
}


/* =========================================================
   COLOR
   ========================================================= */

.colorHint{
  margin-top:15px;

  font-size:10px;

  line-height:1.5;

  letter-spacing:.15em;

  text-transform:uppercase;

  color:rgba(255,255,255,.36);

  text-shadow:var(--shadow);
}


/* =========================================================
   DREAM SHIFT
   ========================================================= */

#dreamShift{
  position:fixed;

  inset:0;

  z-index:150;

  pointer-events:none;

  display:flex;

  justify-content:center;

  align-items:center;

  opacity:0;

  background:#000;
}

#dreamShift.active{
  animation:
    dreamShift
    10s
    ease
    forwards;
}

.dreamShiftWrap{
  width:min(760px,88vw);

  text-align:center;
}

#dreamShiftMain{
  font-size:
    clamp(
      38px,
      9vw,
      92px
    );

  line-height:.9;

  letter-spacing:-.055em;

  font-weight:400;

  text-shadow:var(--shadow);
}

#dreamShiftSub{
  margin-top:28px;

  font-size:10px;

  line-height:1.6;

  letter-spacing:.22em;

  text-transform:uppercase;

  color:rgba(255,255,255,.48);

  text-shadow:var(--shadow);
}


/* =========================================================
   FINAL TRANSITION
   ========================================================= */

#whiteBloom{
  position:fixed;

  inset:-30%;

  z-index:200;

  pointer-events:none;

  opacity:0;

  transform:scale(.2);

  filter:blur(60px);

  background:

    radial-gradient(
      circle at 50% 50%,
      rgba(255,255,255,1) 0%,
      rgba(255,255,255,.96) 16%,
      rgba(255,255,255,.63) 35%,
      rgba(255,255,255,.14) 55%,
      rgba(255,255,255,0) 74%
    );
}

#whiteBloom.active{
  animation:
    bloom
    5.9s
    cubic-bezier(.22,.62,.22,1)
    forwards;
}

#whiteout{
  position:fixed;

  inset:0;

  z-index:201;

  pointer-events:none;

  opacity:0;

  background:#fff;
}

#whiteout.active{
  animation:
    whiteout
    6s
    cubic-bezier(.22,.62,.22,1)
    forwards;
}


/* =========================================================
   FINAL
   ========================================================= */

#finalInvite{
  position:fixed;

  inset:0;

  z-index:220;

  display:flex;

  align-items:center;

  justify-content:center;

  background:#000;

  opacity:0;

  pointer-events:none;

  padding:
    max(30px,env(safe-area-inset-top))
    max(28px,env(safe-area-inset-right))
    max(30px,env(safe-area-inset-bottom))
    max(28px,env(safe-area-inset-left));
}

#finalInvite.active{
  animation:
    finalIn
    2.9s
    ease
    forwards;
}

.finalGrid{
  width:min(1100px,100%);

  display:grid;

  grid-template-columns:
    minmax(180px,280px)
    1fr;

  gap:
    clamp(
      50px,
      8vw,
      120px
    );

  align-items:end;
}

.logoBlock img{
  display:block;

  width:min(100%,260px);

  height:auto;
}

.finalCopy{
  max-width:760px;
}

.finalLabel{
  margin-bottom:32px;

  font-size:10px;

  letter-spacing:.24em;

  text-transform:uppercase;

  color:rgba(255,255,255,.42);
}

#finalTitle{
  font-size:
    clamp(
      32px,
      5.8vw,
      70px
    );

  line-height:1.02;

  letter-spacing:-.04em;

  font-weight:400;
}

.finalRule{
  width:100%;

  height:1px;

  margin:
    42px
    0
    24px;

  background:rgba(255,255,255,.21);
}

.finalDetails{
  display:flex;

  justify-content:space-between;

  gap:30px;

  font-size:11px;

  letter-spacing:.18em;

  text-transform:uppercase;

  color:rgba(255,255,255,.63);
}


/* =========================================================
   KEYFRAMES
   ========================================================= */

@keyframes veilBreath{

  from{
    transform:
      translate3d(-.7%,.4%,0)
      scale(1);
  }

  to{
    transform:
      translate3d(1%,-.7%,0)
      scale(1.018);
  }

}

@keyframes grainMove{

  0%{transform:translate(0,0)}
  25%{transform:translate(3%,-3%)}
  50%{transform:translate(-4%,2%)}
  75%{transform:translate(2%,4%)}
  100%{transform:translate(-2%,-4%)}

}

@keyframes ghostMove{

  0%{
    opacity:0;

    transform:
      translate3d(-1vw,1vh,0)
      scale(.99);

    filter:blur(17px);
  }

  20%{
    opacity:1;
  }

  74%{
    opacity:.60;
  }

  100%{
    opacity:0;

    transform:
      translate3d(2vw,-1.5vh,0)
      scale(1.025);

    filter:blur(31px);
  }

}

@keyframes dreamShift{

  0%{
    opacity:0;
    filter:blur(22px);
  }

  18%{
    opacity:1;
    filter:blur(0);
  }

  78%{
    opacity:1;
    filter:blur(0);
  }

  100%{
    opacity:0;
    filter:blur(20px);
  }

}

@keyframes bloom{

  0%{
    opacity:0;
    transform:scale(.2);
  }

  42%{
    opacity:.14;
  }

  74%{
    opacity:.62;
    transform:scale(1);
  }

  100%{
    opacity:1;
    transform:scale(1.9);
  }

}

@keyframes whiteout{

  0%{opacity:0}
  58%{opacity:.05}
  82%{opacity:.34}
  100%{opacity:1}

}

@keyframes finalIn{

  0%{
    opacity:0;
    filter:blur(12px);
    transform:scale(1.01);
  }

  100%{
    opacity:1;
    filter:blur(0);
    transform:scale(1);
  }

}


/* =========================================================
   MOBILE
   ========================================================= */

@media(max-width:700px){

  #ui{
    padding:
      max(18px,env(safe-area-inset-top))
      max(18px,env(safe-area-inset-right))
      max(18px,env(safe-area-inset-bottom))
      max(18px,env(safe-area-inset-left));
  }

  h1{
    font-size:
      clamp(
        54px,
        19vw,
        84px
      );
  }

  h2{
    font-size:
      clamp(
        27px,
        8.4vw,
        43px
      );
  }

  .introText{
    font-size:
      clamp(
        19px,
        6vw,
        29px
      );
  }

  textarea{
    min-height:
      clamp(
        165px,
        29dvh,
        260px
      );

    font-size:
      clamp(
        18px,
        5.6vw,
        26px
      );
  }

  .langs{
    margin-top:36px;
  }

  .langs button{
    height:70px;

    font-size:11px;
  }

  .actions{
    margin-top:24px;
  }

  .next{
    min-width:128px;
  }

  .finalGrid{
    display:flex;

    flex-direction:column;

    align-items:flex-start;

    justify-content:center;

    gap:44px;
  }

  .logoBlock img{
    width:min(52vw,190px);
  }

  #finalTitle{
    font-size:
      clamp(
        31px,
        9vw,
        46px
      );
  }

  .finalDetails{
    flex-direction:column;
    gap:8px;
  }

}

</style>
</head>


<body>

<canvas id="dreamCanvas"></canvas>

<div id="graphite"></div>

<div id="readingShadow"></div>

<div id="veil"></div>

<div id="ghostLayer"></div>

<div id="grain"></div>


<div id="dreamShift">

  <div class="dreamShiftWrap">

    <div id="dreamShiftMain"></div>

    <div id="dreamShiftSub"></div>

  </div>

</div>


<div id="whiteBloom"></div>

<div id="whiteout"></div>


<div id="finalInvite">

  <div class="finalGrid">

    <div class="logoBlock">

      <img
        src="patchlab_2026_header_1.png"
        alt="Patchlab Festival 2026"
      >

    </div>


    <div class="finalCopy">

      <div class="finalLabel">
        TRAUM SIM / PATCHLAB 2026
      </div>

      <div id="finalTitle"></div>

      <div class="finalRule"></div>

      <div class="finalDetails">

        <div>15.10.2026</div>

        <div>HEVRE</div>

        <div>KRAKÓW</div>

      </div>

    </div>

  </div>

</div>


<div id="ui">

  <div class="top">

    <span>TRAUM SIM</span>

    <span id="progress"></span>

  </div>


  <div id="screenWrap">

    <main id="screen"></main>

  </div>


  <div class="bottom">

    <span>PATCHLAB 2026</span>

    <span id="depthLabel">
      TRAUM
    </span>

  </div>

</div>


<script>

/* =========================================================
   BACKEND
   ========================================================= */

const API_URL =
"https://script.google.com/macros/s/AKfycbzU_GDYcK7nC4aGNVxmQd4fojRBacX1UR076Ox-lCI8KrGV1YVN7G_mwGT-6UFzOhJY3g/exec";


/* =========================================================
   VIEWPORT
   ========================================================= */

function setVH(){

  const h =
    window.visualViewport
    ?
    window.visualViewport.height
    :
    window.innerHeight;


  document
    .documentElement
    .style
    .setProperty(
      "--vh",
      (h*.01)+"px"
    );

}

setVH();

window.addEventListener(
  "resize",
  setVH
);

if(window.visualViewport){

  window.visualViewport.addEventListener(
    "resize",
    setVH
  );

}


/* =========================================================
   INTRO
   ========================================================= */

const INTRO = {

PL:[

{
type:"text",
label:"TRAUM / 01",
title:"Sen nie jest filmem.",
text:"Sen nie musi mieć początku ani końca. Pamięć miesza miejsca, ludzi, czas i emocje w rzeczywistość, która przez chwilę wydaje się całkowicie naturalna.",
meta:"Nie próbuj jeszcze niczego wyjaśniać. Pozwól temu po prostu wrócić."
},

{

label:"TRAUM / 02",

meta:"Za chwilę TRAUM SIM zacznie podążać za tym, co opisujesz."
},

{
type:"color",
label:"TRAUM / 03",
title:"Jaki kolor mają Twoje najlepsze sny?",
text:"Nie zastanawiaj się długo. Wpisz pierwszy kolor, który pojawił się w Twojej głowie.",
meta:"Od tej chwili TRAUM SIM spróbuje śnić właśnie tym kolorem."
},

{
type:"text",
label:"TRAUM / 04",
title:"Opowiedz, nie interpretuj.",
text:"Nie musisz znać znaczenia snu. Opisz to, co pamiętasz: przestrzeń, osobę, sytuację, uczucie albo jeden obraz.",
meta:"Każda odpowiedź zmieni następne pytanie."
}

],


ENG:[

{
type:"text",
label:"TRAUM / 01",

meta:"In a moment TRAUM SIM will begin to follow what you describe."
},

},

{

label:"TRAUM / 04",

text:"You do not need to understand the dream. Describe what remains: a space, a person, an event, a feeling or a single image.",
meta:"Every answer will change the next question."
}

],


UKR:[

{
type:"text",

/* =========================================================
   HELPERS
   ========================================================= */

function escapeHtml(value){

  return String(
    value || ""
  )
  .replace(
    /[&<>"']/g,
    c=>({

      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      "\"":"&quot;",
      "'":"&#039;"

    }[c])
  );

}


function randomItem(array){

  return array[
    Math.floor(
      Math.random() *
      array.length
    )
  ];

}


function normalizeText(text){

  return String(
    text || ""
  )
  .replace(
    /\s+/g,
    " "
  )
  .trim();

}


/* =========================================================
   MODE
   ========================================================= */

function setVisualMode(mode){

  state.mode =
    mode;


  document
    .body
    .classList
    .toggle(
      "questionMode",
      [
        "questions",
        "nickname",
        "saving",
        "saved",
        "error"
      ]
      .includes(
        mode
      )
    );

}


/* =========================================================
   TRANSITION
   ========================================================= */

function transition(fn){

  screen
    .classList
    .add(
      "fade"
    );


  setTimeout(
    ()=>{

      fn();


      requestAnimationFrame(
        ()=>{

          screen
            .classList
            .remove(
              "fade"
            );

        }
      );

    },
    720
  );

}

/* =========================================================
   EXTRACT FRAGMENT
   ========================================================= */

function extractFragment(text){

  const cleaned =
    normalizeText(
      text
    );


  if(
    !cleaned
  ){

    return "";

  }


  const words =
    cleaned
    .split(/\s+/)
    .filter(Boolean);


  if(
    words.length <=
    8
  ){

    return cleaned;

  }


  const startOptions = [

    0,

    Math.floor(
      words.length*.20
    ),

    Math.floor(
      words.length*.40
    ),

    Math.max(
      0,
      words.length-8
    )

  ];


  const start =
    randomItem(
      startOptions
    );


  return words
    .slice(
      start,
      start+8
    )
    .join(" ");

}

/* =========================================================
   GENERATE ADAPTIVE QUESTION
   ========================================================= */

function generateAdaptiveQuestion(){

  const i =
    state.questionIndex;


  const previous =
    state.answers[
      i-1
    ];


  const previousAnswer =
    previous
    ?
    previous.answer
    :
    "";


  const fragment =
    extractFragment(
      previousAnswer
    );


  const themes =
    detectThemes(
      previousAnswer
    );


  if(
    i <= 2
  ){

    return generateLayerOneQuestion(
      fragment,
      themes
    );

  }


  if(
    i <= 5
  ){

    return generateLayerTwoQuestion(
      fragment,
      themes
    );

  }


  return generateLayerThreeQuestion(
    fragment,
    themes
  );

}

/* =========================================================
   CURRENT QUESTION
   ========================================================= */

function getCurrentQuestion(){

  return state.generatedQuestions[
    state.questionIndex
  ];

}


/* =========================================================
   DREAM LEVEL
   ========================================================= */

function getDreamLevel(){

  if(
    state.questionIndex <= 2
  ){
    return 0;
  }


  if(
    state.questionIndex <= 5
  ){
    return 1;
  }


  return 2;

}


/* =========================================================
   RENDER QUESTION
   ========================================================= */

function renderQuestion(){

  setVisualMode(
    "questions"
  );


  const copy =
    UI[
      state.lang
    ];


  const q =
    getCurrentQuestion();


  if(!q){
    return;
  }


  const saved =
    state.answers[
      state.questionIndex
    ];


  const level =
    getDreamLevel();


  dreamEngine.depthTarget =
    level;


  progress.textContent =
    `${String(
      state.questionIndex+1
    ).padStart(
      2,
      "0"
    )}
    /
    ${String(
      state.totalQuestions
    ).padStart(
      2,
      "0"
    )}`;


  depthLabel.textContent =
    `TRAUM ${level}`;


  let trace =
    "";


  if(
    state.questionIndex > 0
  ){

    const previous =
      state.answers[
        state.questionIndex-1
      ];


    if(
      previous &&
      previous.answer
    ){

      const fragment =
        extractFragment(
          previous.answer
        );


      if(fragment){

        trace = `

<div class="contextTrace">
${escapeHtml(fragment)}
</div>

`;

      }

    }

  }


  screen.innerHTML = `

<div class="eyebrow">
${escapeHtml(
  q.category
)}
</div>

<h2>
${escapeHtml(
  q.question
)}
</h2>

${trace}

<textarea
id="answer"
placeholder="${copy.placeholder}"
>${escapeHtml(
  saved
  ?
  saved.answer
  :
  ""
)}</textarea>

<div class="actions">

<button
class="back"
onclick="questionBack()"
>
${copy.back}
</button>

<button
class="next"
onclick="questionNext()"
>
${copy.next}
</button>

</div>

`;


  spawnPreviousAnswerGhost();


  setTimeout(
    ()=>{

      document
      .getElementById(
        "answer"
      )
      ?.focus();

    },
    450
  );

}


/* =========================================================
   SAVE ANSWER
   ========================================================= */

function saveCurrentAnswer(){

  const field =
    document.getElementById(
      "answer"
    );


  if(!field){
    return;
  }


  const q =
    getCurrentQuestion();


  state.answers[
    state.questionIndex
  ]
  =
  {

    level:
      getDreamLevel(),

    category:
      q.category,

    question:
      q.question,

    answer:
      normalizeText(
        field.value
      )

  };

}


/* =========================================================
   NEXT
   ========================================================= */

function questionNext(){

  saveCurrentAnswer();


  const current =
    state.answers[
      state.questionIndex
    ];


  if(
    !current ||
    !current.answer
  ){

    const field =
      document.getElementById(
        "answer"
      );


    if(field){

      field.focus();


      field.style.borderBottomColor =
        "rgba(255,255,255,.68)";


      setTimeout(
        ()=>{

          field.style.borderBottomColor =
            "rgba(255,255,255,.19)";

        },
        900
      );

    }


    return;

  }


  if(
    state.questionIndex ===
    state.totalQuestions-1
  ){

    transition(
      renderNickname
    );

    return;

  }


  if(
    state.questionIndex ===
    2
  ){

    state.questionIndex++;


    if(
      !state.generatedQuestions[
        state.questionIndex
      ]
    ){

      state.generatedQuestions[
        state.questionIndex
      ]
      =
      generateAdaptiveQuestion();

    }


    runDreamShift(
      1
    );


    return;

  }


  if(
    state.questionIndex ===
    5
  ){

    state.questionIndex++;


    if(
      !state.generatedQuestions[
        state.questionIndex
      ]
    ){

      state.generatedQuestions[
        state.questionIndex
      ]
      =
      generateAdaptiveQuestion();

    }


    runDreamShift(
      2
    );


    return;

  }


  state.questionIndex++;


  if(
    !state.generatedQuestions[
      state.questionIndex
    ]
  ){

    state.generatedQuestions[
      state.questionIndex
    ]
    =
    generateAdaptiveQuestion();

  }


  transition(
    renderQuestion
  );

}


/* =========================================================
   BACK
   ========================================================= */

function questionBack(){

  saveCurrentAnswer();


  if(
    state.questionIndex ===
    0
  ){

    state.introStep =
      INTRO[
        state.lang
      ]
      .length-1;


    transition(
      renderIntro
    );


    return;

  }


  state.questionIndex--;


  dreamEngine.depthTarget =
    getDreamLevel();


  transition(
    renderQuestion
  );

}

/* =========================================================
   ANSWER GHOST
   ========================================================= */

function spawnPreviousAnswerGhost(){

  if(
    state.questionIndex ===
    0
  ){

    return;

  }


  const previous =
    state.answers
    .filter(
      a =>
        a &&
        a.answer &&
        a.answer.length > 2
    );


  if(
    !previous.length
  ){

    return;

  }


  if(
    Math.random() >
    .52
  ){

    const a =
      randomItem(
        previous
      );


    const fragment =
      extractFragment(
        a.answer
      );


    ghost(
      fragment,
      true
    );

  }

}

    state.totalQuestions-1;


  dreamEngine.depthTarget =
    2;


  transition(
    renderQuestion
  );

}


/* =========================================================
   SAVE
   ========================================================= */

async function saveDream(){

  const field =
    document.getElementById(
      "nickname"
    );


  state.nickname =
    field
    ?
    field.value.trim()
    :
    "";


  if(
    !state.nickname
  ){

    state.nickname =
      "ANONYMOUS";

  }


  const copy =
    UI[
      state.lang
    ];


  const payload = {

    nickname:
      state.nickname,

    language:
      state.lang,

    dreamColor:
      state.dreamColorName,

    answers:
      state.answers,

    dream:
      state.answers
      .map(
        a =>
          a
          ?
          a.answer
          :
          ""
      )
      .join(
        "\n\n"
      )

  };


  transition(
    ()=>{

      setVisualMode(
        "saving"
      );


      progress.textContent =
        "";


      depthLabel.textContent =
        "ARCHIVE";


      screen.innerHTML = `

<div class="eyebrow">
TRAUM SIM
</div>

<h2>
${copy.saving}
</h2>

<p class="sub">
...
</p>

`;

    }
  );


  try{

    const response =
      await fetch(
        API_URL,
        {

          method:"POST",

          headers:{
            "Content-Type":
              "text/plain;charset=utf-8"
          },

          body:
            JSON.stringify(
              payload
            )

        }
      );


    if(
      !response.ok
    ){

      throw new Error(
        "HTTP " +
        response.status
      );

    }


    const data =
      await response.json();


    if(
      !data.ok
    ){

      throw new Error(
        data.error ||
        "Backend error"
      );

    }


    renderSaved(
      data.dreamId
    );

  }
  catch(error){

    console.error(
      error
    );


    renderError();

  }

}


/* =========================================================
   SAVED
   ========================================================= */

function renderSaved(id){

  const copy =
    UI[
      state.lang
    ];


  transition(
    ()=>{

      setVisualMode(
        "saved"
      );


      screen.innerHTML = `

<div class="eyebrow">
TRAUM SIM
</div>

<h2>
${copy.done}
</h2>

<p class="sub">
${copy.sub}
</p>

<div class="received">

${escapeHtml(

)}

&nbsp;&nbsp;/&nbsp;&nbsp;

${escapeHtml(

)}

</div>

`;

    }
  );

  );

}


/* =========================================================
   ERROR
   ========================================================= */

function renderError(){

  const copy =
    UI[

    ];


  let message;


  if(
    state.lang ===
    "PL"
  ){

    message =
      "Połączenie z archiwum zostało przerwane.";

  }
  else if(
    state.lang ===
    "UKR"
  ){

  }
  else{

      setVisualMode(

      );


      screen.innerHTML = `

<div class="eyebrow">
TRAUM SIM
</div>

${copy.error}

${message}
</p>

/* =========================================================
   GHOST
   ========================================================= */

function ghost(
  text,
  answer=false
){

  if(!text){
    return;
  }


  const e =
    document.createElement(
      "div"
    );


  e.className =
    answer
    ?
    "ghost answerGhost"
    :
    "ghost";


  e.textContent =
    text;


  e.style.left =
    (
      Math.random()*55
      -
      5
    )
    +
    "vw";


  e.style.top =
    (
      Math.random()*75
      +
      8
    )
    +
    "vh";


  e.style.animationDuration =
    (
      25
      +
      Math.random()*22
    )
    +
    "s";


  ghostLayer.appendChild(
    e
  );


  setTimeout(
    ()=>{

      e.remove();

    },
    49000
  );

}


/* =========================================================
   =========================================================
   RORSCHACH ENGINE — FIXED + VERIFIED LOGIC
   =========================================================
   ========================================================= */


/*
IMPORTANT:

- no rotation
- no random values inside animation frame
- fixed central symmetry
- black background
- giant full-screen forms
- motion measured in SECONDS
- movement cycles 100–400 seconds
- blur cycles 100–300 seconds
*/


const canvas =
document.getElementById(
  "dreamCanvas"
);


const ctx =
canvas.getContext(
  "2d",
  {
    alpha:false
  }
);


let W =
0;


let H =
0;


let DPR =
1;


const dreamEngine = {

  depth:
    0,

  depthTarget:
    0,

  focus:
    0

};


const organisms =
[];


/* =========================================================
   RANDOM
   ========================================================= */

function rand(
  min,
  max
){

  return min +
  Math.random() *
  (
    max-min
  );

}


/* =========================================================
   ORGANISM
   ========================================================= */

function makeOrganism(index){

  const base =
    Math.min(
      W,
      H
    );


  return {

    index:index,

    y:
      H *
      rand(
        .22,
        .78
      ),

    radius:
      base *
      rand(
        .24,
        .46
      ),

    stretchX:
      rand(
        1.20,
        2.55
      ),

    stretchY:
      rand(
        .56,
        1.22
      ),

    lobeA:
      rand(
        1.25,
        3.20
      ),

    lobeB:
      rand(
        3.50,
        7.00
      ),

    lobeC:
      rand(
        7.00,
        12.50
      ),

    amplitudeA:
      rand(
        .07,
        .16
      ),

    amplitudeB:
      rand(
        .025,
        .075
      ),

    amplitudeC:
      rand(
        .012,
        .040
      ),

    phaseA:
      rand(
        0,
        Math.PI*2
      ),

    phaseB:
      rand(
        0,
        Math.PI*2
      ),

    phaseC:
      rand(
        0,
        Math.PI*2
      ),

    phaseY:
      rand(
        0,
        Math.PI*2
      ),

    /*
    rad / sec
    insanely slow
    */

    speedA:
      rand(
        .006,
        .015
      ),

    speedB:
      rand(
        .003,
        .009
      ),

    speedC:
      rand(
        .0015,
        .005
      ),

    speedY:
      rand(
        .002,
        .006
      ),

    driftY:
      rand(
        3,
        14
      )

  };

}


/* =========================================================
   RESIZE
   ========================================================= */

function resizeDream(){

  W =
    Math.max(
      1,
      window.innerWidth
    );


  H =
    Math.max(
      1,
      window.innerHeight
    );


  DPR =
    Math.min(
      window.devicePixelRatio ||
      1,
      1.5
    );


  canvas.width =
    Math.round(
      W *
      DPR
    );


  canvas.height =
    Math.round(
      H *
      DPR
    );


  canvas.style.width =
    W +
    "px";


  canvas.style.height =
    H +
    "px";


  ctx.setTransform(
    DPR,
    0,
    0,
    DPR,
    0,
    0
  );


  organisms.length =
    0;


  /*
  6 giant ink masses.
  */

  for(
    let i=0;
    i<6;
    i++
  ){

    organisms.push(
      makeOrganism(
        i
      )
    );

  }


  ctx.fillStyle =
    "#000";


  ctx.fillRect(
    0,
    0,
    W,
    H
  );

}


/* =========================================================
   WATERCOLOUR COLOR
   ========================================================= */

function watercolorColor(
  brightness,
  alpha
){

  const source =
    state.dreamColor;


  const average =
    (
      source.r +
      source.g +
      source.b
    )
    /
    3;


  /*
  Keep it like pigment,
  not RGB neon.
  */

  const saturation =
    .42;


  let r =
    average +
    (
      source.r -
      average
    )
    *
    saturation;


  let g =
    average +
    (
      source.g -
      average
    )
    *
    saturation;


  let b =
    average +
    (
      source.b -
      average
    )
    *
    saturation;


  r =
    Math.max(
      0,
      Math.min(
        255,
        r *
        brightness
      )
    );


  g =
    Math.max(
      0,
      Math.min(
        255,
        g *
        brightness
      )
    );


  b =
    Math.max(
      0,
      Math.min(
        255,
        b *
        brightness
      )
    );


  return `rgba(
    ${Math.round(r)},
    ${Math.round(g)},
    ${Math.round(b)},
    ${alpha}
  )`;

}


/* =========================================================
   RADIUS
   ========================================================= */

function radiusAt(
  o,
  angle,
  seconds,
  scale
){

  const waveA =
    Math.sin(
      angle *
      o.lobeA
      +
      seconds *
      o.speedA
      +
      o.phaseA
    )
    *
    o.amplitudeA;


  const waveB =
    Math.cos(
      angle *
      o.lobeB
      -
      seconds *
      o.speedB
      +
      o.phaseB
    )
    *
    o.amplitudeB;


  const waveC =
    Math.sin(
      angle *
      o.lobeC
      +
      seconds *
      o.speedC
      +
      o.phaseC
    )
    *
    o.amplitudeC;


  /*
  ~200 sec breathing.
  */

  const breath =
    Math.sin(
      seconds *
      .030
      +
      o.phaseA
    )
    *
    .022;


  /*
  IMPORTANT:
  expression stays attached to return.
  */

  return (
    o.radius *
    scale *
    (
      1 +
      waveA +
      waveB +
      waveC +
      breath
    )
  );

}


/* =========================================================
   BUILD PATH
   ========================================================= */

function buildBlotPath(
  o,
  seconds,
  scale,
  edgeAmount
){

  const cx =
    W *
    .5;


  const cy =
    o.y
    +
    Math.sin(
      seconds *
      o.speedY
      +
      o.phaseY
    )
    *
    o.driftY;


  const points =
    190;


  const left =
    [];


  for(
    let i=0;
    i<=points;
    i++
  ){

    const p =
      i /
      points;


    const angle =
      -Math.PI*.5
      +
      p *
      Math.PI;


    const baseRadius =
      radiusAt(
        o,
        angle,
        seconds,
        scale
      );


    /*
    Static-ish ink edge.
    Full cycle > 1000 sec.
    */

    const edge =
      Math.sin(
        angle *
        (
          18 +
          o.index*2
        )
        +
        o.phaseC
        +
        seconds *
        .002
      )
      *
      edgeAmount;


    const radius =
      baseRadius *
      (
        1 +
        edge
      );


    const x =
      Math.cos(
        angle
      )
      *
      radius
      *
      o.stretchX;


    const y =
      Math.sin(
        angle
      )
      *
      radius
      *
      o.stretchY;


    left.push(
      {
        x:
          cx-x,

        y:
          cy+y
      }
    );

  }


  if(
    left.length <
    2
  ){

    return false;

  }


  ctx.beginPath();


  ctx.moveTo(
    left[0].x,
    left[0].y
  );


  for(
    let i=1;
    i<left.length;
    i++
  ){

    ctx.lineTo(
      left[i].x,
      left[i].y
    );

  }


  /*
  Mirror exactly.
  */

  for(
    let i=left.length-1;
    i>=0;
    i--
  ){

    const p =
      left[i];


    ctx.lineTo(
      cx +
      (
        cx -
        p.x
      ),
      p.y
    );

  }


  ctx.closePath();


  return true;

}


/* =========================================================
   PAINT LAYER
   ========================================================= */

function paintLayer(
  o,
  seconds,
  scale,
  brightness,
  alpha,
  edge
){

  const valid =
    buildBlotPath(
      o,
      seconds,
      scale,
      edge
    );


  if(
    !valid
  ){

    return;

  }


  ctx.fillStyle =
    watercolorColor(
      brightness,
      alpha
    );


  ctx.fill();

}


/* =========================================================
   PAINT ORGANISM
   ========================================================= */

function paintOrganism(
  o,
  seconds
){

  /*
  Big wet exterior.
  */

  paintLayer(
    o,
    seconds,
    1.23,
    1.30,
    .095,
    .018
  );


  /*
  Main pigment.
  */

  paintLayer(
    o,
    seconds+37,
    1.00,
    1.00,
    .150,
    .014
  );


  /*
  Medium pigment.
  */

  paintLayer(
    o,
    seconds+89,
    .80,
    .76,
    .130,
    .011
  );


  /*
  Dense centre.
  */

  paintLayer(
    o,
    seconds+151,
    .59,
    .54,
    .115,
    .008
  );


  /*
  Almost black pigment.
  */

  paintLayer(
    o,
    seconds+223,
    .40,
    .37,
    .095,
    .006
  );


  /*
  Inner dream appears deeper.
  */

  if(
    dreamEngine.depth >
    .65
  ){

    const depth =
      Math.min(
        1,
        (
          dreamEngine.depth -
          .55
        )
        /
        1.2
      );


    paintLayer(
      o,
      seconds+301,
      .27,
      1.12,
      .055 *
      depth,
      .006
    );

  }

}


/* =========================================================
   DEPTH
   ========================================================= */

function updateDepth(){

  dreamEngine.depth +=
    (
      dreamEngine.depthTarget -
      dreamEngine.depth
    )
    *
    .002;

}


/* =========================================================
   BLUR / FOCUS
   ========================================================= */

function updateFocus(seconds){

  /*
  Long irregular waves.

  A = 118 sec
  B = 277 sec

  Result:
  several seconds almost sharp,
  then slowly dissolves again.
  */

  const a =
    (
      Math.sin(
        seconds *
        Math.PI *
        2 /
        118
      )
      +
      1
    )
    /
    2;


  const b =
    (
      Math.sin(
        seconds *
        Math.PI *
        2 /
        277
        +
        1.73
      )
      +
      1
    )
    /
    2;


  let focus =
    a*.58 +
    b*.42;


  focus =
    focus *
    focus *
    (
      3 -
      2*focus
    );


  dreamEngine.focus =
    focus;


  /*
  Reference-like:
  can become clearly readable,
  but never digital-sharp.
  */

  let blur =
    17.5 -
    focus *
    14.2;


  if(
    state.mode ===
    "questions"
  ){

    blur +=
      1.4;

  }


  const contrast =
    112 +
    focus *
    43;


  const opacity =
    .78 +
    focus *
    .17;


  canvas.style.filter =
    `blur(${blur.toFixed(2)}px) contrast(${contrast.toFixed(1)}%)`;


  canvas.style.opacity =
    opacity.toFixed(
      3
    );

}


/* =========================================================
   BACKGROUND
   ========================================================= */

function drawBlackField(){

  /*
  REAL BLACK.
  */

  ctx.fillStyle =
    "#000";


  ctx.fillRect(
    0,
    0,
    W,
    H
  );


  /*
  Tiny graphite halo only near centre.
  */

  const gradient =
    ctx.createRadialGradient(
      W*.5,
      H*.5,
      0,
      W*.5,
      H*.5,
      Math.max(
        W,
        H
      )
      *
      .75
    );


  gradient.addColorStop(
    0,
    "rgba(25,25,25,.20)"
  );


  gradient.addColorStop(
    .48,
    "rgba(8,8,8,.16)"
  );


  gradient.addColorStop(
    1,
    "rgba(0,0,0,0)"
  );


  ctx.fillStyle =
    gradient;


  ctx.fillRect(
    0,
    0,
    W,
    H
  );

}


/* =========================================================
   DRAW
   ========================================================= */

function drawDream(timestamp){

  /*
  requestAnimationFrame timestamp is ms.
  Convert exactly once.
  */

  const seconds =
    timestamp /
    1000;


  updateDepth();


  drawBlackField();


  /*
  NORMAL compositing.
  This makes the pigment definitely visible.

  Earlier versions relied heavily on SCREEN +
  very low alpha.
  This version intentionally does not.
  */

  ctx.globalCompositeOperation =
    "source-over";


  for(
    const organism
    of
    organisms
  ){

    paintOrganism(
      organism,
      seconds
    );

  }


  /*
  Very subtle central fold.
  */

  const fold =
    ctx.createLinearGradient(
      W*.465,
      0,
      W*.535,
      0
    );


  fold.addColorStop(
    0,
    "rgba(0,0,0,0)"
  );


  fold.addColorStop(
    .5,
    "rgba(255,255,255,.012)"
  );


  fold.addColorStop(
    1,
    "rgba(0,0,0,0)"
  );


  ctx.fillStyle =
    fold;


  ctx.fillRect(
    W*.44,
    0,
    W*.12,
    H
  );


  updateFocus(
    seconds
  );


  requestAnimationFrame(
    drawDream
  );

}


/* =========================================================
   INIT
   ========================================================= */

window.addEventListener(
  "resize",
  resizeDream
);


resizeDream();


renderStart();


requestAnimationFrame(
  drawDream
);

</script>
