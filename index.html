<!DOCTYPE html>
<html lang="pl">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover"
>

<meta name="theme-color" content="#000000">

<title>TRAUM SIM — PATCHLAB 2026</title>

<style>

/* =========================================================
   ROOT
   ========================================================= */

:root{

  --vh:1vh;

  --white:#f5f5f2;

  --muted:rgba(255,255,255,.50);

  --line:rgba(255,255,255,.19);

  --shadow:
    0 1px 2px rgba(0,0,0,.94),
    0 4px 18px rgba(0,0,0,.42);

  --dreamRGB:185,185,185;

}


/* =========================================================
   RESET
   ========================================================= */

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{

  width:100%;
  height:100%;

  overflow:hidden;

  background:#000;

  color:var(--white);

  font-family:
    Helvetica,
    Arial,
    sans-serif;

  -webkit-font-smoothing:antialiased;
  -webkit-text-size-adjust:none;

}

body{

  min-height:
    calc(
      var(--vh)
      *
      100
    );

}


/* =========================================================
   =========================================================
   STABLE DREAM WORLD
   Safari / MacBook Air friendly
   =========================================================
   ========================================================= */

#dreamWorld{

  position:fixed;

  inset:0;

  z-index:0;

  overflow:hidden;

  pointer-events:none;

  background:#000;

}


/*
Two independent dream layers.

NO animated blur.
NO animated SVG turbulence.
NO animated Gaussian blur.
NO CSS filter animation.

Only opacity + transform.
*/

.dreamStage{

  position:absolute;

  width:112%;
  height:112%;

  left:-6%;
  top:-6%;

  transform-origin:50% 50%;

  will-change:
    opacity,
    transform;

}


/* =========================================================
   SOFT DREAM
   ========================================================= */

#dreamSoft{

  opacity:.54;

  animation:
    softDreamPresence
    173s
    ease-in-out
    infinite;

}


/* =========================================================
   CLEAR DREAM
   ========================================================= */

#dreamClear{

  opacity:.57;

  animation:
    clearDreamPresence
    173s
    ease-in-out
    infinite;

}


/* =========================================================
   INTERNAL GROUP MOVEMENT
   ========================================================= */

.softBack{

  transform-origin:
    800px
    500px;

  animation:
    slowMorphA
    257s
    cubic-bezier(.45,0,.55,1)
    infinite
    alternate;

}

.softMid{

  transform-origin:
    800px
    500px;

  animation:
    slowMorphB
    211s
    cubic-bezier(.45,0,.55,1)
    infinite
    alternate;

}

.clearBack{

  transform-origin:
    800px
    500px;

  animation:
    slowMorphC
    193s
    cubic-bezier(.45,0,.55,1)
    infinite
    alternate;

}

.clearFront{

  transform-origin:
    800px
    500px;

  animation:
    slowMorphD
    239s
    cubic-bezier(.45,0,.55,1)
    infinite
    alternate;

}


/* =========================================================
   PIGMENT
   ========================================================= */

.dreamInk{

  fill:
    rgb(
      var(--dreamRGB)
    );

  transition:
    fill
    7s
    ease;

}


/* darker than previous build */

.inkGhost{
  opacity:.035;
}

.inkSoft{
  opacity:.055;
}

.inkLight{
  opacity:.090;
}

.inkMedium{
  opacity:.075;
}

.inkMain{
  opacity:.095;
}

.inkDark{
  opacity:.055;
}

.inkCore{
  opacity:.040;
}

.inkWater{
  opacity:.050;
}


/* =========================================================
   GRAPHITE
   ========================================================= */

#graphite{

  position:fixed;

  inset:0;

  z-index:1;

  pointer-events:none;

  background:

    radial-gradient(
      ellipse at 50% 48%,

      rgba(70,70,70,.025) 0%,

      rgba(32,32,32,.055) 38%,

      rgba(9,9,9,.15) 70%,

      rgba(0,0,0,.56) 100%
    );

  opacity:.47;

  transition:
    opacity
    3.2s
    ease;

}

body.questionMode #graphite{

  opacity:.72;

}


/* =========================================================
   TEXT READABILITY FIELD
   ========================================================= */

#readingShadow{

  position:fixed;

  inset:0;

  z-index:2;

  pointer-events:none;

  opacity:0;

  background:

    radial-gradient(
      ellipse at 50% 48%,

      rgba(0,0,0,.02) 0%,

      rgba(0,0,0,.10) 40%,

      rgba(0,0,0,.40) 77%,

      rgba(0,0,0,.66) 100%
    );

  transition:
    opacity
    2.8s
    ease;

}

body.questionMode #readingShadow{

  opacity:.60;

}


/* =========================================================
   VEIL
   ========================================================= */

#veil{

  position:fixed;

  inset:-18%;

  z-index:3;

  pointer-events:none;

  opacity:.37;

  mix-blend-mode:screen;

  background:

    radial-gradient(
      circle at 27% 42%,
      rgba(255,255,255,.021),
      transparent 27%
    ),

    radial-gradient(
      circle at 74% 58%,
      rgba(255,255,255,.016),
      transparent 29%
    );

  animation:
    veilBreath
    101s
    ease-in-out
    infinite
    alternate;

}


/* =========================================================
   GHOST WORDS
   ========================================================= */

#ghostLayer{

  position:fixed;

  inset:0;

  z-index:5;

  pointer-events:none;

  overflow:hidden;

}

.ghost{

  position:absolute;

  max-width:90vw;

  white-space:nowrap;

  font-size:
    clamp(
      25px,
      8vw,
      112px
    );

  line-height:.9;

  letter-spacing:-.05em;

  color:
    rgba(255,255,255,.020);

  /*
  Static blur only.
  */

  filter:
    blur(15px);

  animation:
    ghostMove
    linear
    forwards;

}

.answerGhost{

  color:
    rgba(255,255,255,.037);

}


/* =========================================================
   GRAIN
   ========================================================= */

#grain{

  position:fixed;

  inset:-50%;

  z-index:7;

  pointer-events:none;

  opacity:.016;

  background-image:url(
    "data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.83' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E"
  );

  /*
  Very small movement.
  Can be removed entirely if an old Safari
  still behaves badly.
  */

  animation:
    grainMove
    .50s
    steps(2)
    infinite;

}


/* =========================================================
   UI
   ========================================================= */

#ui{

  position:fixed;

  inset:0;

  z-index:20;

  height:
    calc(
      var(--vh)
      *
      100
    );

  display:flex;

  flex-direction:column;

  justify-content:space-between;

  padding:

    max(
      24px,
      env(safe-area-inset-top)
    )

    max(
      24px,
      env(safe-area-inset-right)
    )

    max(
      24px,
      env(safe-area-inset-bottom)
    )

    max(
      24px,
      env(safe-area-inset-left)
    );

  transition:
    opacity
    1.8s
    ease;

}

#ui.hide{

  opacity:0;

  pointer-events:none;

}


/* =========================================================
   MICRO UI
   ========================================================= */

.top,
.bottom{

  display:flex;

  justify-content:space-between;

  align-items:center;

  gap:20px;

  font-size:10px;

  letter-spacing:.22em;

  text-transform:uppercase;

  color:var(--muted);

  text-shadow:var(--shadow);

}


/* =========================================================
   SCREEN
   ========================================================= */

#screenWrap{

  width:
    min(
      960px,
      100%
    );

  margin:auto;

  position:relative;

}

#screenWrap::before{

  content:"";

  position:absolute;

  z-index:-1;

  inset:
    -80px
    -90px;

  pointer-events:none;

  opacity:.48;

  /*
  Static blur. Safe.
  */

  filter:
    blur(30px);

  background:

    radial-gradient(
      ellipse,

      rgba(0,0,0,.52),

      rgba(0,0,0,.20)
      62%,

      rgba(0,0,0,0)
      83%
    );

}


/* =========================================================
   PURE OPACITY CROSSFADE
   ========================================================= */

#screen{

  position:relative;

  opacity:1;

  transition:
    opacity
    1.75s
    cubic-bezier(.45,0,.25,1);

  will-change:
    opacity;

}

#screen.fade{

  opacity:0;

}


/* =========================================================
   TYPOGRAPHY
   ========================================================= */

.eyebrow{

  margin-bottom:24px;

  font-size:10px;

  letter-spacing:.24em;

  text-transform:uppercase;

  color:
    rgba(255,255,255,.54);

  text-shadow:var(--shadow);

}

h1{

  font-size:
    clamp(
      56px,
      13vw,
      116px
    );

  line-height:.84;

  letter-spacing:-.055em;

  font-weight:400;

  text-shadow:var(--shadow);

}

h2{

  max-width:930px;

  font-size:
    clamp(
      30px,
      7vw,
      64px
    );

  line-height:1.02;

  letter-spacing:-.038em;

  font-weight:400;

  text-shadow:var(--shadow);

}

.introText{

  max-width:740px;

  margin-top:28px;

  font-size:
    clamp(
      18px,
      2.8vw,
      29px
    );

  line-height:1.35;

  letter-spacing:-.015em;

  text-shadow:var(--shadow);

}

.introMeta{

  max-width:680px;

  margin-top:27px;

  font-size:12px;

  line-height:1.65;

  color:
    rgba(255,255,255,.54);

  text-shadow:var(--shadow);

}

.sub{

  max-width:650px;

  margin-top:22px;

  font-size:14px;

  line-height:1.55;

  color:
    rgba(255,255,255,.56);

  text-shadow:var(--shadow);

}

.contextTrace{

  max-width:640px;

  margin-top:22px;

  font-size:11px;

  line-height:1.55;

  letter-spacing:.06em;

  color:
    rgba(255,255,255,.27);

  text-shadow:var(--shadow);

}


/* =========================================================
   LANGUAGE
   ========================================================= */

.langs{

  display:grid;

  grid-template-columns:
    1fr
    1fr
    1fr;

  gap:1px;

  margin-top:52px;

  background:
    rgba(255,255,255,.16);

}

button{

  appearance:none;

  border:0;

  background:
    rgba(0,0,0,.80);

  color:#fff;

  font:inherit;

  cursor:pointer;

  text-shadow:var(--shadow);

}

.langs button{

  height:82px;

  font-size:13px;

  letter-spacing:.18em;

}

button:hover{

  background:#fff;

  color:#000;

  text-shadow:none;

}


/* =========================================================
   INPUTS
   ========================================================= */

textarea,
input{

  width:100%;

  border:0;

  border-bottom:
    1px solid
    rgba(255,255,255,.19);

  outline:0;

  background:
    rgba(0,0,0,.07);

  color:#fff;

  font:inherit;

  caret-color:#fff;

  border-radius:0;

  text-shadow:var(--shadow);

}

textarea{

  min-height:210px;

  margin-top:30px;

  padding:
    16px
    0
    20px;

  resize:none;

  font-size:
    clamp(
      20px,
      4.2vw,
      33px
    );

  line-height:1.38;

}

input{

  margin-top:34px;

  padding:
    18px
    0
    20px;

  font-size:
    clamp(
      25px,
      5vw,
      44px
    );

  letter-spacing:-.02em;

}

textarea::placeholder,
input::placeholder{

  color:
    rgba(255,255,255,.17);

}


/* =========================================================
   ACTIONS
   ========================================================= */

.actions{

  margin-top:34px;

  display:flex;

  justify-content:space-between;

  align-items:center;

  gap:18px;

}

.back,
.next{

  font-size:10px;

  letter-spacing:.18em;

  text-transform:uppercase;

}

.back{

  background:transparent;

  color:var(--muted);

  padding:16px 0;

}

.next{

  min-width:150px;

  padding:
    17px
    20px;

  border:
    1px solid
    rgba(255,255,255,.26);

  transition:.42s;

}

.received{

  margin-top:34px;

  font-size:11px;

  letter-spacing:.21em;

  text-transform:uppercase;

  color:
    rgba(255,255,255,.56);

  text-shadow:var(--shadow);

}

.colorHint{

  margin-top:15px;

  font-size:10px;

  line-height:1.5;

  letter-spacing:.15em;

  text-transform:uppercase;

  color:
    rgba(255,255,255,.36);

  text-shadow:var(--shadow);

}


/* =========================================================
   DREAM SHIFT
   ========================================================= */

#dreamShift{

  position:fixed;

  inset:0;

  z-index:150;

  pointer-events:none;

  display:flex;

  justify-content:center;

  align-items:center;

  opacity:0;

  background:#000;

}

#dreamShift.active{

  animation:
    dreamShift
    10.4s
    ease
    forwards;

}

.dreamShiftWrap{

  width:
    min(
      760px,
      88vw
    );

  text-align:center;

}

#dreamShiftMain{

  font-size:
    clamp(
      38px,
      9vw,
      92px
    );

  line-height:.9;

  letter-spacing:-.055em;

  font-weight:400;

  text-shadow:var(--shadow);

}

#dreamShiftSub{

  margin-top:28px;

  font-size:10px;

  line-height:1.6;

  letter-spacing:.22em;

  text-transform:uppercase;

  color:
    rgba(255,255,255,.48);

  text-shadow:var(--shadow);

}

#dreamShiftMain,
#dreamShiftSub{

  opacity:1;

  transition:
    opacity
    1.65s
    ease;

}

#dreamShiftMain.shiftFade,
#dreamShiftSub.shiftFade{

  opacity:0;

}


/* =========================================================
   FINAL
   ========================================================= */

#whiteBloom{

  position:fixed;

  inset:-30%;

  z-index:200;

  pointer-events:none;

  opacity:0;

  transform:
    scale(.2);

  filter:
    blur(60px);

  background:

    radial-gradient(
      circle at 50% 50%,

      rgba(255,255,255,1)
      0%,

      rgba(255,255,255,.96)
      16%,

      rgba(255,255,255,.63)
      35%,

      rgba(255,255,255,.14)
      55%,

      rgba(255,255,255,0)
      74%
    );

}

#whiteBloom.active{

  animation:
    bloom
    5.9s
    cubic-bezier(.22,.62,.22,1)
    forwards;

}

#whiteout{

  position:fixed;

  inset:0;

  z-index:201;

  pointer-events:none;

  opacity:0;

  background:#fff;

}

#whiteout.active{

  animation:
    whiteout
    6s
    cubic-bezier(.22,.62,.22,1)
    forwards;

}

#finalInvite{

  position:fixed;

  inset:0;

  z-index:220;

  display:flex;

  align-items:center;

  justify-content:center;

  background:#000;

  opacity:0;

  pointer-events:none;

  padding:

    max(
      30px,
      env(safe-area-inset-top)
    )

    max(
      28px,
      env(safe-area-inset-right)
    )

    max(
      30px,
      env(safe-area-inset-bottom)
    )

    max(
      28px,
      env(safe-area-inset-left)
    );

}

#finalInvite.active{

  animation:
    finalIn
    2.9s
    ease
    forwards;

}

.finalGrid{

  width:
    min(
      1100px,
      100%
    );

  display:grid;

  grid-template-columns:
    minmax(
      180px,
      280px
    )
    1fr;

  gap:
    clamp(
      50px,
      8vw,
      120px
    );

  align-items:end;

}

.logoBlock img{

  display:block;

  width:
    min(
      100%,
      260px
    );

  height:auto;

}

.finalCopy{

  max-width:760px;

}

.finalLabel{

  margin-bottom:32px;

  font-size:10px;

  letter-spacing:.24em;

  text-transform:uppercase;

  color:
    rgba(255,255,255,.42);

}

#finalTitle{

  font-size:
    clamp(
      32px,
      5.8vw,
      70px
    );

  line-height:1.02;

  letter-spacing:-.04em;

  font-weight:400;

}

.finalRule{

  width:100%;

  height:1px;

  margin:
    42px
    0
    24px;

  background:
    rgba(255,255,255,.21);

}

.finalDetails{

  display:flex;

  justify-content:space-between;

  gap:30px;

  font-size:11px;

  letter-spacing:.18em;

  text-transform:uppercase;

  color:
    rgba(255,255,255,.63);

}


/* =========================================================
   =========================================================
   STABLE ANIMATIONS
   =========================================================
   ========================================================= */


/*
Perceptual focus effect:

When clear SVG becomes stronger,
soft SVG becomes weaker.

NO blur animation.
*/

@keyframes softDreamPresence{

  0%{
    opacity:.62;
  }

  17%{
    opacity:.58;
  }

  34%{
    opacity:.40;
  }

  47%{
    opacity:.29;
  }

  59%{
    opacity:.38;
  }

  73%{
    opacity:.61;
  }

  88%{
    opacity:.70;
  }

  100%{
    opacity:.62;
  }

}


@keyframes clearDreamPresence{

  0%{
    opacity:.34;
  }

  17%{
    opacity:.43;
  }

  34%{
    opacity:.67;
  }

  47%{
    opacity:.79;
  }

  59%{
    opacity:.69;
  }

  73%{
    opacity:.43;
  }

  88%{
    opacity:.28;
  }

  100%{
    opacity:.34;
  }

}


/* =========================================================
   MORPH A
   ========================================================= */

@keyframes slowMorphA{

  0%{

    transform:
      translate3d(
        -0.3%,
        0.2%,
        0
      )
      scaleX(.95)
      scaleY(1.035);

  }

  33%{

    transform:
      translate3d(
        0.2%,
        -0.4%,
        0
      )
      scaleX(1.015)
      scaleY(.985);

  }

  67%{

    transform:
      translate3d(
        0.5%,
        0.3%,
        0
      )
      scaleX(.98)
      scaleY(1.055);

  }

  100%{

    transform:
      translate3d(
        -0.2%,
        -0.2%,
        0
      )
      scaleX(1.035)
      scaleY(.965);

  }

}


/* =========================================================
   MORPH B
   ========================================================= */

@keyframes slowMorphB{

  0%{

    transform:
      translate3d(
        .3%,
        -.2%,
        0
      )
      scaleX(1.025)
      scaleY(.97);

  }

  40%{

    transform:
      translate3d(
        -.35%,
        .25%,
        0
      )
      scaleX(.965)
      scaleY(1.04);

  }

  72%{

    transform:
      translate3d(
        .15%,
        -.3%,
        0
      )
      scaleX(1.04)
      scaleY(.98);

  }

  100%{

    transform:
      translate3d(
        -.15%,
        .15%,
        0
      )
      scaleX(.985)
      scaleY(1.03);

  }

}


/* =========================================================
   MORPH C
   ========================================================= */

@keyframes slowMorphC{

  0%{

    transform:
      scaleX(.97)
      scaleY(1.025);

  }

  28%{

    transform:
      scaleX(1.03)
      scaleY(.98);

  }

  62%{

    transform:
      scaleX(.985)
      scaleY(1.045);

  }

  100%{

    transform:
      scaleX(1.025)
      scaleY(.97);

  }

}


/* =========================================================
   MORPH D
   ========================================================= */

@keyframes slowMorphD{

  0%{

    transform:
      scaleX(1.02)
      scaleY(.975);

  }

  37%{

    transform:
      scaleX(.965)
      scaleY(1.045);

  }

  71%{

    transform:
      scaleX(1.035)
      scaleY(.985);

  }

  100%{

    transform:
      scaleX(.985)
      scaleY(1.025);

  }

}


/* =========================================================
   VEIL
   ========================================================= */

@keyframes veilBreath{

  from{

    transform:
      translate3d(
        -.6%,
        .3%,
        0
      )
      scale(1);

  }

  to{

    transform:
      translate3d(
        .8%,
        -.5%,
        0
      )
      scale(1.014);

  }

}


/* =========================================================
   GRAIN
   ========================================================= */

@keyframes grainMove{

  0%{
    transform:translate(0,0);
  }

  50%{
    transform:translate(-2%,1%);
  }

  100%{
    transform:translate(1%,-2%);
  }

}


/* =========================================================
   GHOST
   ========================================================= */

@keyframes ghostMove{

  0%{

    opacity:0;

    transform:
      translate3d(
        -1vw,
        1vh,
        0
      );

  }

  22%{

    opacity:1;

  }

  74%{

    opacity:.56;

  }

  100%{

    opacity:0;

    transform:
      translate3d(
        2vw,
        -1.2vh,
        0
      );

  }

}


/* =========================================================
   DREAM SHIFT
   ========================================================= */

@keyframes dreamShift{

  0%{
    opacity:0;
  }

  13%{
    opacity:1;
  }

  87%{
    opacity:1;
  }

  100%{
    opacity:0;
  }

}


/* =========================================================
   FINAL
   ========================================================= */

@keyframes bloom{

  0%{

    opacity:0;

    transform:
      scale(.2);

  }

  42%{

    opacity:.14;

  }

  74%{

    opacity:.62;

    transform:
      scale(1);

  }

function escapeHtml(value){

  return String(
    value || ""
  )
  .replace(
    /[&<>"']/g,
    c=>({

      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      "\"":"&quot;",
      "'":"&#039;"

    }[c])
  );

}


function randomItem(array){

  return array[
    Math.floor(
      Math.random() *
      array.length
    )

function normalizeText(text){

/* =========================================================
   INTRO NAV
   ========================================================= */

function introBack(){

  if(
    transitionRunning
  ){
    return;
  }


  if(
    state.introStep ===
    0
  ){

    transition(
      renderStart
    );

    return;

  }


  saveColorField();


  state.introStep--;


  transition(
    renderIntro
  );

}


function introNext(){

  if(
    transitionRunning
  ){
    return;
  }


  saveColorField();


  const slides =
    INTRO[
      state.lang
    ];


  if(
    state.introStep <
    slides.length-1
  ){

    state.introStep++;


    transition(
      renderIntro
    );

  }
  else{

    state.questionIndex =
      0;


    if(
      !state.generatedQuestions[0]
    ){

      state.generatedQuestions[0] =
        generateOpeningQuestion();

    }


    transition(
      renderQuestion
    );

  }

}

/* =========================================================
   EXTRACT FRAGMENT
   ========================================================= */

function extractFragment(text){

  const cleaned =
    normalizeText(
      text
    );


  if(
    !cleaned
  ){
    return "";
  }


  const words =
    cleaned
    .split(/\s+/)
    .filter(Boolean);


  if(
    words.length <=
    8
  ){

    return cleaned;

  }


  const startOptions = [

    0,

    Math.floor(
      words.length*.20
    ),

    Math.floor(
      words.length*.40
    ),

    Math.max(
      0,
      words.length-8
    )

  ];


  const start =
    randomItem(
      startOptions
    );


  return words
  .slice(
    start,
    start+8
  )
  .join(" ");

}

/* =========================================================
   ADAPTIVE QUESTION
   ========================================================= */

function generateAdaptiveQuestion(){

  const i =
    state.questionIndex;


  const previous =
    state.answers[
      i-1
    ];


  const previousAnswer =
    previous
      ?
      previous.answer
      :
      "";


  const fragment =
    extractFragment(
      previousAnswer
    );


  const themes =
    detectThemes(
      previousAnswer
    );


  if(
    i <= 2
  ){

    return generateLayerOneQuestion(
      fragment,
      themes
    );

  }


  if(
    i <= 5
  ){

    return generateLayerTwoQuestion(
      fragment,
      themes
    );

  }


  return generateLayerThreeQuestion(
    fragment,
    themes
  );

}

        category:"ЛОГІКА СНУ",
        question:
          "Яка частина цього сну здавалася цілком нормальною під час сновидіння, але після пробудження стала неможливою?"
      },

      {
        category:"ЗВ’ЯЗОК",
        question:
          `Якби «${f}» могло щось передати без слів, що воно намагалося б показати?`
      },

      {
        category:"ЧАС",
        question:
          "Чи справді події відбувалися одна за одною? Опиши, як поводився час усередині цього сну."
      }

    ];


    if(
      themes.includes(
        "water"
      )
    ){

      pool.push(
        {
          category:"ВОДА",
          question:
            "У цьому сні з’являється вода. Вона була простором, межею, силою, загрозою чи чимось зовсім іншим?"
        }
      );

    }


    if(
      themes.includes(
        "door"
      )
    ){

      pool.push(
        {
          category:"ПЕРЕХІД",
          question:
            "У сні з’являється мотив переходу. Що могло бути по той бік, навіть якщо дістатися туди не вдалося?"
        }
      );

    }


    if(
      themes.includes(
        "fear"
      )
    ){

      pool.push(
        {
          category:"НАПРУЖЕННЯ",
          question:
            "Не описуй сам страх. Спробуй описати його джерело — де знаходилося напруження ще до того, як стало емоцією?"
        }
      );

    }


    return randomItem(
      pool
    );

  }


  const pool = [

    {
      category:"TRANSFORMATION",
      question:
        `Imagine that “${f}” is not fixed. What might begin changing shape if the dream continued for several more minutes?`
    },

    {
      category:"OUTSIDE THE FRAME",
      question:
        "What might have existed just beyond what you remember — something unseen but unmistakably present?"
    },

    {
      category:"DREAM LOGIC",
      question:
        "Which part of the dream felt completely normal while dreaming, but became impossible only after waking?"
    },

    {
      category:"RELATION",
      question:
        `If “${f}” could communicate without using words, what might it be trying to show you?`
    },

    {
      category:"TIME",
      question:
        "Did the events really happen one after another? Describe how time behaved inside this dream."
    }

  ];


  if(
    themes.includes(
      "fear"
    )
  ){

    pool.push(
      {
        category:"TENSION",
        question:
          "Do not describe the fear itself. Describe its source — where did the tension exist before it became an emotion?"
      }
    );

  }


  return randomItem(
    pool
  );

}

/* =========================================================
   CURRENT QUESTION
   ========================================================= */

function getCurrentQuestion(){

  return state
  .generatedQuestions[
    state.questionIndex
  ];

}


/* =========================================================
   DREAM LEVEL
   ========================================================= */

function getDreamLevel(){

  if(
    state.questionIndex <=
    2
  ){
    return 0;
  }


  if(
    state.questionIndex <=
    5
  ){
    return 1;
  }


  return 2;

}


/* =========================================================
   RENDER QUESTION
   ========================================================= */

function renderQuestion(){

  setVisualMode(
    "questions"
  );


  const copy =
    UI[
      state.lang
    ];


  const q =
    getCurrentQuestion();


  if(!q){
    return;
  }


  const saved =
    state.answers[
      state.questionIndex
    ];


  const level =
    getDreamLevel();


  progress.textContent =
    `${String(
      state.questionIndex+1
    ).padStart(
      2,
      "0"
    )}
    /
    ${String(
      state.totalQuestions
    ).padStart(
      2,
      "0"
    )}`;


  depthLabel.textContent =
    `TRAUM ${level}`;


  let trace =
    "";


  if(
    state.questionIndex >
    0
  ){

    const previous =
      state.answers[
        state.questionIndex-1
      ];


    if(
      previous &&
      previous.answer
    ){

      const fragment =
        extractFragment(
          previous.answer
        );


      if(fragment){

        trace = `

<div class="contextTrace">
${escapeHtml(
  fragment
)}
</div>

`;

      }

    }

  }


  screen.innerHTML = `

<div class="eyebrow">
${escapeHtml(
  q.category
)}
</div>

<h2>
${escapeHtml(
  q.question
)}
</h2>

${trace}

<textarea
id="answer"
placeholder="${copy.placeholder}"
>${escapeHtml(
  saved
    ?
    saved.answer
    :
    ""
)}</textarea>

<div class="actions">

<button
class="back"
onclick="questionBack()"
>
${copy.back}
</button>

<button
class="next"
onclick="questionNext()"
>
${copy.next}
</button>

</div>

`;


  spawnPreviousAnswerGhost();


  setTimeout(
    ()=>{

      document
      .getElementById(
        "answer"
      )
      ?.focus();

    },
    400
  );

}


/* =========================================================
   SAVE ANSWER
   ========================================================= */

function saveCurrentAnswer(){

  const field =
    document
    .getElementById(
      "answer"
    );


  if(!field){
    return;
  }


  const q =
    getCurrentQuestion();


  state.answers[
    state.questionIndex
  ]
  =
  {

    level:
      getDreamLevel(),

    category:
      q.category,

    question:
      q.question,

    answer:
      normalizeText(
        field.value
      )

  };

}


/* =========================================================
   NEXT
   ========================================================= */

function questionNext(){

  if(
    transitionRunning ||
    dreamShiftRunning
  ){
    return;
  }


  saveCurrentAnswer();


  const current =
    state.answers[
      state.questionIndex
    ];


  if(
    !current ||
    !current.answer
  ){

    const field =
      document
      .getElementById(
        "answer"
      );


    if(field){

      field.focus();


      field.style.borderBottomColor =
        "rgba(255,255,255,.68)";


      setTimeout(
        ()=>{

          field.style.borderBottomColor =
            "rgba(255,255,255,.19)";

        },
        900
      );

    }


    return;

  }


  if(
    state.questionIndex ===
    state.totalQuestions-1
  ){

    transition(
      renderNickname
    );

    return;

  }


  if(
    state.questionIndex ===
    2
  ){

    state.questionIndex++;


    if(
      !state.generatedQuestions[
        state.questionIndex
      ]
    ){

      state.generatedQuestions[
        state.questionIndex
      ]
      =
      generateAdaptiveQuestion();

    }


    runDreamShift(
      1
    );


    return;

  }


  if(
    state.questionIndex ===
    5
  ){

    state.questionIndex++;


    if(
      !state.generatedQuestions[
        state.questionIndex
      ]
    ){

      state.generatedQuestions[
        state.questionIndex
      ]
      =
      generateAdaptiveQuestion();

    }


    runDreamShift(
      2
    );


    return;

  }


  state.questionIndex++;


  if(
    !state.generatedQuestions[
      state.questionIndex
    ]
  ){

    state.generatedQuestions[
      state.questionIndex
    ]
    =
    generateAdaptiveQuestion();

  }


  transition(
    renderQuestion
  );

}


/* =========================================================
   BACK
   ========================================================= */

function questionBack(){

  if(
    transitionRunning ||
    dreamShiftRunning
  ){
    return;
  }


  saveCurrentAnswer();


  if(
    state.questionIndex ===
    0
  ){

    state.introStep =
      INTRO[
        state.lang
      ]
      .length-1;


    transition(
      renderIntro
    );


    return;

  }


  state.questionIndex--;


  transition(
    renderQuestion
  );

}

/* =========================================================
   ANSWER GHOST
   ========================================================= */

function spawnPreviousAnswerGhost(){

  if(
    state.questionIndex ===
    0
  ){
    return;
  }


  const previous =
    state.answers
    .filter(
      a =>
        a &&
        a.answer &&
        a.answer.length > 2
    );


  if(
    !previous.length
  ){
    return;
  }


  if(
    Math.random() >
    .55
  ){

    const a =
      randomItem(
        previous
      );


    const fragment =
      extractFragment(
        a.answer
      );


    ghost(
      fragment,
      true
    );

  }

}

/* =========================================================
   SAVE DREAM
   ========================================================= */

async function saveDream(){

  if(
    transitionRunning
  ){
    return;
  }


  const field =
    document
    .getElementById(
      "nickname"
    );


  /*
  Do NOT overwrite existing nickname
  during retry.
  */

  if(field){

    const value =
      field
      .value
      .trim();


    if(value){

      state.nickname =
        value;

    }

  }


  if(
    !state.nickname
  ){

    state.nickname =
      "ANONYMOUS";

  }


  const copy =
    UI[
      state.lang
    ];


  const payload = {

    nickname:
      state.nickname,

    language:
      state.lang,

    dreamColor:
      state.dreamColorName,

    answers:
      state.answers,

    dream:
      state.answers
      .map(
        a =>
          a
            ?
            a.answer
            :
            ""
      )
      .join(
        "\n\n"
      )

  };


  transition(
    ()=>{

      setVisualMode(
        "saving"
      );


      progress.textContent =
        "";


      depthLabel.textContent =
        "ARCHIVE";


      screen.innerHTML = `

<div class="eyebrow">
TRAUM SIM
</div>

<h2>
${copy.saving}
</h2>

<p class="sub">
...
</p>

`;

    }
  );


  try{

    const response =
      await fetch(
        API_URL,
        {

          method:"POST",

          headers:{
            "Content-Type":
              "text/plain;charset=utf-8"
          },

          body:
            JSON.stringify(
              payload
            )

        }
      );


    if(
      !response.ok
    ){

      throw new Error(
        "HTTP " +
        response.status
      );

    }


    const data =
      await response.json();


    if(
      !data.ok
    ){

      throw new Error(
        data.error ||
        "Backend error"
      );

    }


    renderSaved(
      data.dreamId
    );

  }
  catch(error){

    console.error(
      "TRAUM SAVE ERROR",
      error
    );


    renderError();

  }

}

  }


  const show =
    ()=>{

      if(
        transitionRunning
      ){

        setTimeout(
          show,
          200
        );

        return;

      }


      transition(
        ()=>{

          setVisualMode(
            "error"
          );


          screen.innerHTML = `

<div class="eyebrow">
TRAUM SIM
</div>

<h2>
${copy.error}
</h2>

<p class="sub">
${message}
</p>

<div class="actions">

<span></span>

<button
class="next"
onclick="saveDream()"
>
${copy.retry}
</button>

</div>

`;

        }
      );

    };


  show();

}


/* =========================================================
   FINAL
   ========================================================= */

function startFinalSequence(){

  const ui =
    document
    .getElementById(
      "ui"
    );


  const bloom =
    document
    .getElementById(
      "whiteBloom"
    );


  const whiteout =
    document
    .getElementById(
      "whiteout"
    );


  const final =
    document
    .getElementById(
      "finalInvite"
    );


  ui
  .classList
  .add(
    "hide"
  );


  setTimeout(
    ()=>{

      bloom
      .classList
      .add(
        "active"
      );


      whiteout
      .classList
      .add(
        "active"
      );

    },
    1300
  );


  setTimeout(
    ()=>{

      document
      .getElementById(
        "finalTitle"
      )
      .textContent =
        UI[
          state.lang
        ]
        .invite;


      final
      .classList
      .add(
        "active"
      );

    },
    7500
  );


  setTimeout(
    ()=>{

      bloom.style.display =
        "none";


      whiteout.style.display =
        "none";

    },
    8150
  );

}


/* =========================================================
   GHOST
   ========================================================= */

function ghost(
  text,
  answer=false
){

  if(!text){
    return;
  }


  const e =
    document
    .createElement(
      "div"
    );


  e.className =
    answer
      ?
      "ghost answerGhost"
      :
      "ghost";


  e.textContent =
    text;


  e.style.left =
    (
      Math.random()*55
      -
      5
    )
    +
    "vw";


  e.style.top =
    (
      Math.random()*75
      +
      8
    )
    +
    "vh";


  e.style.animationDuration =
    (
      29
      +
      Math.random()*25
    )
    +
    "s";


  ghostLayer
  .appendChild(
    e
  );


  setTimeout(
    ()=>{

      e.remove();

    },
    56000
  );

}


/* =========================================================
   INIT
   ========================================================= */

applyDreamColor();

renderStart();

</script>
