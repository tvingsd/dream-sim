<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>DREAM SIM — PATCHLAB 2026</title>

<style>
:root{
  --vh:1vh;
  --fg:#f4f4f4;
  --muted:rgba(255,255,255,.42);
  --line:rgba(255,255,255,.20);
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  color:var(--fg);
  font-family:Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  -webkit-text-size-adjust:none;
}

body{
  min-height:calc(var(--vh)*100);
}

#dreamCanvas{
  position:fixed;
  inset:-10%;
  width:120%;
  height:120%;
  filter:blur(20px) contrast(145%);
  opacity:.88;
  transform:scale(1.06);
}

#fog{
  position:fixed;
  inset:-20%;
  pointer-events:none;
  background:
    radial-gradient(circle at 30% 40%,rgba(255,255,255,.065),transparent 20%),
    radial-gradient(circle at 75% 55%,rgba(255,255,255,.04),transparent 22%),
    radial-gradient(circle at 50% 80%,rgba(255,255,255,.025),transparent 26%);
  mix-blend-mode:screen;
  animation:fogMove 22s ease-in-out infinite alternate;
}

#grain{
  position:fixed;
  inset:-50%;
  pointer-events:none;
  opacity:.05;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  animation:grain .22s steps(2) infinite;
}

#ghostLayer{
  position:fixed;
  inset:0;
  z-index:3;
  pointer-events:none;
  overflow:hidden;
}

.ghost{
  position:absolute;
  font-size:clamp(26px,8vw,110px);
  line-height:.9;
  letter-spacing:-.05em;
  color:rgba(255,255,255,.042);
  filter:blur(7px);
  white-space:nowrap;
  animation:ghostDrift linear forwards;
}

#ui{
  position:fixed;
  inset:0;
  z-index:20;
  height:calc(var(--vh)*100);
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  padding:
    max(24px,env(safe-area-inset-top))
    max(22px,env(safe-area-inset-right))
    max(24px,env(safe-area-inset-bottom))
    max(22px,env(safe-area-inset-left));
}

.top,.bottom{
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:10px;
  letter-spacing:.19em;
  text-transform:uppercase;
  color:var(--muted);
}

#screen{
  width:min(900px,100%);
  margin:auto;
  transition:
    opacity 1.25s ease,
    transform 1.45s ease,
    filter 1.25s ease;
}

#screen.fade{
  opacity:0;
  transform:translateY(11px) scale(1.012);
  filter:blur(12px);
}

.eyebrow{
  margin-bottom:24px;
  font-size:10px;
  letter-spacing:.24em;
  color:var(--muted);
  text-transform:uppercase;
}

h1{
  font-weight:400;
  font-size:clamp(52px,12vw,108px);
  line-height:.84;
  letter-spacing:-.055em;
}

h2{
  font-weight:400;
  font-size:clamp(31px,7vw,64px);
  line-height:1.02;
  letter-spacing:-.035em;
  max-width:900px;
}

.sub{
  margin-top:22px;
  max-width:620px;
  color:rgba(255,255,255,.52);
  font-size:14px;
  line-height:1.52;
}

.langs{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:1px;
  margin-top:50px;
  background:var(--line);
}

button{
  appearance:none;
  border:0;
  background:rgba(0,0,0,.86);
  color:#fff;
  font:inherit;
  cursor:pointer;
}

.langs button{
  height:82px;
  font-size:14px;
  letter-spacing:.17em;
}

.langs button:hover,
.next:hover{
  background:#fff;
  color:#000;
}

.question{
  position:relative;
}

.dreamword{
  display:inline-block;
  transition:filter 3s ease,opacity 3s ease;
}

.dreamword.blur{
  filter:blur(7px);
  opacity:.72;
}

.dreamword.deepblur{
  filter:blur(14px);
  opacity:.35;
}

.dreamword.float{
  transform:translateY(-.08em);
}

textarea{
  width:100%;
  min-height:190px;
  margin-top:30px;
  border:0;
  border-bottom:1px solid var(--line);
  outline:0;
  background:rgba(0,0,0,.05);
  color:#fff;
  resize:none;
  padding:16px 0 20px;
  font:inherit;
  font-size:clamp(20px,4.5vw,34px);
  line-height:1.35;

}

textarea::placeholder{

}

.actions{

  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
}

.back,.next{
  text-transform:uppercase;
  letter-spacing:.17em;
  font-size:10px;
}

.back{
  color:var(--muted);
  background:transparent;
  padding:16px 0;
}

.next{
  border:1px solid rgba(255,255,255,.25);
  padding:17px 20px;
  min-width:150px;
  transition:.45s;
}

.received{
  margin-top:34px;
  color:var(--muted);
  font-size:11px;
  letter-spacing:.21em;
  text-transform:uppercase;
}

#errorBox{
  margin-top:28px;
  color:rgba(255,255,255,.55);
  font-size:12px;
  line-height:1.5;
}

#whiteBloom{

  inset:-30%;
  z-index:200;
  pointer-events:none;
  opacity:0;
  transform:scale(.22);
  filter:blur(55px);
  background:radial-gradient(circle at 50% 50%,
    rgba(255,255,255,1) 0%,
    rgba(255,255,255,.96) 16%,
    rgba(255,255,255,.64) 34%,
    rgba(255,255,255,.14) 55%,
    rgba(255,255,255,0) 72%);
}

#whiteBloom.active{
  animation:bloom 5s cubic-bezier(.22,.62,.22,1) forwards;
}

#whiteout{
  position:fixed;
  inset:0;
  z-index:201;
  pointer-events:none;
  background:#fff;
  opacity:0;
}

#whiteout.active{
  animation:whiteout 5.25s cubic-bezier(.22,.62,.22,1) forwards;
}

#finalInvite{

  inset:0;
  z-index:220;

@keyframes fogMove{
  from{

  }
  to{

  }

@keyframes grain{
  0%{transform:translate(0,0)}

  50%{transform:translate(-4%,2%)}
  75%{transform:translate(2%,4%)}
  100%{transform:translate(-2%,-4%)}
}

@keyframes ghostDrift{
  0%{
    opacity:0;
    transform:translate3d(-4vw,3vh,0) scale(.97);
    filter:blur(12px);
  }
  18%{
    opacity:1;
  }
  68%{
    opacity:.7;
  }
  100%{
    opacity:0;
    transform:translate3d(6vw,-4vh,0) scale(1.06);
    filter:blur(22px);
  }

@keyframes bloom{
  0%{
    opacity:0;
    transform:scale(.2);
  }
  40%{
    opacity:.16;
  }
  72%{
    opacity:.62;
    transform:scale(1);
  }
  100%{
    opacity:1;
    transform:scale(1.9);
  }
}

@keyframes whiteout{
  0%{
    opacity:0;
  }
  55%{
    opacity:.05;
  }
  80%{
    opacity:.36;
  }
  100%{
    opacity:1;
  }
}

@keyframes finalIn{
  0%{
    opacity:0;
    filter:blur(14px);
    transform:scale(1.015);
  }
  100%{
    opacity:1;
    filter:blur(0);
    transform:scale(1);
  }
}

</style>
</head>

/* =========================================================
   QUESTION SYSTEM
   ========================================================= */

function shuffle(a){
  return [...a]
    .sort(()=>Math.random()-.5);
}

function pickQuestions(lang){

  const bank =
    lang==="PL"
      ? QUESTIONS_PL
      : QUESTIONS_EN;

  const shuffled =
    shuffle(bank);

  const picked=[];
  const used=new Set();

  for(const q of shuffled){

    if(
      !used.has(q[0]) ||
      picked.length>4
    ){
      picked.push(q);
      used.add(q[0]);
    }

    if(
      picked.length===
      state.total
    ){
      break;
    }

  }

  return picked;
}


/* =========================================================
   TRANSITIONS

function transition(fn){

  screen.classList.add("fade");

  setTimeout(()=>{

    fn();

    requestAnimationFrame(()=>{
      screen.classList.remove("fade");
    });

  },720);

}

      choose language / wybierz język
    </p>

    <div class="langs">

      <button onclick="chooseLang('PL')">
        PL
      </button>

      <button onclick="chooseLang('ENG')">
        ENG
      </button>

    </div>

  `;

}


/* =========================================================
   LANGUAGE
   ========================================================= */

function chooseLang(lang){

  state.lang=lang;
  state.step=0;
  state.answers=[];

  state.questions=
    pickQuestions(lang);

  transition(
    renderQuestion
  );

}


/* =========================================================
   SURREAL WORD EFFECT
   ========================================================= */

function surrealize(text){

  const words =
    text.split(" ");

  return words.map((w)=>{

    let cls="dreamword";

    const r=
      Math.random();

    if(r<.12){
      cls+=" deepblur";
    }
    else if(r<.27){
      cls+=" blur";
    }

    if(Math.random()<.12){
      cls+=" float";
    }

    return `
      <span class="${cls}">
        ${escapeHtml(w)}
      </span>
    `;

  }).join(" ");

}


/* =========================================================
   QUESTION RENDER
   ========================================================= */

function renderQuestion(){

  const t=
    uiText[state.lang];

  const q=
    state.questions[state.step];

  progress.textContent=
    `${String(state.step+1).padStart(2,"0")} / ${String(state.total).padStart(2,"0")}`;

  screen.innerHTML=`

    <div class="question">

      <div class="eyebrow">
        ${q[0]}
      </div>

      <h2>
        ${surrealize(q[1])}
      </h2>

      <textarea
        id="answer"
        placeholder="${t.placeholder}"
      >${escapeHtml(state.answers[state.step]||"")}</textarea>

      <div class="actions">

        <button
          class="back"
          onclick="goBack()"
        >
          ${t.back}
        </button>

        <button
          class="next"
          onclick="goNext()"
        >

          ${
            state.step===
            state.total-1
              ? t.submit
              : t.next
          }

        </button>

      </div>

    </div>

  `;

  animateBlurWords();

  ghost(q[0]);

  setTimeout(()=>{

    document
      .getElementById("answer")
      ?.focus();

  },500);

}


/* =========================================================
   BLUR WORDS
   ========================================================= */

function animateBlurWords(){

  const words=
    [...document.querySelectorAll(".dreamword")];

  setInterval(()=>{

    if(!words.length){
      return;
    }

    const w=
      words[
        Math.floor(
          Math.random()*
          words.length
        )
      ];

    w.classList.toggle(
      "blur"
    );

  },1800+Math.random()*1000);

}


/* =========================================================
   ANSWERS
   ========================================================= */

function saveAnswer(){

  const el=
    document.getElementById("answer");

  if(el){
    state.answers[state.step]=
      el.value.trim();
  }

}

function goBack(){

  saveAnswer();

  if(state.step===0){

    state.lang=null;

    transition(
      renderStart
    );

    return;
  }

  state.step--;

  transition(
    renderQuestion
  );

}

function goNext(){

  saveAnswer();

  if(
    state.step<
    state.total-1
  ){

    state.step++;

    transition(
      renderQuestion
    );

  }
  else{

    submitDream();

  }

}


/* =========================================================
   SUBMIT TO GOOGLE
   ========================================================= */

async function submitDream(){

  const t=
    uiText[state.lang];

  const payload={

    language:
      state.lang,

    answers:
      state.questions.map(
        (q,i)=>({
          category:q[0],
          question:q[1],
          answer:
            state.answers[i] || ""
        })
      ),

    dream:
      state.answers.join(
        "\n\n"
      )

  };


  transition(()=>{

    progress.textContent="";

    screen.innerHTML=`

      <div class="eyebrow">
        DREAM SIM
      </div>

      <h2>
        ${t.saving}
      </h2>

      <p class="sub">
        ...
      </p>

    `;

  });


  try{

    const response=
      await fetch(
        API_URL,
        {
          method:"POST",

          headers:{
            "Content-Type":
            "text/plain;charset=utf-8"
          },

          body:
            JSON.stringify(
              payload
            )
        }
      );


    if(!response.ok){

      throw new Error(
        "HTTP " +
        response.status
      );

    }


    const data=
      await response.json();


    if(
      !data.ok
    ){

      throw new Error(
        data.error ||
        "Backend error"
      );

    }


    renderSaved(
      data.dreamId
    );

  }
  catch(error){

    console.error(
      "DREAM SAVE ERROR:",
      error
    );

    renderSaveError(
      error
    );

  }

}


/* =========================================================
   SUCCESS
   ========================================================= */

function renderSaved(dreamId){

  const t=
    uiText[state.lang];

  transition(()=>{

    screen.innerHTML=`

      <div class="eyebrow">
        DREAM SIM
      </div>

      <h2>
        ${t.done}
      </h2>

      <p class="sub">
        ${t.sub}
      </p>

      <div class="received">
        ${dreamId || ""}
      </div>

    `;

  });


  setTimeout(
    startFinalSequence,
    2800
  );

}


/* =========================================================
   SAVE ERROR
   ========================================================= */

function renderSaveError(error){

  const t=
    uiText[state.lang];

  transition(()=>{

    screen.innerHTML=`

      <div class="eyebrow">
        DREAM SIM
      </div>

      <h2>
        ${t.error}
      </h2>

      <div id="errorBox">
        Połączenie z archiwum zostało przerwane.
      </div>

      <div class="actions">

        <span></span>

        <button
          class="next"
          onclick="submitDream()"
        >
          ${t.retry}
        </button>

      </div>

    `;

  });

}


/* =========================================================
   FINAL WHITE BLOOM
   ========================================================= */

function startFinalSequence(){

  const bloom=
    document.getElementById(
      "whiteBloom"
    );

  const whiteout=
    document.getElementById(
      "whiteout"
    );

  const final=
    document.getElementById(
      "finalInvite"
    );


  document
    .getElementById(
      "finalTitle"
    )
    .innerHTML=
      uiText[state.lang]
      .invite;


  bloom.classList.add(
    "active"
  );

  whiteout.classList.add(
    "active"
  );


  setTimeout(()=>{

    final.classList.add(
      "active"
    );

  },5100);


  setTimeout(()=>{

    bloom.style.display=
      "none";

    whiteout.style.display=
      "none";

  },5650);

}


/* =========================================================
   GHOST TEXT
   ========================================================= */

function ghost(text){

  const d=
    document.createElement(
      "div"
    );

  d.className=
    "ghost";

  d.textContent=
    text;

  d.style.left=
    (Math.random()*55-5)
    +"vw";

  d.style.top=
    (Math.random()*75+8)
    +"vh";

  d.style.animationDuration=
    (9+Math.random()*9)
    +"s";

  ghostLayer.appendChild(
    d
  );

  setTimeout(()=>{

    d.remove();

  },19000);

}


/* =========================================================
   HTML ESCAPE
   ========================================================= */

function escapeHtml(s){

  return String(
    s || ""
  ).replace(
    /[&<>"']/g,
    m=>({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      "\"":"&quot;",
      "'":"&#039;"
    }[m])
  );

}


/* =========================================================
   AUTONOMOUS DREAM TRACES
   ========================================================= */

const traces=[

  "REMEMBER",
  "NOT HERE",
  "AGAIN",
  "SOMEWHERE",
  "BEHIND",
  "WAKE",
  "ALMOST",
  "WHO WAS THERE",
  "DON'T LOOK BACK",
  "DREAM"

];

setInterval(()=>{

  if(
    Math.random()>.5
  ){

    ghost(
      traces[
        Math.floor(
          Math.random()*
          traces.length
        )
      ]
    );

  }

},4200);


/* =========================================================
   GENERATIVE DREAM FIELD
   ========================================================= */

const canvas=
  document.getElementById(
    "dreamCanvas"
  );

const ctx=
  canvas.getContext(
    "2d",
    {
      alpha:false
    }
  );

let W;
let H;

let DPR=
  Math.min(
    devicePixelRatio||1,
    1.5
  );

let blobs=[];


function resizeCanvas(){

  W=
    window.innerWidth;

  H=
    window.innerHeight;

  canvas.width=
    W*DPR;

  canvas.height=
    H*DPR;

  ctx.setTransform(
    DPR,
    0,
    0,
    DPR,
    0,
    0
  );


  blobs=
    Array.from(
      {
        length:14
      },
      ()=>({

        x:
          Math.random()*W,

        y:
          Math.random()*H,

        r:
          Math.min(W,H)*
          (.08+Math.random()*.25),

        vx:
          (Math.random()-.5)*.13,

        vy:
          (Math.random()-.5)*.13,

        ph:
          Math.random()*
          Math.PI*2,

        sp:
          .001+
          Math.random()*.0022

      })
    );

}


function draw(t){

  ctx.fillStyle=
    "rgba(0,0,0,.045)";

  ctx.fillRect(
    0,
    0,
    W,
    H
  );


  ctx.globalCompositeOperation=
    "screen";


  blobs.forEach(
    (b,i)=>{

      b.x+=
        b.vx+
        Math.sin(
          t*b.sp+b.ph
        )*.08;

      b.y+=
        b.vy+
        Math.cos(
          t*b.sp*.8+b.ph
        )*.08;


      if(
        b.x<-b.r
      ){
        b.x=W+b.r;
      }

      if(
        b.x>W+b.r
      ){
        b.x=-b.r;
      }

      if(
        b.y<-b.r
      ){
        b.y=H+b.r;
      }

      if(
        b.y>H+b.r
      ){
        b.y=-b.r;
      }


      const rr=
        b.r*
        (
          1+
          Math.sin(
            t*b.sp+b.ph
          )*.15
        );


      const g=
        ctx.createRadialGradient(
          b.x,
          b.y,
          0,
          b.x,
          b.y,
          rr
        );


      const a=
        .045+
        (i%4)*.009;


      g.addColorStop(
        0,
        `rgba(255,255,255,${a})`
      );

      g.addColorStop(
        .4,
        `rgba(255,255,255,${a*.55})`
      );

      g.addColorStop(
        1,
        "rgba(255,255,255,0)"
      );


      ctx.fillStyle=
        g;

      ctx.beginPath();

      ctx.arc(
        b.x,
        b.y,
        rr,
        0,
        Math.PI*2
      );

      ctx.fill();

    }
  );


  /* VORTEX */

  ctx.save();

  ctx.translate(
    W*.5,
    H*.5
  );

  ctx.rotate(
    t*.000035
  );


  for(
    let i=0;
    i<8;
    i++
  ){

    ctx.beginPath();

    const rad=
      Math.min(W,H)*
      (
        .05+
        i*.035
      );


    ctx.strokeStyle=
      `rgba(255,255,255,${.008+i*.002})`;

    ctx.lineWidth=
      1;


    ctx.ellipse(
      0,
      0,
      rad*1.5,
      rad*.55,
      Math.sin(
        t*.00009+i
      )*.4,
      0,
      Math.PI*2
    );

    ctx.stroke();

  }


  ctx.restore();


  ctx.globalCompositeOperation=
    "source-over";


  requestAnimationFrame(
    draw
  );

}


window.addEventListener(
  "resize",
  resizeCanvas
);


resizeCanvas();


ctx.fillStyle=
  "#000";

ctx.fillRect(
  0,
  0,
  W,
  H
);


requestAnimationFrame(
  draw
);


/* =========================================================
   START APP
   ========================================================= */

renderStart();

</script>
