<!DOCTYPE html>
<html lang="pl">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover"
>

<meta name="theme-color" content="#000000">

<title>TRAUM SIM — PATCHLAB 2026</title>

<style>

:root{
  --vh:1vh;
  --fg:#f4f4f0;
  --muted:rgba(255,255,255,.42);
  --quiet:rgba(255,255,255,.18);
  --line:rgba(255,255,255,.18);
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{
  width:100%;
  height:100%;
  overflow:hidden;

  background:#000;
  color:var(--fg);

  font-family:
    Helvetica,
    Arial,
    sans-serif;

  -webkit-font-smoothing:antialiased;
  -webkit-text-size-adjust:none;
}

body{
  min-height:calc(var(--vh) * 100);
}


/* =========================================================
   RORSCHACH FIELD
   ========================================================= */

#rorschach{
  position:fixed;

  inset:-8%;

  width:116%;
  height:116%;

  z-index:0;

  opacity:.86;

  filter:
    blur(10px)
    contrast(180%);

  transform:scale(1.04);

  transition:
    filter 7s ease,
    opacity 6s ease;
}


/* =========================================================
   DREAM VEIL
   ========================================================= */

#veil{
  position:fixed;

  inset:-18%;

  z-index:2;

  pointer-events:none;

  background:

    radial-gradient(
      circle at 50% 42%,
      rgba(255,255,255,.035),
      transparent 26%
    ),

    radial-gradient(
      circle at 25% 68%,
      rgba(255,255,255,.025),
      transparent 26%
    ),

    radial-gradient(
      circle at 78% 61%,
      rgba(255,255,255,.018),
      transparent 28%
    );

  mix-blend-mode:screen;

  animation:
    veilMove
    19s
    ease-in-out
    infinite
    alternate;
}


/* =========================================================
   GRAIN
   ========================================================= */

#grain{
  position:fixed;

  inset:-50%;

  z-index:7;

  pointer-events:none;

  opacity:.045;

  background-image:url(
  "data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.88' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E"
  );

  animation:
    grainMove
    .22s
    steps(2)
    infinite;
}


/* =========================================================
   GHOSTS / ANSWER ECHOES
   ========================================================= */

#ghostLayer{
  position:fixed;

  inset:0;

  z-index:6;

  pointer-events:none;

  overflow:hidden;
}

.ghost{
  position:absolute;

  max-width:90vw;

  font-size:
    clamp(
      24px,
      8vw,
      116px
    );

  line-height:.92;

  letter-spacing:-.05em;

  color:
    rgba(255,255,255,.038);

  filter:blur(9px);

  white-space:nowrap;

  animation:
    ghostMove
    linear
    forwards;
}

.answerGhost{
  color:
    rgba(255,255,255,.055);

  filter:blur(11px);
}


/* =========================================================
   UI
   ========================================================= */

#ui{
  position:fixed;

  inset:0;

  z-index:20;

  height:
    calc(
      var(--vh)
      *
      100
    );

  display:flex;

  flex-direction:column;

  justify-content:space-between;

  padding:

    max(
      24px,
      env(safe-area-inset-top)
    )

    max(
      24px,
      env(safe-area-inset-right)
    )

    max(
      24px,
      env(safe-area-inset-bottom)
    )

    max(
      24px,
      env(safe-area-inset-left)
    );

  transition:
    opacity 1.5s ease,
    filter 1.5s ease;
}

#ui.hide{
  opacity:0;
  filter:blur(12px);
  pointer-events:none;
}

.top,
.bottom{
  display:flex;

  justify-content:space-between;

  align-items:center;

  font-size:10px;

  letter-spacing:.21em;

  text-transform:uppercase;

  color:var(--muted);
}

#screen{
  width:min(920px,100%);

  margin:auto;

  transition:
    opacity 1.25s ease,
    transform 1.45s ease,
    filter 1.25s ease;
}

#screen.fade{
  opacity:0;

  transform:
    translateY(11px)
    scale(1.012);

  filter:blur(13px);
}


/* =========================================================
   TYPOGRAPHY
   ========================================================= */

.eyebrow{
  margin-bottom:24px;

  font-size:10px;

  letter-spacing:.24em;

  text-transform:uppercase;

  color:var(--muted);
}

h1{
  font-weight:400;

  font-size:
    clamp(
      54px,
      13vw,
      116px
    );

  line-height:.84;

  letter-spacing:-.055em;
}

h2{
  max-width:900px;

  font-weight:400;

  font-size:
    clamp(
      30px,
      7vw,
      64px
    );

  line-height:1.02;

  letter-spacing:-.035em;
}

.introText{
  max-width:720px;

  margin-top:28px;

  font-size:
    clamp(
      18px,
      2.8vw,
      29px
    );

  line-height:1.34;

  letter-spacing:-.015em;
}

.introMeta{
  max-width:680px;

  margin-top:28px;

  font-size:12px;

  line-height:1.65;

  color:rgba(255,255,255,.47);
}

.sub{
  max-width:620px;

  margin-top:22px;

  color:rgba(255,255,255,.50);

  font-size:14px;

  line-height:1.55;
}


/* =========================================================
   LANGUAGE
   ========================================================= */

.langs{
  display:grid;

  grid-template-columns:
    1fr
    1fr;

  gap:1px;

  margin-top:52px;

  background:var(--line);
}

button{
  appearance:none;

  border:0;

  background:
    rgba(0,0,0,.82);

  color:#fff;

  font:inherit;

  cursor:pointer;
}

.langs button{
  height:82px;

  font-size:13px;

  letter-spacing:.18em;
}

.langs button:hover,
.next:hover{
  background:#fff;
  color:#000;
}


/* =========================================================
   DREAM WORDS
   ========================================================= */

.dreamword{
  display:inline-block;

  transition:
    filter 3.6s ease,
    opacity 3.6s ease,
    transform 4s ease;
}

.dreamword.blur{
  filter:blur(7px);
  opacity:.67;
}

.dreamword.deepblur{
  filter:blur(14px);
  opacity:.28;
}

.dreamword.float{
  transform:translateY(-.08em);
}


/* =========================================================
   INPUT
   ========================================================= */

textarea,
input{
  width:100%;

  border:0;

  border-bottom:
    1px solid
    var(--line);

  outline:0;

  background:
    rgba(0,0,0,.04);

  color:#fff;

  font:inherit;

  caret-color:#fff;

  border-radius:0;
}

textarea{
  min-height:190px;

  margin-top:30px;

  padding:
    16px
    0
    20px;

  resize:none;

  font-size:
    clamp(
      20px,
      4.5vw,
      34px
    );

  line-height:1.35;
}

input{
  margin-top:34px;

  padding:
    18px
    0
    20px;

  font-size:
    clamp(
      25px,
      5vw,
      44px
    );

  letter-spacing:-.02em;
}

textarea::placeholder,
input::placeholder{
  color:
    rgba(255,255,255,.15);
}


/* =========================================================
   BUTTONS
   ========================================================= */

.actions{
  margin-top:34px;

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:18px;
}

.back,
.next{
  text-transform:uppercase;

  letter-spacing:.18em;

  font-size:10px;
}

.back{
  color:var(--muted);

  background:transparent;

  padding:16px 0;
}

.next{
  min-width:150px;

  padding:
    17px
    20px;

  border:
    1px solid
    rgba(255,255,255,.25);

  transition:.45s;
}

.received{
  margin-top:34px;

  color:var(--muted);

  font-size:11px;

  letter-spacing:.21em;

  text-transform:uppercase;
}


/* =========================================================
   FALSE AWAKENING
   ========================================================= */

#falseWake{
  position:fixed;

  inset:0;

  z-index:150;

  display:flex;

  align-items:center;

  justify-content:center;

  background:#000;

  color:#fff;

  opacity:0;

  pointer-events:none;
}

#falseWake.active{
  animation:
    falseWakeSequence
    6.2s
    ease
    forwards;
}

.falseWakeContent{
  width:min(700px,88vw);

  text-align:center;
}

.falseWakeMain{
  font-size:
    clamp(
      36px,
      9vw,
      90px
    );

  line-height:.9;

  letter-spacing:-.055em;

  font-weight:400;
}

.falseWakeSub{
  margin-top:28px;

  font-size:10px;

  letter-spacing:.22em;

  text-transform:uppercase;

  color:rgba(255,255,255,.45);
}


/* =========================================================
   WHITE BLOOM
   ========================================================= */

#whiteBloom{
  position:fixed;

  inset:-30%;

  z-index:200;

  pointer-events:none;

  opacity:0;

  transform:scale(.20);

  filter:blur(60px);

  background:

    radial-gradient(
      circle at 50% 50%,
      rgba(255,255,255,1) 0%,
      rgba(255,255,255,.96) 15%,
      rgba(255,255,255,.62) 34%,
      rgba(255,255,255,.13) 55%,
      rgba(255,255,255,0) 74%
    );
}

#whiteBloom.active{
  animation:
    bloom
    5.5s
    cubic-bezier(.22,.62,.22,1)
    forwards;
}

#whiteout{
  position:fixed;

  inset:0;

  z-index:201;

  background:#fff;

  pointer-events:none;

  opacity:0;
}

#whiteout.active{
  animation:
    whiteout
    5.6s
    cubic-bezier(.22,.62,.22,1)
    forwards;
}


/* =========================================================
   FINAL SCREEN
   ========================================================= */

#finalInvite{
  position:fixed;

  inset:0;

  z-index:220;

  background:#000;

  opacity:0;

  color:#fff;

  pointer-events:none;

  display:flex;

  align-items:center;

  justify-content:center;

  padding:

    max(
      30px,
      env(safe-area-inset-top)
    )

    max(
      28px,
      env(safe-area-inset-right)
    )

    max(
      30px,
      env(safe-area-inset-bottom)
    )

    max(
      28px,
      env(safe-area-inset-left)
    );
}

#finalInvite.active{
  animation:
    finalIn
    2.8s
    ease
    forwards;
}

.finalGrid{
  width:min(1100px,100%);

  display:grid;

  grid-template-columns:
    minmax(180px,280px)
    1fr;

  gap:
    clamp(
      50px,
      8vw,
      120px
    );

  align-items:end;
}

.logoBlock{
  align-self:start;
}

.logoBlock img{
  display:block;

  width:min(100%,260px);

  height:auto;
}

.finalCopy{
  max-width:760px;
}

.finalLabel{
  margin-bottom:32px;

  font-size:10px;

  letter-spacing:.24em;

  text-transform:uppercase;

  color:rgba(255,255,255,.42);
}

#finalTitle{
  font-size:
    clamp(
      32px,
      5.8vw,
      70px
    );

  line-height:1.02;

  letter-spacing:-.04em;

  font-weight:400;
}

.finalRule{
  width:100%;

  height:1px;

  background:
    rgba(255,255,255,.21);

  margin:
    42px
    0
    24px;
}

.finalDetails{
  display:flex;

  justify-content:space-between;

  gap:30px;

  font-size:11px;

  letter-spacing:.18em;

  text-transform:uppercase;

  color:rgba(255,255,255,.63);
}


/* =========================================================
   ANIMATION
   ========================================================= */

@keyframes veilMove{

  from{
    transform:
      translate(-2%,0)
      scale(1);
  }

  to{
    transform:
      translate(3%,-2%)
      scale(1.1);

    filter:blur(12px);
  }

}

@keyframes grainMove{

  0%{transform:translate(0,0)}
  25%{transform:translate(3%,-3%)}
  50%{transform:translate(-4%,2%)}
  75%{transform:translate(2%,4%)}
  100%{transform:translate(-2%,-4%)}

}

@keyframes ghostMove{

  0%{
    opacity:0;

    transform:
      translate(-3vw,3vh)
      scale(.96);

    filter:blur(12px);
  }

  18%{
    opacity:1;
  }

  70%{
    opacity:.7;
  }

  100%{
    opacity:0;

    transform:
      translate(6vw,-4vh)
      scale(1.07);

    filter:blur(24px);
  }

}

@keyframes falseWakeSequence{

  0%{
    opacity:0;
    filter:blur(18px);
  }

  18%{
    opacity:1;
    filter:blur(0);
  }

  70%{
    opacity:1;
    filter:blur(0);
  }

  100%{
    opacity:0;
    filter:blur(16px);
  }

}

@keyframes bloom{

  0%{
    opacity:0;
    transform:scale(.20);
  }

  42%{
    opacity:.14;
  }

  74%{
    opacity:.62;
    transform:scale(1);
  }

  100%{
    opacity:1;
    transform:scale(1.9);
  }

}

@keyframes whiteout{

  0%{opacity:0}
  56%{opacity:.04}
  80%{opacity:.34}
  100%{opacity:1}

}

@keyframes finalIn{

  0%{
    opacity:0;
    filter:blur(12px);
    transform:scale(1.012);
  }

  100%{
    opacity:1;
    filter:blur(0);
    transform:scale(1);
  }

}


/* =========================================================
   MOBILE
   ========================================================= */

@media(max-width:700px){

  #ui{
    padding:

      max(
        18px,
        env(safe-area-inset-top)
      )

      max(
        18px,
        env(safe-area-inset-right)
      )

      max(
        18px,
        env(safe-area-inset-bottom)
      )

      max(
        18px,
        env(safe-area-inset-left)
      );
  }

  h1{
    font-size:
      clamp(
        54px,
        19vw,
        84px
      );
  }

  h2{
    font-size:
      clamp(
        28px,
        8.8vw,
        44px
      );
  }

  .introText{
    font-size:
      clamp(
        19px,
        6vw,
        29px
      );
  }

  textarea{
    min-height:
      clamp(
        145px,
        25dvh,
        225px
      );

    font-size:
      clamp(
        19px,
        6vw,
        27px
      );
  }

  .langs{
    margin-top:36px;
  }

  .langs button{
    height:70px;
  }

  .actions{
    margin-top:24px;
  }

  .next{
    min-width:128px;
  }

  .finalGrid{
    display:flex;

    flex-direction:column;

    align-items:flex-start;

    justify-content:center;

    gap:45px;
  }

  .logoBlock img{
    width:min(52vw,190px);
  }

  #finalTitle{
    font-size:
      clamp(
        31px,
        9vw,
        46px
      );
  }

  .finalRule{
    margin:
      32px
      0
      20px;
  }

  .finalDetails{
    flex-direction:column;
    gap:8px;
  }

}

</style>

</head>

<script>


/* =========================================================
   GOOGLE BACKEND
   ========================================================= */

const API_URL =

/* =========================================================
   VIEWPORT
   ========================================================= */

function setVH(){

  const h =
    window.visualViewport
    ?
    window.visualViewport.height
    :
    window.innerHeight;

  document
    .documentElement
    .style
    .setProperty(
      "--vh",
      (h*.01)+"px"
    );

}

setVH();

window.addEventListener(
  "resize",
  setVH
);

if(window.visualViewport){

  window
    .visualViewport
    .addEventListener(
      "resize",
      setVH
    );

}


/* =========================================================

   QUESTION BANK PL

const QUESTIONS_PL = {

/* =========================================================
   RANDOM
   ========================================================= */

function shuffle(array){

const a =
[...array];

for(
let i=a.length-1;
i>0;
i--
){

const j =
Math.floor(
Math.random()
*
(i+1)
);

[
a[i],
a[j]
]
=
[
a[j],
a[i]
];

}

return a;

}

state.questionsByLevel[0] =

0,
3

state.questionsByLevel[2] =

);

}

/* =========================================================
   SURREALIZE
   ========================================================= */

function surrealize(text){

if(!text){
return "";
}

return text
.split(" ")
.map(
word=>{

let cls =
"dreamword";

const random =
Math.random();

if(
random<.08
){

cls +=
" deepblur";

}
else
if(
random<.22
){

cls +=
" blur";

}

if(
Math.random()<.08
){

cls +=
" float";

}

return `<span class="${cls}">${escapeHtml(word)}</span>`;

}
)
.join(" ");

}


/* =========================================================
   BUILD ECHO QUESTION
   TRAUM 1 / 2 CAN USE PREVIOUS ANSWERS
   ========================================================= */

function questionWithEcho(
item
){

if(
state.level===0
){

return item.question;

}

const previous =
state.answers
.filter(
a=>
a.answer &&
a.answer.trim().length>2
);

if(
!previous.length
){

return item.question;

}


/*
sometimes use a fragment of
the dreamer's own earlier answer
*/

if(
Math.random()>.58
){

const source =
previous[
Math.floor(
Math.random()
*
previous.length
)
];

const fragment =
source.answer
.split(/\s+/)
.slice(
0,
7
)
.join(" ");

if(
state.lang==="PL"
){

const variations = [

`Powiedziałeś wcześniej: „${fragment}”. Czy nadal tak to pamiętasz?`,

`„${fragment}” — czy to należało do pierwszego snu?`,

`Jeżeli „${fragment}” było prawdą, co wydarzyło się chwilę wcześniej?`

];

return variations[
Math.floor(
Math.random()
*
variations.length
)
];

}
else{

const variations = [

`Earlier you said: “${fragment}”. Do you still remember it that way?`,

`“${fragment}” — did that belong to the first dream?`,

`If “${fragment}” was true, what happened immediately before it?`

];

return variations[
Math.floor(
Math.random()
*
variations.length
)
];

}

}

return item.question;

}

!state.nickname

UI[

nickname:
state.nickname,

language:
state.lang,

answers:
state.answers,

dream:
state.answers
.map(
entry=>
entry
?
entry.answer
:
""
)
.join(

)

};

()=>{

"";

depthLabel.textContent =

TRAUM SIM

);

await fetch(
API_URL,
{

method:
"POST",

headers:{
"Content-Type":
"text/plain;charset=utf-8"
},

body:
JSON.stringify(
payload
)

}
);


if(
!response.ok
){

throw new Error(
"HTTP "
+
response.status
);

}


const data =
await response.json();


if(
!data.ok
){

throw new Error(
data.error
||
"Backend error"
);

}


renderSaved(
data.dreamId
);


}
catch(error){

console.error(
"DREAM SAVE ERROR",
error
);

renderError();

}

}

whiteout.style.display =
"none";

},
7800
);

}


/* =========================================================
   GHOST
   ========================================================= */

function ghost(
text,
answer=false
){

if(!text){
return;
}

const element =
document.createElement(
"div"
);

element.className =
answer
?
"ghost answerGhost"
:
"ghost";

element.textContent =
text;

element.style.left =
(
Math.random()*55
-
5
)
+
"vw";

element.style.top =
(
Math.random()*75
+
8
)
+
"vh";

element.style.animationDuration =
(
10
+
Math.random()*10
)
+
"s";

ghostLayer.appendChild(
element
);

setTimeout(
()=>{

element.remove();

},
21000
);

}

/* =========================================================
   HTML ESCAPE
   ========================================================= */

function escapeHtml(value){

return String(
value || ""
)
.replace(
/[&<>"']/g,
char=>({

"&":"&amp;",

"<":"&lt;",

">":"&gt;",

"\"":"&quot;",

"'":"&#039;"

}[char])
);

}


/* =========================================================
   RORSCHACH ENGINE
   ========================================================= */

const rCanvas =
document.getElementById(
"rorschach"
);

const rCtx =
rCanvas.getContext(
"2d"
);


let RW;
let RH;
let RDPR;

let forms=[];

let morphSeed=0;


/* =========================================================
   RESIZE
   ========================================================= */

function resizeRorschach(){

RW =
window.innerWidth;

RH =
window.innerHeight;

RDPR =
Math.min(
window.devicePixelRatio || 1,
1.5
);


rCanvas.width =
RW * RDPR;

rCanvas.height =
RH * RDPR;


rCtx.setTransform(
RDPR,
0,
0,
RDPR,
0,
0
);


generateForms();

}


/* =========================================================
   GENERATE FORMS
   ========================================================= */

function generateForms(){

forms=[];

const level =
state.level || 0;


const count =
level===0
?
6
:
level===1
?
9
:
12;


for(
let i=0;
i<count;
i++
){

forms.push({

cy:
RH *
(
.15 +
Math.random()*.70
),

radius:
Math.min(
RW,
RH
)
*
(
.06 +
Math.random()*.18
),

stretch:
.55 +
Math.random()*.85,

lobes:
3 +
Math.floor(
Math.random()*7
),

phase:
Math.random() *
Math.PI *
2,

speed:
.00012 +
Math.random()*.00030,

alpha:
.045 +
Math.random()*.085,

nested:
Math.random()>.58

});

}

}


/* =========================================================
   RADIUS
   ========================================================= */

function organicRadius(
form,
angle,
time,
layer=0
){

const level =
state.level || 0;


const waveA =
Math.sin(
angle *
form.lobes
+
time *
form.speed *
1000
+
form.phase
+
layer
)
*
(
.19 +
level*.025
);


const waveB =
Math.sin(
angle *
(
form.lobes+3
)
-
time *
form.speed *
630
)
*
.10;


const waveC =
Math.cos(
angle*2
+
time*.00021
+
form.phase*4
)
*
.075;


return form.radius *
(
1 +
waveA +
waveB +
waveC
);

}


/* =========================================================
   DRAW MIRROR BLOT
   ========================================================= */

function drawMirrorBlot(
form,
time,
scale=1,
alphaScale=1
){

const cx =
RW*.5;

const cy =
form.cy;

const count =
86;

const left=[];


for(
let i=0;
i<=count;
i++
){

const p =
i/count;


const angle =
-Math.PI*.5
+
p*Math.PI;


const radius =
organicRadius(
form,
angle,
time
)
*
scale;


const x =
Math.cos(angle)
*
radius
*
form.stretch;


const y =
Math.sin(angle)
*
radius;


left.push({

x:
cx-x,

y:
cy+y

});

}


/*
asymmetry only in TRAUM 2
*/

const asymmetry =
state.level===2
?
Math.sin(
time*.00041
+
form.phase
)
*
12
:
0;


rCtx.beginPath();


rCtx.moveTo(
cx,
cy-form.radius*.12
);


for(
const point
of
left
){

rCtx.lineTo(
point.x,
point.y
);

}


for(
let i=left.length-1;
i>=0;
i--
){

const point =
left[i];


const mirroredX =
cx
+
(
cx-point.x
)
+
asymmetry;


rCtx.lineTo(
mirroredX,
point.y
);

}


rCtx.closePath();


rCtx.fillStyle =
`rgba(
255,
255,
255,
${form.alpha*alphaScale}
)`;


rCtx.fill();


/*
dream inside dream
*/

if(
form.nested &&
state.level>=1
){

rCtx.save();


rCtx.translate(
cx,
cy
);


rCtx.scale(
.62,
.62
);


rCtx.translate(
-cx,
-cy
);


rCtx.fillStyle =
`rgba(
255,
255,
255,
${form.alpha*.38}
)`;


rCtx.fill();


rCtx.restore();

}

}


/* =========================================================
   RORSCHACH LOOP
   ========================================================= */

function drawRorschach(time){

rCtx.fillStyle =
state.level===0
?
"rgba(0,0,0,.065)"
:
state.level===1
?
"rgba(0,0,0,.055)"
:
"rgba(0,0,0,.045)";


rCtx.fillRect(
0,
0,
RW,
RH
);


/*
breathing exposure
*/

const exposure =
.008
+
(
Math.sin(
time*.00027
)
+
1
)
*
.006;


rCtx.fillStyle =
`rgba(
255,
255,
255,
${exposure}
)`;


rCtx.fillRect(
0,
0,
RW,
RH
);


rCtx.globalCompositeOperation =
"screen";


for(
const form
of
forms
){

drawMirrorBlot(
form,
time
);

}


/*
nested center world
*/

if(
state.level>=1
){

rCtx.save();


rCtx.translate(
RW*.5,
RH*.5
);


const pulse =
.72
+
Math.sin(
time*.00018
)
*
.10;


rCtx.scale(
pulse,
pulse
);


rCtx.translate(
-RW*.5,
-RH*.5
);


for(
let i=0;
i<Math.min(
3,
forms.length
);
i++
){

drawMirrorBlot(
forms[i],
time+5000,
.52,
.42
);

}


rCtx.restore();

}


rCtx.globalCompositeOperation =
"source-over";


/*
central fold
*/

const fold =
rCtx.createLinearGradient(
RW*.43,
0,
RW*.57,
0
);


fold.addColorStop(
0,
"rgba(0,0,0,0)"
);


fold.addColorStop(
.5,
state.level===2
?
"rgba(255,255,255,.055)"
:
"rgba(255,255,255,.028)"
);


fold.addColorStop(
1,
"rgba(0,0,0,0)"
);


rCtx.fillStyle =
fold;


rCtx.fillRect(
RW*.39,
0,
RW*.22,
RH
);


requestAnimationFrame(
drawRorschach
);

}


/* =========================================================
   MORPH REBIRTH
   ========================================================= */

setInterval(
()=>{

morphSeed++;

generateForms();


if(
Math.random()>.62
){

ghost(
state.level===0
?
"ANOTHER FORM"
:
state.level===1
?
"DREAM WITHIN DREAM"
:
"IT REMEMBERS"
);

}

},
17000
);

   INIT
   ========================================================= */

window.addEventListener(
"resize",
resizeRorschach
);


resizeRorschach();


rCtx.fillStyle =
"#000";


rCtx.fillRect(
0,
0,
RW,
RH
);


requestAnimationFrame(
drawRorschach
);


renderStart();


</script>
