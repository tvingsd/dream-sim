<!DOCTYPE html>
<html lang="pl">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover"
>

<meta name="theme-color" content="#000000">

<title>TRAUM SIM — PATCHLAB 2026</title>


<style>

/* =========================================================
   ROOT
   ========================================================= */

:root{

  --vh:1vh;

  --white:#f4f4f1;

  --muted:rgba(255,255,255,.50);

  --shadow:
    0 1px 2px rgba(0,0,0,.95),
    0 5px 28px rgba(0,0,0,.52);


  /* SUN */

  --sun-r:220;
  --sun-g:220;
  --sun-b:220;

  --sun-scale:.78;
  --sun-opacity:.70;


  /* MOON */

  --moon-x:94%;
  --moon-y:50%;

  --moon-scale:.72;
  --moon-opacity:0;

}


/* =========================================================
   RESET
   ========================================================= */

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{

  width:100%;
  height:100%;

  overflow:hidden;

  background:#000;

  color:var(--white);

  font-family:
    Helvetica,
    Arial,
    sans-serif;

  -webkit-font-smoothing:antialiased;
  -webkit-text-size-adjust:none;

}

body{

  min-height:
    calc(
      var(--vh) * 100
    );

}


/* =========================================================
   =========================================================
   DREAM IMAGE WORLD
   =========================================================
   ========================================================= */

#dreamWorld{

  position:fixed;

  inset:0;

  z-index:0;

  overflow:hidden;

  pointer-events:none;

  background:#000;

}


/* =========================================================
   IMAGE MORPH STAGE
   ========================================================= */

#dreamImages{

  position:absolute;

  inset:-5%;

  overflow:hidden;

  background:#000;

}


/*
IMPORTANT:

Filters are STATIC.

We do NOT animate:
blur
contrast
grayscale
brightness

Only:
opacity
transform

This is much safer for Safari / MacBook Air.
*/

.dreamImage{

  position:absolute;

  inset:-6%;

  width:112%;
  height:112%;

  object-fit:cover;

  object-position:center;

  opacity:0;

  /*
  preliminary processing:
  - grayscale
  - light threshold-like contrast
  - slight darkening
  - soft blur
  */

  filter:
    grayscale(1)
    contrast(1.42)
    brightness(.72)
    blur(5px);

  transform-origin:50% 50%;

  will-change:
    opacity,
    transform;

}


/* =========================================================
   FOUR DIFFERENT MOVEMENTS
   ========================================================= */

#dreamImg1{

  animation:
    imageMorph1
    64s
    linear
    infinite;

}


#dreamImg2{

  animation:
    imageMorph2
    64s
    linear
    infinite;

}


#dreamImg3{

  animation:
    imageMorph3
    64s
    linear
    infinite;

}


#dreamImg4{

  animation:
    imageMorph4
    64s
    linear
    infinite;

}


/* =========================================================
   EXTRA SOFT IMAGE LAYER
   ========================================================= */

/*
This layer sits above the four images.

No SVG displacement.
No animated blur.

Just a very slow milky veil.
*/

#dreamImageVeil{

  position:absolute;

  inset:-15%;

  background:

    radial-gradient(
      ellipse at 38% 45%,

      rgba(255,255,255,.075)
      0%,

      rgba(255,255,255,.020)
      30%,

      transparent
      67%
    ),

    radial-gradient(
      ellipse at 72% 54%,

      rgba(255,255,255,.050)
      0%,

      rgba(255,255,255,.014)
      35%,

      transparent
      72%
    );

  filter:
    blur(35px);

  opacity:.38;

  animation:
    imageVeilDrift
    130s
    ease-in-out
    infinite
    alternate;

}


/* =========================================================
   CENTRAL SUN
   ========================================================= */

#dreamSun{

  position:absolute;

  left:50%;
  top:50%;

  width:
    clamp(
      440px,
      58vw,
      1120px
    );

  aspect-ratio:1;

  z-index:5;

  opacity:
    var(--sun-opacity);

  transform:
    translate(-50%,-50%)
    scale(var(--sun-scale));

  transform-origin:
    50% 50%;

  transition:

    transform
    8.5s
    cubic-bezier(.22,.61,.36,1),

    opacity
    6s
    ease;

  will-change:
    transform,
    opacity;

}


/* =========================================================
   SUN HALO
   ========================================================= */

.sunHalo{

  position:absolute;

  inset:-24%;

  border-radius:50%;

  background:

    radial-gradient(
      circle,

      rgba(
        var(--sun-r),
        var(--sun-g),
        var(--sun-b),
        .54
      )
      0%,

      rgba(
        var(--sun-r),
        var(--sun-g),
        var(--sun-b),
        .31
      )
      8%,

      rgba(
        var(--sun-r),
        var(--sun-g),
        var(--sun-b),
        .16
      )
      20%,

      rgba(
        var(--sun-r),
        var(--sun-g),
        var(--sun-b),
        .065
      )
      36%,

      rgba(
        var(--sun-r),
        var(--sun-g),
        var(--sun-b),
        .018
      )
      55%,

      rgba(
        var(--sun-r),
        var(--sun-g),
        var(--sun-b),
        0
      )
      75%
    );

  /*
  static blur
  */

  filter:
    blur(45px);

  animation:
    sunBreath
    23s
    ease-in-out
    infinite
    alternate;

}


.sunHalo::before{

  content:"";

  position:absolute;

  inset:-16%;

  border-radius:50%;

  background:

    radial-gradient(
      ellipse at 43% 52%,

      rgba(
        var(--sun-r),
        var(--sun-g),
        var(--sun-b),
        .18
      ),

      rgba(
        var(--sun-r),
        var(--sun-g),
        var(--sun-b),
        .052
      )
      38%,

      transparent
      72%
    );

  filter:
    blur(54px);

  opacity:.84;

}


.sunHalo::after{

  content:"";

  position:absolute;

  left:7%;
  top:32%;

  width:86%;
  height:42%;

  border-radius:50%;

  background:

    radial-gradient(
      ellipse,

      rgba(
        var(--sun-r),
        var(--sun-g),
        var(--sun-b),
        .13
      ),

      rgba(
        var(--sun-r),
        var(--sun-g),
        var(--sun-b),
        .025
      )
      49%,

      transparent
      76%
    );

  filter:
    blur(60px);

  transform:
    rotate(-6deg);

}


/* =========================================================
   SUN CORE
   ========================================================= */

.sunDisk{

  position:absolute;

  left:50%;
  top:50%;

  width:12%;

  aspect-ratio:1;

  border-radius:50%;

  transform:
    translate(-50%,-50%);

  background:
    rgb(
      var(--sun-r),
      var(--sun-g),
      var(--sun-b)
    );

  opacity:.34;

  filter:
    blur(17px);

  box-shadow:

    0 0 45px

    rgba(
      var(--sun-r),
      var(--sun-g),
      var(--sun-b),
      .21
    );

}


/* =========================================================
   MOON
   ========================================================= */

#dreamMoon{

  position:absolute;

  left:
    var(--moon-x);

  top:
    var(--moon-y);

  width:
    clamp(
      135px,
      18vw,
      350px
    );

  aspect-ratio:1;

  z-index:6;

  border-radius:50%;

  background:#000;

  opacity:
    var(--moon-opacity);

  transform:
    translate(-50%,-50%)
    scale(var(--moon-scale));

  transition:

    left
    10s
    cubic-bezier(.22,.61,.36,1),

    top
    10s
    cubic-bezier(.22,.61,.36,1),

    transform
    10s
    cubic-bezier(.22,.61,.36,1),

    opacity
    5s
    ease;

  box-shadow:

    0 0 2px
    rgba(255,255,255,.05),

    inset
    0 0 12px
    rgba(255,255,255,.008);

}


/* =========================================================
   NOISE
   ========================================================= */

/*
Static noise image.
Not animated.

This gives texture without forcing GPU redraws.
*/

#noise{

  position:absolute;

  inset:0;

  z-index:10;

  opacity:.055;

  pointer-events:none;

  background-image:

    url(
      "data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.78' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.75'/%3E%3C/svg%3E"
    );

  mix-blend-mode:soft-light;

}


/* =========================================================
   VIGNETTE
   ========================================================= */

#dreamVignette{

  position:absolute;

  inset:0;

  z-index:11;

  background:

    radial-gradient(
      ellipse at 50% 48%,

      rgba(0,0,0,0)
      0%,

      rgba(0,0,0,.03)
      37%,

      rgba(0,0,0,.22)
      72%,

      rgba(0,0,0,.73)
      100%

}


/* =========================================================
   READABILITY
   ========================================================= */

#readingShadow{

  position:fixed;

  inset:0;

  z-index:12;

  pointer-events:none;

  opacity:.10;

  background:

    radial-gradient(
      ellipse at 50% 50%,

      0%,

      rgba(0,0,0,.14)
      43%,

      rgba(0,0,0,.42)

    opacity
    2.8s
    ease;

body.questionMode #readingShadow{

}


/* =========================================================
   GHOST TEXT
   ========================================================= */

  inset:0;

/* =========================================================

   ========================================================= */

/* =========================================================

/* =========================================================
   =========================================================
   IMAGE MORPH ANIMATIONS
   =========================================================
   ========================================================= */


/*
64 second loop.

Each image:
approx 24 sec visible / blending.

This means two images overlap during transitions.
There is never a hard cut.
*/


@keyframes imageMorph1{

  0%{

    opacity:.88;

    transform:
      translate3d(-1%,0,0)
      scale(1.08);

  }


  17%{

    opacity:.90;

    transform:
      translate3d(.5%,-.7%,0)
      scale(1.12);

  }


  27%{

    opacity:0;

    transform:
      translate3d(1.2%,-1%,0)
      scale(1.16);

  }


  88%{

    opacity:0;

    transform:
      translate3d(-1.5%,1%,0)
      scale(1.06);

  }


  100%{

    opacity:.88;

    transform:
      translate3d(-1%,0,0)
      scale(1.08);

  }

}


@keyframes imageMorph2{

  0%,
  12%{

    opacity:0;

    transform:
      translate3d(1%,.5%,0)
      scale(1.10);

  }


  22%{

    opacity:.88;

    transform:
      translate3d(.5%,0,0)
      scale(1.13);

  }


  39%{

    opacity:.90;

    transform:

/* =========================================================

   ========================================================= */

function updateDreamCosmos(){

  if(
    state.mode !==
    "questions"
  ){

    return;

  }


  const i =
    state.questionIndex;


  const level =
    getDreamLevel();


  const p =
    Math.max(
      0,
      Math.min(
        1,
        i/8
      )
    );


  /*
  Central light grows with every question.
  */

  const sunScale =
    .84 +
    p * 2.20;


  const sunOpacity =
    .69 +
    p * .20;


  document.documentElement.style.setProperty(
    "--sun-scale",
    sunScale
  );


  document.documentElement.style.setProperty(
    "--sun-opacity",
    sunOpacity
  );


  /*
  TRAUM 0
  */

  if(
    level === 0
  ){

    document.documentElement.style.setProperty(
      "--moon-opacity",
      "0"
    );


    document.documentElement.style.setProperty(
      "--moon-x",
      "94%"
    );


    document.documentElement.style.setProperty(
      "--moon-scale",
      ".72"
    );


    return;

  }


  /*
  TRAUM 1
  */

  if(
    level === 1
  ){

    const local =
      Math.max(
        0,
        Math.min(
          1,
          (i-3)/2
        )
      );


    const moonX =
      85 -
      local * 21;


    const moonScale =
      .75 +
      local * .18;


    document.documentElement.style.setProperty(
      "--moon-opacity",
      ".94"
    );


    document.documentElement.style.setProperty(
      "--moon-x",
      moonX+"%"
    );


    document.documentElement.style.setProperty(
      "--moon-y",
      "50%"
    );


    document.documentElement.style.setProperty(
      "--moon-scale",
      moonScale
    );


    return;

  }


  /*
  TRAUM 2 / eclipse
  */

  const local =
    Math.max(
      0,
      Math.min(
        1,
        (i-6)/2
      )
    );


  const moonX =
    61 -
    local * 11;


  const moonScale =
    .95 +
    local * .28;


  document.documentElement.style.setProperty(
    "--moon-opacity",
    ".995"
  );


  document.documentElement.style.setProperty(
    "--moon-x",
    moonX+"%"
  );

let transitionRunning =

function transition(fn){

  if(
    transitionRunning
  ){

    return;

  }


  transitionRunning =
    true;


  screen.classList.add(
    "fade"
  );


  setTimeout(

    ()=>{


      setTimeout(

        ()=>{


          fn();


          requestAnimationFrame(

            ()=>{


              requestAnimationFrame(

                ()=>{


                  screen.classList.remove(
                    "fade"

                  setTimeout(

                    ()=>{

                      transitionRunning =
                        false;

                    },

                    1850

                  );


                }

              );


            }

          );


        },

        420

      );


    },

    1800

  );

}

  state.introStep--;

function introNext(){

  if(
    transitionRunning

  saveColorField();


  const slides =

    state.introStep <

  state.questionIndex =
    0;


  if(

/* =========================================================
   FRAGMENT
   ========================================================= */

function extractFragment(text){

  const cleaned =
    normalizeText(
      text
    );


  if(
    !cleaned
  ){

    return "";

  }


  const words =
    cleaned
    .split(/\s+/)
    .filter(Boolean);


  if(
    words.length <= 8
  ){

    return cleaned;

  }


  const starts = [

    0,

    Math.floor(
      words.length*.20
    ),

    Math.floor(
      words.length*.40
    ),

    Math.max(
      0,
      words.length-8
    )

  ];


  const start =
    randomItem(
      starts
    );


  return words
  .slice(
    start,
    start+8
  )
  .join(
    " "
  );

}


/* =========================================================
   CLEAN FRAGMENT
   ========================================================= */

function cleanFragmentForPrompt(text){

  let fragment =
    normalizeText(
      text || ""
    );


  fragment =
    fragment
    .replace(
      /["“”„«»']/g,
      ""
    )
    .trim();


  fragment =
    fragment
    .replace(
      /[.,!?;:]+$/g,
      ""
    )
    .trim();


  return fragment;

}

/* =========================================================
   ADAPTIVE
   ========================================================= */

function generateAdaptiveQuestion(){

  const i =
    state.questionIndex;


  const previous =
    state.answers[
      i-1
    ];


  const answer =
    previous
    ?
    previous.answer
    :
    "";


  const fragment =
    cleanFragmentForPrompt(
      extractFragment(
        answer
      )
    );


  const themes =
    detectThemes(
      answer
    );


  if(
    i <= 2
  ){

    return generateLayerOneQuestion(
      fragment,
      themes
    );

  }


  if(
    i <= 5
  ){

    return generateLayerTwoQuestion(
      fragment,
      themes
    );

  }


  return generateLayerThreeQuestion(
    fragment,
    themes
  );

}

          `Wróć do fragmentu: ${f}. Zmień w nim jedną rzecz. Co musiałoby się zmienić, aby cały sen nagle zaczął znaczyć coś zupełnie innego?`

      }

    ]);

  }


  if(
    state.lang ===
    "UKR"
  ){

    return randomItem([

      {

        category:
          "ПАМ’ЯТЬ",

        question:
          `Повернися до фрагмента: ${f}. Чи залишається впевненість, що саме так виглядав сон? Що вже встигло змінитися в пам’яті протягом цієї розмови?`

      },

      {

        category:
          "ІНШИЙ СОН",

        question:
          `Сприйми фрагмент ${f} як частину сну всередині іншого сну. Що могло б з’явитися після пробудження з цього першого шару?`

      },

      {

        category:
          "ПРИСУТНІСТЬ",

        question:
          `Повернися до сцени: ${f}. Уяви цю ситуацію без своєї присутності. Що продовжувало б відбуватися?`

      },

      {

        category:
          "СЛІД",

        question:
          `Повернися до образу: ${f}. Якби з усього сну можна було залишити лише один образ, жест, предмет або речення — що мало б залишитися?`

      },

      {

        category:
          "ПОГЛЯД",

        question:
          `Повернися до сцени: ${f}. А якщо не Ти спостерігаєш за сном? Що в цій історії могло б спостерігати у відповідь?`

      }

    ]);

  }


  return randomItem([

    {

      category:
        "MEMORY",

      question:
        `Return to this fragment: ${f}. Are you still certain the dream looked exactly like that? What has already changed in your memory during this conversation?`

    },

    {

      category:
        "SECOND DREAM",

      question:
        `Treat the fragment ${f} as part of a dream contained inside another dream. What might appear after waking from the first layer?`

    },

    {

      category:
        "IDENTITY",

      question:
        `Return to the scene: ${f}. Imagine this situation without your presence. What would continue happening?`

    },

    {

      category:
        "TRACE",

      question:
        `Return to the image: ${f}. If only one image, gesture, object or sentence could remain from the entire dream, what should survive?`

    },

    {

      category:
        "REVERSAL",

      question:
        `Return to the scene: ${f}. What if you are not the one observing the dream? What in this story might be observing you?`

    }

  ]);

}


/* =========================================================
   QUESTION HELPERS
   ========================================================= */

function getCurrentQuestion(){

  return state
  .generatedQuestions[
    state.questionIndex
  ];

}


function getDreamLevel(){

  if(
    state.questionIndex <= 2
  ){

    return 0;

  }


  if(
    state.questionIndex <= 5
  ){

    return 1;

  }


  return 2;

}


/* =========================================================
   RENDER QUESTION
   ========================================================= */

function renderQuestion(){

  setVisualMode(
    "questions"
  );


  updateDreamCosmos();


  const copy =
    UI[
      state.lang
    ];


  const q =
    getCurrentQuestion();


  if(
    !q
  ){

    return;

  }


  const saved =
    state.answers[
      state.questionIndex
    ];


  const level =
    getDreamLevel();


  progress.textContent =

    `${String(
      state.questionIndex+1
    )
    .padStart(
      2,
      "0"
    )}
    /
    ${String(
      state.totalQuestions
    )
    .padStart(
      2,
      "0"
    )}`;


  depthLabel.textContent =
    `TRAUM ${level}`;


  let trace =
    "";


  if(
    state.questionIndex > 0
  ){

    const previous =
      state.answers[
        state.questionIndex-1
      ];


    if(
      previous &&
      previous.answer
    ){

      const fragment =
        cleanFragmentForPrompt(
          extractFragment(
            previous.answer
          )
        );


      if(
        fragment
      ){

        trace = `

<div class="contextTrace">
${escapeHtml(
  fragment
)}
</div>

`;

      }

    }

  }


  screen.innerHTML = `

<div class="eyebrow">
${escapeHtml(
  q.category
)}
</div>

<h2>
${escapeHtml(
  q.question
)}
</h2>

${trace}

<textarea
id="answer"
placeholder="${copy.placeholder}"
>${escapeHtml(
  saved
  ?
  saved.answer
  :
  ""
)}</textarea>

<div class="actions">

<button
class="back"
onclick="questionBack()"
>
${copy.back}
</button>

<button
class="next"
onclick="questionNext()"
>
${copy.next}
</button>

</div>

`;


  spawnPreviousAnswerGhost();


  setTimeout(

    ()=>{

      document
      .getElementById(
        "answer"
      )
      ?.focus();

    },

    350

  );

}


/* =========================================================
   SAVE ANSWER
   ========================================================= */

function saveCurrentAnswer(){

  const field =
    document
    .getElementById(
      "answer"
    );


  if(
    !field
  ){

    return;

  }


  const q =
    getCurrentQuestion();


  state.answers[
    state.questionIndex
  ] = {

    level:
      getDreamLevel(),

    category:
      q.category,

    question:
      q.question,

    answer:
      normalizeText(
        field.value
      )

  };

}


/* =========================================================
   NEXT
   ========================================================= */

function questionNext(){

  if(
    transitionRunning
    ||
    dreamShiftRunning
  ){

    return;

  }


  saveCurrentAnswer();


  const current =
    state.answers[
      state.questionIndex
    ];


  if(
    !current
    ||
    !current.answer
  ){

    const field =
      document
      .getElementById(
        "answer"
      );


    if(field){

      field.focus();


      field.style.borderBottomColor =
        "rgba(255,255,255,.72)";


      setTimeout(

        ()=>{

          field.style.borderBottomColor =
            "rgba(255,255,255,.22)";

        },

        900

      );

    }


    return;

  }


  if(
    state.questionIndex ===
    state.totalQuestions-1
  ){

    transition(
      renderNickname
    );


    return;

  }


  state.questionIndex++;


  if(
    !state.generatedQuestions[
      state.questionIndex
    ]
  ){

    state.generatedQuestions[
      state.questionIndex
    ] =
      generateAdaptiveQuestion();

  }


  updateDreamCosmos();


  if(
    state.questionIndex ===
    3
  ){

    runDreamShift(
      1
    );


    return;

  }


  if(
    state.questionIndex ===
    6
  ){

    runDreamShift(
      2
    );


    return;

  }


  transition(
    renderQuestion
  );

}


/* =========================================================
   BACK
   ========================================================= */

function questionBack(){

  if(
    transitionRunning
    ||
    dreamShiftRunning
  ){

    return;

  }


  saveCurrentAnswer();


  if(
    state.questionIndex ===
    0
  ){

    state.introStep =
      INTRO[
        state.lang
      ]
      .length-1;


    transition(
      renderIntro
    );


    return;

  }


  state.questionIndex--;


  updateDreamCosmos();


  transition(
    renderQuestion
  );

}


/* =========================================================
   DREAM SHIFT
   ========================================================= */

let dreamShiftRunning =
false;


function runDreamShift(level){

  if(
    dreamShiftRunning
  ){

    return;

  }


  dreamShiftRunning =
    true;


  const overlay =
    document.getElementById(
      "dreamShift"
    );


  const main =
    document.getElementById(
      "dreamShiftMain"
    );


  const sub =
    document.getElementById(
      "dreamShiftSub"
    );


  const ui =
    document.getElementById(
      "ui"
    );


  main.classList.remove(
    "shiftFade"
  );


  sub.classList.remove(
    "shiftFade"
  );


  ui.classList.add(
    "hide"
  );


  if(
    level === 1
  ){

    if(
      state.lang ===
      "PL"
    ){

      main.textContent =
        "COŚ PRZESZŁO PRZEZ ŚWIATŁO";


      sub.textContent =
        "sen ma jeszcze jedną warstwę";

    }

    else if(
      state.lang ===
      "UKR"
    ){

      main.textContent =
        "ЩОСЬ ПРОЙШЛО КРІЗЬ СВІТЛО";


      sub.textContent =
        "сон має ще один шар";

    }

    else{

      main.textContent =
        "SOMETHING CROSSED THE LIGHT";


      sub.textContent =
        "the dream has another layer";

    }

  }

  else{

    if(
      state.lang ===
      "PL"
    ){

      main.textContent =
        "ŚWIATŁO NIE ZNIKNĘŁO";


      sub.textContent =
        "zostało tylko przesłonięte";

    }

    else if(
      state.lang ===
      "UKR"
    ){

      main.textContent =
        "СВІТЛО НЕ ЗНИКЛО";


      sub.textContent =
        "його лише було закрито";

    }

    else{

      main.textContent =
        "THE LIGHT DID NOT DISAPPEAR";


      sub.textContent =
        "it was only covered";

    }

  }


  overlay.classList.add(
    "active"
  );


  setTimeout(

    ()=>{


      main.classList.add(
        "shiftFade"
      );


      sub.classList.add(
        "shiftFade"
      );


    },

    3400

  );


  setTimeout(

    ()=>{


      if(
        level === 1
      ){

        if(
          state.lang ===
          "PL"
        ){

          main.textContent =
            "NIE SZUKAJ POCZĄTKU";


          sub.textContent =
            "pozwól obrazowi prowadzić dalej";

        }

        else if(
          state.lang ===
          "UKR"
        ){

          main.textContent =
            "НЕ ШУКАЙ ПОЧАТКУ";


          sub.textContent =
            "дозволь образу вести далі";

        }

        else{

          main.textContent =
            "DO NOT LOOK FOR THE BEGINNING";


          sub.textContent =
            "let the image lead you further";

        }

      }

      else{

        if(
          state.lang ===
          "PL"
        ){

          main.textContent =
            "ZOSTAŁA KORONA";


          sub.textContent =
            "kolor nadal jest pod spodem";

        }

        else if(
          state.lang ===
          "UKR"
        ){

          main.textContent =
            "ЗАЛИШИЛАСЯ КОРОНА";


          sub.textContent =
            "колір усе ще під нею";

        }

        else{

          main.textContent =
            "THE CORONA REMAINS";


          sub.textContent =
            "the colour is still underneath";

        }

      }


      requestAnimationFrame(

        ()=>{


          requestAnimationFrame(

            ()=>{


              main.classList.remove(
                "shiftFade"
              );


              sub.classList.remove(
                "shiftFade"
              );


            }

          );


        }

      );


    },

    5100

  );


  setTimeout(

    ()=>{


      main.classList.add(
        "shiftFade"
      );


      sub.classList.add(
        "shiftFade"
      );


    },

    8200

  );


  setTimeout(

    ()=>{


      overlay.classList.remove(
        "active"
      );


      renderQuestion();


      ui.classList.remove(
        "hide"
      );


      setTimeout(

        ()=>{

          dreamShiftRunning =
            false;

        },

        900

      );


    },

    10400

  );

}


/* =========================================================
   GHOST
   ========================================================= */

function spawnPreviousAnswerGhost(){

  if(
    state.questionIndex === 0
  ){

    return;

  }


  const previous =
    state.answers
    .filter(

      a =>
        a &&
        a.answer &&
        a.answer.length > 2

    );


  if(
    !previous.length
  ){

    return;

  }


  if(
    Math.random() >
    .58
  ){

    const a =
      randomItem(
        previous
      );


    const fragment =
      cleanFragmentForPrompt(
        extractFragment(
          a.answer
        )
      );


    ghost(
      fragment,
      true
    );

  }

}


function ghost(
  text,
  answer=false
){

  if(
    !text
  ){

    return;

  }


  const e =
    document.createElement(
      "div"
    );


  e.className =
    answer
    ?
    "ghost answerGhost"
    :
    "ghost";


  e.textContent =
    text;


  e.style.left =

    (
      Math.random()*55
      -
      5
    )
    +
    "vw";


  e.style.top =

    (
      Math.random()*75
      +
      8
    )
    +
    "vh";


  e.style.animationDuration =

    (
      32
      +
      Math.random()*26
    )
    +
    "s";


  ghostLayer.appendChild(
    e
  );


  setTimeout(

    ()=>{

      e.remove();

    },

    60000

  );

}

   NICKNAME

/* =========================================================
   NICKNAME BACK
   ========================================================= */

function nicknameBack(){

  if(
    transitionRunning
  ){

    return;

  }


  const field =
    document.getElementById(
      "nickname"
    );


  if(field){

    state.nickname =
      field.value.trim();

  }


  state.questionIndex =
    state.totalQuestions-1;


  updateDreamCosmos();


  transition(
    renderQuestion
  );

}


/* =========================================================
   SAVE
   ========================================================= */

async function saveDream(){

  if(
    transitionRunning
  ){

    return;

  }


  const field =
    document.getElementById(
      "nickname"
    );


  if(field){

    const value =
      field.value.trim();


    if(value){

      state.nickname =
        value;

    }

  }


  if(
    !state.nickname
  ){

    state.nickname =
      "ANONYMOUS";

  }


  const honeypot =
    document.getElementById(
      "website"
    );


  const copy =
    UI[
      state.lang
    ];


  const payload = {

    nickname:
      state.nickname,

    language:
      state.lang,

    dreamColor:
      state.dreamColorName,

    website:
      honeypot
      ?
      honeypot.value
      :
      "",

    answers:
      state.answers,

    dream:
      state.answers
      .map(
        a =>
          a
          ?
          a.answer
          :
          ""
      )
      .join(
        "\n\n"
      )

  };


  transition(

    ()=>{


      setVisualMode(
        "saving"
      );


      progress.textContent =
        "";


      depthLabel.textContent =
        "ARCHIVE";


      screen.innerHTML = `

<div class="eyebrow">
TRAUM SIM
</div>

<h2>
${copy.saving}
</h2>

<p class="sub">
...
</p>

`;

    }

  );


  try{

    const response =
      await fetch(

        API_URL,

        {

          method:
            "POST",

          headers:{

            "Content-Type":
              "text/plain;charset=utf-8"

          },

          body:
            JSON.stringify(
              payload
            )

        }

      );


    if(
      !response.ok
    ){

      throw new Error(
        "HTTP "
        +
        response.status
      );

    }


    const data =
      await response.json();


    if(
      !data.ok
    ){

      throw new Error(
        data.error
        ||
        "Backend error"
      );

    }


    renderSaved(
      data.dreamId
    );

  }

  catch(error){

    console.error(
      "TRAUM SAVE ERROR",
      error
    );


    renderError();

  }

}

${copy.done}
